name: Issue 316 package cache follow-up

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: issue-316-package-cache-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'issue-316-ci-setup-integration'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Require current main ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Apply exact downloaded-package cache migration
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/bootstrap/apply_issue_316_package_cache.py \
            .github/bootstrap/fix_issue_316_package_cache.py
          cp .github/bootstrap/apply_issue_316_package_cache.py \
            "${RUNNER_TEMP}/apply_issue_316_package_cache.py"
          python3 - <<'PY'
          import os
          import pathlib

          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "apply_issue_316_package_cache.py"
          text = path.read_text(encoding="utf-8")
          old = "ROOT = pathlib.Path(__file__).resolve().parents[2]\n"
          new = 'ROOT = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()\n'
          if text.count(old) != 1:
              raise SystemExit("export driver root binding differs")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 .github/bootstrap/apply_issue_316_package_cache.py apply
          python3 .github/bootstrap/fix_issue_316_package_cache.py
          rm -f .github/bootstrap/apply_issue_316_package_cache.py
          rm -f .github/bootstrap/fix_issue_316_package_cache.py
          rm -f .github/workflows/issue-316-package-cache-followup.yml
          rmdir .github/bootstrap 2>/dev/null || true

      - name: Create isolated checker environment
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/issue-316-cache-venv"
          "${RUNNER_TEMP}/issue-316-cache-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --requirement tools/quality/requirements.txt
          echo "${RUNNER_TEMP}/issue-316-cache-venv/bin" >> "${GITHUB_PATH}"

      - name: Regenerate and validate contracts
        run: |
          set -euo pipefail
          python tools/quality/check_documentation_consistency.py generate --root .
          python tools/quality/verify_checksums.py generate --root .
          python -m py_compile \
            tools/ci/bootstrap_supply_chain.py \
            tools/quality/check_ci_supply_chain.py \
            tools/quality/collect_toolchain_provenance.py \
            tests/quality/test_ng_ci_supply_chain.py
          python tools/quality/check_ci_supply_chain.py check --root .
          python tools/quality/check_ng_api_development_readiness.py check --root .
          python tests/quality/test_ng_ci_supply_chain.py
          python tools/quality/check_documentation_consistency.py check --root .
          python tools/quality/verify_checksums.py check --root .

      - name: Commit and export exact generated tree
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "issue 316 package-cache migration produced no changes" >&2
            exit 1
          fi
          git commit -m "Cache exact CI package downloads (#316)"
          python "${RUNNER_TEMP}/apply_issue_316_package_cache.py" export \
            --output "${RUNNER_TEMP}/issue-316-package-cache-tree.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-316-package-cache-tree-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/issue-316-package-cache-tree.json
          if-no-files-found: error
          retention-days: 7
