name: Issue 316 package cache follow-up

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-316-package-cache-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'issue-316-ci-setup-integration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Require current main ancestry
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Add exact downloaded-package cache
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label} replacement count differs: {text.count(old)}")
              return text.replace(old, new, 1)

          action_path = pathlib.Path(".github/actions/setup-ci/action.yml")
          action = action_path.read_text(encoding="utf-8")
          action_marker = "    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97\n"
          action_cache = """    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      if: ${{ inputs.profile != 'none' || inputs.documentation == 'true' }}
      with:
        path: ~/.cache/cxxlens/packages
        key: cxxlens-ci-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/llvm22-noble.lock.json') }}

    - name: Bind exact downloaded-package cache
      if: ${{ inputs.profile != 'none' || inputs.documentation == 'true' }}
      shell: bash
      run: echo "CXXLENS_PACKAGE_CACHE=${HOME}/.cache/cxxlens/packages" >> "${GITHUB_ENV}"

"""
          action = replace_once(action, action_marker, action_cache + action_marker, "setup action cache")
          action_path.write_text(action, encoding="utf-8")

          bootstrap_path = pathlib.Path("tools/ci/bootstrap_supply_chain.py")
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          bootstrap = replace_once(
              bootstrap,
              "import json\nimport pathlib\nimport platform\n",
              "import json\nimport os\nimport pathlib\nimport platform\nimport shutil\n",
              "bootstrap imports",
          )
          bootstrap = replace_once(
              bootstrap,
              'SOURCE_LIST = pathlib.Path("/etc/apt/sources.list.d/cxxlens-llvm.list")\n',
              'SOURCE_LIST = pathlib.Path("/etc/apt/sources.list.d/cxxlens-llvm.list")\n'
              'PACKAGE_CACHE_ENV = "CXXLENS_PACKAGE_CACHE"\n'
              'DEFAULT_PACKAGE_CACHE = pathlib.Path.home() / ".cache/cxxlens/packages"\n',
              "bootstrap constants",
          )
          bootstrap = replace_once(
              bootstrap,
              '    local_workflows = lock.get("local_workflows")\n'
              '    if not all(\n'
              '        isinstance(value, dict)\n'
              '        for value in (llvm, documentation, python, runner, actions, local_workflows)\n'
              '    ) or not local_workflows:\n'
              '        raise SupplyChainError("supply-chain lock sections are missing")\n',
              '    local_workflows = lock.get("local_workflows")\n'
              '    package_cache = lock.get("package_cache")\n'
              '    if not all(\n'
              '        isinstance(value, dict)\n'
              '        for value in (\n'
              '            llvm, documentation, python, runner, actions, local_workflows, package_cache\n'
              '        )\n'
              '    ) or not local_workflows:\n'
              '        raise SupplyChainError("supply-chain lock sections are missing")\n'
              '    expected_package_cache = {\n'
              '        "directory": "~/.cache/cxxlens/packages",\n'
              '        "environment": PACKAGE_CACHE_ENV,\n'
              '        "key_version": "v1",\n'
              '        "scope": "exact-downloaded-debs-only",\n'
              '        "correctness_role": "transport-optimization-only",\n'
              '        "restore_keys": False,\n'
              '    }\n'
              '    if package_cache != expected_package_cache:\n'
              '        raise SupplyChainError("downloaded-package cache contract differs")\n',
              "bootstrap cache contract",
          )

          helper_marker = "\ndef install_documentation(lock: dict[str, Any]) -> None:\n"
          helpers = r'''
def package_cache_directory(lock: dict[str, Any]) -> pathlib.Path:
    config = lock["package_cache"]
    raw = os.environ.get(config["environment"])
    directory = pathlib.Path(raw).expanduser() if raw else pathlib.Path(config["directory"]).expanduser()
    if not directory.is_absolute():
        raise SupplyChainError("downloaded-package cache path must be absolute")
    directory.mkdir(parents=True, exist_ok=True)
    return directory


def cached_package_path(
    directory: pathlib.Path, namespace: str, package: str, digest: str
) -> pathlib.Path:
    if not namespace or "/" in namespace or not package or "/" in package:
        raise SupplyChainError("downloaded-package cache identity is invalid")
    return directory / namespace / f"{package}-{digest}.deb"


def verify_deb_archive(
    archive: pathlib.Path,
    *,
    package: str,
    version: str,
    architecture: str,
    digest: str,
) -> None:
    verify_bytes(archive.read_bytes(), digest, f"cached package {package}")
    fields = {
        field: run(["dpkg-deb", "--field", str(archive), field], capture=True)
        for field in ("Package", "Version", "Architecture")
    }
    expected = {
        "Package": package,
        "Version": version,
        "Architecture": architecture,
    }
    if fields != expected:
        raise SupplyChainError(
            f"cached package metadata mismatch: expected {expected}, received {fields}"
        )


def publish_cached_archive(source: pathlib.Path, target: pathlib.Path) -> pathlib.Path:
    target.parent.mkdir(parents=True, exist_ok=True)
    temporary = target.with_name(target.name + f".tmp-{os.getpid()}")
    try:
        shutil.copyfile(source, temporary)
        os.replace(temporary, target)
    finally:
        temporary.unlink(missing_ok=True)
    return target
'''
          if helper_marker not in bootstrap:
              raise SystemExit("bootstrap helper insertion point is missing")
          bootstrap = bootstrap.replace(helper_marker, helpers + helper_marker, 1)

          documentation_start = bootstrap.index("def install_documentation(lock: dict[str, Any]) -> None:\n")
          install_start = bootstrap.index("\ndef install(root: pathlib.Path, profile_name: str) -> None:\n", documentation_start)
          documentation_function = r'''def install_documentation(lock: dict[str, Any]) -> None:
    documentation = lock["documentation"]
    cache = package_cache_directory(lock)
    archive = cached_package_path(
        cache, "documentation", documentation["package"], documentation["sha256"]
    )
    if archive.is_file():
        verify_deb_archive(
            archive,
            package=documentation["package"],
            version=documentation["version"],
            architecture=documentation["architecture"],
            digest=documentation["sha256"],
        )
    else:
        content = download(documentation["url"])
        verify_bytes(content, documentation["sha256"], "Doxygen package")
        with tempfile.TemporaryDirectory(prefix="cxxlens-documentation-package-") as temporary:
            candidate = pathlib.Path(temporary) / "doxygen.deb"
            candidate.write_bytes(content)
            verify_deb_archive(
                candidate,
                package=documentation["package"],
                version=documentation["version"],
                architecture=documentation["architecture"],
                digest=documentation["sha256"],
            )
            archive = publish_cached_archive(candidate, archive)
        verify_deb_archive(
            archive,
            package=documentation["package"],
            version=documentation["version"],
            architecture=documentation["architecture"],
            digest=documentation["sha256"],
        )
    if installed_package_version(documentation["package"]) != documentation["version"]:
        run(
            [
                "sudo",
                "apt-get",
                "install",
                "--yes",
                "--no-install-recommends",
                "--no-upgrade",
                str(archive),
            ]
        )
    actual = installed_package_version(documentation["package"])
    if actual != documentation["version"]:
        raise SupplyChainError(f"installed Doxygen version mismatch: {actual}")
    version = run(["doxygen", "--version"], capture=True)
    if version != documentation["expected_release"]:
        raise SupplyChainError(f"Doxygen release mismatch: {version}")
'''
          bootstrap = bootstrap[:documentation_start] + documentation_function + bootstrap[install_start:]

          old_install_start = bootstrap.index('    signing_key = llvm["signing_key"]\n', bootstrap.index("def install("))
          old_install_end = bootstrap.index('    for name in llvm["profiles"][profile_name]:\n', old_install_start)
          cache_install = r'''    members = list(llvm["profiles"][profile_name])
    cache = package_cache_directory(lock)
    archives: dict[str, pathlib.Path] = {}
    missing: list[str] = []
    for name in members:
        target = cached_package_path(cache, "llvm", name, llvm["package_sha256"][name])
        if target.is_file():
            verify_deb_archive(
                target,
                package=name,
                version=llvm["packages"][name],
                architecture=llvm["architecture"],
                digest=llvm["package_sha256"][name],
            )
            archives[name] = target
        else:
            missing.append(name)

    if missing:
        signing_key = llvm["signing_key"]
        key_content = download(signing_key["url"])
        verify_bytes(key_content, signing_key["sha256"], "LLVM signing key")
        with tempfile.TemporaryDirectory(prefix="cxxlens-llvm-bootstrap-") as temporary:
            directory = pathlib.Path(temporary)
            keyring = verify_key(
                key_content, signing_key["primary_fingerprint"], directory
            )
            source = directory / "cxxlens-llvm.list"
            source.write_text(
                "deb [arch={architecture} signed-by={keyring}] {repository} "
                "{suite} {component}\n".format(
                    architecture=llvm["architecture"],
                    keyring=KEYRING,
                    repository=llvm["repository"],
                    suite=llvm["suite"],
                    component=llvm["component"],
                ),
                encoding="utf-8",
            )
            run(["sudo", "install", "-D", "-m", "0644", str(keyring), str(KEYRING)])
            run(["sudo", "install", "-D", "-m", "0644", str(source), str(SOURCE_LIST)])
        run(
            [
                "sudo",
                "apt-get",
                "-o",
                f"Dir::Etc::sourcelist={SOURCE_LIST}",
                "-o",
                "Dir::Etc::sourceparts=-",
                "-o",
                "APT::Get::List-Cleanup=0",
                "update",
            ]
        )
        package_requests = [f"{name}={llvm['packages'][name]}" for name in missing]
        with tempfile.TemporaryDirectory(prefix="cxxlens-llvm-packages-") as temporary:
            package_directory = pathlib.Path(temporary)
            run(["apt-get", "download", *package_requests], cwd=package_directory)
            downloaded: dict[str, pathlib.Path] = {}
            for candidate in sorted(package_directory.glob("*.deb")):
                name = run(["dpkg-deb", "--field", str(candidate), "Package"], capture=True)
                if name not in missing or name in downloaded:
                    raise SupplyChainError(
                        f"downloaded LLVM package set is duplicated or unexpected: {candidate.name}"
                    )
                verify_deb_archive(
                    candidate,
                    package=name,
                    version=llvm["packages"][name],
                    architecture=llvm["architecture"],
                    digest=llvm["package_sha256"][name],
                )
                target = cached_package_path(
                    cache, "llvm", name, llvm["package_sha256"][name]
                )
                downloaded[name] = publish_cached_archive(candidate, target)
            if set(downloaded) != set(missing):
                raise SupplyChainError("downloaded LLVM package set differs from cache miss set")
            archives.update(downloaded)

    if set(archives) != set(members):
        raise SupplyChainError("resolved LLVM package set differs from profile")
    for name, archive in archives.items():
        verify_deb_archive(
            archive,
            package=name,
            version=llvm["packages"][name],
            architecture=llvm["architecture"],
            digest=llvm["package_sha256"][name],
        )
    run(
        [
            "sudo",
            "apt-get",
            "install",
            "--yes",
            "--no-install-recommends",
            "--no-upgrade",
            *[str(archives[name]) for name in members],
        ]
    )
'''
          bootstrap = bootstrap[:old_install_start] + cache_install + bootstrap[old_install_end:]
          bootstrap_path.write_text(bootstrap, encoding="utf-8")

          lock_path = pathlib.Path("tools/ci/llvm22-noble.lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          lock["document_version"] = "1.5.0"
          lock["actions"]["actions/cache"] = "0057852bfaa89a56745cba8c7296529d2fc39830"
          lock["package_cache"] = {
              "directory": "~/.cache/cxxlens/packages",
              "environment": "CXXLENS_PACKAGE_CACHE",
              "key_version": "v1",
              "scope": "exact-downloaded-debs-only",
              "correctness_role": "transport-optimization-only",
              "restore_keys": False,
          }
          lock["local_actions"][action_path.as_posix()] = hashlib.sha256(
              action_path.read_bytes()
          ).hexdigest()
          lock_path.write_text(
              json.dumps(lock, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          checker_path = pathlib.Path("tools/quality/check_ci_supply_chain.py")
          checker = checker_path.read_text(encoding="utf-8")
          checker = replace_once(
              checker,
              '    setup_text = (root / SETUP_ACTION).read_text(encoding="utf-8")\n'
              '    for marker in (\n'
              '        "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",\n'
              '        "cache: pip",\n'
              '        "bootstrap_supply_chain.py install",\n'
              '        "tools/quality/requirements.lock",\n'
              '    ):\n',
              '    setup_text = (root / SETUP_ACTION).read_text(encoding="utf-8")\n'
              '    expected_cache = {\n'
              '        "directory": "~/.cache/cxxlens/packages",\n'
              '        "environment": "CXXLENS_PACKAGE_CACHE",\n'
              '        "key_version": "v1",\n'
              '        "scope": "exact-downloaded-debs-only",\n'
              '        "correctness_role": "transport-optimization-only",\n'
              '        "restore_keys": False,\n'
              '    }\n'
              '    if lock.get("package_cache") != expected_cache:\n'
              '        raise CiSupplyChainError("downloaded-package cache contract differs")\n'
              '    for marker in (\n'
              '        "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",\n'
              '        "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830",\n'
              '        "cache: pip",\n'
              '        "CXXLENS_PACKAGE_CACHE",\n'
              '        "cxxlens-ci-packages-v1-${{ runner.os }}-${{ runner.arch }}-",\n'
              '        "hashFiles(\'tools/ci/llvm22-noble.lock.json\')",\n'
              '        "bootstrap_supply_chain.py install",\n'
              '        "tools/quality/requirements.lock",\n'
              '    ):\n',
              "checker setup markers",
          )
          checker = replace_once(
              checker,
              '    if workflow_text.count("collect_toolchain_provenance.py") < 8:\n',
              '    if "restore-keys:" in setup_text:\n'
              '        raise CiSupplyChainError("downloaded-package cache must not use fallback restore keys")\n'
              '    bootstrap_text = (root / "tools/ci/bootstrap_supply_chain.py").read_text(encoding="utf-8")\n'
              '    for marker in (\n'
              '        "CXXLENS_PACKAGE_CACHE",\n'
              '        "package_cache_directory",\n'
              '        "verify_deb_archive",\n'
              '        "exact-downloaded-debs-only",\n'
              '        \"[\\\"apt-get\\\", \\\"download\\\"\",\n'
              '    ):\n'
              '        if marker not in bootstrap_text:\n'
              '            raise CiSupplyChainError(\n'
              '                f"bootstrap lacks exact package-cache binding: {marker}"\n'
              '            )\n'
              '    if workflow_text.count("collect_toolchain_provenance.py") < 8:\n',
              "checker bootstrap markers",
          )
          checker_path.write_text(checker, encoding="utf-8")

          test_path = pathlib.Path("tests/quality/test_ng_ci_supply_chain.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_once(tests, "import json\nimport pathlib\n", "import json\nimport os\nimport pathlib\n", "test imports")
          tests = replace_once(
              tests,
              "    install_documentation,\n    load_lock,\n    verify_bytes,\n",
              "    install_documentation,\n    load_lock,\n    package_cache_directory,\n    verify_bytes,\n    verify_deb_archive,\n",
              "test bootstrap imports",
          )
          test_methods = r'''
    def test_downloaded_package_cache_is_exact_and_has_no_fallback_key(self) -> None:
        action = (ROOT / ".github/actions/setup-ci/action.yml").read_text(encoding="utf-8")
        self.assertIn(
            "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830",
            action,
        )
        self.assertIn("CXXLENS_PACKAGE_CACHE", action)
        self.assertIn("hashFiles('tools/ci/llvm22-noble.lock.json')", action)
        self.assertNotIn("restore-keys:", action)
        self.assertEqual(
            self.lock["package_cache"],
            {
                "directory": "~/.cache/cxxlens/packages",
                "environment": "CXXLENS_PACKAGE_CACHE",
                "key_version": "v1",
                "scope": "exact-downloaded-debs-only",
                "correctness_role": "transport-optimization-only",
                "restore_keys": False,
            },
        )

    def test_relative_downloaded_package_cache_path_is_rejected(self) -> None:
        with mock.patch.dict(os.environ, {"CXXLENS_PACKAGE_CACHE": "relative/cache"}, clear=False):
            with self.assertRaisesRegex(SupplyChainError, "must be absolute"):
                package_cache_directory(self.lock)

    def test_corrupt_cached_package_is_rejected_before_metadata_probe(self) -> None:
        with tempfile.TemporaryDirectory() as temporary:
            archive = pathlib.Path(temporary) / "package.deb"
            archive.write_bytes(b"substituted")
            with mock.patch("bootstrap_supply_chain.run") as run:
                with self.assertRaisesRegex(SupplyChainError, "checksum mismatch"):
                    verify_deb_archive(
                        archive,
                        package="clang-22",
                        version=self.lock["llvm"]["packages"]["clang-22"],
                        architecture=self.lock["llvm"]["architecture"],
                        digest=self.lock["llvm"]["package_sha256"]["clang-22"],
                    )
                run.assert_not_called()

'''
          tests = replace_once(tests, "\n\nif __name__ == \"__main__\":\n", "\n" + test_methods + "\nif __name__ == \"__main__\":\n", "test methods")
          test_path.write_text(tests, encoding="utf-8")

          contributing_path = pathlib.Path("CONTRIBUTING.md")
          contributing = contributing_path.read_text(encoding="utf-8")
          contributing = replace_once(
              contributing,
              "`setup-python` の pip cache は反復高速化に使いますが、cache は `full` / `stress` の\ncorrectness evidence ではありません。\n",
              "`setup-python` の pip wheel cache と、lock digest・runner OS/arch に完全一致する LLVM/Doxygen `.deb` cache を\n反復高速化に使います。cache hit でも package SHA-256、package/version/architecture を再検証し、fallback restore key は\n使用しません。cache は `full` / `stress` の correctness evidence ではありません。\n",
              "contributing cache policy",
          )
          contributing_path.write_text(contributing, encoding="utf-8")
          PY

      - name: Remove the one-shot follow-up workflow
        run: rm -f .github/workflows/issue-316-package-cache-followup.yml

      - name: Create isolated checker environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/issue-316-cache-venv"
          "${RUNNER_TEMP}/issue-316-cache-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --requirement tools/quality/requirements.txt
          echo "${RUNNER_TEMP}/issue-316-cache-venv/bin" >> "${GITHUB_PATH}"

      - name: Regenerate and validate contracts
        run: |
          python tools/quality/check_documentation_consistency.py generate --root .
          python tools/quality/verify_checksums.py generate --root .
          python -m py_compile \
            tools/ci/bootstrap_supply_chain.py \
            tools/quality/check_ci_supply_chain.py \
            tests/quality/test_ng_ci_supply_chain.py
          python tools/quality/check_ci_supply_chain.py check --root .
          python tools/quality/check_ng_api_development_readiness.py check --root .
          python tests/quality/test_ng_ci_supply_chain.py
          python tools/quality/check_documentation_consistency.py check --root .
          python tools/quality/verify_checksums.py check --root .

      - name: Commit and export exact generated tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPORT_PATH: ${{ runner.temp }}/issue-316-package-cache-tree.json
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Cache exact CI package downloads (#316)"
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request

          def output(*arguments: str) -> str:
              return subprocess.check_output(["git", *arguments], text=True).strip()

          def create_blob(content: bytes) -> str:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "cxxlens-issue-316-package-cache",
                  },
                  data=json.dumps({
                      "content": base64.b64encode(content).decode("ascii"),
                      "encoding": "base64",
                  }).encode("utf-8"),
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.loads(response.read().decode("utf-8"))["sha"]

          revision = output("rev-parse", "HEAD")
          parent = output("rev-parse", "HEAD^")
          expected_tree = output("rev-parse", "HEAD^{tree}")
          changed = subprocess.check_output(
              ["git", "diff", "--no-renames", "--name-status", "-z", parent, "HEAD"]
          ).split(b"\0")
          entries = []
          index = 0
          while index < len(changed) and changed[index]:
              status = changed[index].decode("utf-8")
              path = changed[index + 1].decode("utf-8")
              index += 2
              row = {"path": path, "status": status[0]}
              if status[0] != "D":
                  tree_row = subprocess.check_output(
                      ["git", "ls-tree", "HEAD", "--", path], text=True
                  ).strip()
                  content = pathlib.Path(path).read_bytes()
                  row.update({
                      "mode": tree_row.split()[0],
                      "blob_sha": create_blob(content),
                      "content_base64": base64.b64encode(content).decode("ascii"),
                  })
              entries.append(row)
          pathlib.Path(os.environ["EXPORT_PATH"]).write_text(
              json.dumps({
                  "schema": "cxxlens.issue-316-package-cache-tree.v1",
                  "parent": parent,
                  "generated_revision": revision,
                  "expected_tree": expected_tree,
                  "entries": entries,
              }, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-316-package-cache-tree-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/issue-316-package-cache-tree.json
          if-no-files-found: error
          retention-days: 7
