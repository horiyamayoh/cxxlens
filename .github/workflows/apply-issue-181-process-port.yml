name: Apply issue 181 process registry port

on:
  push:
    branches:
      - agent/issue-181-shm-process-port

permissions:
  contents: write

concurrency:
  group: issue-181-shm-process-port-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_BASE: 709b57724f159f88173cac68ea32b92ce99d1a91
      EXPECTED_PATCH_SHA256: 53e4ba1857e402c3c57c59586c55a4333c416120eb7d261cd9b92470f49c28cc
      EXPECTED_TREE: a5ace9d141ba318d4e86eb5cef7a68991325da4c
      PATCH_CARRIER: .github/cxxlens-process-port.patch.gz.b64
      WORKFLOW_CARRIER: .github/workflows/apply-issue-181-process-port.yml
      TRIGGER_CARRIER: .github/cxxlens-process-port.trigger
      BOOTSTRAP_PARENT: 4c4964ffa2989ad43d249a5239f8ffe297443654
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 3

      - name: Verify and apply frozen patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${BOOTSTRAP_PARENT}"
          test "$(git rev-parse HEAD^^)" = "${EXPECTED_BASE}"
          base64 --decode "${PATCH_CARRIER}" | gzip -dc > "${RUNNER_TEMP}/process-port.patch"
          echo "${EXPECTED_PATCH_SHA256}  ${RUNNER_TEMP}/process-port.patch" | sha256sum --check --strict
          git apply --check --whitespace=error-all "${RUNNER_TEMP}/process-port.patch"
          git apply --whitespace=nowarn "${RUNNER_TEMP}/process-port.patch"
          rm -- "${PATCH_CARRIER}" "${WORKFLOW_CARRIER}" "${TRIGGER_CARRIER}"
          git diff --check
          git add --all
          test "$(git write-tree)" = "${EXPECTED_TREE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add qualified same-process SHM registry port"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"

      - name: Build focused process-registry boundary
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-quick -B build/process-port-bootstrap \
            -DCXXLENS_BUILD_QUALITY_TOOLS=OFF
          cmake --build build/process-port-bootstrap --parallel 2 --target \
            cxxlens-unit-sdk-sqlite-shm-process-port \
            cxxlens-unit-sdk-sqlite-shm-mapping-lease \
            cxxlens-unit-sdk-sqlite-shm-mapping-registry \
            cxxlens-unit-sdk-sqlite-shm-identity-issuer
          ctest --test-dir build/process-port-bootstrap --output-on-failure \
            -R 'unit.sdk-sqlite-shm-(process-port|mapping-lease|mapping-registry|identity-issuer)$'

      - name: Publish exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
