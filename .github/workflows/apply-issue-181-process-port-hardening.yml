name: Apply issue 181 process-port hardening

on:
  pull_request:
    branches:
      - issue-181-clang22-materialization-runtime
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-181-process-port-hardening
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: cbcd702c47083d38529dc6e496ccc9dc106e2fe5
      EXPECTED_PATCH_SHA256: dc67bbf55d8049f5764f6f5501e9586e0520e923a9f53f5f81dd1170be36aa57
      EXPECTED_TREE: 9e623f6734ca6008c32950965612b6726cdb0650
      PATCH_CARRIER: .github/cxxlens-process-port-hardening.patch.gz.b64
      WORKFLOW_CARRIER: .github/workflows/apply-issue-181-process-port-hardening.yml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Verify and apply frozen hardening patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          base64 --decode "${PATCH_CARRIER}" | gzip -dc > "${RUNNER_TEMP}/process-port-hardening.patch"
          echo "${EXPECTED_PATCH_SHA256}  ${RUNNER_TEMP}/process-port-hardening.patch" | sha256sum --check --strict
          git apply --check --whitespace=error-all "${RUNNER_TEMP}/process-port-hardening.patch"
          git apply --whitespace=nowarn "${RUNNER_TEMP}/process-port-hardening.patch"
          rm -- "${PATCH_CARRIER}" "${WORKFLOW_CARRIER}"
          git diff --check
          git add --all
          test "$(git write-tree)" = "${EXPECTED_TREE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden process-port authority boundary"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"

      - name: Build focused process-registry boundary
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-quick -B build/process-port-hardening \
            -DCXXLENS_BUILD_QUALITY_TOOLS=OFF \
            -DCXXLENS_WARNINGS_AS_ERRORS=OFF
          cmake --build build/process-port-hardening --parallel 2 --target \
            cxxlens-unit-sdk-sqlite-shm-process-port \
            cxxlens-unit-sdk-sqlite-shm-mapping-lease \
            cxxlens-unit-sdk-sqlite-shm-mapping-registry \
            cxxlens-unit-sdk-sqlite-shm-identity-issuer
          ctest --test-dir build/process-port-hardening --output-on-failure \
            -R 'unit.sdk-sqlite-shm-(process-port|mapping-lease|mapping-registry|identity-issuer)$'

      - name: Publish exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
