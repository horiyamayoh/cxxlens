name: Autonomy fast

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-sha-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - name: Verify exact non-cancelled main SHA
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""
      - name: Validate autonomy authority and negative corpus
        run: |
          python3 tools/quality/check_ng_development_decisions.py check --root .
          python3 tools/quality/check_ng_work_units.py check --root .
          python3 tools/quality/check_ng_autonomy_constructibility.py check --root .
          python3 tools/quality/check_ng_wip_inventory.py check --root .
          python3 tools/quality/check_ng_agent_context_v2.py corpus --root .
          python3 -m unittest \
            tests.quality.test_ng_development_decisions \
            tests.quality.test_ng_work_units \
            tests.quality.test_ng_autonomy_constructibility \
            tests.quality.test_ng_wip_inventory \
            tests.quality.test_ng_agent_context_v2
          python3 tools/quality/check_documentation_consistency.py check --root .
          python3 tools/quality/verify_checksums.py check --root .
      - name: Run bounded fast gate
        env:
          CXX: clang++-22
          CXXLENS_CI_TIER: fast
        run: |
          python3 tools/quality/run_gate.py fast \
            --preset ci-quick \
            --configure \
            --cmake-arg=-DCXXLENS_CLANG_ADAPTER=ON \
            --report "${RUNNER_TEMP}/cxxlens-autonomy-fast.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-autonomy-fast-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cxxlens-autonomy-fast.json
            ${{ runner.temp }}/cxxlens-autonomy-fast.junit.xml
          if-no-files-found: error
