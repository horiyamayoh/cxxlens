name: Apply PR 264 review fix

on:
  push:
    branches:
      - agent/issue-263-conflict-scoped-completion
    paths:
      - ".github/workflows/apply-issue-264-review-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12.11"
      - run: "python -m pip install --require-hashes --only-binary=:all: --requirement tools/quality/requirements.lock"
      - name: Restrict path conflicts to different active units
        run: |
          set -euo pipefail
          test "$(git hash-object tools/quality/check_ng_api_development_readiness.py)" = "2615517134fb62f5852ad32ff43d54d6c319134a"
          test "$(git hash-object tests/quality/test_ng_api_development_readiness.py)" = "08e6dde751fe3f0551b44ca5fec48aabefa7ff12"
          python3 - <<'PY'
          from pathlib import Path

          checker = Path("tools/quality/check_ng_api_development_readiness.py")
          text = checker.read_text(encoding="utf-8")
          old = "\n".join(
              (
                  "            for previous_issue, previous_raw, previous_path in path_owners:",
                  "                if active_write_paths_overlap(previous_path, normalized):",
                  "                    fail(",
                  "",
              )
          )
          new = "\n".join(
              (
                  "            for previous_issue, previous_raw, previous_path in path_owners:",
                  "                if previous_issue == issue:",
                  "                    continue",
                  "                if active_write_paths_overlap(previous_path, normalized):",
                  "                    fail(",
                  "",
              )
          )
          if text.count(old) != 1:
              raise SystemExit("active write path comparison anchor differs")
          checker.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/quality/test_ng_api_development_readiness.py")
          text = tests.read_text(encoding="utf-8")
          anchor = "    def test_five_active_write_units_are_rejected(self) -> None:\n"
          method = "\n".join(
              (
                  "    def test_nested_write_paths_within_one_active_unit_are_accepted(self) -> None:",
                  "        with tempfile.TemporaryDirectory() as temporary:",
                  "            root = self.copied_root(temporary)",
                  "            manifest_path = root / \"schemas/cxxlens_ng_api_development_readiness.yaml\"",
                  "            manifest = load_document(manifest_path)",
                  "            manifest[\"api_unit_workflow\"][\"active_write_units\"] = [",
                  "                {",
                  "                    \"issue\": \"#200\",",
                  "                    \"contract_ids\": [\"synthetic.contract\"],",
                  "                    \"write_paths\": [\"src/sdk\", \"src/sdk/store.cpp\"],",
                  "                    \"completed_stages\": [],",
                  "                }",
                  "            ]",
                  "            self.write_yaml(manifest_path, manifest)",
                  "            validate_documents(root)",
                  "",
                  "",
              )
          )
          if text.count(anchor) != 1:
              raise SystemExit("active write test anchor differs")
          tests.write_text(text.replace(anchor, method + anchor, 1), encoding="utf-8")
          PY
          python3 -m py_compile \
            tools/quality/check_ng_api_development_readiness.py \
            tests/quality/test_ng_api_development_readiness.py
          python3 -m unittest \
            tests.quality.test_ng_api_development_readiness.NgApiDevelopmentReadinessTest.test_nested_write_paths_within_one_active_unit_are_accepted \
            tests.quality.test_ng_api_development_readiness.NgApiDevelopmentReadinessTest.test_active_write_unit_equal_path_conflict_is_rejected \
            tests.quality.test_ng_api_development_readiness.NgApiDevelopmentReadinessTest.test_active_write_unit_ancestor_path_conflict_is_rejected \
            tests.quality.test_ng_api_development_readiness.NgApiDevelopmentReadinessTest.test_four_disjoint_active_write_units_are_accepted \
            -v
          git diff --check
          git add \
            tools/quality/check_ng_api_development_readiness.py \
            tests/quality/test_ng_api_development_readiness.py
          git diff --cached --check
          git config user.name "cxxlens workflow maintainer"
          git config user.email "44720751+horiyamayoh@users.noreply.github.com"
          git commit -m "Allow nested paths within one completion lane (#263)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
