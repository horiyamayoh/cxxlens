name: Recover issue 272 implementation payload

on:
  push:
    branches:
      - fix/soft-unresolved-materialization-272
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-soft-unresolved-272
  cancel-in-progress: true

jobs:
  decode-payload:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/soft-unresolved-materialization-272
          fetch-depth: 0
      - name: Decode the implementation source for review
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path('.github/agent_fix_272.py.gz.b64').read_text(encoding='utf-8')
          decoded = gzip.decompress(base64.b64decode(encoded))
          Path('.github/agent_fix_272.py').write_bytes(decoded)
          PY
          python3 -m py_compile .github/agent_fix_272.py
      - name: Commit the decoded source
        run: |
          git add .github/agent_fix_272.py
          git diff --cached --check
          git config user.name 'Codex'
          git config user.email 'codex@users.noreply.github.com'
          git commit -m 'Recover issue #272 implementation source for review'
          git push origin HEAD:fix/soft-unresolved-materialization-272
