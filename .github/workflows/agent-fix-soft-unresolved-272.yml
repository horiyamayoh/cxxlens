name: Implement issue 272 soft unresolved materialization

on:
  push:
    branches:
      - fix/soft-unresolved-materialization-272
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: implement-soft-unresolved-272
  cancel-in-progress: true

jobs:
  apply-test-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/soft-unresolved-materialization-272
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Make recovered replacements formatting-tolerant
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/agent_fix_272.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f"{path}: expected {count} matches, found {actual}")
              file.write_text(text.replace(old, new), encoding="utf-8")
          '''
          # The source file stores this function without the YAML heredoc indentation.
          old = '\n'.join(line[12:] if line.startswith('            ') else line for line in old.splitlines()) + '\n'
          new = '''def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              import re

              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual == count:
                  file.write_text(text.replace(old, new), encoding="utf-8")
                  return

              pieces = re.split(r"([ \\t]+)", old)
              pattern = "".join(
                  r"[ \\t]+" if piece and all(character in " \\t" for character in piece)
                  else re.escape(piece)
                  for piece in pieces
              )
              matches = list(re.finditer(pattern, text))
              if len(matches) != count:
                  raise RuntimeError(
                      f"{path}: expected {count} matches, found {actual} exact and {len(matches)} whitespace-flexible"
                  )
              file.write_text(re.sub(pattern, lambda _: new, text, count=count), encoding="utf-8")
          '''
          new = '\n'.join(line[12:] if line.startswith('            ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise RuntimeError('recovered replace_exact function shape changed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply the reviewed implementation
        run: |
          python3 -m py_compile .github/agent_fix_272.py
          python3 .github/agent_fix_272.py
          git diff --check
          test -n "$(git status --short -- src/llvm/clang22/materialization_claims.cpp src/llvm/clang22/materialization_bounded_claim_source.cpp src/llvm/clang22/materialization_bounded_claim_source.hpp tests/adapter/clang22/materialization_store_test.cpp)"

      - name: Install exact Clang 22 toolchain
        run: python3 tools/ci/bootstrap_supply_chain.py install --profile developer

      - name: Format modified C++
        run: |
          clang-format-22 -i \
            src/llvm/clang22/materialization_claims.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            tests/adapter/clang22/materialization_store_test.cpp
          git diff --check

      - name: Configure and build focused targets
        env:
          CXX: clang++-22
        run: |
          cmake --preset ci-quick -DCXXLENS_CLANG_ADAPTER=ON
          cmake --build --preset ci-quick --target \
            cxxlens-clang22-materialization-claims \
            cxxlens-clang22-materialization-store

      - name: Run focused regressions
        run: |
          ctest --preset ci-quick \
            --tests-regex '^adapter\.clang22-materialization-(claims|store)$' \
            --output-on-failure

      - name: Commit the verified implementation
        run: |
          git rm \
            .github/agent_fix_272.py \
            .github/agent_fix_272.py.gz.b64 \
            .github/workflows/agent-fix-soft-unresolved-272.yml
          git add \
            src/llvm/clang22/materialization_claims.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            tests/adapter/clang22/materialization_store_test.cpp
          git diff --cached --check
          git config user.name 'Codex'
          git config user.email 'codex@users.noreply.github.com'
          git commit -m 'Preserve soft unresolved materialization results (#272)'
          git push origin HEAD:fix/soft-unresolved-materialization-272
