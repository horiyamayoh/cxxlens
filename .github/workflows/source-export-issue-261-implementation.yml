name: Exact source export for issue 261 implementation

on:
  push:
    branches:
      - agent/issue-261-source-closure-vfs-implementation

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - name: Export the exact branch tree
        run: |
          set -euo pipefail
          git archive --format=zip \
            --output="${RUNNER_TEMP}/cxxlens-source-${GITHUB_SHA}.zip" \
            "${GITHUB_SHA}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-source-${{ github.sha }}
          path: ${{ runner.temp }}/cxxlens-source-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 1
