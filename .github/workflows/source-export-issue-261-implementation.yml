name: Issue 261 incremental checkpoint

on:
  push:
    branches:
      - agent/issue-261-source-closure-vfs-implementation

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.checkpoint.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - name: Apply a staged checkpoint or export the exact tree
        id: checkpoint
        run: |
          set -euo pipefail
          shopt -s nullglob
          encoded=.github/issue261-next.patch.gz.b64
          parts=(.github/issue261-next.patch.gz.part-*)
          expected_file=.github/issue261-next.patch.sha256
          message_file=.github/issue261-next.commit-message
          if [[ -f "${encoded}" || ${#parts[@]} -gt 0 || -f "${expected_file}" || -f "${message_file}" ]]; then
            test -f "${expected_file}"
            test -f "${message_file}"
            if [[ -f "${encoded}" && ${#parts[@]} -gt 0 ]]; then
              echo 'both monolithic and chunked checkpoint payloads are present' >&2
              exit 2
            fi
            archive="${RUNNER_TEMP}/issue261-next.patch.gz"
            if [[ ${#parts[@]} -gt 0 ]]; then
              cat "${parts[@]}" > "${archive}"
            else
              test -f "${encoded}"
              base64 --decode "${encoded}" > "${archive}"
            fi
            patch="${RUNNER_TEMP}/issue261-next.patch"
            gzip --test "${archive}"
            gzip --decompress --stdout "${archive}" > "${patch}"
            expected="$(tr -d '\r\n' < "${expected_file}")"
            [[ "${expected}" =~ ^[0-9a-f]{64}$ ]]
            printf '%s  %s\n' "${expected}" "${patch}" | sha256sum --check --status
            if grep -Eq '^diff --git a/\.github/workflows/' "${patch}"; then
              echo 'checkpoint patches may not modify workflow authority' >&2
              exit 2
            fi
            git apply --check "${patch}"
            git apply "${patch}"
            rm -f "${encoded}" "${parts[@]}" "${expected_file}"
            commit_message="${RUNNER_TEMP}/issue261-commit-message"
            cp "${message_file}" "${commit_message}"
            rm "${message_file}"
            git config user.name horiyamayoh
            git config user.email 44720751+horiyamayoh@users.noreply.github.com
            git add -A
            git diff --cached --check
            git commit -F "${commit_message}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo 'mode=applied' >> "${GITHUB_OUTPUT}"
          else
            archive="${RUNNER_TEMP}/cxxlens-source-${GITHUB_SHA}.zip"
            git archive --format=zip --output="${archive}" "${GITHUB_SHA}"
            echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
            echo 'mode=export' >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: steps.checkpoint.outputs.mode == 'export'
        with:
          name: cxxlens-source-${{ github.sha }}
          path: ${{ steps.checkpoint.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  focused-clang22:
    needs: checkpoint
    if: needs.checkpoint.outputs.mode == 'export'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
          documentation: "false"
      - name: Build and test the exact Clang 22 source-closure boundary
        env:
          CXX: clang++-22
        run: |
          cmake --preset dev-clang -DCXXLENS_BUILD_QUALITY_TOOLS=OFF
          cmake --build --preset dev-clang --target \
            cxxlens-clang22-source-closure-native \
            cxxlens-clang22-source-closure-invocation \
            cxxlens-clang-worker-22 --parallel 4
          ctest --preset dev-clang \
            -R '^adapter\.clang22-source-closure($|-vfs$|-invocation$|-native$)' \
            --output-on-failure
          python3 tools/quality/check_documentation_consistency.py check --root .
          python3 tools/quality/check_ng_design_feedback.py check --root .
          python3 tools/quality/verify_checksums.py check --root .
