name: Issue 316 bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: read

concurrency:
  group: issue-316-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'issue-316-ci-setup-integration'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Integrate current main without rewriting branch history
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - name: Recover and verify the reviewed migration payload
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: "5306714689"
          EXPECTED_RAW_SHA256: c68a50fc9ba328fcba80b3e90100c1da6cc09b73ecc825bdcb0fc680a1ec3adf
          EXPECTED_GZIP_SHA256: 5c5f5343907c98810162e2e907671718f23897f981818e62036fde7d5acf48ba
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .body \
            > "${RUNNER_TEMP}/issue-316-payload-comment.txt"
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          import pathlib
          import re

          body = pathlib.Path(os.environ["RUNNER_TEMP"], "issue-316-payload-comment.txt").read_text(
              encoding="utf-8"
          )
          match = re.search(r"```base64\s*\n(?P<payload>[A-Za-z0-9+/=\r\n]+)\n```", body)
          if match is None:
              raise SystemExit("issue 316 payload code block is missing")
          compressed = base64.b64decode("".join(match.group("payload").split()), validate=True)
          compressed_digest = hashlib.sha256(compressed).hexdigest()
          if compressed_digest != os.environ["EXPECTED_GZIP_SHA256"]:
              raise SystemExit(
                  f"issue 316 gzip digest differs: {compressed_digest}"
              )
          source = gzip.decompress(compressed)
          source_digest = hashlib.sha256(source).hexdigest()
          if source_digest != os.environ["EXPECTED_RAW_SHA256"]:
              raise SystemExit(f"issue 316 raw digest differs: {source_digest}")
          destination = pathlib.Path(".github/bootstrap/apply_issue_316.py")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(source)
          PY
          python3 -m py_compile .github/bootstrap/apply_issue_316.py

      - name: Apply the reviewed issue 316 migration
        run: python3 .github/bootstrap/apply_issue_316.py

      - name: Normalize generated contracts and refresh authority digests
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib

          action_path = pathlib.Path(".github/actions/setup-ci/action.yml")
          text = action_path.read_text(encoding="utf-8")
          old = (
              "      run: >-\n"
              "        python -m pip install --require-hashes --only-binary=:all:\n"
              "        --requirement tools/quality/requirements.lock\n"
          )
          new = (
              "      run: python -m pip install --require-hashes "
              "--only-binary=:all: --requirement tools/quality/requirements.lock\n"
          )
          if text.count(old) != 1:
              raise SystemExit("common setup pip command shape differs")
          action_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          lock_path = pathlib.Path("tools/ci/llvm22-noble.lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          local_actions = lock.get("local_actions")
          if not isinstance(local_actions, dict):
              raise SystemExit("local action authority is missing")
          local_actions[action_path.as_posix()] = hashlib.sha256(
              action_path.read_bytes()
          ).hexdigest()
          lock_path.write_text(
              json.dumps(lock, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          test_path = pathlib.Path("tests/quality/test_ng_ci_supply_chain.py")
          test_text = test_path.read_text(encoding="utf-8")
          fixture_old = (
              '            workflows = root / ".github/workflows"\n'
              '            workflows.mkdir(parents=True)\n'
              '            shutil.copy2(ROOT / ".github/workflows/quality.yml", workflows / "quality.yml")\n'
          )
          fixture_new = (
              '            workflows = root / ".github/workflows"\n'
              '            workflows.mkdir(parents=True)\n'
              '            shutil.copytree(ROOT / ".github/actions", root / ".github/actions")\n'
              '            shutil.copy2(ROOT / ".github/workflows/quality.yml", workflows / "quality.yml")\n'
          )
          if test_text.count(fixture_old) != 1:
              raise SystemExit("reusable-workflow fixture shape differs")
          test_path.write_text(
              test_text.replace(fixture_old, fixture_new, 1), encoding="utf-8"
          )
          PY

      - name: Remove the one-shot bootstrap assets
        run: |
          rm -f .github/bootstrap/apply_issue_316.py
          rm -f .github/workflows/issue-316-bootstrap.yml
          rmdir .github/bootstrap 2>/dev/null || true

      - name: Create isolated checker environment
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/issue-316-venv"
          "${RUNNER_TEMP}/issue-316-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --requirement tools/quality/requirements.txt
          echo "${RUNNER_TEMP}/issue-316-venv/bin" >> "${GITHUB_PATH}"

      - name: Regenerate tracked inventories
        run: |
          python tools/quality/check_documentation_consistency.py generate --root .
          python tools/quality/verify_checksums.py generate --root .

      - name: Validate the migrated repository contracts
        run: |
          python -m py_compile \
            tools/quality/check_ci_supply_chain.py \
            tools/quality/collect_toolchain_provenance.py \
            tools/quality/check_ng_api_development_readiness.py \
            tests/quality/test_ng_ci_supply_chain.py
          python tools/quality/check_ci_supply_chain.py check --root .
          python tools/quality/check_ng_api_development_readiness.py check --root .
          python tests/quality/test_ng_ci_supply_chain.py
          python tools/quality/check_documentation_consistency.py check --root .
          python tools/quality/verify_checksums.py check --root .

      - name: Commit and publish the exact generated Git objects
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPORT_PATH: ${{ runner.temp }}/issue-316-generated-tree.json
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "issue 316 migration produced no changes" >&2
            exit 1
          fi
          git commit -m "Commonize CI setup and automate PR integration (#316)"
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request

          def output(*arguments: str) -> str:
              return subprocess.check_output(["git", *arguments], text=True).strip()

          def api(path: str, *, method: str = "GET", payload=None):
              repository = os.environ["GITHUB_REPOSITORY"]
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "cxxlens-issue-316-bootstrap",
                  },
                  data=(json.dumps(payload).encode("utf-8") if payload is not None else None),
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.loads(response.read().decode("utf-8"))

          revision = output("rev-parse", "HEAD")
          parents = output("rev-list", "--parents", "-n", "1", "HEAD").split()[1:]
          if len(parents) != 2:
              raise SystemExit(f"expected two parents after main integration, received {parents}")
          first_parent, main_parent = parents
          expected_tree = output("rev-parse", "HEAD^{tree}")
          changed = subprocess.check_output(
              ["git", "diff", "--no-renames", "--name-status", "-z", first_parent, "HEAD"]
          ).split(b"\0")
          entries = []
          tree_entries = []
          index = 0
          while index < len(changed) and changed[index]:
              status = changed[index].decode("utf-8")
              path = changed[index + 1].decode("utf-8")
              index += 2
              if path.startswith("/") or ".." in pathlib.PurePosixPath(path).parts:
                  raise SystemExit(f"noncanonical generated path: {path}")
              row = {"path": path, "status": status[0]}
              if status[0] == "D":
                  tree_entries.append({
                      "path": path,
                      "mode": "100644",
                      "type": "blob",
                      "sha": None,
                  })
              else:
                  tree_row = subprocess.check_output(
                      ["git", "ls-tree", "HEAD", "--", path], text=True
                  ).strip()
                  if not tree_row:
                      raise SystemExit(f"tree entry missing for {path}")
                  mode = tree_row.split()[0]
                  content = pathlib.Path(path).read_bytes()
                  blob = api(
                      "git/blobs",
                      method="POST",
                      payload={
                          "content": base64.b64encode(content).decode("ascii"),
                          "encoding": "base64",
                      },
                  )
                  row["mode"] = mode
                  row["content_base64"] = base64.b64encode(content).decode("ascii")
                  row["blob_sha"] = blob["sha"]
                  tree_entries.append({
                      "path": path,
                      "mode": mode,
                      "type": "blob",
                      "sha": blob["sha"],
                  })
              entries.append(row)

          first_commit = api(f"git/commits/{first_parent}")
          remote_tree = api(
              "git/trees",
              method="POST",
              payload={"base_tree": first_commit["tree"]["sha"], "tree": tree_entries},
          )
          if remote_tree["sha"] != expected_tree:
              raise SystemExit(
                  f"remote tree differs: expected {expected_tree}, received {remote_tree['sha']}"
              )
          remote_commit = api(
              "git/commits",
              method="POST",
              payload={
                  "message": "Commonize CI setup and automate PR integration (#316)",
                  "tree": remote_tree["sha"],
                  "parents": [first_parent, main_parent],
              },
          )
          document = {
              "schema": "cxxlens.issue-316-generated-tree.v1",
              "first_parent": first_parent,
              "main_parent": main_parent,
              "generated_revision": revision,
              "expected_tree": expected_tree,
              "remote_tree": remote_tree["sha"],
              "remote_commit": remote_commit["sha"],
              "entries": entries,
          }
          pathlib.Path(os.environ["EXPORT_PATH"]).write_text(
              json.dumps(document, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "first_parent": first_parent,
              "main_parent": main_parent,
              "expected_tree": expected_tree,
              "remote_commit": remote_commit["sha"],
              "entry_count": len(entries),
          }, sort_keys=True))
          PY

      - name: Preserve the validated generated tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-316-generated-tree-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/issue-316-generated-tree.json
          if-no-files-found: error
          retention-days: 7
