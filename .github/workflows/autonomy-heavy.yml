name: Autonomy heavy

on:
  workflow_run:
    workflows: ["Autonomy fast"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: autonomy-heavy-latest-main
  cancel-in-progress: true

jobs:
  freshness:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    outputs:
      disposition: ${{ steps.classify.outputs.disposition }}
      candidate_sha: ${{ steps.classify.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh current main authority
        run: git fetch --no-tags origin main
      - name: Authenticate canonical fast workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          expected_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/autonomy-fast.yml" --jq .id)"
          test "${EVENT_WORKFLOW_ID}" = "${expected_id}"
      - id: classify
        name: Classify exact candidate freshness
        # A stale candidate produces only the uploaded superseded freshness report.
        env:
          EVENT_CANDIDATE: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 tools/quality/check_ng_autonomy_ci.py classify-heavy \
            --candidate "${EVENT_CANDIDATE}" \
            --github-output "${GITHUB_OUTPUT}" \
            --report "${RUNNER_TEMP}/cxxlens-autonomy-heavy-freshness.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-autonomy-heavy-freshness-${{ steps.classify.outputs.candidate_sha }}
          path: ${{ runner.temp }}/cxxlens-autonomy-heavy-freshness.json
          if-no-files-found: error

  exact-latest-heavy:
    needs: freshness
    if: needs.freshness.outputs.disposition == 'current'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.freshness.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - name: Run coalesced full integration gate
        env:
          CXX: clang++-22
          CXXLENS_CI_TIER: full
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.freshness.outputs.candidate_sha }}"
          python3 tools/quality/run_gate.py full \
            --preset ci-quick \
            --configure \
            --cmake-arg=-DCXXLENS_CLANG_ADAPTER=ON \
            --report "${RUNNER_TEMP}/cxxlens-autonomy-heavy.json"
      - id: postflight
        name: Reclassify freshness after full gate
        if: always()
        run: |
          git fetch --no-tags origin main
          python3 tools/quality/check_ng_autonomy_ci.py classify-heavy \
            --candidate "${{ needs.freshness.outputs.candidate_sha }}" \
            --github-output "${GITHUB_OUTPUT}" \
            --report "${RUNNER_TEMP}/cxxlens-autonomy-heavy-postflight.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: success() && steps.postflight.outputs.disposition == 'current'
        with:
          # The upload is provisional. A consumer must reauthenticate candidate_sha
          # against current origin/main; artifact existence is never authority.
          name: cxxlens-autonomy-heavy-provisional-${{ needs.freshness.outputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/cxxlens-autonomy-heavy.json
            ${{ runner.temp }}/cxxlens-autonomy-heavy.junit.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: cxxlens-autonomy-heavy-postflight-${{ needs.freshness.outputs.candidate_sha }}
          path: ${{ runner.temp }}/cxxlens-autonomy-heavy-postflight.json
          if-no-files-found: error
