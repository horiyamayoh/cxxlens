name: U2a1c refresh frozen source identity

on:
  push:
    branches:
      - agent/u2a1c-merge-controller-181
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: u2a1c-refresh-frozen-source
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout controller branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/u2a1c-merge-controller-181
          fetch-depth: 0
          persist-credentials: true

      - name: Bind the independently verified cleanup-lifetime source hash
        shell: bash
        run: |
          set -euo pipefail
          old=e545344c2ffb71e5cfffc0c2dd93047f0011a863099fc3af37b6bad1b4fb5e08
          new=c5a2b29e4a6d29c1a821fe92c4a0fe45d943431f4598d365a225102dde1a1a9c
          test "$(grep -c "${old}" .github/workflows/u2a1c-merge-controller.yml)" = 1
          sed -i "s/${old}/${new}/" .github/workflows/u2a1c-merge-controller.yml
          rm .github/workflows/u2a1c-refresh-frozen-hash.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: accept verified U2a1c cleanup receipt lifetime fix'
          git push origin HEAD:agent/u2a1c-merge-controller-181
