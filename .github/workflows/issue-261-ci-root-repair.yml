name: Remove issue 261 branch-only checkpoint workflows

on:
  push:
    branches:
      - agent/issue-261-source-closure-vfs-implementation

permissions:
  contents: write

concurrency:
  group: issue-261-checkpoint-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: agent/issue-261-source-closure-vfs-implementation
          fetch-depth: 0
      - name: Remove temporary workflows and publish one clean checkpoint
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/issue-261-ci-root-repair.yml \
            .github/workflows/issue-261-compiler-vfs-check.yml \
            .github/workflows/issue-261-request-v2_2-check.yml \
            .github/workflows/issue-261-source-closure-check.yml \
            .github/workflows/issue-261-task-v4-check.yml \
            .github/workflows/issue-261-task-v4-decode-check.yml \
            .github/workflows/issue-261-worker-check.yml \
            .github/workflows/source-export-issue-261-implementation.yml
          python3 tools/quality/check_documentation_consistency.py generate --root .
          python3 tools/quality/verify_checksums.py generate --root .
          python3 tools/quality/check_documentation_consistency.py check --root .
          python3 tools/quality/verify_checksums.py check --root .
          git diff --check
          git config user.name horiyamayoh
          git config user.email 44720751+horiyamayoh@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary #261 checkpoint workflows"
          git push origin HEAD:agent/issue-261-source-closure-vfs-implementation
