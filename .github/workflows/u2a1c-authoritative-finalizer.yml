name: U2a1c authoritative source finalizer

on:
  pull_request:
    branches:
      - issue-181-clang22-materialization-runtime
    types:
      - synchronize
    paths:
      - tools/agent/u2a1c-finalize-trigger.txt

permissions:
  contents: write

concurrency:
  group: u2a1c-authoritative-source-finalizer
  cancel-in-progress: false

env:
  HEAD_BRANCH: agent/u2a1c-qualified-mapped-result-181
  BASE_SHA: 7dd0adb0e1c5545dd804908bc8083e88f85b95bd

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 213 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/u2a1c-qualified-mapped-result-181'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/u2a1c-qualified-mapped-result-181
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize, freeze, and publish the seven-file source unit
        shell: bash
        run: |
          set -euo pipefail
          observed=$(git rev-parse HEAD)
          if [[ "${observed}" != "${{ github.event.pull_request.head.sha }}" ]]; then
            echo "event/head mismatch: ${{ github.event.pull_request.head.sha }} != ${observed}" >&2
            exit 1
          fi

          python3 -m py_compile tools/agent/u2a1c_export_source_bundle.py
          python3 tools/agent/u2a1c_export_source_bundle.py \
            --output "${RUNNER_TEMP}/u2a1c-source-bundle.json"

          paths=(
            src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp
            src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp
            src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp
            src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp
            tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp
          )

          cat > "${RUNNER_TEMP}/u2a1c-source.sha256" <<'EOF'
          401ae6fab91f82ca6171430a33c9ae249e4f532b3488f19e52e6a62824840cb6  src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp
          d029b62ed66fd090765d12f5dabed4e3d59a6d20f7cb3e23d6ffce1306139cd3  src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp
          c5a2b29e4a6d29c1a821fe92c4a0fe45d943431f4598d365a225102dde1a1a9c  src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp
          55e5590c9d6ac72d93a05c29cdedceaa1845d853e795a4689f2cfe9c7c800180  src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp
          3380fe7b768f805e6ac4922ba5d3f446f10aca16568c148a1022a9d04db062b4  src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp
          cfb051582c5173f0a0ac558b0981cb921f77ea94bdac48c278541db24e00be8e  src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp
          e6619b355c43a0e634af497e9b665fe8cb4c6a66acc51ca9ae62dc71e841ddad  tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp
          EOF
          sed -i 's/^          //' "${RUNNER_TEMP}/u2a1c-source.sha256"
          sha256sum -c "${RUNNER_TEMP}/u2a1c-source.sha256"

          archive="${RUNNER_TEMP}/u2a1c-source.tar"
          tar -cf "${archive}" "${paths[@]}"

          git checkout --detach "${BASE_SHA}"
          git clean -fdx
          tar -xf "${archive}"

          sha256sum -c "${RUNNER_TEMP}/u2a1c-source.sha256"
          git diff --check "${BASE_SHA}"
          mapfile -t changed < <(git diff --name-only "${BASE_SHA}")
          if (( ${#changed[@]} != 7 )); then
            printf 'Expected exactly seven source files, found %d:\n' "${#changed[@]}" >&2
            printf '  %s\n' "${changed[@]:-}" >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "${path}" in
              src/sdk/sqlite_same_process_shm_*|tests/unit/sdk/sqlite_same_process_shm_*) ;;
              *) echo "Unexpected final path: ${path}" >&2; exit 1 ;;
            esac
          done

          remote=$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)
          if [[ "${remote}" != "${observed}" ]]; then
            echo "candidate branch changed during finalization: ${observed} -> ${remote}" >&2
            exit 1
          fi

          git add "${paths[@]}"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sqlite): qualify mapped reader result ownership'
          git push \
            --force-with-lease="refs/heads/${HEAD_BRANCH}:${observed}" \
            origin HEAD:"refs/heads/${HEAD_BRANCH}"
