name: U2a1c mapped-result execute v7

on:
  push:
    branches:
      - agent/u2a1c-mapped-result-workbench-181
    paths:
      - tools/agent/u2a1c_apply_source.py
      - tools/agent/u2a1c_apply_source_v4.py
      - tools/agent/u2a1c_apply_source_v5.py
      - .github/workflows/u2a1c-execute-v7.yml

concurrency:
  group: issue-181-u2a1c-finalizer
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  qualify-pr-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 1
      BASE_BRANCH: issue-181-clang22-materialization-runtime
      U2A1B_SHA: 7dd0adb0e1c5545dd804908bc8083e88f85b95bd
      OUTPUT_BRANCH: agent/u2a1c-mapped-result-181-v7
    steps:
      - name: Checkout least-authority workbench driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/u2a1c-mapped-result-workbench-181
          fetch-depth: 2

      - name: Wait boundedly for an older v6 writer to leave the critical section
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent/u2a1c-mapped-result-workbench-181&per_page=100")"
            active="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get("workflow_runs",[]) if r.get("name")=="U2a1c mapped-result execute v6" and r.get("status") in {"queued","in_progress","waiting","requested","pending"}))' <<<"${runs}")"
            if [[ "${active}" == "0" ]]; then
              echo "No active v6 writer"
              exit 0
            fi
            echo "v6 writer still active (${attempt}/45); bounded wait"
            sleep 20
          done
          echo "v6 did not leave the critical section within 15 minutes"
          exit 1

      - name: Classify the exact active implementation branch
        id: base
        shell: bash
        run: |
          set -euo pipefail
          cp tools/agent/u2a1c_apply_source.py "${RUNNER_TEMP}/u2a1c_apply_source.py"
          cp tools/agent/u2a1c_apply_source_v4.py "${RUNNER_TEMP}/u2a1c_apply_source_v4.py"
          cp tools/agent/u2a1c_apply_source_v5.py "${RUNNER_TEMP}/u2a1c_apply_source_v5.py"
          remote_sha="$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')"
          echo "remote_sha=${remote_sha}" >> "${GITHUB_OUTPUT}"
          if [[ "${remote_sha}" != "${U2A1B_SHA}" ]]; then
            git fetch --no-tags origin "${remote_sha}"
            git switch --detach "${remote_sha}"
            if grep -q 'sqlite_shm_reader_mapped_effect_identity_validation_capability' \
                 src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp && \
               grep -q 'sqlite_same_process_shm_reader_receipt_validator::validate' \
                 src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp && \
               grep -q 'mapped_effect_validation_phase' \
                 src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp; then
              echo "already_integrated=true" >> "${GITHUB_OUTPUT}"
              echo "U2a1c is already present at ${remote_sha}; this run is a no-op"
              exit 0
            fi
            echo "Active branch moved without the complete U2a1c symbols; refusing to stack"
            exit 1
          fi
          echo "already_integrated=false" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code origin "refs/heads/${OUTPUT_BRANCH}"; then
            echo "Output branch already exists; refusing a non-fast-forward rewrite"
            exit 1
          fi
          git fetch --no-tags origin "${U2A1B_SHA}"
          git switch --detach "${U2A1B_SHA}"
          git switch -c "${OUTPUT_BRANCH}"
          mkdir -p tools/agent
          cp "${RUNNER_TEMP}/u2a1c_apply_source.py" tools/agent/u2a1c_apply_source.py
          cp "${RUNNER_TEMP}/u2a1c_apply_source_v4.py" tools/agent/u2a1c_apply_source_v4.py
          cp "${RUNNER_TEMP}/u2a1c_apply_source_v5.py" tools/agent/u2a1c_apply_source_v5.py

      - name: Record an already-integrated bounded no-op
        if: steps.base.outputs.already_integrated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="## U2a1c v7 bounded no-op\n\nThe active #193 branch already contains the complete mapped-result capability, closed validator, and mapped terminal phase at \`${{ steps.base.outputs.remote_sha }}\`. No second writer or duplicate PR was created. Run: ${run_url}"
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"

      - name: Apply least-authority exact bounded transformation
        if: steps.base.outputs.already_integrated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/agent/u2a1c_apply_source_v5.py | tee "${RUNNER_TEMP}/u2a1c-transform.log"
          git diff --check
          git status --short | tee "${RUNNER_TEMP}/u2a1c-status.log"
          test -n "$(git status --short)"

      - name: Independent authority-boundary review
        if: steps.base.outputs.already_integrated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lease_h = Path('src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp').read_text()
          lease_c = Path('src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp').read_text()
          issuer_c = Path('src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp').read_text()
          tests = Path('tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp').read_text()

          native_start = lease_h.index('\tclass sqlite_shm_reader_native_attachment_identity')
          native_end = lease_h.index('\n\t};', native_start)
          native_class = lease_h[native_start:native_end]
          assert 'friend class detail::sqlite_shm_mapping_lease_state;' not in native_class
          assert 'friend class sqlite_same_process_shm_reader_receipt_validator;' in native_class

          receipt_start = lease_h.index('\tclass sqlite_shm_verified_reader_attachment_post_map_receipt')
          receipt_end = lease_h.index('\n\t};', receipt_start)
          receipt_class = lease_h[receipt_start:receipt_end]
          assert 'friend class detail::sqlite_shm_mapping_registry_state;' not in receipt_class
          assert 'friend class detail::sqlite_shm_mapping_lease_state;' in receipt_class
          assert 'sqlite_shm_reader_mapped_effect_receipt_control' in receipt_class

          validator_start = lease_h.index('\tclass sqlite_same_process_shm_reader_receipt_validator final')
          validator_end = lease_h.index('\n\t};', validator_start)
          validator = lease_h[validator_start:validator_end]
          assert 'sqlite_shm_reader_native_attachment_identity observed_attachment' in validator
          assert 'observed_shm_object_receipt' not in validator
          assert 'observed_mount_receipt' not in validator

          assert 'sqlite_shm_reader_effect_identity_role::mapped_result' in issuer_c
          assert 'mapped_effect_capability_is_current' in issuer_c
          assert 'sqlite_shm_reader_mapped_effect_validation_phase::terminal_consumed' in lease_c
          assert 'map_attempt->receipt->observed_attachment()' in lease_c
          assert 'map_attempt->receipt->zero_resize_effect_receipt()' in lease_c
          assert 'sqlite_same_process_shm_reader_receipt_validator::validate' in tests
          assert 'observed_receipt.observed_attachment()' in tests
          print('authority review: PASS')
          PY

      - name: Independent lifecycle and exact-scope review
        if: steps.base.outputs.already_integrated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp',
              'src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp',
              'src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp',
              'src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp',
              'src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp',
              'src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp',
              'tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp',
              'tools/agent/u2a1c_apply_source.py',
              'tools/agent/u2a1c_apply_source_v4.py',
              'tools/agent/u2a1c_apply_source_v5.py',
          }
          paths = {line[3:] for line in subprocess.check_output(['git','status','--short'], text=True).splitlines()}
          assert not (paths - allowed), paths - allowed
          production = {p for p in paths if not p.startswith('tools/agent/')}
          assert len(production) == 7, production
          assert all('store.cpp' not in p for p in production)
          assert all('vfs' not in p.lower() for p in production)
          assert all('/public/' not in p for p in production)

          lease = open('src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp', encoding='utf-8').read()
          registry = open('src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp', encoding='utf-8').read()
          assert 'native_status == static_cast<int>(sqlite_native_map_status::ok)' in lease
          assert 'native_mapping != nullptr && delegated_extend == 0' in lease
          assert 'observed_attachment.expected() == map->request.expected_attachment' in lease
          assert 'validate_mapped_effect_identity_for_registry' in registry
          assert 'admission_quarantined_locked()' in registry
          assert '/dev/null' not in lease and '/dev/null' not in registry
          print('lifecycle/scope review: PASS')
          PY
          git diff --check

      - name: Install exact Clang 22 developer toolchain
        if: steps.base.outputs.already_integrated != 'true'
        run: python3 tools/ci/bootstrap_supply_chain.py install --profile developer

      - name: Configure and build exact transformed tree
        if: steps.base.outputs.already_integrated != 'true'
        env:
          CXX: clang++-22
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1320s \
            cmake --preset ci-quick -B build/u2a1c \
              -DCXXLENS_CLANG_ADAPTER=ON \
              -DCXXLENS_BUILD_SHARED=OFF \
            2>&1 | tee "${RUNNER_TEMP}/u2a1c-configure.log"
          timeout --signal=TERM --kill-after=30s 1320s \
            cmake --build build/u2a1c \
            2>&1 | tee "${RUNNER_TEMP}/u2a1c-build.log"

      - name: Run focused lifecycle tests with bounded repetition
        if: steps.base.outputs.already_integrated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/u2a1c --show-only=json-v1 > "${RUNNER_TEMP}/u2a1c-tests.json"
          python3 - "${RUNNER_TEMP}/u2a1c-tests.json" "${RUNNER_TEMP}/u2a1c-focused-tests.txt" <<'PY'
          import json
          import sys
          source, output = sys.argv[1:]
          names = [item["name"] for item in json.load(open(source, encoding="utf-8"))["tests"]]
          tokens = ("identity-issuer", "mapping-lease", "mapping-registry", "same-process-shm")
          selected = [name for name in names if any(token in name for token in tokens)]
          if len(selected) < 3:
              raise SystemExit(f"expected at least three focused lifecycle tests, got {selected!r}")
          with open(output, "w", encoding="utf-8") as handle:
              handle.write("\n".join(selected) + "\n")
          print("focused tests:\n" + "\n".join(selected))
          PY
          while IFS= read -r test_name; do
            escaped="$(printf '%s' "${test_name}" | sed 's/[][(){}.^$*+?|\\]/\\&/g')"
            timeout --signal=TERM --kill-after=20s 480s \
              ctest --test-dir build/u2a1c --tests-regex "^${escaped}$" \
                --repeat until-fail:20 --output-on-failure \
              2>&1 | tee -a "${RUNNER_TEMP}/u2a1c-focused.log"
          done < "${RUNNER_TEMP}/u2a1c-focused-tests.txt"

      - name: Commit and publish the exact source-only branch
        if: steps.base.outputs.already_integrated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm tools/agent/u2a1c_apply_source.py tools/agent/u2a1c_apply_source_v4.py tools/agent/u2a1c_apply_source_v5.py
          git diff --check
          git config user.name "cxxlens-u2a1c-workbench"
          git config user.email "cxxlens-u2a1c-workbench@users.noreply.github.com"
          git add \
            src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp \
            src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp \
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp \
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp \
            src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp \
            src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp \
            tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp
          test -z "$(git status --short | grep -v '^M  ' || true)"
          git commit -m "Implement owner-qualified reader mapped-result validation"
          source_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${U2A1B_SHA}"
          mapfile -t changed < <(git diff --name-only "${U2A1B_SHA}" "${source_head}")
          test "${#changed[@]}" = "7"
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
          echo "SOURCE_HEAD=${source_head}" >> "${GITHUB_ENV}"

      - name: Create GitHub-Flow PR and squash-merge the exact qualified head
        if: steps.base.outputs.already_integrated != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          create_payload="$(python3 - <<'PY'
          import json
          print(json.dumps({
              "title": "Implement owner-qualified reader mapped-result validation",
              "head": "agent/u2a1c-mapped-result-181-v7",
              "base": "issue-181-clang22-materialization-runtime",
              "draft": False,
              "maintainer_can_modify": True,
              "body": "Implements the least-authority bounded U2a1c sub-unit of #181 from exact parent `7dd0adb0e1c5545dd804908bc8083e88f85b95bd`. Adds exact mapped-result issuer/owner validation, a source-private typed native-attachment observation, complete private mapping provenance, one-shot terminal consumption, and focused regression coverage. No forwarding VFS, Store, public API/catalog/status, native callback execution, or outward native-`SQLITE_OK` projection is changed or authorized."
          }))
          PY
          )"
          pr="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/pulls" -d "${create_payload}")"
          number="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])' <<<"${pr}")"
          pr_url="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["html_url"])' <<<"${pr}")"
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' <<<"${pr}")" = "${SOURCE_HEAD}"
          merge_payload="$(python3 - "${SOURCE_HEAD}" <<'PY'
          import json,sys
          print(json.dumps({
              "sha": sys.argv[1],
              "merge_method": "squash",
              "commit_title": "Implement owner-qualified reader mapped-result validation",
              "commit_message": "Complete the least-authority bounded U2a1c mapped-result validator sub-unit of #181 after exact qualification."
          }))
          PY
          )"
          merged=''
          for attempt in 1 2 3 4 5; do
            set +e
            merged="$(curl --fail-with-body --silent --show-error -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${number}/merge" \
              -d "${merge_payload}" 2>"${RUNNER_TEMP}/u2a1c-merge-error.log")"
            code=$?
            set -e
            [[ ${code} -eq 0 ]] && break
            cat "${RUNNER_TEMP}/u2a1c-merge-error.log"
            sleep 5
          done
          test "$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["merged"]).lower())' <<<"${merged}")" = "true"
          echo "PR_URL=${pr_url}" >> "${GITHUB_ENV}"
          echo "MERGE_SHA=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<<"${merged}")" >> "${GITHUB_ENV}"

      - name: Persist successful merge checkpoint
        if: success() && steps.base.outputs.already_integrated != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="## U2a1c least-authority mapped-result unit merged into #193 branch\n\n- source-only PR: ${PR_URL}\n- exact qualified source head: \`${SOURCE_HEAD}\`\n- squash commit: \`${MERGE_SHA}\`\n- bounded run: ${run_url}\n\nExact base guard, two independent structural reviews, pinned Clang 22 full build, focused lifecycle tests repeated 20 times, and GitHub-Flow PR merge completed. No production VFS/Store activation claim is made."
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"

      - name: Persist bounded failure checkpoint
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="## U2a1c bounded v7 attempt stopped fail-closed\n\nNo PR was merged by this attempt. Inspect the named step and Actions log: ${run_url}\n\nThe job has a 60-minute hard ceiling; older-writer polling and every build/test process are independently bounded."
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"
