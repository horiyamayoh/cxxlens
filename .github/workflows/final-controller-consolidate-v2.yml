name: Consolidate final controller v2 hardening

on:
  push:
    branches:
      - agent/final-production-qualification-controller-v2

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout final controller branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/final-production-qualification-controller-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for prior one-shot upgrades and reset to latest head
        shell: bash
        run: |
          set -euo pipefail
          sleep 180
          git fetch --no-tags origin agent/final-production-qualification-controller-v2
          git reset --hard origin/agent/final-production-qualification-controller-v2

      - name: Apply every final-controller hardening idempotently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/agent/final_production_qualification_controller.sh')
          source = path.read_text()

          unsafe = '  gh pr diff 189 --repo "${GITHUB_REPOSITORY}" | head -c 650000 > controller-work/pr-189.diff\n'
          safe = '  gh pr diff 189 --repo "${GITHUB_REPOSITORY}" > controller-work/pr-189.full.diff\n  head -c 650000 controller-work/pr-189.full.diff > controller-work/pr-189.diff\n'
          if unsafe in source:
              source = source.replace(unsafe, safe, 1)
          if safe not in source:
              raise SystemExit('SIGPIPE-safe PR #189 audit is absent')

          cleanup = "rm -f .github/workflows/cxxlens-completion-watchdog.yml .github/workflows/cxxlens-watchdog-*.yml tools/agent/cxxlens_completion_watchdog.sh tools/agent/u2a1c_watchdog_recovery.py"
          cleanup_pattern = re.compile(
              r'rm -f \.github/workflows/cxxlens-completion-watchdog\.yml[^\n]*(?:\n\s*tools/agent/cxxlens_completion_watchdog\.sh)?'
          )
          if cleanup_pattern.search(source):
              source = cleanup_pattern.sub(cleanup, source, count=1)
          elif cleanup not in source:
              merge_anchor = '''if ! git merge-base --is-ancestor origin/main HEAD; then\n  git merge --no-edit origin/main\n  git push origin HEAD:"${FEATURE_BRANCH}"\nfi\n'''
              cleanup_block = merge_anchor + f'''\n# Remove the temporary completion control plane before qualifying the product head.\n{cleanup}\nif ! git diff --quiet; then\n  git add -A\n  git diff --cached --check\n  git commit -m 'ci: retire production completion watchdog'\n  git push origin HEAD:"${{FEATURE_BRANCH}}"\nfi\n'''
              if merge_anchor not in source:
                  raise SystemExit('feature/main merge anchor missing')
              source = source.replace(merge_anchor, cleanup_block, 1)

          marker = "Close superseded generated serial PRs"
          if marker not in source:
              pr_anchor = "log 'Require PR #193 to be the only remaining open PR'\n"
              pr_block = r'''log 'Close superseded generated serial PRs'
          while IFS= read -r number; do
            case "${number}" in
              189|193|203|204) continue ;;
            esac
            head_ref=$(api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.head.ref')
            case "${head_ref}" in
              agent/*)
                api --method POST "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" \
                  -f body="Final production audit: this generated serial/workbench PR is superseded by an exact-head implementation already integrated on \`${FEATURE_BRANCH}\`. Closing it prevents stale candidate state from entering final main qualification. Learning checkpoint: none." >/dev/null || true
                api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" -f state=closed >/dev/null
                ;;
              *)
                echo "Unexpected non-agent open PR #${number} (${head_ref}); refusing automatic closure" >&2
                exit 1
                ;;
            esac
          done < <(api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].number')

          log 'Require PR #193 to be the only remaining open PR'
          '''
              if pr_anchor not in source:
                  raise SystemExit('open PR precondition anchor missing')
              source = source.replace(pr_anchor, pr_block, 1)

          path.write_text(source)
          PY

          bash -n tools/agent/final_production_qualification_controller.sh
          find .github/workflows -maxdepth 1 -type f -name 'final-controller-*.yml' -delete
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: consolidate final production controller hardening'
          git push origin HEAD:agent/final-production-qualification-controller-v2
