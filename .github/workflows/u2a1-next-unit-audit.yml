name: U2a1 next-unit exact source audit

on:
  push:
    branches:
      - agent/u2a1c-mapped-result-workbench-181
    paths:
      - .github/workflows/u2a1-next-unit-audit.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASE_BRANCH: issue-181-clang22-materialization-runtime
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/u2a1c-mapped-result-workbench-181
          fetch-depth: 1

      - name: Wait boundedly for authority-complete U2a1c head
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 135); do
            sha="$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')"
            if [[ -n "${sha}" ]]; then
              git fetch --no-tags origin "${sha}"
              git switch --detach "${sha}"
              if grep -q 'class sqlite_shm_reader_mapped_native_observation final' \
                   src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp && \
                 grep -q 'sqlite_shm_reader_mapped_effect_identity_validation_capability' \
                   src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp; then
                echo "AUDIT_SHA=${sha}" >> "${GITHUB_ENV}"
                exit 0
              fi
            fi
            echo "Authority-complete U2a1c not yet visible (${attempt}/135)"
            sleep 20
          done
          echo "U2a1c did not become visible within 45 minutes"
          exit 1

      - name: Build exact next-unit audit report
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/u2a1-next-audit.md" <<'PY'
          from pathlib import Path
          import re, sys

          root=Path('.')
          targets=[
            root/'src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp',
            root/'src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp',
            root/'src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp',
            root/'src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp',
            root/'src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp',
            root/'src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp',
            root/'tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp',
          ]
          texts={str(p):p.read_text(encoding='utf-8') for p in targets}
          joined='\n'.join(texts.values())

          validator_classes=sorted(set(re.findall(r'class (sqlite_same_process_shm_reader_[A-Za-z0-9_]*validator)',joined)))
          validator_defs={name:sum(text.count(name+'::') for text in texts.values()) for name in validator_classes}
          callbacks=sorted(set(re.findall(r'sqlite_shm_reader_callback_identity_role::([A-Za-z0-9_]+)',joined)))
          effects=sorted(set(re.findall(r'sqlite_shm_reader_effect_identity_role::([A-Za-z0-9_]+)',joined)))
          terminals=sorted(set(re.findall(r'sqlite_shm_reader_session_terminal_identity_role::([A-Za-z0-9_]+)',joined)))
          verify_functions=sorted(set(re.findall(r'void (verify_[A-Za-z0-9_]+)\s*\(',texts[str(targets[-1])])) )
          mapped_tests=[name for name in verify_functions if 'mapped' in name or 'map_identity' in name]
          deferred=[]
          for path,text in texts.items():
            for number,line in enumerate(text.splitlines(),1):
              lower=line.lower()
              if any(token in lower for token in ('deferred','remains blocked','production-blocked','future production','future caller')):
                if any(token in lower for token in ('reader','shm','mapped','validator','issuer','terminal','unmap','close')):
                  deferred.append((path,number,line.strip()))

          lines=[
            '## U2a1 exact next-unit source audit',
            '',
            f'- audited SHA: `{__import__("os").environ.get("AUDIT_SHA","")}`',
            f'- validator classes: `{len(validator_classes)}`',
            f'- verify functions: `{len(verify_functions)}`',
            '',
            '### Validator definition census',
          ]
          lines += [f'- `{name}`: definition references `{validator_defs[name]}`' for name in validator_classes]
          lines += ['', '### Closed identity roles', f'- callback: {", ".join(callbacks)}', f'- effect: {", ".join(effects)}', f'- session terminal: {", ".join(terminals)}']
          lines += ['', '### Mapped / owner-focused tests']
          lines += [f'- `{name}`' for name in mapped_tests[:80]] or ['- none detected']
          lines += ['', '### Reader-lifecycle deferred gates (first 80)']
          lines += [f'- `{path}:{number}` — {line[:220]}' for path,number,line in deferred[:80]] or ['- none detected']
          lines += ['', '### Mechanical priority signal']
          missing=[name for name,count in validator_defs.items() if count==0]
          if missing:
            lines.append('- Validator declarations without out-of-class definitions: '+', '.join(f'`{x}`' for x in missing))
          else:
            lines.append('- All detected validator classes have at least one definition reference; choose by deferred owner role and test gaps.')
          lines.append('- The next write unit must preserve the seven-file authority boundary unless this audit proves a narrower source-only slice.')
          Path(sys.argv[1]).write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Persist audit to issue 181
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' < "${RUNNER_TEMP}/u2a1-next-audit.md")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"

      - name: Persist bounded audit failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          body="## U2a1 next-unit audit stopped fail-closed\n\nThe authority-complete head was not available or the exact source census failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The audit changed no product branch."
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"
