name: Export PR 317 synthesized overlay

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  export-overlay:
    if: >-
      github.event.pull_request.number == 317 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'issue-316-ci-setup-integration'
    runs-on: ubuntu-24.04
    env:
      REVIEWED_SOURCE_COMMIT: e578ed4a9b2885f796803ff5fafe5af8bbc5b0cb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Synthesize and export exact files
        run: |
          set -euo pipefail
          main_checker="${RUNNER_TEMP}/main-readiness.py"
          cp tools/quality/check_ng_api_development_readiness.py "${main_checker}"
          git show "${REVIEWED_SOURCE_COMMIT}:.github/workflows/quality.yml" > .github/workflows/quality.yml
          git show "${REVIEWED_SOURCE_COMMIT}:tools/quality/check_ng_api_development_readiness.py" > tools/quality/check_ng_api_development_readiness.py
          python3 - "${main_checker}" <<'PY'
          from __future__ import annotations
          import pathlib
          import sys

          quality_path = pathlib.Path('.github/workflows/quality.yml')
          quality = quality_path.read_text(encoding='utf-8')
          section_start = quality.index('  quality-contracts:\n')
          section_end = quality.index('\n  agent-context:\n', section_start)
          section = quality[section_start:section_end]
          if '          fetch-depth: 0\n' in section:
              section = section.replace('          fetch-depth: 0\n', '          fetch-depth: 2\n', 1)
          elif '          fetch-depth: 2\n' not in section:
              raise SystemExit('quality-contracts checkout depth is unavailable')
          quality_path.write_text(quality[:section_start] + section + quality[section_end:], encoding='utf-8')

          checker_path = pathlib.Path('tools/quality/check_ng_api_development_readiness.py')
          checker = checker_path.read_text(encoding='utf-8')
          main_checker = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          block_start = main_checker.index('    quality_contracts = _job(quality, "quality-contracts")\n')
          block_end = main_checker.index('    check = _job(quality, "check-tier")\n', block_start)
          block = main_checker[block_start:block_end]
          if block not in checker:
              anchor = '    check = _job(quality, "check-tier")\n'
              if checker.count(anchor) != 1:
                  raise SystemExit('readiness checker insertion anchor differs')
              checker = checker.replace(anchor, block + anchor, 1)
          checker_path.write_text(checker, encoding='utf-8')
          PY
          python3 -m py_compile tools/quality/check_ng_api_development_readiness.py
          echo '>>>BEGIN_QUALITY_B64'
          base64 -w 120 .github/workflows/quality.yml
          echo '>>>END_QUALITY_B64'
          echo '>>>BEGIN_READINESS_B64'
          base64 -w 120 tools/quality/check_ng_api_development_readiness.py
          echo '>>>END_READINESS_B64'
