name: Autonomy release evaluation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current origin/main SHA
        required: true
        type: string
      selection_json:
        description: Canonical cxxlens.ng-release-evidence-selection.v1 JSON
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: autonomy-release-evaluation-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  exact-current-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - name: Reject non-current or non-dispatch release evaluation
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          git fetch --no-tags origin main
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse origin/main)" = "${CANDIDATE_SHA}"
      - id: collect
        name: Collect explicit release producer objects
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION_JSON: ${{ inputs.selection_json }}
        run: |
          set -euo pipefail
          printf '%s' "${SELECTION_JSON}" > "${RUNNER_TEMP}/cxxlens-ng-release-evidence-selection.json"
          python3 tools/quality/collect_ng_release_evidence.py collect \
            --selection "${RUNNER_TEMP}/cxxlens-ng-release-evidence-selection.json" \
            --selection-output "${RUNNER_TEMP}/cxxlens-ng-release-evidence-selection.normalized.json" \
            --bundle-output "${RUNNER_TEMP}/cxxlens-ng-release-evidence-bundle.json" \
            --artifact-root "${RUNNER_TEMP}/cxxlens-ng-release-artifacts"
      - id: authenticate
        name: Authenticate collected release producer objects
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: |
          python3 tools/quality/check_ng_release_evidence_bundle.py check \
            --root . \
            --selection "${RUNNER_TEMP}/cxxlens-ng-release-evidence-selection.normalized.json" \
            --bundle "${RUNNER_TEMP}/cxxlens-ng-release-evidence-bundle.json" \
            --artifact-root "${RUNNER_TEMP}/cxxlens-ng-release-artifacts"
      - name: Validate release contracts and emit bounded aggregate evaluation
        if: always()
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          python3 tools/quality/check_ng_release_contract.py check --root .
          if [[ -f "${RUNNER_TEMP}/cxxlens-ng-release-evidence-bundle.json" && "${{ steps.collect.outcome }}" == "success" && "${{ steps.authenticate.outcome }}" == "success" ]]; then
            python3 tools/quality/check_ng_autonomy_ci.py release-evaluation \
              --candidate "${CANDIDATE_SHA}" \
              --bundle "${RUNNER_TEMP}/cxxlens-ng-release-evidence-bundle.json" \
              --selection "${RUNNER_TEMP}/cxxlens-ng-release-evidence-selection.normalized.json" \
              --artifact-root "${RUNNER_TEMP}/cxxlens-ng-release-artifacts" \
              --report "${RUNNER_TEMP}/cxxlens-autonomy-release-evaluation.json"
          else
            python3 tools/quality/check_ng_autonomy_ci.py release-evaluation \
              --candidate "${CANDIDATE_SHA}" \
              --report "${RUNNER_TEMP}/cxxlens-autonomy-release-evaluation.json"
          fi
      - name: Revalidate exact current main authority before publication
        if: success()
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse origin/main)" = "${CANDIDATE_SHA}"
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-autonomy-release-evaluation-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/cxxlens-autonomy-release-evaluation.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: steps.collect.outcome == 'success' && steps.authenticate.outcome == 'success'
        with:
          name: cxxlens-autonomy-release-evidence-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/cxxlens-ng-release-evidence-selection.normalized.json
            ${{ runner.temp }}/cxxlens-ng-release-evidence-bundle.json
            ${{ runner.temp }}/cxxlens-ng-release-artifacts
          if-no-files-found: error
          retention-days: 365
