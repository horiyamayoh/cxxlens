name: Autonomy release evaluation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current origin/main SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: autonomy-release-evaluation-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  exact-current-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - name: Reject non-current or non-dispatch release evaluation
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          git fetch --no-tags origin main
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse origin/main)" = "${CANDIDATE_SHA}"
      - name: Validate release role contracts without issuing GR
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          python3 tools/quality/check_ng_release_contract.py check --root .
          python3 tools/quality/check_ng_autonomy_ci.py release-evaluation \
            --candidate "${CANDIDATE_SHA}" \
            --report "${RUNNER_TEMP}/cxxlens-autonomy-release-evaluation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-autonomy-release-evaluation-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/cxxlens-autonomy-release-evaluation.json
          if-no-files-found: error
