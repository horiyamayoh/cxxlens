name: U2a1c mapped-result adversarial matrix finalizer

on:
  pull_request:
    branches:
      - issue-181-clang22-materialization-runtime
    types:
      - synchronize
    paths:
      - tools/agent/u2a1c-mapped-matrix-finalize-trigger.txt

permissions:
  contents: write

concurrency:
  group: u2a1c-mapped-matrix-finalizer
  cancel-in-progress: false

env:
  HEAD_BRANCH: agent/u2a1c-mapped-adversarial-matrix-211
  BASE_SHA: b55c878db17691c8a1efed75f60e0aa0f735c7f0

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 215 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/u2a1c-mapped-adversarial-matrix-211'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/u2a1c-mapped-adversarial-matrix-211
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and freeze the three-file source unit
        shell: bash
        run: |
          set -euo pipefail
          observed=$(git rev-parse HEAD)
          if [[ "${observed}" != "${{ github.event.pull_request.head.sha }}" ]]; then
            echo "event/head mismatch: ${{ github.event.pull_request.head.sha }} != ${observed}" >&2
            exit 1
          fi

          python3 -m py_compile tools/agent/u2a1c_materialize_mapped_adversarial_matrix.py
          python3 tools/agent/u2a1c_materialize_mapped_adversarial_matrix.py

          paths=(
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp
            tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp
          )
          cat > "${RUNNER_TEMP}/u2a1c-mapped-matrix.sha256" <<'EOF'
          e68f98ad34ec1e123000917c917930d4ff3851edd3a7e0aab4c430e42dfbf17c  src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp
          65b7f736dfd2ccd63cf171f79cbe1d6451a615325f786eb1157417c5efb04393  src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp
          56d785b9ff637b033c49de05ac829312f4330266c9b612a1179fa4861e4e2573  tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp
          EOF
          sed -i 's/^          //' "${RUNNER_TEMP}/u2a1c-mapped-matrix.sha256"
          sha256sum -c "${RUNNER_TEMP}/u2a1c-mapped-matrix.sha256"
          git diff --check "${BASE_SHA}"

          archive="${RUNNER_TEMP}/u2a1c-mapped-matrix.tar"
          tar -cf "${archive}" "${paths[@]}"

          git checkout --detach "${BASE_SHA}"
          git clean -fdx
          tar -xf "${archive}"
          sha256sum -c "${RUNNER_TEMP}/u2a1c-mapped-matrix.sha256"
          git diff --check "${BASE_SHA}"

          mapfile -t changed < <(git diff --name-only "${BASE_SHA}")
          if (( ${#changed[@]} != 3 )); then
            printf 'Expected exactly three source files, found %d:\n' "${#changed[@]}" >&2
            printf '  %s\n' "${changed[@]:-}" >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "${path}" in
              src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp|\
              src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp|\
              tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp) ;;
              *) echo "Unexpected final path: ${path}" >&2; exit 1 ;;
            esac
          done

          remote=$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)
          if [[ "${remote}" != "${observed}" ]]; then
            echo "candidate branch changed during finalization: ${observed} -> ${remote}" >&2
            exit 1
          fi

          git add "${paths[@]}"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(sqlite): close mapped result adversarial matrix'
          git push \
            --force-with-lease="refs/heads/${HEAD_BRANCH}:${observed}" \
            origin HEAD:"refs/heads/${HEAD_BRANCH}"
