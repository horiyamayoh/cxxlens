name: Add superseded serial PR cleanup

on:
  push:
    branches:
      - agent/final-production-qualification-controller-v2

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout final controller branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/final-production-qualification-controller-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Close only superseded generated serial PRs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/agent/final_production_qualification_controller.sh')
          source = path.read_text()
          marker = "Close superseded generated serial PRs"
          if marker not in source:
              anchor = "log 'Require PR #193 to be the only remaining open PR'\n"
              insertion = r'''log 'Close superseded generated serial PRs'
          while IFS= read -r number; do
            case "${number}" in
              189|193|203|204) continue ;;
            esac
            head_ref=$(api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.head.ref')
            case "${head_ref}" in
              agent/*)
                api --method POST "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" \
                  -f body="Final production audit: this generated serial/workbench PR is superseded by the exact-head implementation already integrated on \`${FEATURE_BRANCH}\`. Closing it prevents stale candidate state from entering the final main qualification. Learning checkpoint: none." >/dev/null || true
                api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" -f state=closed >/dev/null
                ;;
              *)
                echo "Unexpected non-agent open PR #${number} (${head_ref}); refusing automatic closure" >&2
                exit 1
                ;;
            esac
          done < <(api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].number')

          log 'Require PR #193 to be the only remaining open PR'
          '''
              if anchor not in source:
                  raise SystemExit('open PR precondition anchor not found')
              source = source.replace(anchor, insertion, 1)
              path.write_text(source)
          PY
          bash -n tools/agent/final_production_qualification_controller.sh
          rm -f .github/workflows/final-controller-superseded-pr-cleanup-upgrade.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: close only superseded generated serial PRs'
          git push origin HEAD:agent/final-production-qualification-controller-v2
