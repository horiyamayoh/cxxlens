name: Dispatch exact-main Nightly qualification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nightly-exact-main-dispatch.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-nightly:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the Nightly workflow on the merged main ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${REPOSITORY}/actions/workflows/nightly.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}'
