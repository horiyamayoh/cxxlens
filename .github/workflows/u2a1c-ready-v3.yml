name: U2a1c mapped-result ready gate v3

on:
  workflow_run:
    workflows:
      - U2a1c mapped-result qualification v3
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  create-or-ready:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create or mark the exact subordinate PR ready
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          GRAPHQL_URL: ${{ github.graphql_url }}
          REPOSITORY: ${{ github.repository }}
          OUTPUT_BRANCH: agent/u2a1c-mapped-result-181-v3
          BASE_BRANCH: issue-181-clang22-materialization-runtime
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          pr_json=''
          for attempt in 1 2 3 4 5; do
            pulls="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${REPOSITORY}/pulls?state=open&head=${owner}:${OUTPUT_BRANCH}&base=${BASE_BRANCH}")"
            count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' <<<"${pulls}")"
            if [[ "${count}" != "0" ]]; then
              pr_json="$(python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)[0]))' <<<"${pulls}")"
              break
            fi
            sleep 5
          done
          if [[ -z "${pr_json}" ]]; then
            payload="$(python3 - <<'PY'
          import json
          print(json.dumps({
              "title": "Implement owner-qualified reader mapped-result validation",
              "head": "agent/u2a1c-mapped-result-181-v3",
              "base": "issue-181-clang22-materialization-runtime",
              "draft": False,
              "maintainer_can_modify": True,
              "body": "Implements the bounded U2a1c sub-unit of #181 from exact parent `7dd0adb0e1c5545dd804908bc8083e88f85b95bd`.\n\nAdds production-inert exact mapped-result issuer/owner validation, complete private mapping and SHM observation provenance, one-shot terminal consumption, and focused regression coverage. No forwarding VFS, Store, public API/catalog/status, native callback execution, or outward native-`SQLITE_OK` projection is changed or authorized.\n\nThe source-only branch was published only after the exact-base guard, pinned Clang 22 build, repeated focused lifecycle tests, and diff checks succeeded."
          }))
          PY
          )"
            pr_json="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${REPOSITORY}/pulls" \
              -d "${payload}")"
          fi
          draft="$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["draft"]).lower())' <<<"${pr_json}")"
          node_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["node_id"])' <<<"${pr_json}")"
          pr_url="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["html_url"])' <<<"${pr_json}")"
          if [[ "${draft}" == "true" ]]; then
            graphql_payload="$(python3 - "${node_id}" <<'PY'
          import json,sys
          print(json.dumps({
              "query": "mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}",
              "variables": {"id": sys.argv[1]},
          }))
          PY
          )"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              "${GRAPHQL_URL}" \
              -d "${graphql_payload}"
          fi
          body="## U2a1c subordinate PR ready\n\n- PR: ${pr_url}\n- prequalification: ${RUN_URL}\n- full pull-request Quality gates are now required before merge."
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/issues/181/comments" \
            -d "${payload}"
