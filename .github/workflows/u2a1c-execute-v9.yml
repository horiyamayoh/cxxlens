name: U2a1c mapped-result execute v9

on:
  push:
    branches:
      - agent/u2a1c-mapped-result-workbench-181
    paths:
      - tools/agent/u2a1c_apply_source.py
      - tools/agent/u2a1c_apply_source_v8.py
      - tools/agent/u2a1c_apply_source_v9.py
      - .github/workflows/u2a1c-execute-v9.yml

concurrency:
  group: issue-181-u2a1c-authority-complete-finalizer
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  qualify-pr-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 2
      BASE_BRANCH: issue-181-clang22-materialization-runtime
      U2A1B_SHA: 7dd0adb0e1c5545dd804908bc8083e88f85b95bd
      OUTPUT_BRANCH: agent/u2a1c-mapped-result-181-v9
    steps:
      - name: Checkout authority-complete workbench driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/u2a1c-mapped-result-workbench-181
          fetch-depth: 2

      - name: Wait boundedly for older U2a1c writers
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent/u2a1c-mapped-result-workbench-181&per_page=100")"
            active="$(python3 -c 'import json,sys; d=json.load(sys.stdin); names={"U2a1c mapped-result execute v6","U2a1c mapped-result execute v7"}; print(sum(1 for r in d.get("workflow_runs",[]) if r.get("name") in names and r.get("status") in {"queued","in_progress","waiting","requested","pending"}))' <<<"${runs}")"
            if [[ "${active}" == "0" ]]; then
              echo "No older U2a1c writer is active"
              exit 0
            fi
            echo "Older writer still active (${attempt}/45); bounded wait"
            sleep 20
          done
          echo "Older writer did not leave the critical section within 15 minutes"
          exit 1

      - name: Classify fresh, provisional-repair, or already-integrated base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          cp tools/agent/u2a1c_apply_source.py "${RUNNER_TEMP}/u2a1c_apply_source.py"
          cp tools/agent/u2a1c_apply_source_v8.py "${RUNNER_TEMP}/u2a1c_apply_source_v8.py"
          cp tools/agent/u2a1c_apply_source_v9.py "${RUNNER_TEMP}/u2a1c_apply_source_v9.py"
          remote_sha="$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')"
          test -n "${remote_sha}"
          echo "remote_sha=${remote_sha}" >> "${GITHUB_OUTPUT}"
          git fetch --no-tags origin "${remote_sha}"
          git switch --detach "${remote_sha}"

          complete=false
          if grep -q 'class sqlite_shm_reader_mapped_native_observation final' \
               src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp && \
             grep -q 'sqlite_shm_reader_mapped_effect_identity_validation_capability' \
               src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp && \
             grep -q 'sqlite_same_process_shm_reader_receipt_validator::validate' \
               src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp && \
             grep -q 'mapped_effect_validation_phase' \
               src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp; then
            complete=true
          fi
          if [[ "${complete}" == "true" ]]; then
            echo "mode=already" >> "${GITHUB_OUTPUT}"
            echo "Authority-complete U2a1c is already present at ${remote_sha}"
            exit 0
          fi

          if git ls-remote --exit-code origin "refs/heads/${OUTPUT_BRANCH}"; then
            echo "Output branch already exists; refusing a non-fast-forward rewrite"
            exit 1
          fi

          mode=fresh
          if [[ "${remote_sha}" != "${U2A1B_SHA}" ]]; then
            if grep -q 'sqlite_shm_reader_mapped_effect_identity_validation_capability' \
                 src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp && \
               grep -q 'sqlite_same_process_shm_reader_receipt_validator::validate' \
                 src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp && \
               [[ "$(git rev-parse HEAD^)" == "${U2A1B_SHA}" ]]; then
              mode=repair
            else
              echo "Unexpected #193 branch movement; refusing to rewrite or stack"
              exit 1
            fi
          fi

          git switch -c "${OUTPUT_BRANCH}"
          if [[ "${mode}" == "repair" ]]; then
            git revert --no-commit "${remote_sha}"
            git diff --quiet "${U2A1B_SHA}" -- \
              src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp \
              src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp \
              src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp \
              src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp \
              src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp \
              src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp \
              tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp
            echo "Provisional direct child reverted in worktree; applying authority-complete replacement"
          fi
          mkdir -p tools/agent
          cp "${RUNNER_TEMP}/u2a1c_apply_source.py" tools/agent/u2a1c_apply_source.py
          cp "${RUNNER_TEMP}/u2a1c_apply_source_v8.py" tools/agent/u2a1c_apply_source_v8.py
          cp "${RUNNER_TEMP}/u2a1c_apply_source_v9.py" tools/agent/u2a1c_apply_source_v9.py
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Record already-integrated bounded no-op
        if: steps.base.outputs.mode == 'already'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="## U2a1c authority-complete v9 bounded no-op\n\nThe active #193 branch already contains the private mapped-native observation, exact mapped owner/effect capability, closed validator, and one-shot terminal phase at \`${{ steps.base.outputs.remote_sha }}\`. No duplicate PR or second writer was created. Run: ${run_url}"
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"

      - name: Apply hardened authority-complete transformation
        if: steps.base.outputs.mode != 'already'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/agent/u2a1c_apply_source_v9.py | tee "${RUNNER_TEMP}/u2a1c-transform.log"
          git diff --check
          git status --short | tee "${RUNNER_TEMP}/u2a1c-status.log"
          test -n "$(git status --short)"

      - name: Independent authority and non-circularity review
        if: steps.base.outputs.mode != 'already'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h = Path('src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp').read_text()
          c = Path('src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp').read_text()
          issuer = Path('src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp').read_text()
          tests = Path('tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp').read_text()

          obs_start = h.index('\tclass sqlite_shm_reader_mapped_native_observation final')
          obs_end = h.index('\n\t};', obs_start)
          observation = h[obs_start:obs_end]
          assert 'friend class detail::sqlite_shm_mapping_registry_state;' in observation
          assert 'friend class sqlite_same_process_shm_lease_test_peer;' in observation
          assert 'sqlite_shm_reader_mapped_native_observation(const sqlite_shm_reader_mapped_native_observation&)' in observation
          assert '= delete;' in observation

          identity_start = h.index('\tclass sqlite_shm_reader_native_attachment_identity')
          identity_end = h.index('\n\t};', identity_start)
          identity = h[identity_start:identity_end]
          assert 'friend class detail::sqlite_shm_mapping_lease_state;' in identity
          assert 'friend class sqlite_same_process_shm_reader_receipt_validator;' not in identity

          validator_start = h.index('\tclass sqlite_same_process_shm_reader_receipt_validator final')
          validator_end = h.index('\n\t};', validator_start)
          validator = h[validator_start:validator_end]
          assert 'sqlite_shm_reader_mapped_native_observation observation' in validator
          assert 'sqlite_shm_reader_native_attachment_identity observed_attachment' not in validator
          assert 'observed_shm_object_receipt' not in validator

          assert 'observation.expected() == map->request.expected_attachment' in c
          assert 'observation.native_status() ==' in c
          assert 'observation.native_mapping() == map->expected_mapping.native_mapping' in c
          assert 'map_attempt->receipt->observed_attachment()' in c
          assert 'map_attempt->receipt->zero_resize_effect_receipt()' in c
          assert 'sqlite_shm_reader_mapped_effect_validation_phase::terminal_consumed' in c
          assert 'mapped_effect_capability_is_current' in issuer
          assert 'reader_mapped_native_observation' in tests
          assert '!std::is_copy_constructible_v<sqlite_shm_reader_mapped_native_observation>' in tests
          print('authority/non-circularity review: PASS')
          PY

      - name: Independent lifecycle, race-surface, and exact-scope review
        if: steps.base.outputs.mode != 'already'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp',
              'src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp',
              'src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp',
              'src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp',
              'src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp',
              'src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp',
              'tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp',
              'tools/agent/u2a1c_apply_source.py',
              'tools/agent/u2a1c_apply_source_v8.py',
              'tools/agent/u2a1c_apply_source_v9.py',
          }
          paths = {line[3:] for line in subprocess.check_output(['git','status','--short'], text=True).splitlines()}
          assert not (paths - allowed), paths - allowed
          production = {p for p in paths if not p.startswith('tools/agent/')}
          assert len(production) == 7, production
          assert all('store.cpp' not in p for p in production)
          assert all('vfs' not in p.lower() for p in production)
          assert all('/public/' not in p for p in production)

          lease = open('src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp', encoding='utf-8').read()
          registry = open('src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp', encoding='utf-8').read()
          assert 'sqlite_shm_reader_mapped_effect_validation_phase::validating' in lease
          assert 'sqlite_shm_reader_mapped_effect_validation_phase::poisoned' in lease
          assert 'sqlite_shm_reader_mapped_effect_validation_phase::sealed' in lease
          assert 'sqlite_shm_reader_mapped_effect_validation_phase::terminal_consumed' in lease
          assert 'validate_mapped_effect_identity_for_registry' in registry
          assert 'admission_quarantined_locked()' in registry
          assert '/dev/null' not in lease and '/dev/null' not in registry
          print('lifecycle/race/scope review: PASS')
          PY
          git diff --check

      - name: Install exact Clang 22 developer toolchain
        if: steps.base.outputs.mode != 'already'
        run: python3 tools/ci/bootstrap_supply_chain.py install --profile developer

      - name: Configure and build exact transformed tree
        if: steps.base.outputs.mode != 'already'
        env:
          CXX: clang++-22
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1320s \
            cmake --preset ci-quick -B build/u2a1c \
              -DCXXLENS_CLANG_ADAPTER=ON \
              -DCXXLENS_BUILD_SHARED=OFF \
            2>&1 | tee "${RUNNER_TEMP}/u2a1c-configure.log"
          timeout --signal=TERM --kill-after=30s 1320s \
            cmake --build build/u2a1c \
            2>&1 | tee "${RUNNER_TEMP}/u2a1c-build.log"

      - name: Repeat focused issuer, lease, and registry lifecycle tests
        if: steps.base.outputs.mode != 'already'
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/u2a1c --show-only=json-v1 > "${RUNNER_TEMP}/u2a1c-tests.json"
          python3 - "${RUNNER_TEMP}/u2a1c-tests.json" "${RUNNER_TEMP}/u2a1c-focused-tests.txt" <<'PY'
          import json
          import sys
          source, output = sys.argv[1:]
          names = [item["name"] for item in json.load(open(source, encoding="utf-8"))["tests"]]
          tokens = ("identity-issuer", "mapping-lease", "mapping-registry", "same-process-shm")
          selected = [name for name in names if any(token in name for token in tokens)]
          if len(selected) < 3:
              raise SystemExit(f"expected at least three focused lifecycle tests, got {selected!r}")
          with open(output, "w", encoding="utf-8") as handle:
              handle.write("\n".join(selected) + "\n")
          print("focused tests:\n" + "\n".join(selected))
          PY
          while IFS= read -r test_name; do
            escaped="$(printf '%s' "${test_name}" | sed 's/[][(){}.^$*+?|\\]/\\&/g')"
            timeout --signal=TERM --kill-after=20s 600s \
              ctest --test-dir build/u2a1c --tests-regex "^${escaped}$" \
                --repeat until-fail:20 --output-on-failure \
              2>&1 | tee -a "${RUNNER_TEMP}/u2a1c-focused.log"
          done < "${RUNNER_TEMP}/u2a1c-focused-tests.txt"

      - name: Run the complete CTest inventory and allow only recorded downstream gaps
        if: steps.base.outputs.mode != 'already'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 1200s \
            ctest --test-dir build/u2a1c --output-on-failure \
              --output-junit "${RUNNER_TEMP}/u2a1c-all.xml" \
            2>&1 | tee "${RUNNER_TEMP}/u2a1c-all.log"
          test_rc=${PIPESTATUS[0]}
          set -e
          python3 - "${RUNNER_TEMP}/u2a1c-all.xml" "${test_rc}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          path, raw_rc = sys.argv[1:]
          rc = int(raw_rc)
          root = ET.parse(path).getroot()
          failed = {
              case.attrib.get("name", "")
              for case in root.iter("testcase")
              if case.find("failure") is not None or case.find("error") is not None
          }
          allowed = {"unit.sdk-store", "adapter.clang22-materialization-store"}
          unexpected = failed - allowed
          if unexpected:
              raise SystemExit(f"unexpected full-suite failures: {sorted(unexpected)}")
          if rc != 0 and not failed:
              raise SystemExit(f"ctest returned {rc} without classified test failures")
          print(f"full inventory accepted; known downstream failures={sorted(failed)}")
          PY

      - name: Commit and publish the exact source-only branch
        if: steps.base.outputs.mode != 'already'
        shell: bash
        run: |
          set -euo pipefail
          rm tools/agent/u2a1c_apply_source.py tools/agent/u2a1c_apply_source_v8.py tools/agent/u2a1c_apply_source_v9.py
          git diff --check
          git config user.name "cxxlens-u2a1c-workbench"
          git config user.email "cxxlens-u2a1c-workbench@users.noreply.github.com"
          git add \
            src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp \
            src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp \
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp \
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp \
            src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp \
            src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp \
            tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" = "7"
          git commit -m "Implement owner-qualified reader mapped-result validation"
          source_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${{ steps.base.outputs.remote_sha }}"
          current_remote="$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')"
          test "${current_remote}" = "${{ steps.base.outputs.remote_sha }}"
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
          echo "SOURCE_HEAD=${source_head}" >> "${GITHUB_ENV}"

      - name: Create GitHub-Flow PR and squash-merge the exact qualified head
        if: steps.base.outputs.mode != 'already'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          current_remote="$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')"
          test "${current_remote}" = "${{ steps.base.outputs.remote_sha }}"
          mode="${{ steps.base.outputs.mode }}"
          create_payload="$(python3 - "${mode}" <<'PY'
          import json,sys
          mode=sys.argv[1]
          print(json.dumps({
              "title": "Implement owner-qualified reader mapped-result validation",
              "head": "agent/u2a1c-mapped-result-181-v9",
              "base": "issue-181-clang22-materialization-runtime",
              "draft": False,
              "maintainer_can_modify": True,
              "body": f"Implements the authority-complete bounded U2a1c sub-unit of #181 ({mode} mode). A distinct move-only registry-private mapped-native observation is consumed only after exact owner/callback/effect authentication and then promoted to the retained attachment identity. Complete private mapping provenance and one-shot terminal consumption are retained. No forwarding VFS, Store, public API/catalog/status, native callback execution, or outward native-SQLITE_OK projection is changed or authorized."
          }))
          PY
          )"
          pr="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/pulls" -d "${create_payload}")"
          number="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])' <<<"${pr}")"
          pr_url="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["html_url"])' <<<"${pr}")"
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' <<<"${pr}")" = "${SOURCE_HEAD}"
          merge_payload="$(python3 - "${SOURCE_HEAD}" <<'PY'
          import json,sys
          print(json.dumps({
              "sha": sys.argv[1],
              "merge_method": "squash",
              "commit_title": "Implement owner-qualified reader mapped-result validation",
              "commit_message": "Complete the authority-correct bounded U2a1c mapped-result validator sub-unit of #181 after exact qualification."
          }))
          PY
          )"
          merged=''
          for attempt in 1 2 3 4 5; do
            set +e
            merged="$(curl --fail-with-body --silent --show-error -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${number}/merge" \
              -d "${merge_payload}" 2>"${RUNNER_TEMP}/u2a1c-merge-error.log")"
            code=$?
            set -e
            [[ ${code} -eq 0 ]] && break
            cat "${RUNNER_TEMP}/u2a1c-merge-error.log"
            sleep 5
          done
          test "$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["merged"]).lower())' <<<"${merged}")" = "true"
          echo "PR_URL=${pr_url}" >> "${GITHUB_ENV}"
          echo "MERGE_SHA=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<<"${merged}")" >> "${GITHUB_ENV}"

      - name: Persist successful authority-complete checkpoint
        if: success() && steps.base.outputs.mode != 'already'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="## U2a1c authority-complete mapped-result unit merged into #193 branch\n\n- mode: \`${{ steps.base.outputs.mode }}\`\n- source-only PR: ${PR_URL}\n- exact qualified source head: \`${SOURCE_HEAD}\`\n- squash commit: \`${MERGE_SHA}\`\n- bounded run: ${run_url}\n\nEvidence: exact branch guard, independent non-circular authority review, independent lifecycle/race/scope review, pinned Clang 22 full build, focused lifecycle tests repeated 20 times, complete CTest inventory with only recorded downstream gaps permitted, exact seven-file scope, and GitHub-Flow PR merge. No production VFS/Store activation claim is made."
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"

      - name: Persist bounded failure checkpoint
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="## U2a1c authority-complete v9 stopped fail-closed\n\nNo PR was merged by this attempt. Inspect the named step and retained Actions log: ${run_url}\n\nThe job has a 65-minute hard ceiling; older-writer polling and every build/test process are independently bounded. Unexpected branch movement, provisional ancestry, source scope, or test failures stop publication."
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"
