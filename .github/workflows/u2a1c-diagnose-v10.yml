name: U2a1c diagnose v10 failure

on:
  push:
    branches:
      - agent/u2a1c-mapped-result-workbench-181
    paths:
      - .github/workflows/u2a1c-diagnose-v10.yml

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Wait for and inspect latest v10 run
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 135); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent/u2a1c-mapped-result-workbench-181&per_page=100" \
              > "${RUNNER_TEMP}/runs.json"
            read -r run_id status conclusion < <(python3 - "${RUNNER_TEMP}/runs.json" <<'PY'
          import json,sys
          runs=[r for r in json.load(open(sys.argv[1],encoding='utf-8')).get('workflow_runs',[]) if r.get('name')=='U2a1c mapped-result execute v10']
          if not runs: print('  missing'); raise SystemExit
          run=max(runs,key=lambda r:r.get('created_at',''))
          print(run['id'],run.get('status',''),run.get('conclusion') or '')
          PY
            )
            if [[ -n "${run_id}" && "${status}" == "completed" ]]; then
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              echo "conclusion=${conclusion}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "v10 not completed (${attempt}/135)"
            sleep 20
          done
          echo "v10 not completed within diagnostic bound"
          exit 1

      - name: Extract failed steps and bounded log tail
        if: steps.inspect.outputs.conclusion != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          RUN_ID: ${{ steps.inspect.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > "${RUNNER_TEMP}/jobs.json"
          python3 - "${RUNNER_TEMP}/jobs.json" "${RUNNER_TEMP}/failed.md" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          lines=['### Failed jobs and steps']
          for job in data.get('jobs',[]):
            if job.get('conclusion') not in ('success','skipped'):
              lines.append(f"- job `{job.get('name')}`: `{job.get('conclusion')}`")
              for step in job.get('steps',[]):
                if step.get('conclusion') not in ('success','skipped',None):
                  lines.append(f"  - step `{step.get('name')}`: `{step.get('conclusion')}`")
          open(sys.argv[2],'w',encoding='utf-8').write('\n'.join(lines)+'\n')
          PY
          mkdir -p "${RUNNER_TEMP}/logs"
          set +e
          curl --location --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs" \
            -o "${RUNNER_TEMP}/logs.zip"
          download_rc=$?
          set -e
          if [[ ${download_rc} -eq 0 ]]; then
            unzip -q "${RUNNER_TEMP}/logs.zip" -d "${RUNNER_TEMP}/logs"
            find "${RUNNER_TEMP}/logs" -type f -print0 | sort -z | xargs -0 cat \
              | sed -E 's/(Authorization: Bearer|token:)[^ ]+/\1 ***REDACTED***/Ig' \
              | tail -n 180 > "${RUNNER_TEMP}/tail.txt"
          else
            echo 'Log archive was unavailable; failed-step metadata remains authoritative.' > "${RUNNER_TEMP}/tail.txt"
          fi
          {
            echo '## U2a1c v10 automatic failure diagnosis'
            echo
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            echo "- conclusion: \`${{ steps.inspect.outputs.conclusion }}\`"
            echo
            cat "${RUNNER_TEMP}/failed.md"
            echo
            echo '<details><summary>Bounded tail of retained logs</summary>'
            echo
            echo '```text'
            head -c 24000 "${RUNNER_TEMP}/tail.txt"
            echo
            echo '```'
            echo '</details>'
          } > "${RUNNER_TEMP}/diagnosis.md"

      - name: Persist failure diagnosis to issue 181
        if: steps.inspect.outputs.conclusion != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' < "${RUNNER_TEMP}/diagnosis.md")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"

      - name: Confirm successful v10 needs no diagnosis
        if: steps.inspect.outputs.conclusion == 'success'
        run: echo 'v10 succeeded; no failure diagnosis posted.'
