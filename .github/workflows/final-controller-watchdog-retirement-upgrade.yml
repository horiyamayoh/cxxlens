name: Add watchdog retirement to final controller

on:
  push:
    branches:
      - agent/final-production-qualification-controller-v2

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout final controller branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/final-production-qualification-controller-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Retire temporary watchdog before exact-head qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/agent/final_production_qualification_controller.sh')
          source = path.read_text()
          marker = "rm -f .github/workflows/cxxlens-completion-watchdog.yml"
          if marker not in source:
              old = '''if ! git merge-base --is-ancestor origin/main HEAD; then\n  git merge --no-edit origin/main\n  git push origin HEAD:"${FEATURE_BRANCH}"\nfi\nfeature_head=$(git rev-parse HEAD)\n'''
              new = '''if ! git merge-base --is-ancestor origin/main HEAD; then\n  git merge --no-edit origin/main\n  git push origin HEAD:"${FEATURE_BRANCH}"\nfi\n\n# The watchdog exists only to drive unfinished serial work.  Remove it from the\n# exact product head before any final qualification or merge receipt is minted.\nrm -f .github/workflows/cxxlens-completion-watchdog.yml \\\n  tools/agent/cxxlens_completion_watchdog.sh\nif ! git diff --quiet; then\n  git add -A\n  git diff --cached --check\n  git commit -m 'ci: retire production completion watchdog'\n  git push origin HEAD:"${FEATURE_BRANCH}"\nfi\nfeature_head=$(git rev-parse HEAD)\n'''
              if old not in source:
                  raise SystemExit('feature-head anchor not found')
              source = source.replace(old, new, 1)
              path.write_text(source)
          PY
          bash -n tools/agent/final_production_qualification_controller.sh
          rm -f .github/workflows/final-controller-watchdog-retirement-upgrade.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: retire watchdog before final qualification'
          git push origin HEAD:agent/final-production-qualification-controller-v2
