name: Apply workflow acceleration patch for issue 263

on:
  push:
    branches:
      - agent/issue-263-conflict-scoped-completion
    paths:
      - ".github/workflows/apply-issue-263.yml"

permissions:
  contents: write
  issues: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Reconstruct and publish the reviewed exact-main commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/263/comments?per_page=100" \
            > "${RUNNER_TEMP}/issue263-comments.json"
          python3 - "${RUNNER_TEMP}/issue263-comments.json" "${RUNNER_TEMP}/issue263.patch" <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import re
          import sys

          comments_path = pathlib.Path(sys.argv[1])
          patch_path = pathlib.Path(sys.argv[2])
          comments = json.loads(comments_path.read_text(encoding="utf-8"))
          pattern = re.compile(
              r"<!-- CXXLENS_ISSUE263_PATCH_PART (\d{3})/008\n"
              r"([A-Za-z0-9+/=]+)\n-->"
          )
          parts = {}
          for comment in comments:
              body = comment.get("body")
              if not isinstance(body, str):
                  continue
              match = pattern.fullmatch(body)
              if match is None:
                  continue
              index = int(match.group(1))
              if index in parts:
                  raise SystemExit(f"duplicate patch part: {index:03d}")
              parts[index] = match.group(2)
          expected = set(range(1, 9))
          if set(parts) != expected:
              raise SystemExit(
                  f"patch parts differ: expected {sorted(expected)}, got {sorted(parts)}"
              )
          expected_part_length = 5588
          for index in sorted(parts):
              if len(parts[index]) < expected_part_length:
                  raise SystemExit(
                      f"patch part {index:03d} is truncated: {len(parts[index])}"
                  )
              parts[index] = parts[index][:expected_part_length]
              part_digest = hashlib.sha256(parts[index].encode("ascii")).hexdigest()
              print(f"patch part {index:03d}: {len(parts[index])} {part_digest}")
          encoded = "".join(parts[index] for index in sorted(parts))
          encoded_digest = hashlib.sha256(encoded.encode("ascii")).hexdigest()
          if encoded_digest != "38694485255fda66ae8587b01824c4b8f3082515f835bc9399dd319388fd9669":
              raise SystemExit(f"encoded patch digest differs: {encoded_digest}")
          patch = base64.b64decode(encoded, validate=True)
          patch_digest = hashlib.sha256(patch).hexdigest()
          if patch_digest != "7a3b361b638c3c711268e91fa278288e04ab602b625bc8b40c399b675057e7c3":
              raise SystemExit(f"decoded patch digest differs: {patch_digest}")
          patch_path.write_bytes(patch)
          PY
          git apply --check --whitespace=error-all "${RUNNER_TEMP}/issue263.patch"
          git apply --index --whitespace=error-all "${RUNNER_TEMP}/issue263.patch"
          git rm .github/workflows/apply-issue-263.yml
          git diff --cached --check
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          parent_sha = os.environ["GITHUB_SHA"]
          expected_paths = {
              ".github/workflows/apply-issue-263.yml",
              ".github/workflows/nightly.yml",
              ".github/workflows/quality.yml",
              "docs/design/adr/0094-risk-tiered-goal-authorization.md",
              "docs/design/cxxlens_next_generation_integrated_design_ja.md",
              "docs/development/agent-api-development-goal.md",
              "docs/development/build-and-test.md",
              "schemas/cxxlens_ng_api_development_readiness.schema.yaml",
              "schemas/cxxlens_ng_api_development_readiness.yaml",
              "tests/quality/test_ng_api_development_readiness.py",
              "tools/quality/check_ng_api_development_readiness.py",
          }

          def git_output(*arguments: str) -> bytes:
              return subprocess.check_output(["git", *arguments])

          def gh_post(endpoint: str, payload: dict) -> dict:
              completed = subprocess.run(
                  ["gh", "api", "--method", "POST", endpoint, "--input", "-"],
                  input=json.dumps(payload),
                  text=True,
                  capture_output=True,
              )
              if completed.returncode != 0:
                  raise SystemExit(
                      f"GitHub API request failed for {endpoint}: {completed.stderr}"
                  )
              return json.loads(completed.stdout)

          changed_paths = {
              item.decode("utf-8")
              for item in git_output("diff", "--cached", "--name-only", "-z").split(b"\0")
              if item
          }
          if changed_paths != expected_paths:
              raise SystemExit(
                  f"staged paths differ: expected {sorted(expected_paths)}, "
                  f"got {sorted(changed_paths)}"
              )
          deleted_paths = {
              item.decode("utf-8")
              for item in git_output(
                  "diff", "--cached", "--diff-filter=D", "--name-only", "-z"
              ).split(b"\0")
              if item
          }
          if deleted_paths != {".github/workflows/apply-issue-263.yml"}:
              raise SystemExit(f"deleted paths differ: {sorted(deleted_paths)}")

          tree_elements = []
          for path in sorted(changed_paths):
              if path in deleted_paths:
                  tree_elements.append(
                      {"path": path, "mode": "100644", "type": "blob", "sha": None}
                  )
                  continue
              index_entry = git_output("ls-files", "-s", "--", path).decode("utf-8")
              mode = index_entry.split(maxsplit=1)[0]
              content = pathlib.Path(path).read_bytes()
              blob = gh_post(
                  f"repos/{repository}/git/blobs",
                  {
                      "content": base64.b64encode(content).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              tree_elements.append(
                  {"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]}
              )
              print(f"published blob {path}: {blob['sha']}")

          base_tree_sha = git_output("rev-parse", "HEAD^{tree}").decode("ascii").strip()
          tree = gh_post(
              f"repos/{repository}/git/trees",
              {"base_tree": base_tree_sha, "tree": tree_elements},
          )
          commit = gh_post(
              f"repos/{repository}/git/commits",
              {
                  "message": "Accelerate conflict-scoped completion lanes (#263)",
                  "tree": tree["sha"],
                  "parents": [parent_sha],
              },
          )
          print(f"CXXLENS_CREATED_COMMIT_SHA={commit['sha']}")
          PY
