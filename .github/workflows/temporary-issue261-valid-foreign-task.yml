name: Temporary issue 261 valid foreign task witness

on:
  push:
    branches:
      - fix/261-task-transfer-authority-binding
    paths:
      - .github/workflows/temporary-issue261-valid-foreign-task.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-issue261-valid-foreign-task.yml

permissions:
  contents: write

jobs:
  strengthen-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/261-task-transfer-authority-binding
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.11
          cache: pip
          cache-dependency-path: tools/quality/requirements.lock
      - name: Install exact Python quality dependencies
        run: python -m pip install --require-hashes --only-binary=:all: --requirement tools/quality/requirements.lock
      - name: Strengthen cross-task witness
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('tools/quality/check_ng_source_closure_transport.py')
          text = source.read_text(encoding='utf-8')
          old = (
              '    foreign_descriptor["task_id"] = (\n'
              '        "task:semantic-v2:sha256:" + "f" * 64\n'
              '    )\n'
          )
          new = old + (
              '    foreign_descriptor["task_v4_digest"] = (\n'
              '        "semantic-v2:sha256:" + "f" * 64\n'
              '    )\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'source anchor count: {text.count(old)}')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/quality/test_ng_source_closure_transport.py')
          text = tests.read_text(encoding='utf-8')
          old = (
              '        foreign["task_id"] = "task:semantic-v2:sha256:" + "f" * 64\n'
              '        rebound = TransferStateWitness.for_task_extension(\n'
          )
          new = (
              '        foreign["task_id"] = "task:semantic-v2:sha256:" + "f" * 64\n'
              '        foreign["task_v4_digest"] = "semantic-v2:sha256:" + "f" * 64\n'
              '        rebound = TransferStateWitness.for_task_extension(\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'test anchor count: {text.count(old)}')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run bounded evidence
        run: |
          python tools/quality/check_ng_source_closure_transport.py check --root .
          python -m unittest tests.quality.test_ng_source_closure_transport
          python tools/quality/check_ng_work_units.py check --root .
          python tools/quality/verify_checksums.py check --root .
      - name: Commit strengthened witness
        run: |
          git config user.name "cxxlens blocker-fix agent"
          git config user.email "44720751+horiyamayoh@users.noreply.github.com"
          git add -- tools/quality/check_ng_source_closure_transport.py tests/quality/test_ng_source_closure_transport.py
          git diff --cached --check
          git commit -m "Test valid foreign task rebinding rejection (#261)"
          git push origin HEAD:fix/261-task-transfer-authority-binding
