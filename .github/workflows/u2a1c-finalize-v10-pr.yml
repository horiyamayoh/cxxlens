name: U2a1c finalize qualified v10 PR

on:
  push:
    branches:
      - agent/u2a1c-mapped-result-workbench-181
    paths:
      - .github/workflows/u2a1c-finalize-v10-pr.yml

concurrency:
  group: issue-181-u2a1c-v10-pr-finalizer
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASE_BRANCH: issue-181-clang22-materialization-runtime
      SOURCE_BRANCH: agent/u2a1c-mapped-result-181-v10
    steps:
      - name: Checkout repository control branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/u2a1c-mapped-result-workbench-181
          fetch-depth: 1

      - name: Wait boundedly for v10 qualification to finish
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 135); do
            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent/u2a1c-mapped-result-workbench-181&per_page=100")"
            active="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get("workflow_runs",[]) if r.get("name")=="U2a1c mapped-result execute v10" and r.get("status") in {"queued","in_progress","waiting","requested","pending"}))' <<<"${runs}")"
            [[ "${active}" == "0" ]] && exit 0
            echo "v10 qualification active (${attempt}/135)"
            sleep 20
          done
          echo "v10 did not finish within the 45-minute finalizer bound"
          exit 1

      - name: Verify exact qualified source or detect completed integration
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')"
          test -n "${base_sha}"
          git fetch --no-tags origin "${base_sha}"
          git switch --detach "${base_sha}"
          if grep -q 'class sqlite_shm_reader_mapped_native_observation final' \
               src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp && \
             grep -q 'sqlite_shm_reader_mapped_effect_identity_validation_capability' \
               src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp && \
             grep -q 'sqlite_same_process_shm_reader_receipt_validator::validate' \
               src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp; then
            echo "already=true" >> "${GITHUB_OUTPUT}"
            echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          source_sha="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')"
          test -n "${source_sha}"
          git fetch --no-tags origin "${source_sha}"
          test "$(git rev-parse "${source_sha}^")" = "${base_sha}"
          mapfile -t changed < <(git diff --name-only "${base_sha}" "${source_sha}")
          test "${#changed[@]}" = 7
          printf '%s\n' "${changed[@]}" | sort > "${RUNNER_TEMP}/actual.txt"
          cat > "${RUNNER_TEMP}/expected.txt" <<'EOF'
          src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp
          src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp
          src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp
          src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp
          src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp
          src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp
          tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp
          EOF
          sort -o "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/expected.txt"
          diff -u "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/actual.txt"
          git switch --detach "${source_sha}"
          grep -q 'class sqlite_shm_reader_mapped_native_observation final' \
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp
          grep -q 'sqlite_shm_reader_mapped_effect_identity_validation_capability' \
            src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp
          grep -q 'observation.expected() == map->request.expected_attachment' \
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp
          grep -q 'map_attempt->receipt->zero_resize_effect_receipt()' \
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp
          echo "already=false" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Find or create exact GitHub-Flow PR and merge
        if: steps.verify.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')" = "${{ steps.verify.outputs.base_sha }}"
          owner="${GITHUB_REPOSITORY%%/*}"
          pulls="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${owner}:${SOURCE_BRANCH}&base=${BASE_BRANCH}")"
          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' <<<"${pulls}")"
          if [[ "${count}" == "0" ]]; then
            payload="$(python3 - <<'PY'
          import json
          print(json.dumps({
            'title':'Implement owner-qualified reader mapped-result validation',
            'head':'agent/u2a1c-mapped-result-181-v10',
            'base':'issue-181-clang22-materialization-runtime',
            'draft':False,
            'maintainer_can_modify':True,
            'body':'Authority-complete bounded U2a1c. This exact source branch was published only after independent authority/lifecycle reviews, Clang 22 build, 20x focused tests, complete inventory classification, ASan+UBSan, and exact seven-file scope. No production VFS/Store/public/outward-native-OK activation.'
          }))
          PY
          )"
            pr="$(curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${GITHUB_REPOSITORY}/pulls" -d "${payload}")"
          elif [[ "${count}" == "1" ]]; then
            pr="$(python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)[0]))' <<<"${pulls}")"
          else
            echo "Multiple open PRs for the exact source branch"
            exit 1
          fi
          number="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])' <<<"${pr}")"
          pr_url="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["html_url"])' <<<"${pr}")"
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' <<<"${pr}")" = "${{ steps.verify.outputs.source_sha }}"
          merge_payload="$(python3 - '${{ steps.verify.outputs.source_sha }}' <<'PY'
          import json,sys
          print(json.dumps({'sha':sys.argv[1],'merge_method':'squash','commit_title':'Implement owner-qualified reader mapped-result validation','commit_message':'Complete authority-correct U2a1c after exact bounded qualification.'}))
          PY
          )"
          result=''
          for attempt in 1 2 3 4 5; do
            set +e
            result="$(curl --fail-with-body --silent --show-error -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${number}/merge" -d "${merge_payload}" 2>"${RUNNER_TEMP}/merge.err")"
            code=$?; set -e
            [[ ${code} -eq 0 ]] && break
            cat "${RUNNER_TEMP}/merge.err"; sleep 5
          done
          test "$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["merged"]).lower())' <<<"${result}")" = true
          echo "PR_URL=${pr_url}" >> "${GITHUB_ENV}"
          echo "MERGE_SHA=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<<"${result}")" >> "${GITHUB_ENV}"

      - name: Persist finalizer success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.verify.outputs.already }}" == "true" ]]; then
            body="## U2a1c finalizer no-op\n\n#193 already contains authority-complete U2a1c at \`${{ steps.verify.outputs.base_sha }}\`."
          else
            body="## U2a1c qualified PR finalized\n\n- PR: ${PR_URL}\n- exact source head: \`${{ steps.verify.outputs.source_sha }}\`\n- squash commit: \`${MERGE_SHA}\`\n- finalizer: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"

      - name: Persist finalizer failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          body="## U2a1c v10 PR finalizer stopped fail-closed\n\nNo unverified source was merged. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The wait, ancestry, exact-diff, symbol, PR-head, and merge checks are all bounded and mandatory."
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"
