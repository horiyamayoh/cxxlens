name: PR 345 merge-conflict export

on:
  push:
    branches:
      - audit/issue-277-agent-context-slice

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the complete PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Export exact base, ours, theirs, and conflicted worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          branch_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"

          set +e
          git -c user.name='cxxlens conflict exporter' \
            -c user.email='44720751+horiyamayoh@users.noreply.github.com' \
            merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          mkdir -p merge-conflict/stages
          printf '%s\n' "${branch_sha}" > merge-conflict/branch-sha.txt
          printf '%s\n' "${main_sha}" > merge-conflict/main-sha.txt
          printf '%s\n' "${merge_status}" > merge-conflict/merge-status.txt
          git status --porcelain=v1 > merge-conflict/status.txt
          git diff --name-only --diff-filter=U > merge-conflict/conflicted-paths.txt

          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            key="$(printf '%s' "${path}" | sha256sum | cut -d' ' -f1)"
            mkdir -p "merge-conflict/stages/${key}"
            printf '%s\n' "${path}" > "merge-conflict/stages/${key}/path.txt"
            git show ":1:${path}" > "merge-conflict/stages/${key}/base" || true
            git show ":2:${path}" > "merge-conflict/stages/${key}/ours" || true
            git show ":3:${path}" > "merge-conflict/stages/${key}/theirs" || true
            cp -- "${path}" "merge-conflict/stages/${key}/with-markers" || true
          done < merge-conflict/conflicted-paths.txt

          tar --exclude=.git \
            --exclude=merge-conflict \
            -czf /tmp/pr345-worktree-with-conflicts.tgz .
          tar -czf /tmp/pr345-conflict-stages.tgz merge-conflict
          mv /tmp/pr345-worktree-with-conflicts.tgz .
          mv /tmp/pr345-conflict-stages.tgz .

      - name: Upload conflict diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr345-merge-conflict-${{ github.sha }}
          path: |
            pr345-conflict-stages.tgz
            pr345-worktree-with-conflicts.tgz
          if-no-files-found: error
          retention-days: 1
