name: Upgrade serial agent secondary reviewer model

on:
  push:
    branches:
      - agent/release-completion-agent-tools

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current tooling branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/release-completion-agent-tools
          fetch-depth: 0
          persist-credentials: true

      - name: Use a large-context independent secondary reviewer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/agent/release_completion_issue_agent.py')
          source = path.read_text()
          old = 'SECONDARY_MODEL = "openai/gpt-4o"'
          new = 'SECONDARY_MODEL = "openai/gpt-4.1-mini"'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('secondary reviewer model anchor not found')
          path.write_text(source)
          PY
          python3 -m py_compile tools/agent/release_completion_issue_agent.py
          rm -f .github/workflows/release-completion-agent-model-upgrade.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'tools: use large-context secondary release reviewer'
          git push origin HEAD:agent/release-completion-agent-tools
