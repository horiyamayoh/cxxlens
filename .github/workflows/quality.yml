name: Main tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_PARALLEL_LEVEL: ${{ vars.CXXLENS_BUILD_JOBS || 4 }}
  CTEST_PARALLEL_LEVEL: ${{ vars.CXXLENS_TEST_JOBS || 4 }}

jobs:
  deterministic-tests:
    name: Clang 22 ${{ matrix.shared == 'ON' && 'shared' || 'static' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shared: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - name: Build and run every deterministic CTest
        env:
          CXX: clang++-22
        run: |
          cmake --preset ci-quick -DCXXLENS_CLANG_ADAPTER=ON \
            -DCXXLENS_BUILD_SHARED=${{ matrix.shared }}
          cmake --build --preset ci-quick
          ctest --preset ci-quick --parallel "${CTEST_PARALLEL_LEVEL}" \
            --output-on-failure

  contract-and-docs:
    name: Documentation tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
          documentation: "true"
      - name: Build and run documentation assertions
        env:
          CXX: clang++-22
        run: |
          cmake --preset docs -DCXXLENS_CLANG_ADAPTER=ON
          cmake --build --preset docs
          # The deterministic jobs own all quality/security tests. This job
          # owns only the docs fixture graph, which requires CXXLENS_BUILD_DOCS.
          ctest --test-dir build/docs --label-regex '^docs' \
            --output-on-failure

  installed-consumers:
    name: Installed ${{ matrix.shared == 'ON' && 'shared' || 'static' }} consumers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shared: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - name: Build and test the relocated install prefix
        env:
          CXX: clang++-22
        run: |
          cmake --preset install-check -DCXXLENS_CLANG_ADAPTER=ON \
            -DCXXLENS_BUILD_SHARED=${{ matrix.shared }}
          cmake --build --preset install-check
          ctest --preset install-check --parallel "${CTEST_PARALLEL_LEVEL}" \
            --label-regex '^install$' --output-on-failure

  gcc-public-headers:
    name: GCC public headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          profile: none
      - name: Compile LLVM-independent headers
        run: |
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            -fsyntax-only tests/public_headers/cxxlens_header_test.cpp
          g++ -std=c++23 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            -fsyntax-only tests/public_headers/sdk_header_test.cpp

  gcc-application-capture:
    name: Exact GCC 16.2 application capture
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - uses: ./.github/actions/setup-gcc16-capture
      - name: Capture and import an exact GCC-built fixture
        env:
          CXX: clang++-22
        run: |
          cmake --preset ci-quick
          cmake --build --preset ci-quick --target \
            cxxlens cxxlens-gcc-capture-cli-consumer
          python3 tests/unit/sdk/check_gcc_capture_cli.py \
            build/ci-quick/cxxlens "$(command -v g++)" \
            build/ci-quick/tests/cxxlens-gcc-capture-cli-consumer \
            --require-production-build
