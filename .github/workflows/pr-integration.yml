name: PR integration automation

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: ["Quality gates"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to update.
        required: true
        type: number

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  update-branch:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/update-branch' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request || github.event.issue.number }}
    steps:
      - name: Update the exact same-repository PR branch
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${REQUESTED_PR}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr}")"
          state="$(jq -r '.state' <<<"${pr}")"
          if [[ "${head_repo}" != "${GITHUB_REPOSITORY}" || "${state}" != "open" ]]; then
            echo "refusing to update a closed or cross-repository pull request" >&2
            exit 1
          fi
          gh api --method PUT             "repos/${GITHUB_REPOSITORY}/pulls/${REQUESTED_PR}/update-branch"             -f "expected_head_sha=${head_sha}"

  squash-automerge:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Squash marked exact-head PR after Quality succeeds
        run: |
          set -euo pipefail
          prs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/pull_requests")"
          count="$(jq 'length' <<<"${prs}")"
          if [[ "${count}" != "1" ]]; then
            echo "Quality run does not bind exactly one pull request; no merge performed"
            exit 0
          fi
          number="$(jq -r '.[0].number' <<<"${prs}")"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}")"
          body="$(jq -r '.body // ""' <<<"${pr}")"
          draft="$(jq -r '.draft' <<<"${pr}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"${pr}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr}")"
          if ! grep -Fxq 'automerge: squash' <<<"${body}"; then
            echo "PR #${number} is not marked for squash auto-merge"
            exit 0
          fi
          if [[ "${draft}" != "false" || "${head_repo}" != "${GITHUB_REPOSITORY}" ||
                "${head_sha}" != "${RUN_HEAD_SHA}" ]]; then
            echo "PR #${number} no longer matches the successful exact-head run" >&2
            exit 1
          fi
          gh pr merge "${number}" --repo "${GITHUB_REPOSITORY}"             --squash --delete-branch --match-head-commit "${RUN_HEAD_SHA}"

  cleanup-merged-branch:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Delete merged same-repository source branch
        run: |
          set -euo pipefail
          encoded_ref="$(jq -rn --arg value "${HEAD_REF}" '$value|@uri')"
          if ! gh api --method DELETE             "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_ref}"; then
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_ref}" >/dev/null 2>&1; then
              echo "merged branch still exists after deletion failure" >&2
              exit 1
            fi
            echo "merged branch was already absent"
          fi
