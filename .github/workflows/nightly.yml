name: Nightly quality

on:
  workflow_call:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality-${{ github.sha }}
  cancel-in-progress: false

env:
  CXXLENS_CI_TIER: stress
  CMAKE_BUILD_PARALLEL_LEVEL: ${{ vars.CXXLENS_SANITIZER_BUILD_JOBS || 2 }}
  CTEST_PARALLEL_LEVEL: ${{ vars.CXXLENS_SANITIZER_TEST_JOBS || 2 }}

jobs:
  latest-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      candidate_sha: ${{ steps.bind.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: bind
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          printf 'candidate_sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  sanitizers:
    needs: latest-main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.latest-main.outputs.candidate_sha }}
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - name: ASan and UBSan
        env:
          CXX: clang++-22
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:exitcode=86:handle_segv=0:symbolize=1
          UBSAN_OPTIONS: halt_on_error=1:exitcode=86:print_stacktrace=1:symbolize=1
        run: |
          export ASAN_SYMBOLIZER_PATH="$(command -v llvm-symbolizer-22)"
          cmake --preset asan-ubsan
          cmake --build --preset asan-ubsan
          ctest --preset asan-ubsan --parallel "${CTEST_PARALLEL_LEVEL}" \
            --label-exclude quality --output-junit ctest.xml
          python3 tools/quality/check_sanitizer_coverage.py check --root . \
            --build-dir build/asan-ubsan --expected address,undefined \
            --require-install-consumers 2>&1 | tee build/asan-ubsan/sanitizer-coverage.log
          python tools/quality/collect_toolchain_provenance.py \
            --compiler clang++-22 --configuration asan-ubsan-clang22 \
            --output build/asan-ubsan/toolchain.json
          python tools/quality/check_quality_ownership.py evidence \
            --check-id sanitizer.asan-ubsan --configuration asan-ubsan-clang22 \
            --toolchain-provenance build/asan-ubsan/toolchain.json \
            --checker tools/quality/check_sanitizer_coverage.py \
            --output build/asan-ubsan/ctest.xml \
            --output build/asan-ubsan/sanitizer-coverage.log \
            --evidence-output build/asan-ubsan/asan-ubsan.evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-nightly-asan-ubsan-${{ needs.latest-main.outputs.candidate_sha }}
          path: |
            build/asan-ubsan/ctest.xml
            build/asan-ubsan/sanitizer-coverage.log
            build/asan-ubsan/toolchain.json
            build/asan-ubsan/asan-ubsan.evidence.json
          if-no-files-found: error

  thread-sanitizer:
    needs: latest-main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.latest-main.outputs.candidate_sha }}
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - name: TSan
        env:
          CXX: clang++-22
        run: |
          cmake --preset tsan
          cmake --build --preset tsan
      - name: Run exact TSan CTest selection
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=86:handle_segv=0:second_deadlock_stack=1:symbolize=1
        run: |
          ctest --preset tsan --parallel 1 --label-exclude quality \
            --exclude-regex '^install\.clang22-materializer-(success|base64|negative)$' \
            --output-junit ctest.xml
      - name: TSan evidence
        run: |
          python3 tools/quality/check_sanitizer_coverage.py check --root . \
            --build-dir build/tsan --expected thread \
            --require-install-consumers 2>&1 | tee build/tsan/sanitizer-coverage.log
          python tools/quality/collect_toolchain_provenance.py \
            --compiler clang++-22 --configuration tsan-clang22 \
            --output build/tsan/toolchain.json
          python tools/quality/check_quality_ownership.py evidence \
            --check-id sanitizer.tsan --configuration tsan-clang22 \
            --toolchain-provenance build/tsan/toolchain.json \
            --checker tools/quality/check_sanitizer_coverage.py \
            --output build/tsan/ctest.xml \
            --output build/tsan/sanitizer-coverage.log \
            --evidence-output build/tsan/tsan.evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-nightly-tsan-${{ needs.latest-main.outputs.candidate_sha }}
          path: |
            build/tsan/ctest.xml
            build/tsan/sanitizer-coverage.log
            build/tsan/toolchain.json
            build/tsan/tsan.evidence.json
          if-no-files-found: error

  static-analysis:
    needs: latest-main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.latest-main.outputs.candidate_sha }}
      - uses: ./.github/actions/setup-ci
        with:
          profile: static-analysis
      - name: clang-tidy
        env:
          CXX: clang++-22
        run: |
          cmake --preset ci-quick
          cmake --build --preset ci-quick --target cxxlens-clang-tidy \
            2>&1 | tee build/ci-quick/clang-tidy.log
          python tools/quality/collect_toolchain_provenance.py \
            --compiler clang++-22 --configuration clang22 \
            --output build/ci-quick/toolchain.json
          python tools/quality/check_quality_ownership.py evidence \
            --check-id analysis.clang-tidy --configuration clang22 \
            --toolchain-provenance build/ci-quick/toolchain.json \
            --checker .clang-tidy \
            --output build/ci-quick/clang-tidy.log \
            --evidence-output build/ci-quick/clang-tidy.evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-nightly-clang-tidy-${{ needs.latest-main.outputs.candidate_sha }}
          path: |
            build/ci-quick/clang-tidy.log
            build/ci-quick/toolchain.json
            build/ci-quick/clang-tidy.evidence.json
          if-no-files-found: error

  materialization-scale:
    needs: latest-main
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.latest-main.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - name: Build the exact request driver and installed materializer
        env:
          CXX: clang++-22
        run: |
          cmake --preset install-check -DCXXLENS_CLANG_ADAPTER=ON -DCXXLENS_BUILD_SHARED=OFF
          cmake --build --preset install-check --target \
            cxxlens-provider-scaffold cxxlens-sdk-doctor cxxlens-clang-worker-22 \
            cxxlens-clang22-materialization-request-driver cxxlens-clang22-materialize
          cmake --install build/install-check --prefix "${RUNNER_TEMP}/cxxlens-materialization-scale-prefix"
      - name: Run scale harness and retain its result
        id: materialization-scale-harness
        env:
          CXX: clang++-22
        run: |
          set +e
          marker="${RUNNER_TEMP}/cxxlens-materialization-scale-failure.json"
          printf '%s\n' '{"current_scenario":null,"driver":"","exit_status":null,"failure":{"phase":"workflow","reason":"harness-not-started"},"phase":"workflow","report":"cxxlens-materialization-scale-evidence.json","scenarios":[],"schema":"cxxlens.clang22-materialization-scale-run.v1","source_revision":null,"source_tree":null,"status":"workflow-not-started"}' > "${marker}"
          python tests/install/clang22_materializer_scale_test.py \
            --root . \
            --driver build/install-check/tests/cxxlens-clang22-materialization-request-driver \
            --prefix "${RUNNER_TEMP}/cxxlens-materialization-scale-prefix" \
            --work-directory "${RUNNER_TEMP}/cxxlens-materialization-scale-work" \
            --preserve-inputs \
            --failure-marker "${marker}" \
            --output "${RUNNER_TEMP}/cxxlens-materialization-scale-evidence.json"
          harness_status=$?
          printf 'scale harness exit status: %s\n' "${harness_status}"
          printf 'exit_status=%s\n' "${harness_status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Check scale evidence and retain checker result
        id: materialization-scale-check
        if: always()
        run: |
          set +e
          report="${RUNNER_TEMP}/cxxlens-materialization-scale-evidence.json"
          marker="${RUNNER_TEMP}/cxxlens-materialization-scale-failure.json"
          checker_log="${RUNNER_TEMP}/cxxlens-materialization-scale-check.log"
          if [[ -f "${report}" ]]; then
            python tools/quality/check_ng_clang22_materialization_scale.py check \
              --root . \
              --report "${report}" \
              --run-marker "${marker}" \
              --require-installed-scenarios one-task,sixteen-mib-source,arbitrary-short-reads \
              > "${checker_log}" 2>&1
            checker_status=$?
          else
            printf 'scale evidence report is missing; checker was not run\n' > "${checker_log}"
            checker_status=1
          fi
          cat "${checker_log}"
          printf 'scale checker exit status: %s\n' "${checker_status}"
          printf 'exit_status=%s\n' "${checker_status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Collect scale toolchain provenance
        id: materialization-scale-provenance
        if: always()
        run: |
          set +e
          provenance_log="${RUNNER_TEMP}/cxxlens-materialization-scale-provenance.log"
          python tools/quality/collect_toolchain_provenance.py \
            --compiler clang++-22 --configuration materialization-scale-clang22 \
            --output "${RUNNER_TEMP}/cxxlens-materialization-scale-toolchain.json" \
            > "${provenance_log}" 2>&1
          provenance_status=$?
          cat "${provenance_log}"
          printf 'scale provenance exit status: %s\n' "${provenance_status}"
          printf 'exit_status=%s\n' "${provenance_status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Check scale evidence ownership
        id: materialization-scale-ownership
        if: always()
        env:
          HARNESS_STATUS: ${{ steps.materialization-scale-harness.outputs.exit_status }}
          CHECKER_STATUS: ${{ steps.materialization-scale-check.outputs.exit_status }}
          PROVENANCE_STATUS: ${{ steps.materialization-scale-provenance.outputs.exit_status }}
        run: |
          set +e
          report="${RUNNER_TEMP}/cxxlens-materialization-scale-evidence.json"
          toolchain="${RUNNER_TEMP}/cxxlens-materialization-scale-toolchain.json"
          ownership_log="${RUNNER_TEMP}/cxxlens-materialization-scale-ownership.log"
          if [[ "${HARNESS_STATUS}" != "0" || "${CHECKER_STATUS}" != "0" || "${PROVENANCE_STATUS}" != "0" ]]; then
            printf 'scale evidence ownership was not generated: harness=%s checker=%s provenance=%s\n' \
              "${HARNESS_STATUS}" "${CHECKER_STATUS}" "${PROVENANCE_STATUS}" > "${ownership_log}"
            ownership_status=1
          elif [[ -f "${report}" && -f "${toolchain}" ]]; then
            python tools/quality/check_quality_ownership.py evidence \
              --check-id materialization.scale-ingress \
              --configuration materialization-scale-clang22 \
              --toolchain-provenance "${toolchain}" \
              --checker tools/quality/check_ng_clang22_materialization_scale.py \
              --output "${report}" \
              --evidence-output "${RUNNER_TEMP}/cxxlens-materialization-scale-ownership.evidence.json" \
              > "${ownership_log}" 2>&1
            ownership_status=$?
          else
            printf 'scale evidence ownership inputs are incomplete\n' > "${ownership_log}"
            ownership_status=1
          fi
          cat "${ownership_log}"
          printf 'scale ownership exit status: %s\n' "${ownership_status}"
          printf 'exit_status=%s\n' "${ownership_status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: cxxlens-nightly-materialization-scale-${{ needs.latest-main.outputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/cxxlens-materialization-scale-evidence.json
            ${{ runner.temp }}/cxxlens-materialization-scale-evidence.process
            ${{ runner.temp }}/inputs
            ${{ runner.temp }}/cxxlens-materialization-scale-failure.json
            ${{ runner.temp }}/cxxlens-materialization-scale-check.log
            ${{ runner.temp }}/cxxlens-materialization-scale-provenance.log
            ${{ runner.temp }}/cxxlens-materialization-scale-ownership.log
            ${{ runner.temp }}/cxxlens-materialization-scale-toolchain.json
            ${{ runner.temp }}/cxxlens-materialization-scale-ownership.evidence.json
          if-no-files-found: warn
      - name: Enforce scale evidence result
        if: always()
        env:
          HARNESS_STATUS: ${{ steps.materialization-scale-harness.outputs.exit_status }}
          CHECKER_STATUS: ${{ steps.materialization-scale-check.outputs.exit_status }}
          PROVENANCE_STATUS: ${{ steps.materialization-scale-provenance.outputs.exit_status }}
          OWNERSHIP_STATUS: ${{ steps.materialization-scale-ownership.outputs.exit_status }}
        run: |
          if [[ "${HARNESS_STATUS}" != "0" || "${CHECKER_STATUS}" != "0" || "${PROVENANCE_STATUS}" != "0" || "${OWNERSHIP_STATUS}" != "0" ]]; then
            printf 'scale evidence gate failed: harness=%s checker=%s provenance=%s ownership=%s\n' \
              "${HARNESS_STATUS}" "${CHECKER_STATUS}" "${PROVENANCE_STATUS}" "${OWNERSHIP_STATUS}"
            exit 1
          fi

  evidence-ownership:
    needs: [latest-main, sanitizers, thread-sanitizer, static-analysis, materialization-scale]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.latest-main.outputs.candidate_sha }}
      - uses: ./.github/actions/setup-ci
        with:
          profile: none
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          pattern: cxxlens-nightly-*-${{ needs.latest-main.outputs.candidate_sha }}
          path: build/nightly-evidence-input
      - run: |
          python tools/quality/check_quality_ownership.py aggregate \
            --owner nightly --evidence-dir build/nightly-evidence-input \
            --report build/nightly-evidence-set.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-nightly-evidence-${{ needs.latest-main.outputs.candidate_sha }}
          path: build/nightly-evidence-set.json
          if-no-files-found: error

  clean-full:
    needs: latest-main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.latest-main.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - name: Clean no-cache stress gate
        env:
          CXX: clang++-22
          CCACHE_DISABLE: "1"
        run: |
          python tools/quality/run_gate.py stress --preset ci-quick --configure \
            --report "${RUNNER_TEMP}/cxxlens-clean-full.json"
          python tools/quality/collect_toolchain_provenance.py \
            --compiler clang++-22 --configuration "ci-quick;clean-no-cache;stress" \
            --output "${RUNNER_TEMP}/cxxlens-clean-full-toolchain.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-clean-full-${{ needs.latest-main.outputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/cxxlens-clean-full.json
            ${{ runner.temp }}/cxxlens-clean-full*.xml
            ${{ runner.temp }}/cxxlens-clean-full-toolchain.json
            build/ci-quick/.ninja_log
          if-no-files-found: error
