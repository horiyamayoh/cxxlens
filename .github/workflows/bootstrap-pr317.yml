name: Clean exact temporary branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Clean exact temporary branches'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: c24427e6e66af7a75dcc2934bc20ee8cf2f27c37
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Delete only exact temporary refs
        run: |
          set -euo pipefail
          for ref in tmp-base64-whitespace-test tmp2 tmp3 tmp4; do
            current="$(git ls-remote origin "refs/heads/${ref}" | awk '{print $1}')"
            if [[ -z "${current}" ]]; then
              echo "${ref} already absent"
              continue
            fi
            if [[ "${current}" != "${EXPECTED_SHA}" ]]; then
              echo "refusing to delete ${ref}: current=${current}, expected=${EXPECTED_SHA}" >&2
              exit 1
            fi
            git push origin ":refs/heads/${ref}"
          done
