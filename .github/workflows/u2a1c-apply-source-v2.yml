name: U2a1c source apply and focused qualification

on:
  push:
    branches:
      - agent/u2a1c-mapped-result-workbench-181
    paths:
      - tools/agent/u2a1c_apply_source.py
      - tools/agent/u2a1c_apply_source_v2.py
      - .github/workflows/u2a1c-apply-source-v2.yml

permissions:
  contents: write

jobs:
  apply-build-test-publish-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 1
      BASE_BRANCH: issue-181-clang22-materialization-runtime
      BASE_SHA: 7dd0adb0e1c5545dd804908bc8083e88f85b95bd
      OUTPUT_BRANCH: agent/u2a1c-mapped-result-181-v1
    steps:
      - name: Checkout corrected workbench driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/u2a1c-mapped-result-workbench-181
          fetch-depth: 2

      - name: Verify exact implementation base and prepare isolated branch
        shell: bash
        run: |
          set -euo pipefail
          cp tools/agent/u2a1c_apply_source.py "${RUNNER_TEMP}/u2a1c_apply_source.py"
          cp tools/agent/u2a1c_apply_source_v2.py "${RUNNER_TEMP}/u2a1c_apply_source_v2.py"
          remote_sha="$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')"
          printf 'expected base: %s\nremote base:   %s\n' "${BASE_SHA}" "${remote_sha}"
          test "${remote_sha}" = "${BASE_SHA}"
          if git ls-remote --exit-code origin "refs/heads/${OUTPUT_BRANCH}"; then
            echo "Output branch already exists; refusing a non-fast-forward rewrite"
            exit 1
          fi
          git fetch --no-tags origin "${BASE_SHA}"
          git switch --detach "${BASE_SHA}"
          git switch -c "${OUTPUT_BRANCH}"
          cp "${RUNNER_TEMP}/u2a1c_apply_source.py" tools/agent/u2a1c_apply_source.py
          cp "${RUNNER_TEMP}/u2a1c_apply_source_v2.py" tools/agent/u2a1c_apply_source_v2.py

      - name: Apply corrected exact bounded source transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/agent/u2a1c_apply_source_v2.py | tee "${RUNNER_TEMP}/u2a1c-transform.log"
          git diff --check
          git status --short | tee "${RUNNER_TEMP}/u2a1c-status.log"
          test -n "$(git status --short)"

      - name: Install exact Clang 22 developer toolchain
        run: python3 tools/ci/bootstrap_supply_chain.py install --profile developer

      - name: Configure and build exact transformed tree
        env:
          CXX: clang++-22
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1320s \
            cmake --preset ci-quick -B build/u2a1c \
              -DCXXLENS_CLANG_ADAPTER=ON \
              -DCXXLENS_BUILD_SHARED=OFF \
            2>&1 | tee "${RUNNER_TEMP}/u2a1c-configure.log"
          timeout --signal=TERM --kill-after=30s 1320s \
            cmake --build build/u2a1c \
            2>&1 | tee "${RUNNER_TEMP}/u2a1c-build.log"

      - name: Run focused lifecycle tests with bounded repetition
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/u2a1c --show-only=json-v1 > "${RUNNER_TEMP}/u2a1c-tests.json"
          python3 - "${RUNNER_TEMP}/u2a1c-tests.json" "${RUNNER_TEMP}/u2a1c-focused-tests.txt" <<'PY'
          import json
          import sys
          source, output = sys.argv[1:]
          tests = json.load(open(source, encoding="utf-8"))["tests"]
          names = [item["name"] for item in tests]
          selected = [
              name for name in names
              if ("same-process-shm" in name or "identity-issuer" in name)
              and ("mapping" in name or "identity" in name)
          ]
          if len(selected) < 3:
              raise SystemExit(f"expected at least three focused lifecycle tests, got {selected!r}")
          with open(output, "w", encoding="utf-8") as handle:
              handle.write("\n".join(selected) + "\n")
          print("focused tests:\n" + "\n".join(selected))
          PY
          while IFS= read -r test_name; do
            escaped="$(printf '%s' "${test_name}" | sed 's/[][(){}.^$*+?|\\]/\\&/g')"
            timeout --signal=TERM --kill-after=20s 480s \
              ctest --test-dir build/u2a1c \
                --tests-regex "^${escaped}$" \
                --repeat until-fail:20 \
                --output-on-failure \
              2>&1 | tee -a "${RUNNER_TEMP}/u2a1c-focused.log"
          done < "${RUNNER_TEMP}/u2a1c-focused-tests.txt"

      - name: Commit only the qualified source unit and publish a clean PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm tools/agent/u2a1c_apply_source.py tools/agent/u2a1c_apply_source_v2.py
          git diff --check
          git config user.name "cxxlens-u2a1c-workbench"
          git config user.email "cxxlens-u2a1c-workbench@users.noreply.github.com"
          git add \
            src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp \
            src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp \
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp \
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp \
            src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp \
            src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp \
            tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp
          test -z "$(git status --short | grep -v '^M  ' || true)"
          git commit -m "Implement owner-qualified reader mapped-result validation"
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
