name: Add immutable-base publish gate to serial agent

on:
  push:
    branches:
      - agent/release-completion-agent-tools

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current serial-agent branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/release-completion-agent-tools
          fetch-depth: 0
          persist-credentials: true

      - name: Add exact remote-base and open-issue checks before publication
        shell: bash
        run: |
          set -euo pipefail
          sleep 90
          git fetch --no-tags origin agent/release-completion-agent-tools
          git reset --hard origin/agent/release-completion-agent-tools
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/agent/release_completion_issue_agent.py')
          source = path.read_text()
          marker = 'serial base changed during issue qualification'
          if marker not in source:
              anchor = '''def publish(cfg: Configuration, payload: dict[str, Any], paths: list[str]) -> tuple[int, str, str]:\n    run(["git", "commit", "-m", f"fix: complete issue #{cfg.issue}"], cwd=cfg.repo_dir)\n'''
              replacement = '''def publish(cfg: Configuration, payload: dict[str, Any], paths: list[str]) -> tuple[int, str, str]:\n    current_issue = gh_json(cfg, f"repos/{cfg.repository}/issues/{cfg.issue}")\n    if current_issue.get("state") != "open":\n        current_head = run(["git", "rev-parse", "HEAD"], cwd=cfg.repo_dir, capture=True).stdout.strip()\n        print(f"issue #{cfg.issue} was completed by another serial owner; discarding the local candidate")\n        return 0, current_head, ""\n\n    starting_base = run(["git", "rev-parse", "HEAD"], cwd=cfg.repo_dir, capture=True).stdout.strip()\n    run(["git", "fetch", "--no-tags", "origin", cfg.base_branch], cwd=cfg.repo_dir)\n    current_base = run(\n        ["git", "rev-parse", f"origin/{cfg.base_branch}"],\n        cwd=cfg.repo_dir,\n        capture=True,\n    ).stdout.strip()\n    if current_base != starting_base:\n        raise RuntimeError(\n            f"serial base changed during issue qualification: {starting_base} -> {current_base}"\n        )\n\n    run(["git", "commit", "-m", f"fix: complete issue #{cfg.issue}"], cwd=cfg.repo_dir)\n'''
              if anchor not in source:
                  raise SystemExit('publish function anchor not found')
              source = source.replace(anchor, replacement, 1)
          source = source.replace('SECONDARY_MODEL = "openai/gpt-4o"', 'SECONDARY_MODEL = "openai/gpt-4.1-mini"')
          path.write_text(source)
          PY
          python3 -m py_compile tools/agent/release_completion_issue_agent.py
          rm -f .github/workflows/release-completion-agent-immutable-base.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'tools: require immutable serial base before publish'
          git push origin HEAD:agent/release-completion-agent-tools
