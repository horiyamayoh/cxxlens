name: PR 348 static test fix

on:
  push:
    branches:
      - agent/340-request-binding-hardening

permissions:
  contents: write

jobs:
  patch-static-test:
    if: github.repository == 'horiyamayoh/cxxlens' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/340-request-binding-hardening
          fetch-depth: 0
      - name: Apply the exact compile fix and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("tests/adapter/clang22/materialization_claims_test.cpp")
          text = source.read_text(encoding="utf-8")
          replacements = (
              (
                  "source->materialization_request_id() == *request_id &&",
                  "source->materialization_request_id() == request_id &&",
              ),
              (
                  "materialization_store_external_authority{&*source, &*journal});",
                  "materialization_store_external_authority{&*source, &*journal, *request_binding});",
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)
          source.write_text(text, encoding="utf-8")
          Path(".github/workflows/agent-pr348-static-test-fix.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/adapter/clang22/materialization_claims_test.cpp \
                  .github/workflows/agent-pr348-static-test-fix.yml
          git diff --cached --check
          git commit -m "Fix static materialization claims test build"
          git push origin HEAD:agent/340-request-binding-hardening
