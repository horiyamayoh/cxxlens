name: Export issue 291 baseline sources

on:
  push:
    branches:
      - issue-291-development-acceleration

permissions:
  contents: read

concurrency:
  group: export-issue-291-baseline
  cancel-in-progress: true

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Export frozen pre-291 sources
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/baseline/tools/quality" "${RUNNER_TEMP}/baseline/tests/quality"
          git show c4b8c9df6f7fa53656c39447b191ba723ebe2040:tools/quality/check_ng_api_development_readiness.py \
            > "${RUNNER_TEMP}/baseline/tools/quality/check_ng_api_development_readiness.py"
          git show c4b8c9df6f7fa53656c39447b191ba723ebe2040:tests/quality/test_ng_api_development_readiness.py \
            > "${RUNNER_TEMP}/baseline/tests/quality/test_ng_api_development_readiness.py"
          tar -C "${RUNNER_TEMP}/baseline" -czf "${RUNNER_TEMP}/issue291-baseline.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: issue291-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/issue291-baseline.tar.gz
          if-no-files-found: error
          retention-days: 1
