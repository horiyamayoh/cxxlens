name: U2a1c finalize qualified v10 PR v2

on:
  push:
    branches:
      - agent/u2a1c-mapped-result-workbench-181
    paths:
      - .github/workflows/u2a1c-finalize-v10-pr-v2.yml

concurrency:
  group: issue-181-u2a1c-v10-pr-finalizer-v2
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize-now:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BASE_BRANCH: issue-181-clang22-materialization-runtime
      SOURCE_BRANCH: agent/u2a1c-mapped-result-181-v10
    steps:
      - name: Checkout control branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/u2a1c-mapped-result-workbench-181
          fetch-depth: 1

      - name: Verify complete base or exact qualified branch
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')"
          test -n "${base_sha}"
          git fetch --no-tags origin "${base_sha}"
          git switch --detach "${base_sha}"
          if grep -q 'class sqlite_shm_reader_mapped_native_observation final' src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp && \
             grep -q 'sqlite_shm_reader_mapped_effect_identity_validation_capability' src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp && \
             grep -q 'sqlite_same_process_shm_reader_receipt_validator::validate' src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp; then
            echo "already=true" >> "${GITHUB_OUTPUT}"
            echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          source_sha="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')"
          test -n "${source_sha}"
          git fetch --no-tags origin "${source_sha}"
          test "$(git rev-parse "${source_sha}^")" = "${base_sha}"
          mapfile -t changed < <(git diff --name-only "${base_sha}" "${source_sha}")
          test "${#changed[@]}" = 7
          git switch --detach "${source_sha}"
          grep -q 'class sqlite_shm_reader_mapped_native_observation final' src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp
          grep -q 'sqlite_shm_reader_mapped_effect_identity_validation_capability' src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp
          grep -q 'observation.expected() == map->request.expected_attachment' src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp
          grep -q 'map_attempt->receipt->zero_resize_effect_receipt()' src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp
          echo "already=false" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Find or create exact PR and merge
        if: steps.verify.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')" = "${{ steps.verify.outputs.base_sha }}"
          owner="${GITHUB_REPOSITORY%%/*}"
          pulls="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${owner}:${SOURCE_BRANCH}&base=${BASE_BRANCH}")"
          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' <<<"${pulls}")"
          if [[ "${count}" == 0 ]]; then
            payload="$(python3 - <<'PY'
          import json
          print(json.dumps({'title':'Implement owner-qualified reader mapped-result validation','head':'agent/u2a1c-mapped-result-181-v10','base':'issue-181-clang22-materialization-runtime','draft':False,'maintainer_can_modify':True,'body':'Authority-complete bounded U2a1c. Exact source branch published only after independent reviews, Clang 22 build, repeated focused/full inventory tests, ASan+UBSan, and exact seven-file scope.'}))
          PY
          )"
            pr="$(curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${GITHUB_REPOSITORY}/pulls" -d "${payload}")"
          elif [[ "${count}" == 1 ]]; then
            pr="$(python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)[0]))' <<<"${pulls}")"
          else
            exit 1
          fi
          number="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])' <<<"${pr}")"
          pr_url="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["html_url"])' <<<"${pr}")"
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' <<<"${pr}")" = "${{ steps.verify.outputs.source_sha }}"
          merge_payload="$(python3 - '${{ steps.verify.outputs.source_sha }}' <<'PY'
          import json,sys
          print(json.dumps({'sha':sys.argv[1],'merge_method':'squash','commit_title':'Implement owner-qualified reader mapped-result validation','commit_message':'Complete authority-correct U2a1c after exact bounded qualification.'}))
          PY
          )"
          result="$(curl --fail-with-body --silent --show-error -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${number}/merge" -d "${merge_payload}")"
          test "$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["merged"]).lower())' <<<"${result}")" = true
          echo "PR_URL=${pr_url}" >> "${GITHUB_ENV}"
          echo "MERGE_SHA=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<<"${result}")" >> "${GITHUB_ENV}"

      - name: Persist immediate finalizer result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.verify.outputs.already }}" == true ]]; then
            body="## U2a1c immediate finalizer no-op\n\nAuthority-complete U2a1c is already present at \`${{ steps.verify.outputs.base_sha }}\`."
          else
            body="## U2a1c immediate finalizer merged qualified PR\n\n- PR: ${PR_URL}\n- source: \`${{ steps.verify.outputs.source_sha }}\`\n- squash: \`${MERGE_SHA}\`"
          fi
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"

      - name: Persist immediate finalizer failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          body="## U2a1c immediate finalizer found no mergeable qualified state\n\nNo unverified source was merged. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"
