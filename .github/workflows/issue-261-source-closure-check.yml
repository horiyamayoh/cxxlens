name: Issue 261 source-closure checkpoints

on:
  push:
    branches:
      - agent/issue-261-source-closure-vfs-implementation

permissions:
  contents: read

concurrency:
  group: issue-261-source-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-closure-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
          documentation: "false"
      - name: Compile and run the source-closure core
        run: |
          set -euo pipefail
          clang++-22 -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            -Isrc \
            src/llvm/clang22/source_closure.cpp \
            tests/adapter/clang22/source_closure_test.cpp \
            -o "${RUNNER_TEMP}/cxxlens-source-closure-test"
          "${RUNNER_TEMP}/cxxlens-source-closure-test"
      - name: Verify branch diff hygiene
        run: git diff --check HEAD^ HEAD
