name: MSVC application worker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-windows:
    name: Native Windows worker
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Cache exact clang-cl 23.1.0 archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/cxxlens/toolchains/clang+llvm-23.1.0-x86_64-pc-windows-msvc.tar.zst
          key: cxxlens-clangcl23-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/application-analysis-toolchains.lock.json') }}
      - name: Verify pinned MSVC, Windows SDK, and clang-cl toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ImageVersion -ne '20260824.214.3') {
            throw "Windows runner image pin differs: $env:ImageVersion"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installations = @(& $vswhere -products * -version '[18.9,18.10)' -format json | ConvertFrom-Json)
          if ($installations.Count -ne 1) { throw 'Exact Visual Studio 18.9 installation is unavailable' }
          $installation = $installations[0]
          if ($installation.installationVersion -ne '18.9.12112.369') {
            throw "Visual Studio pin differs: $($installation.installationVersion)"
          }
          $vs = $installation.installationPath
          $toolset = (Get-Content (Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          if ($toolset -ne '14.51.36231') { throw "MSVC toolset pin differs: $toolset" }
          $cl = Join-Path $vs "VC\Tools\MSVC\$toolset\bin\Hostx64\x64\cl.exe"
          $clVersion = (Get-Item $cl).VersionInfo.ProductVersion
          if (-not $clVersion.StartsWith('14.51.36256')) { throw "cl.exe binary pin differs: $clVersion" }
          $sdkRc = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x64\rc.exe"
          if (-not (Test-Path $sdkRc)) { throw 'Windows SDK 10.0.26100.0 is unavailable' }
          $archive = Join-Path $env:USERPROFILE '.cache\cxxlens\toolchains\clang+llvm-23.1.0-x86_64-pc-windows-msvc.tar.zst'
          New-Item -ItemType Directory -Force (Split-Path $archive) | Out-Null
          if (-not (Test-Path $archive)) {
            curl.exe -fL --retry 3 --output $archive 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/clang%2Bllvm-23.1.0-x86_64-pc-windows-msvc.tar.zst'
          }
          if ((Get-Item $archive).Length -ne 490116109) { throw 'clang-cl archive byte count differs' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne
              '1aebf024b959b3835c3bd936da2fa58cd002c61ccf47fce1714447b900bd9837') {
            throw 'clang-cl archive digest differs'
          }
          $toolchains = Join-Path $env:RUNNER_TEMP 'cxxlens-toolchains'
          New-Item -ItemType Directory -Force $toolchains | Out-Null
          tar.exe -xf $archive -C $toolchains
          $clangRoot = Join-Path $toolchains 'clang+llvm-23.1.0-x86_64-pc-windows-msvc'
          $clang = Join-Path $clangRoot 'bin\clang-cl.exe'
          if ((& $clang --version | Select-Object -First 1) -notmatch '23\.1\.0') {
            throw 'clang-cl version differs'
          }
          "CXXLENS_CLANG_CL_ROOT=$clangRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXXLENS_VS_ROOT=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXXLENS_MSVC_REAL_CL=$cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build, test, and relocate the minimal Windows component
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module "$env:CXXLENS_VS_ROOT\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $env:CXXLENS_VS_ROOT -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake -S workers/msvc -B build/msvc-worker -G Ninja `
            -DBUILD_TESTING=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER="$env:CXXLENS_CLANG_CL_ROOT\bin\clang-cl.exe" `
            -DLLVM_DIR="$env:CXXLENS_CLANG_CL_ROOT\lib\cmake\llvm" `
            -DClang_DIR="$env:CXXLENS_CLANG_CL_ROOT\lib\cmake\clang"
          cmake --build build/msvc-worker
          ctest --test-dir build/msvc-worker --output-on-failure
          $prefix = Join-Path $env:RUNNER_TEMP 'cxxlens worker relocated'
          cmake --install build/msvc-worker --prefix $prefix `
            --component application-analysis-msvc-worker
          $workerVersion = & "$prefix\bin\cxxlens-clangcl-worker-23.exe" --version
          if ($LASTEXITCODE -ne 0 -or $workerVersion -ne 'cxxlens-clangcl-worker-23 23.1.0') {
            throw 'Relocated exact clang-cl replay worker did not execute'
          }
          & "$prefix\bin\cxxlens-msvc-capture.exe" --check-vector `
            tests/fixtures/msvc_application_analysis/canonical_capture.sha256
          $fixture = Join-Path $env:RUNNER_TEMP 'cxxlens proxy fixture'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          $captureDirectory = Join-Path $fixture 'capture bundles'
          New-Item -ItemType Directory -Force $captureDirectory | Out-Null
          $env:CXXLENS_MSVC_PROJECT_ID = 'project:native-msvc-proxy-fixture'
          $env:CXXLENS_MSVC_PROJECT_ROOT = $fixture
          $env:CXXLENS_MSVC_CAPTURE_DIRECTORY = $captureDirectory
          $env:CXXLENS_WINDOWS_SDK_ROOT = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $source = Join-Path $fixture 'unicode ソース.cpp'
          $header = Join-Path $fixture 'fixture header.hpp'
          $response = Join-Path $fixture 'compile options.rsp'
          $object = Join-Path $fixture 'unicode 出力.obj'
          Set-Content -Path $header -Encoding utf8 -Value 'inline int cxxlens_fixture_value() { return 0; }'
          Set-Content -Path $response -Encoding utf8 -Value '/nologo /std:c++latest /DCXXLENS_RESPONSE_CAPTURE=1'
          Set-Content -Path $source -Encoding utf8 -Value @'
          #include "fixture header.hpp"
          #include <cstddef>
          int cxxlens_proxy_fixture() { return cxxlens_fixture_value() + static_cast<int>(sizeof(std::size_t)); }
          '@
          Push-Location $fixture
          & "$prefix\bin\cxxlens-msvc-capture.exe" "@$response" /c $source "/Fo$object"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $object)) {
            throw 'MSVC capture proxy did not preserve the real compiler execution'
          }
          $bundles = @(Get-ChildItem $captureDirectory -Filter '*.cxxlens-capture')
          if ($bundles.Count -ne 1 -or $bundles[0].Length -eq 0) {
            throw 'Successful MSVC compilation did not publish exactly one capture bundle'
          }
          & "$prefix\bin\cxxlens-msvc-capture.exe" "@$response" /c $source "/Fo$object"
          if ($LASTEXITCODE -ne 0 -or @(Get-ChildItem $captureDirectory -Filter '*.cxxlens-capture').Count -ne 1) {
            throw 'Repeated identical MSVC capture was not deterministic'
          }
          Set-Content -Path $response -Encoding utf8 -Value '/nologo /std:c++latest /DCXXLENS_RESPONSE_CAPTURE=2'
          & "$prefix\bin\cxxlens-msvc-capture.exe" "@$response" /c $source "/Fo$object"
          if ($LASTEXITCODE -ne 0 -or @(Get-ChildItem $captureDirectory -Filter '*.cxxlens-capture').Count -ne 2) {
            throw 'Changed MSVC response-file content was not bound into the capture bundle'
          }
          $failedSource = Join-Path $fixture 'failed.cpp'
          Set-Content -Path $failedSource -Encoding utf8 -Value 'not valid C++'
          $ErrorActionPreference = 'Continue'
          & "$prefix\bin\cxxlens-msvc-capture.exe" /nologo /c $failedSource
          $failedExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($failedExit -eq 0 -or @(Get-ChildItem $captureDirectory -Filter '*.cxxlens-capture').Count -ne 2) {
            throw 'Failed MSVC compilation published a capture bundle or lost its exit code'
          }
          Pop-Location

          $msbuildFixture = Join-Path $env:RUNNER_TEMP 'cxxlens MSBuild proxy fixture'
          New-Item -ItemType Directory -Force $msbuildFixture | Out-Null
          $msbuildCapture = Join-Path $msbuildFixture 'capture bundles'
          New-Item -ItemType Directory -Force $msbuildCapture | Out-Null
          $msbuildTemp = Join-Path $msbuildFixture 'tool temp'
          New-Item -ItemType Directory -Force $msbuildTemp | Out-Null
          $msbuildSource = Join-Path $msbuildFixture 'unicode MSBuild ソース.cpp'
          $msbuildHeader = Join-Path $msbuildFixture 'fixture header.hpp'
          $msbuildProject = Join-Path $msbuildFixture 'native proxy.vcxproj'
          Set-Content -Path $msbuildHeader -Encoding utf8 -Value 'inline int cxxlens_msbuild_value() { return 23; }'
          Set-Content -Path $msbuildSource -Encoding utf8 -Value @'
          #include "fixture header.hpp"
          #include <cstddef>
          int cxxlens_msbuild_fixture() { return cxxlens_msbuild_value() + static_cast<int>(sizeof(std::size_t)); }
          '@
          Set-Content -Path $msbuildProject -Encoding utf8 -Value @'
          <Project DefaultTargets="Build" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <ItemGroup Label="ProjectConfigurations">
              <ProjectConfiguration Include="Release|x64">
                <Configuration>Release</Configuration>
                <Platform>x64</Platform>
              </ProjectConfiguration>
            </ItemGroup>
            <PropertyGroup Label="Globals">
              <ProjectGuid>{4A124C5A-111D-47DA-A807-2B865D1658F3}</ProjectGuid>
              <Keyword>Win32Proj</Keyword>
              <WindowsTargetPlatformVersion>10.0.26100.0</WindowsTargetPlatformVersion>
            </PropertyGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.Default.props" />
            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'" Label="Configuration">
              <ConfigurationType>StaticLibrary</ConfigurationType>
              <UseDebugLibraries>false</UseDebugLibraries>
              <PlatformToolset>v145</PlatformToolset>
            </PropertyGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.props" />
            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'">
              <OutDir>$(ProjectDir)out\</OutDir>
              <IntDir>$(ProjectDir)obj\</IntDir>
              <TargetName>cxxlens-msbuild-fixture</TargetName>
            </PropertyGroup>
            <ItemDefinitionGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'">
              <ClCompile>
                <WarningLevel>Level4</WarningLevel>
                <LanguageStandard>stdcpplatest</LanguageStandard>
              </ClCompile>
            </ItemDefinitionGroup>
            <ItemGroup>
              <ClCompile Include="unicode MSBuild ソース.cpp" />
            </ItemGroup>
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />
          </Project>
          '@
          $env:CXXLENS_MSVC_PROJECT_ID = 'project:native-msbuild-proxy-fixture'
          $env:CXXLENS_MSVC_PROJECT_ROOT = $msbuildFixture
          $env:CXXLENS_MSVC_CAPTURE_DIRECTORY = $msbuildCapture
          $previousTemp = $env:TEMP
          $previousTmp = $env:TMP
          $env:TEMP = $msbuildTemp
          $env:TMP = $msbuildTemp
          Push-Location $msbuildFixture
          msbuild $msbuildProject /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=x64 `
            "/p:CLToolExe=cxxlens-msvc-capture.exe" "/p:CLToolPath=$prefix\bin"
          if ($LASTEXITCODE -ne 0 -or
              -not (Test-Path (Join-Path $msbuildFixture 'out\cxxlens-msbuild-fixture.lib'))) {
            throw 'MSBuild did not preserve the native static-library output'
          }
          $msbuildBundles = @(Get-ChildItem $msbuildCapture -Filter '*.cxxlens-capture')
          if ($msbuildBundles.Count -ne 1 -or $msbuildBundles[0].Length -eq 0) {
            throw 'MSBuild did not select the installed CLToolExe/CLToolPath capture proxy'
          }
          Pop-Location
          $env:TEMP = $previousTemp
          $env:TMP = $previousTmp
          exit 0
