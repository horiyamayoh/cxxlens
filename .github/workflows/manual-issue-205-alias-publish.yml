name: Manual issue 205 alias lifecycle publication

on:
  pull_request:
    branches:
      - issue-181-clang22-materialization-runtime

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/manual-205-alias-publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Publish exact bounded implementation branch
        shell: bash
        env:
          BASE_SHA: a84eabfe2febe2d60dc07623142a8769265ecdd9
          TARGET_BRANCH: agent/issue-181-shm-vfs-alias-registration-port
          PATCH_SHA256: 224a3d8a01ba20226f02da31850502acc46748d1f81845da3917e2baa80f718c
          EXPECTED_TREE: 838a3303a6ea6b9c5adb3a70a54d7b45af88d00d
        run: |
          set -euo pipefail
          patch_file="${RUNNER_TEMP}/issue-205-alias.patch.gz"
          cp .agent/issue-205-alias.patch.gz "${patch_file}"
          test "$(sha256sum "${patch_file}" | awk '{print $1}')" = "${PATCH_SHA256}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git checkout --detach "${BASE_SHA}"
          git switch -C "${TARGET_BRANCH}"
          gzip -dc "${patch_file}" | git apply --index --whitespace=error-all
          cat > "${RUNNER_TEMP}/expected-files" <<'EOF'
          CMakeLists.txt
          src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp
          src/sdk/sqlite_same_process_shm_vfs_alias_registration_internal.cpp
          src/sdk/sqlite_same_process_shm_vfs_alias_registration_internal.hpp
          tests/CMakeLists.txt
          tests/unit/sdk/sqlite_same_process_shm_vfs_alias_registration_test.cpp
          EOF
          git diff --cached --name-only | sort > "${RUNNER_TEMP}/actual-files"
          sort "${RUNNER_TEMP}/expected-files" -o "${RUNNER_TEMP}/expected-files"
          diff -u "${RUNNER_TEMP}/expected-files" "${RUNNER_TEMP}/actual-files"
          git diff --cached --check
          test "$(git write-tree)" = "${EXPECTED_TREE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(sqlite): add closed SHM VFS alias lifecycle port"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXPECTED_TREE}"
          if git ls-remote --exit-code --heads origin "refs/heads/${TARGET_BRANCH}"; then
            echo "target branch already exists" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
