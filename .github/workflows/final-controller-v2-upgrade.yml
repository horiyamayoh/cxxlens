name: Upgrade final production controller v2

on:
  push:
    branches:
      - agent/final-production-qualification-controller-v2

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout controller branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/final-production-qualification-controller-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Remove SIGPIPE-sensitive bounded PR diff pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/agent/final_production_qualification_controller.sh')
          source = path.read_text()
          old = '''  gh pr diff 189 --repo "${GITHUB_REPOSITORY}" | head -c 650000 > controller-work/pr-189.diff\n'''
          new = '''  gh pr diff 189 --repo "${GITHUB_REPOSITORY}" > controller-work/pr-189.full.diff\n  head -c 650000 controller-work/pr-189.full.diff > controller-work/pr-189.diff\n'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('PR diff pipeline anchor not found')
          path.write_text(source)
          PY
          bash -n tools/agent/final_production_qualification_controller.sh
          rm -f .github/workflows/final-controller-v2-upgrade.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: harden final PR audit against SIGPIPE'
          git push origin HEAD:agent/final-production-qualification-controller-v2
