name: Apply direct-to-main policy

on:
  push:
    branches:
      - agent/direct-to-main-policy

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: agent/direct-to-main-policy
      - uses: ./.github/actions/setup-ci
        with:
          profile: none
      - name: Apply policy migration
        run: python tools/quality/_apply_direct_main_policy.py
      - name: Validate migrated policy
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/quality/check_ng_api_development_readiness.py \
            tests/quality/test_ng_api_development_readiness.py \
            tools/quality/check_ci_supply_chain.py
          python tools/quality/check_documentation_consistency.py check --root .
          python tools/quality/check_ci_supply_chain.py check --root .
          python tools/quality/check_ng_api_development_readiness.py check --root .
          python tests/quality/test_ng_api_development_readiness.py
          git diff --check
      - name: Commit migrated policy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Switch development policy to direct-to-main"
          git push origin HEAD:agent/direct-to-main-policy
