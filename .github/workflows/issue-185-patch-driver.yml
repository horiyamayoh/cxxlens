name: Issue 185 patch driver

on:
  push:
    branches:
      - agent/issue-185-patch-driver

permissions:
  contents: write

jobs:
  patch-nightly-trigger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: agent/issue-185-clang-asan-boundary
          fetch-depth: 0
      - name: Bind exact-main Nightly qualification to its own contract change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/nightly.yml")
          text = path.read_text(encoding="utf-8")
          anchor = "  workflow_dispatch:\n\npermissions:\n"
          replacement = (
              "  workflow_dispatch:\n"
              "  # A Nightly contract change must qualify the exact merged-main tree.\n"
              "  # The path filter prevents ordinary main pushes from duplicating the\n"
              "  # scheduled suite.\n"
              "  push:\n"
              "    branches:\n"
              "      - main\n"
              "    paths:\n"
              '      - ".github/workflows/nightly.yml"\n\n'
              "permissions:\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit("Nightly trigger anchor is not unique")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
      - name: Validate and publish the exact-main trigger
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/nightly.yml
          git commit -m "Qualify Nightly contract changes on exact main"
          git push origin HEAD:agent/issue-185-clang-asan-boundary
