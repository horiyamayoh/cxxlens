name: Issue 185 patch driver

on:
  push:
    branches:
      - agent/issue-185-patch-driver

permissions:
  contents: write

jobs:
  patch-install-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: agent/issue-185-clang-asan-boundary
          fetch-depth: 0
      - name: Bind the sanitizer-only finite address-space fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/install/clang22_materializer_success_test.py")
          text = path.read_text(encoding="utf-8")

          constant_anchor = "OCCURRENCE_RELATIVE_PATH = (\n"
          if text.count(constant_anchor) != 1:
              raise SystemExit("ASan fixture constant anchor is not unique")
          text = text.replace(
              constant_anchor,
              (
                  "# ASan reserves a multi-terabyte virtual shadow before main(). "
                  "The normal\n"
                  "# install fixture retains its 1 GiB production budget; only the "
                  "explicit\n"
                  "# sanitizer test environment selects this finite, shadow-compatible "
                  "limit.\n"
                  "ASAN_TEST_ADDRESS_SPACE_BYTES = 64 * 1024 * 1024 * 1024 * 1024\n\n"
                  + constant_anchor
              ),
              1,
          )

          task_anchor = '''    for task in request["tasks"]:
              task["sandbox"]["policy_digest"] = BASELINE_POLICY_DIGEST
          '''
          task_replacement = '''    asan_address_space = os.environ.get(
              "CXXLENS_TEST_ASAN_ADDRESS_SPACE_BYTES"
          )
              if asan_address_space is not None and asan_address_space != str(
                  ASAN_TEST_ADDRESS_SPACE_BYTES
              ):
                  fail(
                      "CXXLENS_TEST_ASAN_ADDRESS_SPACE_BYTES differs from the closed "
                      "ASan sandbox fixture budget"
                  )
              for task in request["tasks"]:
                  task["sandbox"]["policy_digest"] = BASELINE_POLICY_DIGEST
                  if asan_address_space is not None:
                      task["budget"]["address_space_bytes"] = (
                          ASAN_TEST_ADDRESS_SPACE_BYTES
                      )
          '''
          # The literals above carry workflow indentation. Normalize the exact source
          # text before replacing it.
          task_anchor = "\n".join(line[4:] for line in task_anchor.splitlines()) + "\n"
          task_replacement = (
              "\n".join(line[4:] for line in task_replacement.splitlines()) + "\n"
          )
          if text.count(task_anchor) != 1:
              raise SystemExit("ASan fixture task anchor is not unique")
          text = text.replace(task_anchor, task_replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate and publish the focused patch
        run: |
          python3 -m py_compile tests/install/clang22_materializer_success_test.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/install/clang22_materializer_success_test.py
          git commit -m "Use a finite ASan-compatible worker sandbox budget"
          git push origin HEAD:agent/issue-185-clang-asan-boundary
