name: U2a1c qualified mapped-result apply v2

on:
  push:
    branches:
      - agent/u2a1c-qualified-mapped-result-181
    paths:
      - tools/agent/u2a1c_fix_mapped_control_destructor_v2.py
      - tools/agent/u2a1c_fix_mapped_control_destructor_v3.py
      - .github/workflows/u2a1c-qualified-mapped-result-v2.yml

permissions:
  contents: write

concurrency:
  group: u2a1c-qualified-mapped-result
  cancel-in-progress: false

jobs:
  apply-build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Checkout exact child branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/u2a1c-qualified-mapped-result-181
          fetch-depth: 0

      - name: Verify base ancestry and bounded branch scope
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 60s git fetch origin issue-181-clang22-materialization-runtime
          git merge-base --is-ancestor origin/issue-181-clang22-materialization-runtime HEAD
          git diff --name-only origin/issue-181-clang22-materialization-runtime...HEAD > u2a1c-preapply-files.txt
          python3 - <<'PY'
          from pathlib import Path
          source = {
              'src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp',
              'src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp',
              'src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp',
              'src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp',
              'src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp',
              'src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp',
              'tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp',
          }
          temporary = {
              'tools/agent/u2a1c_transform_common.py',
              'tools/agent/u2a1c_transform_issuer.py',
              'tools/agent/u2a1c_transform_lease_header.py',
              'tools/agent/u2a1c_transform_lease_support.py',
              'tools/agent/u2a1c_transform_lease_state.py',
              'tools/agent/u2a1c_transform_registry.py',
              'tools/agent/u2a1c_transform_test.py',
              'tools/agent/u2a1c_fix_mapped_control_destructor_v2.py',
              'tools/agent/u2a1c_fix_mapped_control_destructor_v3.py',
              '.github/workflows/u2a1c-qualified-mapped-result.yml',
              '.github/workflows/u2a1c-qualified-mapped-result-v2.yml',
          }
          actual = set(Path('u2a1c-preapply-files.txt').read_text().splitlines())
          unexpected = actual - source - temporary
          if unexpected:
              raise SystemExit(f'unbounded branch delta: {sorted(unexpected)}')
          PY

      - name: Apply or verify exact source transformation
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'class sqlite_shm_reader_mapped_effect_identity_validation_capability final' \
              src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp; then
            for script in \
              tools/agent/u2a1c_transform_issuer.py \
              tools/agent/u2a1c_transform_lease_header.py \
              tools/agent/u2a1c_transform_lease_support.py \
              tools/agent/u2a1c_transform_lease_state.py \
              tools/agent/u2a1c_transform_registry.py \
              tools/agent/u2a1c_transform_test.py; do
              test -f "$script"
              timeout --signal=TERM --kill-after=10s 60s python3 "$script"
            done
          fi
          timeout --signal=TERM --kill-after=10s 60s \
            python3 tools/agent/u2a1c_fix_mapped_control_destructor_v3.py
          git diff --check

      - name: Enforce the exact production-inert source boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = {
              'src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp',
              'src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp',
              'src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp',
              'src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp',
              'src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp',
              'src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp',
              'tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp',
          }
          issuer = Path('src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp').read_text()
          issuer_h = Path('src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp').read_text()
          lease_h = Path('src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp').read_text()
          lease = Path('src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp').read_text()
          registry_h = Path('src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp').read_text()
          registry = Path('src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp').read_text()
          test = Path('tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp').read_text()
          assert issuer_h.count('class sqlite_shm_reader_mapped_effect_identity_validation_capability final') == 1
          assert issuer.count('validate_mapped_effect_identity_for_registry(') >= 3
          assert issuer.count('mapped_effect_capability_is_current(') >= 2
          assert 'sqlite_shm_reader_effect_identity_role::mapped_result' in issuer
          assert lease_h.count('class sqlite_same_process_shm_reader_receipt_validator final') == 1
          assert lease.count('sqlite_shm_reader_mapped_effect_receipt_control::\n\t\t\t~sqlite_shm_reader_mapped_effect_receipt_control() noexcept') == 1
          assert lease.count('mapped_effect_validation_phase.compare_exchange_strong') >= 2
          for phase in ('unclaimed', 'validating', 'sealed', 'terminal_consumed', 'poisoned'):
              assert f'sqlite_shm_reader_mapped_effect_validation_phase::{phase}' in lease
          assert '(!qualified_owned_terminal && qualified_control)' in lease
          assert 'map->expected_mapping.native_mapping == native_mapping' in lease
          assert 'detail::validate_mapped_effect_identity_for_registry' in registry
          assert 'validate_reader_mapped_attachment_effect(' in registry_h
          assert 'owned mapped result validates after ordinary family quarantine' in test
          assert 'src/sdk/store.cpp' not in source
          assert not any(path.startswith('include/') or 'forwarding_vfs' in path for path in source)
          PY

      - name: Install exact Clang 22 developer toolchain
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 720s \
            python3 tools/ci/bootstrap_supply_chain.py install --profile developer \
            > u2a1c-toolchain.log 2>&1
          clang++-22 --version | tee u2a1c-compiler.txt

      - name: Configure and build exact source head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/u2a1c-qualified
          timeout --signal=TERM --kill-after=30s 360s env CXX=clang++-22 \
            cmake --preset ci-quick -B build/u2a1c-qualified \
              -DCXXLENS_CLANG_ADAPTER=OFF -DCXXLENS_BUILD_SHARED=OFF \
            > u2a1c-configure.log 2>&1
          timeout --signal=TERM --kill-after=30s 720s \
            cmake --build build/u2a1c-qualified --parallel 4 \
            > u2a1c-build.log 2>&1

      - name: Select and run exact focused tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/u2a1c-qualified -N > u2a1c-test-list.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          names = []
          for line in Path('u2a1c-test-list.txt').read_text().splitlines():
              match = re.search(r'Test\s+#\d+:\s+(.+)$', line)
              if not match:
                  continue
              name = match.group(1).strip()
              if any(token in name for token in (
                  'sqlite-same-process-shm',
                  'sqlite_same_process_shm',
                  'identity-issuer',
                  'mapping-lease',
                  'mapping-registry',
              )):
                  names.append(name)
          registry = [name for name in names if 'mapping-registry' in name or 'mapping_registry' in name]
          if len(names) < 3 or not registry:
              raise SystemExit(f'focused tests not discovered: {names}')
          esc = lambda value: re.escape(value)
          Path('u2a1c-focused-regex.txt').write_text('^(' + '|'.join(map(esc, names)) + ')$')
          Path('u2a1c-registry-regex.txt').write_text('^(' + '|'.join(map(esc, registry)) + ')$')
          Path('u2a1c-selected-tests.txt').write_text('\n'.join(names) + '\n')
          PY
          timeout --signal=TERM --kill-after=30s 600s \
            ctest --test-dir build/u2a1c-qualified --output-on-failure \
              -R "$(cat u2a1c-focused-regex.txt)" \
            > u2a1c-ctest.log 2>&1
          timeout --signal=TERM --kill-after=30s 600s \
            ctest --test-dir build/u2a1c-qualified --output-on-failure \
              -R "$(cat u2a1c-registry-regex.txt)" --repeat until-fail:20 \
            > u2a1c-repeat.log 2>&1

      - name: Commit source and remove every apply-only file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cxxlens-u2a1c-bounded-bot'
          git config user.email 'cxxlens-u2a1c-bounded-bot@users.noreply.github.com'
          source_files=(
            src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp
            src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp
            src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp
            src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp
            src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp
            tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp
          )
          git add "${source_files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'Qualify mapped reader result ownership'
          fi
          git rm -f --ignore-unmatch \
            tools/agent/u2a1c_transform_common.py \
            tools/agent/u2a1c_transform_issuer.py \
            tools/agent/u2a1c_transform_lease_header.py \
            tools/agent/u2a1c_transform_lease_support.py \
            tools/agent/u2a1c_transform_lease_state.py \
            tools/agent/u2a1c_transform_registry.py \
            tools/agent/u2a1c_transform_test.py \
            tools/agent/u2a1c_fix_mapped_control_destructor_v2.py \
            tools/agent/u2a1c_fix_mapped_control_destructor_v3.py \
            .github/workflows/u2a1c-qualified-mapped-result.yml \
            .github/workflows/u2a1c-qualified-mapped-result-v2.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove U2a1c apply workbench'
          fi
          git diff --check origin/issue-181-clang22-materialization-runtime...HEAD
          git diff --name-only origin/issue-181-clang22-materialization-runtime...HEAD \
            > u2a1c-final-files.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              'src/sdk/sqlite_same_process_shm_identity_issuer_internal.hpp',
              'src/sdk/sqlite_same_process_shm_identity_issuer_internal.cpp',
              'src/sdk/sqlite_same_process_shm_mapping_lease_internal.hpp',
              'src/sdk/sqlite_same_process_shm_mapping_lease_internal.cpp',
              'src/sdk/sqlite_same_process_shm_mapping_registry_internal.hpp',
              'src/sdk/sqlite_same_process_shm_mapping_registry_internal.cpp',
              'tests/unit/sdk/sqlite_same_process_shm_mapping_registry_test.cpp',
          }
          actual = set(Path('u2a1c-final-files.txt').read_text().splitlines())
          if actual != expected:
              raise SystemExit(f'final PR pollution or omission: {sorted(actual ^ expected)}')
          PY
          timeout --signal=TERM --kill-after=30s 120s \
            git push origin HEAD:agent/u2a1c-qualified-mapped-result-181 \
            > u2a1c-push.log 2>&1
