name: Temporary issue 261 blocker fix

on:
  push:
    branches:
      - fix/261-task-transfer-authority-binding
    paths:
      - .github/workflows/temporary-issue-261-blocker-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message == 'Bootstrap exact issue 261 blocker fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/261-task-transfer-authority-binding
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          profile: developer
      - name: Apply exact source-closure binding correction
        run: python3 tools/dev/temporary_issue261_patch.py
      - name: Run bounded issue 261 evidence
        run: |
          python3 tools/quality/check_ng_source_closure_transport.py check --root .
          python3 -m unittest tests.quality.test_ng_source_closure_transport
          python3 tools/quality/check_ng_work_units.py check --root .
          python3 -m unittest tests.quality.test_ng_work_units
          python3 tools/quality/verify_checksums.py check --root .
      - name: Commit bounded correction
        run: |
          git config user.name "cxxlens blocker-fix agent"
          git config user.email "44720751+horiyamayoh@users.noreply.github.com"
          git add -- \
            tools/quality/check_ng_source_closure_transport.py \
            tests/quality/test_ng_source_closure_transport.py \
            schemas/cxxlens_ng_source_closure_transport.yaml \
            schemas/cxxlens_ng_source_closure_transport.schema.yaml \
            schemas/cxxlens_ng_work_units.yaml \
            docs/design/SHA256SUMS
          git diff --cached --check
          git commit -m "Bind source-closure transfer to outer task identity (#261)"
          git push origin HEAD:fix/261-task-transfer-authority-binding
