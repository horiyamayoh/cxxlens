name: U2a1c cancel obsolete writers

on:
  push:
    branches:
      - agent/u2a1c-mapped-result-workbench-181
    paths:
      - .github/workflows/u2a1c-cancel-obsolete.yml

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only superseded U2a1c writer runs
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent/u2a1c-mapped-result-workbench-181&per_page=100")"
          python3 - "${RUNNER_TEMP}/obsolete.txt" <<'PY' <<<"${runs}"
          import json,sys
          data=json.load(sys.stdin)
          obsolete={
            'U2a1c mapped-result execute v6',
            'U2a1c mapped-result execute v7',
            'U2a1c mapped-result execute v9',
          }
          active={'queued','in_progress','waiting','requested','pending'}
          rows=[(r['id'],r['name'],r['status']) for r in data.get('workflow_runs',[]) if r.get('name') in obsolete and r.get('status') in active]
          with open(sys.argv[1],'w',encoding='utf-8') as f:
            for run_id,name,status in rows:
              f.write(f'{run_id}\t{name}\t{status}\n')
          for row in rows: print(row)
          PY
          cancelled=0
          while IFS=$'\t' read -r run_id name status; do
            [[ -z "${run_id}" ]] && continue
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"
            echo "cancelled ${name} run ${run_id} (${status})"
            cancelled=$((cancelled+1))
          done < "${RUNNER_TEMP}/obsolete.txt"
          echo "CANCELLED=${cancelled}" >> "${GITHUB_ENV}"

      - name: Persist cleanup checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          body="## U2a1c obsolete-writer cleanup\n\nCancelled active superseded v6/v7/v9 runs: \`${CANCELLED}\`. Authority-complete v10, its exact PR finalizer, and the read-only next-unit audit were not targeted. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"${body}")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${GITHUB_REPOSITORY}/issues/181/comments" -d "${payload}"
