name: Finalize PR 269

on:
  push:
    branches:
      - issue-183-ng1-session-driver
    paths:
      - .github/workflows/finalize-pr269.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: sync-pr269-latest-main
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: "269"
      HEAD_BRANCH: issue-183-ng1-session-driver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: issue-183-ng1-session-driver
          fetch-depth: 0

      - name: Install exact developer toolchain
        run: python3 tools/ci/bootstrap_supply_chain.py install --profile developer

      - name: Converge onto latest main and validate the complete tree
        id: candidate
        env:
          CXX: clang++-22
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          expected_main="$(git rev-parse origin/main)"
          echo "main_sha=${expected_main}" >> "${GITHUB_OUTPUT}"

          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-ff --no-commit origin/main || true
            git rev-parse -q --verify MERGE_HEAD >/dev/null

            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              case "${path}" in
                AGENTS.md|docs/design/SHA256SUMS|schemas/cxxlens_asset_migration_ledger.json)
                  ;;
                *)
                  echo "unexpected merge conflict: ${path}" >&2
                  exit 1
                  ;;
              esac
            done
            if printf '%s\n' "${conflicts[@]}" | grep -Fxq AGENTS.md; then
              git checkout --theirs -- AGENTS.md
            fi
          fi

          # These generated authority files must contain the union of current main and
          # the two source-private assets introduced by the runtime-service unit.
          git show origin/main:schemas/cxxlens_asset_migration_ledger.json \
            > schemas/cxxlens_asset_migration_ledger.json
          git show origin/main:docs/design/SHA256SUMS > docs/design/SHA256SUMS
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          ledger_path = Path("schemas/cxxlens_asset_migration_ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          expected = {
              "authority": "active",
              "removal_issue": None,
              "replacement": None,
              "status": "active",
          }
          by_path = {entry["path"]: entry for entry in ledger["assets"]}
          for path in (
              "src/sdk/provider_runtime_service.cpp",
              "src/sdk/provider_runtime_service_internal.hpp",
          ):
              if path in by_path:
                  actual = {key: by_path[path].get(key) for key in expected}
                  if actual != expected:
                      raise SystemExit(
                          f"existing ledger entry for {path} has unexpected authority: {actual}"
                      )
              else:
                  ledger["assets"].append({"path": path, **expected})

          ledger["assets"].sort(key=lambda entry: entry["path"])
          ledger["asset_count"] = len(ledger["assets"])
          counts = Counter(entry["status"] for entry in ledger["assets"])
          order = list(ledger["classifications"])
          ledger["classifications"] = {key: counts.pop(key, 0) for key in order}
          for key in sorted(counts):
              ledger["classifications"][key] = counts[key]
          ledger_path.write_text(
              json.dumps(ledger, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          checksum_path = Path("docs/design/SHA256SUMS")
          target = "../../schemas/cxxlens_asset_migration_ledger.json"
          digest = hashlib.sha256(ledger_path.read_bytes()).hexdigest()
          lines = checksum_path.read_text(encoding="utf-8").splitlines()
          matches = 0
          for index, line in enumerate(lines):
              fields = line.split(maxsplit=1)
              if len(fields) == 2 and fields[1] == target:
                  lines[index] = f"{digest}  {target}"
                  matches += 1
          if matches != 1:
              raise SystemExit(f"expected one SHA256SUMS entry for {target}, found {matches}")
          checksum_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          # Do not publish any synchronization machinery or marker into the product tree.
          rm -f \
            .github/workflows/sync-pr269-latest-main.yml \
            .github/workflows/finalize-pr269.yml \
            .github/workflows/sync-pr269-with-main.yml \
            .github/workflows/finalize-pr269-sync.yml \
            .github/sync-pr269.request \
            .github/finalize-pr269.request \
            .github/quality-trigger-pr269.txt \
            .github/quality-trigger-pr269-final \
            .github/quality-trigger-pr269-final2

          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'merge still has unresolved paths' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git diff --cached --check
          python3 tools/quality/check_format.py --root . --clang-format clang-format-22

          cmake -S . -B build/pr269-final -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCXXLENS_CLANG_ADAPTER=OFF \
            -DCXXLENS_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON \
            -DCXXLENS_BUILD_QUALITY_TOOLS=OFF
          cmake --build build/pr269-final --parallel 2
          ctest --test-dir build/pr269-final --parallel 2 --output-on-failure
          cmake --build build/pr269-final --target cxxlens-quality

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Merge latest main into NG1 session driver"
          elif ! git diff --cached --quiet; then
            git commit -m "Finalize NG1 session driver on latest main"
          fi

          clean_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${HEAD_BRANCH}"
          echo "head_sha=${clean_sha}" >> "${GITHUB_OUTPUT}"

      - name: Require exact-head Quality and an unresolved-review count of zero
        env:
          CLEAN_SHA: ${{ steps.candidate.outputs.head_sha }}
          EXPECTED_MAIN: ${{ steps.candidate.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          for _ in $(seq 1 160); do
            runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f head_sha="${CLEAN_SHA}" -f per_page=100)"
            count="$(jq '[.workflow_runs[] | select(.name == "Quality" and .event == "pull_request")] | length' <<<"${runs}")"
            active="$(jq '[.workflow_runs[] | select(.name == "Quality" and .event == "pull_request" and .status != "completed")] | length' <<<"${runs}")"
            failed="$(jq '[.workflow_runs[] | select(.name == "Quality" and .event == "pull_request" and .status == "completed" and .conclusion != "success")] | length' <<<"${runs}")"
            succeeded="$(jq '[.workflow_runs[] | select(.name == "Quality" and .event == "pull_request" and .status == "completed" and .conclusion == "success")] | length' <<<"${runs}")"
            if [[ "${failed}" != 0 ]]; then
              echo "exact-head Quality failed for ${CLEAN_SHA}" >&2
              exit 1
            fi
            if [[ "${count}" != 0 && "${active}" == 0 && "${succeeded}" != 0 ]]; then
              break
            fi
            sleep 15
          done
          if [[ "${count:-0}" == 0 || "${active:-1}" != 0 || "${succeeded:-0}" == 0 ]]; then
            echo "exact-head Quality did not reach success for ${CLEAN_SHA}" >&2
            exit 1
          fi

          unresolved="$(gh api graphql \
            -f owner="${owner}" -f repo="${repo}" -F number="${PR_NUMBER}" \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          [[ "${unresolved}" == 0 ]] || {
            echo "PR ${PR_NUMBER} still has ${unresolved} unresolved review threads" >&2
            exit 1
          }

          pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          draft="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .draft)"
          [[ "${pr_head}" == "${CLEAN_SHA}" && "${draft}" == false ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "${EXPECTED_MAIN}" ]] || {
            echo 'main advanced while the exact-head qualification was running' >&2
            exit 1
          }
          git merge-base --is-ancestor origin/main "${CLEAN_SHA}"

      - name: Squash merge the qualified runtime-service unit
        env:
          CLEAN_SHA: ${{ steps.candidate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --squash --delete-branch --match-head-commit "${CLEAN_SHA}" \
            --subject 'Complete NG1 runtime session driver (#269)' \
            --body 'Integrate the production NG1 runtime service on top of the merged duplex transport and source-closure VFS. Exact-head full build, full CTest, quality target, GitHub Quality, and review-thread checks all passed.'

          merge_sha="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --json state,mergeCommit --jq 'select(.state == "MERGED") | .mergeCommit.oid')"
          [[ -n "${merge_sha}" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${merge_sha}" origin/main
          [[ "$(git rev-parse "${merge_sha}^{tree}")" == "$(git rev-parse "${CLEAN_SHA}^{tree}")" ]]
          echo "merged ${merge_sha} with the exact qualified candidate tree"
