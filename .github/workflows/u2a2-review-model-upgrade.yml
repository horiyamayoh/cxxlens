name: Upgrade U2a2 secondary reviewer model

on:
  push:
    branches:
      - agent/u2a2-recovery-controller-205

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout U2a2 recovery controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/u2a2-recovery-controller-205
          fetch-depth: 0
          persist-credentials: true

      - name: Use a large-context independent secondary reviewer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/agent/u2a2_recovery_controller.py')
          source = path.read_text()
          old = 'MODELS = ("openai/gpt-4.1", "openai/gpt-4o")'
          new = 'MODELS = ("openai/gpt-4.1", "openai/gpt-4.1-mini")'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('U2a2 reviewer model anchor not found')
          path.write_text(source)
          PY
          python3 -m py_compile tools/agent/u2a2_recovery_controller.py
          rm -f .github/workflows/u2a2-review-model-upgrade.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'tools: use large-context U2a2 secondary reviewer'
          git push origin HEAD:agent/u2a2-recovery-controller-205
