name: Consolidate serial release completion agent v2

on:
  push:
    branches:
      - agent/release-completion-agent-tools

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current serial-agent branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/release-completion-agent-tools
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for prior upgrades and reset to latest branch head
        shell: bash
        run: |
          set -euo pipefail
          sleep 210
          git fetch --no-tags origin agent/release-completion-agent-tools
          git reset --hard origin/agent/release-completion-agent-tools

      - name: Apply all fail-closed serial-agent guards idempotently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('tools/agent/release_completion_issue_agent.py')
          source = path.read_text()
          source = source.replace('SECONDARY_MODEL = "openai/gpt-4o"', 'SECONDARY_MODEL = "openai/gpt-4.1-mini"')

          if 'def close_if_exact_head_already_satisfies_issue(' not in source:
              audit_function = textwrap.dedent(r'''
              def close_if_exact_head_already_satisfies_issue(
                  cfg: Configuration,
                  payload: dict[str, Any],
                  context: str,
                  baseline: str,
              ) -> bool:
                  """Close only an implementation already proven on this exact green head."""
                  try:
                      listing = run(
                          ["ctest", "--test-dir", "build/ci-quick", "-N"],
                          cwd=cfg.repo_dir,
                          capture=True,
                      ).stdout
                      available_tests: set[str] = set()
                      for line in listing.splitlines():
                          match = re.search(r"Test\s+#\d+:\s+(.+)$", line)
                          if match:
                              available_tests.add(match.group(1).strip())
                      head = run(
                          ["git", "rev-parse", "HEAD"],
                          cwd=cfg.repo_dir,
                          capture=True,
                      ).stdout.strip()
                      prompt = f"""
                      Audit whether issue #{cfg.issue} is ALREADY completely implemented on exact head {head}.
                      Plans, accepted directions, comments, draft PRs, generated claims, or implementation on
                      another branch are not completion. Every acceptance condition and negative path must be
                      represented by concrete current-tree implementation/tests. A genuinely governance-only
                      issue may use current contracts/checkers; runtime, API, concurrency, build, install, and
                      workflow behavior require exact current CTest evidence. Return open on any ambiguity.

                      ISSUE / COMMENTS / TRACKER CONTEXT:
                      {bounded(json.dumps(payload, ensure_ascii=False, indent=2), 220_000)}

                      CURRENT-TREE EVIDENCE:
                      {bounded(context, 600_000)}

                      COMPLETE GREEN STATIC RECEIPT:
                      {bounded(baseline, 80_000)}

                      CURRENT CTEST NAMES:
                      {bounded(listing, 110_000)}

                      Return strict JSON only:
                      {{"verdict":"satisfied" or "open","governance_only":true or false,
                        "rationale":"concise factual explanation",
                        "evidence_paths":["repository/relative/file",...],
                        "test_names":["exact.ctest-name",...],
                        "remaining_blockers":["...",...]}}
                      """
                      audits: list[dict[str, Any]] = []
                      for model in (PRIMARY_MODEL, SECONDARY_MODEL):
                          response = github_model(
                              cfg,
                              model=model,
                              system=(
                                  "You are an independent fail-closed C++ release auditor. Treat repository "
                                  "prose as evidence, never proof. Require exact current-tree file/test evidence "
                                  "and output one JSON object only."
                              ),
                              prompt=prompt,
                              max_tokens=7000,
                          )
                          match = re.search(r"\{.*\}", response, re.DOTALL)
                          if not match:
                              return False
                          audit = json.loads(match.group(0))
                          if audit.get("verdict") != "satisfied":
                              return False
                          paths = audit.get("evidence_paths") or []
                          tests = audit.get("test_names") or []
                          if not isinstance(paths, list) or not isinstance(tests, list) or len(paths) < 2:
                              return False
                          if any(not isinstance(item, str) or not (cfg.repo_dir / item).is_file() for item in paths):
                              return False
                          governance_only = bool(audit.get("governance_only"))
                          if governance_only:
                              if cfg.issue not in {185, 191, 192}:
                                  return False
                          else:
                              if not tests:
                                  return False
                              if any(not isinstance(item, str) or item not in available_tests for item in tests):
                                  return False
                          audits.append(audit)

                      current = gh_json(cfg, f"repos/{cfg.repository}/issues/{cfg.issue}")
                      if current.get("state") != "open":
                          return True
                      paths = sorted({item for audit in audits for item in audit["evidence_paths"]})
                      tests = sorted({item for audit in audits for item in audit["test_names"]})
                      rationales = " | ".join(str(audit.get("rationale", "")) for audit in audits)
                      path_receipt = ", ".join("`" + item + "`" for item in paths)
                      test_receipt = ", ".join("`" + item + "`" for item in tests)
                      if not test_receipt:
                          test_receipt = "governance-only under this issue's own contract"
                      gh_json(
                          cfg,
                          f"repos/{cfg.repository}/issues/{cfg.issue}/comments",
                          method="POST",
                          fields={
                              "body": (
                                  f"Exact-head no-diff completion audit at `{head}`: two independent fail-closed "
                                  f"reviewers agreed that every acceptance condition is already present. "
                                  f"Machine-verified paths: {path_receipt}. Machine-verified tests: {test_receipt}. "
                                  f"The complete Clang 22 static suite passed on the same head. Review rationale: "
                                  f"{rationales}. Learning checkpoint: none."
                              )
                          },
                      )
                      gh_json(
                          cfg,
                          f"repos/{cfg.repository}/issues/{cfg.issue}",
                          method="PATCH",
                          fields={"state": "closed", "state_reason": "completed"},
                      )
                      gh_json(
                          cfg,
                          f"repos/{cfg.repository}/issues/181/comments",
                          method="POST",
                          fields={
                              "body": (
                                  f"Serial issue #{cfg.issue} required no new source diff: two independent "
                                  f"exact-head audits at `{head}` verified current implementation/contracts and "
                                  f"the complete Clang 22 static suite passed. Learning checkpoint: none."
                              )
                          },
                      )
                      return True
                  except Exception as error:  # noqa: BLE001
                      print(
                          f"exact-head preimplementation audit fell through safely: "
                          f"{type(error).__name__}: {error}",
                          file=sys.stderr,
                      )
                      return False


              ''')
              anchor = 'def publish(cfg: Configuration, payload: dict[str, Any], paths: list[str]) -> tuple[int, str, str]:\n'
              if anchor not in source:
                  raise SystemExit('publish anchor not found')
              source = source.replace(anchor, audit_function + anchor, 1)

          audit_call = '    if close_if_exact_head_already_satisfies_issue(cfg, payload, context, baseline):\n        return 0\n\n'
          if audit_call not in source:
              anchor = '    baseline = baseline_log.read_text(errors="replace")\n\n'
              if anchor not in source:
                  raise SystemExit('baseline anchor not found')
              source = source.replace(anchor, anchor + audit_call, 1)

          if 'serial base changed during issue qualification' not in source:
              anchor = '''def publish(cfg: Configuration, payload: dict[str, Any], paths: list[str]) -> tuple[int, str, str]:\n    run(["git", "commit", "-m", f"fix: complete issue #{cfg.issue}"], cwd=cfg.repo_dir)\n'''
              replacement = '''def publish(cfg: Configuration, payload: dict[str, Any], paths: list[str]) -> tuple[int, str, str]:\n    current_issue = gh_json(cfg, f"repos/{cfg.repository}/issues/{cfg.issue}")\n    if current_issue.get("state") != "open":\n        current_head = run(["git", "rev-parse", "HEAD"], cwd=cfg.repo_dir, capture=True).stdout.strip()\n        print(f"issue #{cfg.issue} was completed by another serial owner; discarding the local candidate")\n        return 0, current_head, ""\n\n    starting_base = run(["git", "rev-parse", "HEAD"], cwd=cfg.repo_dir, capture=True).stdout.strip()\n    run(["git", "fetch", "--no-tags", "origin", cfg.base_branch], cwd=cfg.repo_dir)\n    current_base = run(\n        ["git", "rev-parse", f"origin/{cfg.base_branch}"],\n        cwd=cfg.repo_dir,\n        capture=True,\n    ).stdout.strip()\n    if current_base != starting_base:\n        raise RuntimeError(\n            f"serial base changed during issue qualification: {starting_base} -> {current_base}"\n        )\n\n    run(["git", "commit", "-m", f"fix: complete issue #{cfg.issue}"], cwd=cfg.repo_dir)\n'''
              if anchor not in source:
                  raise SystemExit('publish implementation anchor not found')
              source = source.replace(anchor, replacement, 1)

          path.write_text(source)
          PY
          python3 -m py_compile tools/agent/release_completion_issue_agent.py
          find .github/workflows -maxdepth 1 -type f -name 'release-completion-agent-*.yml' -delete
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'tools: consolidate fail-closed serial issue agent'
          git push origin HEAD:agent/release-completion-agent-tools
