name: Apply and verify issue 272 on current main

on:
  push:
    branches:
      - fix/soft-unresolved-materialization-272-clean
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-272-clean-implementation
  cancel-in-progress: true

jobs:
  apply-current-main:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/soft-unresolved-materialization-272-clean
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Recover the reviewed implementation driver
        run: |
          git show 45de9d75baeba275331f6911cb6df367d06bb18f:.github/agent_fix_272.py > /tmp/agent_fix_272.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/agent_fix_272.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f"{path}: expected {count} matches, found {actual}")
              file.write_text(text.replace(old, new), encoding="utf-8")
          '''
          old = '\n'.join(line[12:] if line.startswith('            ') else line for line in old.splitlines()) + '\n'
          new = '''def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              import re

              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual == count:
                  file.write_text(text.replace(old, new), encoding="utf-8")
                  return

              pieces = re.split(r"([ \\t]+)", old)
              pattern = "".join(
                  r"[ \\t]+" if piece and all(character in " \\t" for character in piece)
                  else re.escape(piece)
                  for piece in pieces
              )
              matches = list(re.finditer(pattern, text))
              if len(matches) != count:
                  raise RuntimeError(
                      f"{path}: expected {count} matches, found {actual} exact and {len(matches)} whitespace-flexible"
                  )
              file.write_text(re.sub(pattern, lambda _: new, text, count=count), encoding="utf-8")
          '''
          new = '\n'.join(line[12:] if line.startswith('            ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise RuntimeError('reviewed replace_exact function shape changed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 -m py_compile /tmp/agent_fix_272.py

      - name: Apply the implementation to current main
        run: |
          python3 /tmp/agent_fix_272.py
          git diff --check
          printf '%s\n' \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            src/llvm/clang22/materialization_claims.cpp \
            tests/adapter/clang22/materialization_store_test.cpp \
            > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          tar -czf /tmp/issue-272-current-main.tgz \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            src/llvm/clang22/materialization_claims.cpp \
            tests/adapter/clang22/materialization_store_test.cpp

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-272-current-main-${{ github.sha }}
          path: /tmp/issue-272-current-main.tgz
          if-no-files-found: error
          retention-days: 1

  verify-and-commit:
    needs: apply-current-main
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/soft-unresolved-materialization-272-clean
          fetch-depth: 0

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.3.0
        with:
          name: issue-272-current-main-${{ github.sha }}
          path: /tmp/issue-272-download

      - name: Restore the bounded implementation
        run: |
          tar -xzf /tmp/issue-272-download/issue-272-current-main.tgz -C .
          git diff --check

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Install exact Clang 22 toolchain
        run: python3 tools/ci/bootstrap_supply_chain.py install --profile developer

      - name: Install locked Python quality dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement tools/quality/requirements.lock

      - name: Format the bounded change
        run: |
          clang-format-22 -i \
            src/llvm/clang22/materialization_claims.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            tests/adapter/clang22/materialization_store_test.cpp
          git diff --check

      - name: Configure and build focused targets
        env:
          CXX: clang++-22
        run: |
          cmake --preset ci-quick -DCXXLENS_CLANG_ADAPTER=ON
          cmake --build --preset ci-quick --target \
            cxxlens-clang22-materialization-claims \
            cxxlens-clang22-materialization-store

      - name: Run focused materialization regressions
        run: |
          ctest --preset ci-quick \
            --tests-regex '^adapter\.clang22-materialization-(claims|store)$' \
            --output-on-failure

      - name: Commit only the verified implementation
        run: |
          git rm .github/workflows/issue-272-clean-apply.yml
          git add \
            src/llvm/clang22/materialization_claims.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            tests/adapter/clang22/materialization_store_test.cpp
          git diff --cached --check
          printf '%s\n' \
            .github/workflows/issue-272-clean-apply.yml \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            src/llvm/clang22/materialization_claims.cpp \
            tests/adapter/clang22/materialization_store_test.cpp \
            > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git config user.name 'Codex'
          git config user.email 'codex@users.noreply.github.com'
          git commit -m 'Preserve soft unresolved materialization results (#272)'
          git push origin HEAD:fix/soft-unresolved-materialization-272-clean
