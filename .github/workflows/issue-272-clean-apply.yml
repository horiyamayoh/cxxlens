name: Apply and verify issue 272 on current main

on:
  push:
    branches:
      - fix/soft-unresolved-materialization-272-clean
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-272-clean-implementation
  cancel-in-progress: true

jobs:
  apply-current-main:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/soft-unresolved-materialization-272-clean
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Recover the reviewed implementation driver
        run: |
          git show 45de9d75baeba275331f6911cb6df367d06bb18f:.github/agent_fix_272.py > /tmp/agent_fix_272.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/agent_fix_272.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f"{path}: expected {count} matches, found {actual}")
              file.write_text(text.replace(old, new), encoding="utf-8")
          '''
          old = '\n'.join(line[12:] if line.startswith('            ') else line for line in old.splitlines()) + '\n'
          new = '''def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              import re

              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual == count:
                  file.write_text(text.replace(old, new), encoding="utf-8")
                  return

              pieces = re.split(r"([ \\t]+)", old)
              pattern = "".join(
                  r"[ \\t]+" if piece and all(character in " \\t" for character in piece)
                  else re.escape(piece)
                  for piece in pieces
              )
              matches = list(re.finditer(pattern, text))
              if len(matches) != count:
                  raise RuntimeError(
                      f"{path}: expected {count} matches, found {actual} exact and {len(matches)} whitespace-flexible"
                  )
              file.write_text(re.sub(pattern, lambda _: new, text, count=count), encoding="utf-8")
          '''
          new = '\n'.join(line[12:] if line.startswith('            ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise RuntimeError('reviewed replace_exact function shape changed')
          text = text.replace(old, new)

          # #295 already owns production begin() and its request-entry resolver. Remove the
          # obsolete constructor rewrite; a resolver-preserving test factory is added after the
          # issue #272 patch has been applied.
          begin_start = text.index(
              "replace_exact(\n    bounded_path,\n    r'''\\t\\treturn materialization_bounded_claim_source{",
              text.index('bounded_path = '),
          )
          finalize_marker = text.index(
              '# Replace finalize with request-wide residual reconciliation', begin_start
          )
          text = text[:begin_start] + text[finalize_marker:]
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile /tmp/agent_fix_272.py

      - name: Apply the implementation to current main
        run: |
          python3 /tmp/agent_fix_272.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected one adaptation marker, found {text.count(old)}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          header = 'src/llvm/clang22/materialization_bounded_claim_source.hpp'
          replace_once(
              header,
              '''\t\t/** Begin from already validated exact request identity and task census. */
          \t\t[[nodiscard]] static sdk::result<materialization_bounded_claim_source>
          \t\tbegin(std::string materialization_request_id,
          \t\t\t  const sdk::relation_engine& engine,
          \t\t\t  std::uint64_t expected_task_count);
          ''',
              '''\t\t/** Begin from validated identity and exact ordered task-entry bindings. */
          \t\t[[nodiscard]] static sdk::result<materialization_bounded_claim_source>
          \t\tbegin(std::string materialization_request_id,
          \t\t\t  const sdk::relation_engine& engine,
          \t\t\t  std::vector<std::string> selected_request_entry_bindings);
          ''',
          )

          source = 'src/llvm/clang22/materialization_bounded_claim_source.cpp'
          source_file = Path(source)
          source_text = source_file.read_text(encoding='utf-8')
          marker = '''\n\tsdk::result<materialization_bounded_claim_source> materialization_bounded_claim_source::begin(
          \t\tconst materialization_v2_1_claim_authority& authority)
          '''
          if source_text.count(marker) != 1:
              raise RuntimeError('bounded source authority begin marker changed')
          overload = r'''
          	sdk::result<materialization_bounded_claim_source>
          	materialization_bounded_claim_source::begin(
          		std::string materialization_request_id,
          		const sdk::relation_engine& engine,
          		std::vector<std::string> selected_request_entry_bindings)
          	{
          		if (materialization_request_id.empty() || selected_request_entry_bindings.empty() ||
          			selected_request_entry_bindings.size() >
          				std::numeric_limits<std::uint64_t>::max())
          			return sdk::unexpected(source_error("request", "empty-or-unbound"));
          		for (const auto& binding : selected_request_entry_bindings)
          			if (auto valid = sdk::validate_strong_id(binding); !valid)
          				return sdk::unexpected(source_error("task-binding", "strong-id"));
          		const auto task_count =
          			static_cast<std::uint64_t>(selected_request_entry_bindings.size());
          		return materialization_bounded_claim_source{
          			std::move(materialization_request_id),
          			engine,
          			task_count,
          			[bindings = std::move(selected_request_entry_bindings)](
          				const std::size_t task_index) -> sdk::result<std::string>
          			{
          				if (task_index >= bindings.size())
          					return sdk::unexpected(source_error("task-binding", "index"));
          				return bindings[task_index];
          			}};
          	}
          
          '''
          overload = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in overload.splitlines()
          )
          source_file.write_text(source_text.replace(marker, '\n' + overload + marker.lstrip('\n')), encoding='utf-8')

          test = 'tests/adapter/clang22/materialization_store_test.cpp'
          test_file = Path(test)
          test_text = test_file.read_text(encoding='utf-8')
          task_marker = '''\t[[nodiscard]] materialization_bounded_task_claims
          \tsoft_bounded_task(const sdk::relation_engine& value,
          '''
          helper = r'''
          	[[nodiscard]] std::string soft_request_entry_binding(const std::uint64_t task_index)
          	{
          		const auto digit = static_cast<char>('0' + (task_index % 10U));
          		return "sha256:" + std::string(64U, digit);
          	}
          
          '''
          helper = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in helper.splitlines()
          )
          if test_text.count(task_marker) != 1:
              raise RuntimeError('soft bounded task marker changed')
          test_text = test_text.replace(task_marker, helper + task_marker)
          old_signature = '''\tsoft_bounded_task(const sdk::relation_engine& value,
          \t\t\t\t\t  sdk::claim claim,
          \t\t\t\t\t  std::vector<sdk::unresolved_reference> unresolved,
          \t\t\t\t\t  const std::string& suffix)
          '''
          new_signature = '''\tsoft_bounded_task(const sdk::relation_engine& value,
          \t\t\t\t\t  sdk::claim claim,
          \t\t\t\t\t  std::vector<sdk::unresolved_reference> unresolved,
          \t\t\t\t\t  const std::string& suffix,
          \t\t\t\t\t  const std::uint64_t task_index)
          '''
          if test_text.count(old_signature) != 1:
              raise RuntimeError('soft bounded task signature changed')
          test_text = test_text.replace(old_signature, new_signature)
          return_marker = '''\t\treturn {
          \t\t\t"sha256:2222222222222222222222222222222222222222222222222222222222222222",
          '''
          return_replacement = '''\t\treturn {
          \t\t\ttask_index,
          \t\t\tsoft_request_entry_binding(task_index),
          \t\t\t"sha256:2222222222222222222222222222222222222222222222222222222222222222",
          '''
          if test_text.count(return_marker) != 1:
              raise RuntimeError('soft bounded task return marker changed')
          test_text = test_text.replace(return_marker, return_replacement)
          old_begin = '''\t[[nodiscard]] materialization_bounded_claim_source
          \tbegin_soft_source(const sdk::relation_engine& value, const std::uint64_t task_count)
          \t{
          \t\tauto source = materialization_bounded_claim_source::begin(
          \t\t\t"materialization-request:soft-unresolved", value, task_count);
          \t\trequire(source.has_value(), "soft-reference bounded source begin failed");
          \t\treturn std::move(*source);
          \t}
          '''
          new_begin = '''\t[[nodiscard]] materialization_bounded_claim_source
          \tbegin_soft_source(const sdk::relation_engine& value, const std::uint64_t task_count)
          \t{
          \t\tstd::vector<std::string> bindings;
          \t\tbindings.reserve(static_cast<std::size_t>(task_count));
          \t\tfor (std::uint64_t task_index{}; task_index < task_count; ++task_index)
          \t\t\tbindings.push_back(soft_request_entry_binding(task_index));
          \t\tauto source = materialization_bounded_claim_source::begin(
          \t\t\t"materialization-request:soft-unresolved", value, std::move(bindings));
          \t\trequire(source.has_value(), "soft-reference bounded source begin failed");
          \t\treturn std::move(*source);
          \t}
          '''
          if test_text.count(old_begin) != 1:
              raise RuntimeError('soft bounded source helper changed')
          test_text = test_text.replace(old_begin, new_begin)
          test_text = test_text.replace(
              '''soft_bounded_task(
          \t\t\t\t\t\tvalue, source_claim, unresolved, "source-only")''',
              '''soft_bounded_task(
          \t\t\t\t\t\tvalue, source_claim, unresolved, "source-only", 0U)''',
          )
          old_cross = '''\t\tauto source = begin_soft_source(value, 2U);
          \t\tauto source_task = soft_bounded_task(
          \t\t\tvalue, source_claim, soft_unresolved_for(value, source_claim), "source");
          \t\tauto target_task =
          \t\t\tsoft_bounded_task(value, target_claim, {}, "target");
          '''
          new_cross = '''\t\tauto source = begin_soft_source(value, 2U);
          \t\tconst auto source_index = reverse ? 1U : 0U;
          \t\tconst auto target_index = reverse ? 0U : 1U;
          \t\tauto source_task = soft_bounded_task(value,
          \t\t\t			\t\t\t\t\t\t source_claim,
          \t\t\t		\t\t\t\t\t\t soft_unresolved_for(value, source_claim),
          \t\t\t		\t\t\t\t\t\t "source",
          \t\t\t		\t\t\t\t\t\t source_index);
          \t\tauto target_task =
          \t\t\tsoft_bounded_task(value, target_claim, {}, "target", target_index);
          '''
          if test_text.count(old_cross) != 1:
              raise RuntimeError('cross-task soft fixture changed')
          test_text = test_text.replace(old_cross, new_cross)
          test_file.write_text(test_text, encoding='utf-8')
          PY
          git diff --check
          printf '%s\n' \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            src/llvm/clang22/materialization_claims.cpp \
            tests/adapter/clang22/materialization_store_test.cpp \
            > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          tar -czf /tmp/issue-272-current-main.tgz \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            src/llvm/clang22/materialization_claims.cpp \
            tests/adapter/clang22/materialization_store_test.cpp

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-272-current-main-${{ github.sha }}
          path: /tmp/issue-272-current-main.tgz
          if-no-files-found: error
          retention-days: 1

  verify-and-commit:
    needs: apply-current-main
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/soft-unresolved-materialization-272-clean
          fetch-depth: 0

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.3.0
        with:
          name: issue-272-current-main-${{ github.sha }}
          path: /tmp/issue-272-download

      - name: Restore the bounded implementation
        run: |
          tar -xzf /tmp/issue-272-download/issue-272-current-main.tgz -C .
          git diff --check

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Install exact Clang 22 toolchain
        run: python3 tools/ci/bootstrap_supply_chain.py install --profile developer

      - name: Install locked Python quality dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement tools/quality/requirements.lock

      - name: Format the bounded change
        run: |
          clang-format-22 -i \
            src/llvm/clang22/materialization_claims.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            tests/adapter/clang22/materialization_store_test.cpp
          git diff --check

      - name: Configure and build focused targets
        env:
          CXX: clang++-22
        run: |
          cmake --preset ci-quick -DCXXLENS_CLANG_ADAPTER=ON
          cmake --build --preset ci-quick --target \
            cxxlens-clang22-materialization-claims \
            cxxlens-clang22-materialization-store

      - name: Run focused materialization regressions
        run: |
          ctest --preset ci-quick \
            --tests-regex '^adapter\.clang22-materialization-(claims|store)$' \
            --output-on-failure

      - name: Commit only the verified implementation
        run: |
          git rm .github/workflows/issue-272-clean-apply.yml
          git add \
            src/llvm/clang22/materialization_claims.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            tests/adapter/clang22/materialization_store_test.cpp
          git diff --cached --check
          printf '%s\n' \
            .github/workflows/issue-272-clean-apply.yml \
            src/llvm/clang22/materialization_bounded_claim_source.cpp \
            src/llvm/clang22/materialization_bounded_claim_source.hpp \
            src/llvm/clang22/materialization_claims.cpp \
            tests/adapter/clang22/materialization_store_test.cpp \
            > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git config user.name 'Codex'
          git config user.email 'codex@users.noreply.github.com'
          git commit -m 'Preserve soft unresolved materialization results (#272)'
          git push origin HEAD:fix/soft-unresolved-materialization-272-clean
