name: Agent source export

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Package exact PR and main sources
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="${RUNNER_TEMP}/cxxlens-source-head-${GITHUB_SHA}.tar.gz" HEAD
          git archive --format=tar.gz --output="${RUNNER_TEMP}/cxxlens-source-main-${GITHUB_SHA}.tar.gz" origin/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-agent-source-${{ github.sha }}
          path: ${{ runner.temp }}/cxxlens-source-*.tar.gz
          if-no-files-found: error
          retention-days: 1
