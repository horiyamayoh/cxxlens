name: Agent blocker remediation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write

jobs:
  apply-remediation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect complete staged remediation
        id: remediation
        shell: bash
        run: |
          if [[ -f .github/agent-remediation.part-00 && \
                -f .github/agent-remediation.part-01 && \
                -f .github/agent-remediation.part-02 && \
                -f .github/agent-remediation.part-03 && \
                -f .github/agent-remediation.part-04 ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install exact Clang 22 toolchain
        if: steps.remediation.outputs.present == 'true'
        run: python3 tools/ci/bootstrap_supply_chain.py install --profile developer

      - name: Apply, clean, format, build, and test remediation
        if: steps.remediation.outputs.present == 'true'
        env:
          CXX: clang++-22
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-remediation.part-* > "${RUNNER_TEMP}/agent-remediation.patch"
          git apply --check "${RUNNER_TEMP}/agent-remediation.patch"
          git apply "${RUNNER_TEMP}/agent-remediation.patch"
          python3 -c 'from pathlib import Path; p=Path("tests/unit/sdk/provider_runtime_test.cpp"); s=p.read_text(); assert s.count("fs:temp_directory_path()") == 1; p.write_text(s.replace("fs:temp_directory_path()", "fs::temp_directory_path()"))'

          # Restore the authoritative Quality workflow and remove every temporary
          # remediation/export artifact before validating or publishing the branch.
          git restore --source=origin/main -- .github/workflows/quality.yml
          rm -f .github/agent-remediation.part-*
          rm -f .github/workflows/agent-source-export.yml
          rm -f .github/workflows/apply-ng1-duplex-review-fixes.yml
          rm -f tools/agent/apply_ng1_duplex_review_fixes.py

          clang-format-22 -i \
            src/runtime/provider_process_adapter.cpp \
            tests/fixtures/provider_process_fixture.cpp \
            tests/unit/sdk/provider_runtime_test.cpp
          git diff --check
          python3 tools/quality/check_format.py --root . --clang-format clang-format-22
          cmake -S . -B build/agent-remediation -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCXXLENS_CLANG_ADAPTER=OFF \
            -DCXXLENS_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON \
            -DCXXLENS_BUILD_QUALITY_TOOLS=OFF
          cmake --build build/agent-remediation --target \
            cxxlens-unit-sdk-provider-runtime \
            cxxlens-provider-process-fixture
          ctest --test-dir build/agent-remediation \
            --tests-regex '^unit.sdk-provider-runtime$' \
            --output-on-failure
          cmake --build build/agent-remediation --target cxxlens-quality

      - name: Commit exact validated remediation
        if: steps.remediation.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix NG1 duplex process review findings"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
