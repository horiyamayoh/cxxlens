name: Agent blocker remediation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  apply-remediation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detect complete staged remediation
        id: remediation
        shell: bash
        run: |
          if [[ -f .github/agent-remediation.part-00 && \
                -f .github/agent-remediation.part-01 && \
                -f .github/agent-remediation.part-02 && \
                -f .github/agent-remediation.part-03 && \
                -f .github/agent-remediation.part-04 ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Install exact Clang 22 toolchain
        if: steps.remediation.outputs.present == 'true'
        run: python3 tools/ci/bootstrap_supply_chain.py install --profile developer
      - name: Apply, format, build, and test remediation
        if: steps.remediation.outputs.present == 'true'
        env:
          CXX: clang++-22
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-remediation.part-* > "${RUNNER_TEMP}/agent-remediation.patch"
          git apply --check "${RUNNER_TEMP}/agent-remediation.patch"
          git apply "${RUNNER_TEMP}/agent-remediation.patch"
          python3 -c 'from pathlib import Path; p=Path("tests/unit/sdk/provider_runtime_test.cpp"); s=p.read_text(); assert s.count("fs:temp_directory_path()") == 1; p.write_text(s.replace("fs:temp_directory_path()", "fs::temp_directory_path()"))'
          rm .github/agent-remediation.part-*
          rm .github/workflows/agent-source-export.yml
          clang-format-22 -i \
            src/runtime/provider_process_adapter.cpp \
            tests/fixtures/provider_process_fixture.cpp \
            tests/unit/sdk/provider_runtime_test.cpp
          git diff --check
          python3 tools/quality/check_format.py --root . --clang-format clang-format-22
          cmake -S . -B build/agent-remediation -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCXXLENS_CLANG_ADAPTER=OFF \
            -DCXXLENS_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON \
            -DCXXLENS_BUILD_QUALITY_TOOLS=OFF
          cmake --build build/agent-remediation --target \
            cxxlens-unit-sdk-provider-runtime \
            cxxlens-provider-process-fixture
          ctest --test-dir build/agent-remediation \
            --tests-regex '^unit.sdk-provider-runtime$' \
            --output-on-failure
          git diff --binary > "${RUNNER_TEMP}/validated-remediation.patch"
      - name: Preserve exact validated remediation
        if: steps.remediation.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cxxlens-agent-remediation-${{ github.sha }}
          path: |
            .github/workflows/quality.yml
            src/runtime/provider_process_adapter.cpp
            tests/fixtures/provider_process_fixture.cpp
            tests/unit/sdk/provider_runtime_test.cpp
            ${{ runner.temp }}/validated-remediation.patch
          if-no-files-found: error
          retention-days: 1
