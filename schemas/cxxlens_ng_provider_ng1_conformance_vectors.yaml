schema: cxxlens.provider-ng1-conformance-vectors.v1
document_version: 1.0.0
maturity: proposed
authority:
  contract: schemas/cxxlens_ng_provider_ng1_hardening.yaml
  decision_issue: '#233'
  implementation_issue: '#183'
  digest_grammar_adr: docs/design/adr/0100-ng1-resume-provider-digest-grammar.md
  digest_grammar_issue: '#243'
  binding:
    state: authority-only-unbound
    revision: null
    tree: null
    provider_binary_digest: null
    provider_semantic_contract_digest: null
    protocol_minor: 1
    hardening_contract_digest: null
vectors:
  - id: positive-heartbeat-and-progress
    class: positive
    surface: heartbeat
    mutation: valid-probe-ack-and-rate-samples
    expected: {decision: accepted}
  - id: stale-heartbeat
    class: negative
    surface: heartbeat
    mutation: ack-after-last-probe-deadline
    expected: {decision: rejected, reason_code: provider.heartbeat-timeout}
  - id: heartbeat-timeout
    class: negative
    surface: heartbeat
    mutation: no-ack-through-inclusive-timeout-boundary
    expected: {decision: rejected, reason_code: provider.heartbeat-timeout}
  - id: progress-sample-timeout
    class: negative
    surface: progress
    mutation: no-valid-sample-through-inclusive-startup-grace
    expected: {decision: rejected, reason_code: provider.progress-rate}
  - id: zero-progress-after-grace
    class: negative
    surface: progress
    mutation: zero-delta-after-startup-grace
    expected: {decision: rejected, reason_code: provider.progress-rate}
  - id: stale-resume-token
    class: negative
    surface: resume
    mutation: lower-generation-or-terminal-token
    expected: {decision: rejected, reason_code: provider.resume-token-stale}
  - id: foreign-resume-token
    class: negative
    surface: resume
    mutation: provider-task-or-session-binding-mismatch
    expected: {decision: rejected, reason_code: provider.resume-token-stale}
  - id: spill-corruption
    class: negative
    surface: spill
    mutation: torn-record-or-digest-gap
    expected: {decision: rejected, reason_code: provider.spill-corrupt}
  - id: worker-crash-recovery
    class: recovery
    surface: recovery
    mutation: worker-exit-after-fsync-confirmed-ack
    expected: {decision: recovery, outcome: replay-from-ack-plus-one-or-fail-closed}
  - id: worker-hang-recovery
    class: recovery
    surface: recovery
    mutation: heartbeat-timeout-and-worker-kill
    expected: {decision: recovery, outcome: replay-from-durable-ack-or-fail-closed}
  - id: cancellation-recovery
    class: recovery
    surface: recovery
    mutation: cancel-during-open-dependency-group
    expected: {decision: recovery, outcome: rollback-current-group-and-fail-closed}
  - id: permutation-replay
    class: negative
    surface: resume
    mutation: duplicate-gap-or-out-of-order-replay
    expected: {decision: rejected, reason_code: provider.resume-replay-invalid}
  - id: long-run-fault
    class: recovery
    surface: qualification
    mutation: injected-long-run-clock-worker-and-spill-faults
    expected: {decision: recovery, outcome: accepted-only-with-exact-certificate-or-stable-failure}
  - id: manifest-content-digest-binding
    class: positive
    surface: resume
    mutation: provider-identity-fields-use-exact-manifest-content-digests
    expected: {decision: accepted}
  - id: semantic-v2-provider-identity-rejected
    class: negative
    surface: resume
    mutation: provider-identity-field-uses-semantic-v2-without-manifest-projection
    expected: {decision: rejected, reason_code: provider.resume-token-stale}
  - id: content-digest-semantic-field-rejected
    class: negative
    surface: resume
    mutation: semantic-binding-field-uses-manifest-content-digest
    expected: {decision: rejected, reason_code: provider.resume-token-stale}
