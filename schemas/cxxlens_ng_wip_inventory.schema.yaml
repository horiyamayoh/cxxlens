$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-wip-inventory.v1
title: cxxlens preserved branch and worktree provenance
type: object
additionalProperties: false
required: [schema, document_version, captured_at, source_revision, normalization, worktrees, refs]
properties:
  schema: {const: cxxlens.ng-wip-inventory.v1}
  document_version: {const: 1.0.0}
  captured_at: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+Z$'}
  source_revision: {$ref: '#/$defs/hex40'}
  normalization:
    type: object
    additionalProperties: false
    required: [prunable_registration_action, branch_deletion, live_worktree_deletion, status]
    properties:
      prunable_registration_action: {const: prune-after-snapshot}
      branch_deletion: {const: forbidden}
      live_worktree_deletion: {const: forbidden}
      status: {const: complete}
  worktrees:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [path, head, branch, prunable, disposition]
      properties:
        path: {type: string, minLength: 1}
        head: {$ref: '#/$defs/hex40'}
        branch: {oneOf: [{type: string, minLength: 1}, {type: 'null'}]}
        prunable: {type: boolean}
        prunable_reason: {type: string, minLength: 1}
        disposition: {$ref: '#/$defs/disposition'}
  refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [ref, head, disposition]
      properties:
        ref: {type: string, minLength: 1}
        head: {$ref: '#/$defs/hex40'}
        disposition: {$ref: '#/$defs/disposition'}
$defs:
  hex40: {type: string, pattern: '^[0-9a-f]{40}$'}
  disposition: {enum: [moving-canonical, selected-provenance, historical-unreviewed, merged, prunable-registration]}
