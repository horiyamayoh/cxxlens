$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-release-evidence-selection.v1
title: cxxlens authenticated release evidence selection
description: >-
  An explicit, attempt-one-only selection of producer workflow runs and artifact
  IDs. This document contains no latest-run discovery and is not itself release
  qualification evidence.
type: object
additionalProperties: false
required:
  - schema
  - document_version
  - contract_id
  - selection_id
  - selected_at
  - candidate
  - roles
properties:
  schema:
    const: cxxlens.ng-release-evidence-selection.v1
  document_version:
    const: 1.0.0
  contract_id:
    const: development.authenticated-release-evidence-handoff.v1
  selection_id:
    type: string
    pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
  selected_at:
    type: string
    format: date-time
  candidate:
    $ref: '#/$defs/candidate'
  roles:
    type: object
    additionalProperties: false
    required: [heavy, nightly, gr, terminal_scope]
    properties:
      heavy:
        $ref: '#/$defs/heavy_selection'
      nightly:
        $ref: '#/$defs/nightly_selection'
      gr:
        $ref: '#/$defs/gr_selection'
      terminal_scope:
        $ref: '#/$defs/terminal_scope_selection'
$defs:
  sha:
    type: string
    pattern: '^[0-9a-f]{40}$'
  repository_id:
    type: integer
    minimum: 1
  workflow_id:
    type: integer
    minimum: 1
  run_id:
    type: integer
    minimum: 1
  artifact_id:
    type: integer
    minimum: 1
  candidate:
    type: object
    additionalProperties: false
    required: [repository, repository_id, branch, sha, tree]
    properties:
      repository:
        type: string
        pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
      repository_id:
        $ref: '#/$defs/repository_id'
      branch:
        const: main
      sha:
        $ref: '#/$defs/sha'
      tree:
        $ref: '#/$defs/sha'
  base_selection:
    type: object
    additionalProperties: false
    required:
      - owner_issue
      - workflow_path
      - workflow_id
      - event
      - run_id
      - run_attempt
      - artifact_ids
    properties:
      owner_issue:
        type: string
        pattern: '^#[0-9]+$'
      workflow_path:
        type: string
        pattern: '^\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml$'
      workflow_id:
        $ref: '#/$defs/workflow_id'
      event:
        type: string
      run_id:
        $ref: '#/$defs/run_id'
      run_attempt:
        const: 1
      artifact_ids:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/artifact_id'
  heavy_selection:
    allOf:
      - $ref: '#/$defs/base_selection'
      - type: object
        properties:
          owner_issue:
            const: '#173'
          workflow_path:
            const: .github/workflows/autonomy-heavy.yml
          event:
            const: workflow_run
          artifact_ids:
            minItems: 2
            maxItems: 2
  nightly_selection:
    allOf:
      - $ref: '#/$defs/base_selection'
      - type: object
        properties:
          owner_issue:
            const: '#173'
          workflow_path:
            const: .github/workflows/nightly.yml
          event:
            enum: [schedule, workflow_dispatch]
          artifact_ids:
            minItems: 1
            maxItems: 1
  gr_selection:
    allOf:
      - $ref: '#/$defs/base_selection'
      - type: object
        properties:
          owner_issue:
            const: '#167'
          workflow_path:
            const: .github/workflows/autonomy-gr.yml
          event:
            const: workflow_dispatch
          artifact_ids:
            minItems: 1
            maxItems: 1
  terminal_scope_selection:
    allOf:
      - $ref: '#/$defs/base_selection'
      - type: object
        properties:
          owner_issue:
            const: '#179'
          workflow_path:
            const: .github/workflows/autonomy-production-scope.yml
          event:
            const: workflow_dispatch
          artifact_ids:
            minItems: 1
            maxItems: 1
