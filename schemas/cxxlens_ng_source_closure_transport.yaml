schema: cxxlens.source-closure-transport.v1
document_version: 1.1.0
maturity: proposed
authority:
  adr: docs/design/adr/0102-dedicated-source-closure-transport.md
  identity_adr: docs/design/adr/0101-source-closure-identity-and-compiler-vfs.md
  owner_issue: '#261'
  review: {status: required, reviewer: null, ref: null, exact_main_commit: null}
review_findings:
  status: blocking
  exact_main_commit: d7dfb7a2a5d2fe7e2fa247232be46da577166aa4
  ref: https://github.com/horiyamayoh/cxxlens/issues/261#issuecomment-5358501463
  reviewer: codex-independent-reviewer/01a01fe3-fd16-7191-8275-275ba44196eb
  receipt_id: null
  required_resolutions:
    - id: SC-R2-01
      problem: request-v2-2-nests-protocol-1-1-and-source-bytes
      decision: replace-with-full-v2-2-authority-derived-from-v2-1-minus-content-plus-protocol-1-2
    - id: SC-R2-02
      problem: provider-cannot-recompute-task-v4
      decision: protocol-1-2-input-chunks-carry-canonical-complete-task-v4-metadata-before-closure-transfer
    - id: SC-R2-03
      problem: manifest-bound-excludes-valid-adr-0101-closure
      decision: forty-mib-manifest-and-eighty-eight-mib-spool-with-constructibility-witness
    - id: SC-R2-04
      problem: phase-authentic-reject-is-declarative
      decision: closed-control-schemas-plus-executable-reject-union-validator
    - id: SC-R2-05
      problem: review-reference-not-content-bound
      decision: committed-review-receipt-binds-verdict-reviewer-session-exact-main-sha-and-comment-body-digest
versions:
  provider_protocol: {legacy: 1.1, proposed: 1.2, downgrade: reject}
  request: {legacy: 2.1, proposed: 2.2}
  task: {legacy: cxxlens.clang22.task.v3, proposed: cxxlens.clang22.task.v4}
capability:
  id: task-source-closure-v1
  required_for: [request-2.2, task-v4]
  absence: source-closure.required-feature-missing
message_registry:
  preserved: {heartbeat: 23}
  proposed:
    - {id: 24, name: source_closure_manifest, direction: host-to-provider}
    - {id: 25, name: source_closure_blob, direction: host-to-provider}
    - {id: 26, name: source_closure_chunk, direction: host-to-provider}
    - {id: 27, name: source_closure_seal, direction: host-to-provider}
    - {id: 28, name: source_closure_ack, direction: provider-to-host}
    - {id: 29, name: source_closure_reject, direction: provider-to-host}
wire_controls:
  common:
    encoding: deterministic-cbor-closed-map
    stream_id: exact-open-task-stream
    sequence: contiguous-shared-session-sequence
    flags: zero
    control_bytes: 65536
    payload_bytes: 1048576
    unknown_or_extra_field: reject
    field_types:
      kind: closed-enum
      session_id: typed-id
      task_id: typed-id
      task_v4_digest: semantic-v2-digest
      closure_id: source-closure-semantic-v2-id
      closure_digest: semantic-v2-digest
      manifest_digest: semantic-v2-digest
      blob_digest: content-sha256-digest
      transfer_digest: semantic-v2-digest
      counts-offsets-and-sizes: uint64
      blob_receipts_digest: semantic-v2-digest
      observed_counters: canonical-closed-map
      receipts-and-cleanup-owner: typed-id-or-semantic-v2-digest
  source_closure_manifest:
    descriptor: {kind: descriptor, exact_fields: [kind, session_id, task_id, task_v4_digest, closure_id, closure_digest, manifest_digest, total_bytes, chunk_bytes, chunk_count], payload: empty}
    chunk: {kind: chunk, exact_fields: [kind, session_id, task_id, manifest_digest, chunk_index, offset, byte_count], payload: exact-byte-count-frame-digest}
  source_closure_blob:
    exact_fields: [session_id, task_id, closure_digest, blob_ordinal, blob_digest, total_bytes, chunk_bytes, chunk_count]
    payload: empty
  source_closure_chunk:
    exact_fields: [session_id, task_id, blob_ordinal, blob_digest, chunk_index, offset, byte_count]
    payload: exact-byte-count-frame-digest
  source_closure_seal:
    exact_fields: [session_id, task_id, task_v4_digest, manifest_digest, blob_receipts_digest, blob_count, total_bytes, closure_digest, transfer_digest]
    payload: empty
  source_closure_ack:
    exact_fields: [session_id, task_id, closure_digest, transfer_digest, spool_receipt, cleanup_owner]
    payload: empty
  source_closure_reject:
    exact_fields: [session_id, task_id, failure_phase, reason_code, observed_counters, cleanup_receipt]
    unavailable_fields: omitted-never-placeholder
    payload: empty
state_machine:
  initial: task-v4-sealed
  success_path: [task-v4-sealed, manifest-open, manifest-streaming, manifest-validated, blob-open, blob-streaming, blob-sealed, closure-sealed, closure-acknowledged, task-accepted]
  repeated_blob_subpath: [blob-open, blob-streaming, blob-sealed]
  cancellation: {from: every-nonterminal-closure-state, via: cancelling, terminal: source-closure.cancelled}
  replay: manifest-first-complete-transfer-same-task-and-session-only
  invalid_transition: source-closure.protocol-state-invalid
  pre_accept_liveness:
    clock: host-injected-monotonic
    send_progress_timeout_ns: 5000000000
    seal_ack_timeout_ns: 5000000000
    timeout: source-closure.transfer-timeout
  terminal_precedence:
    valid_reject_on_live_connection: exactly-one
    connection-loss-or-worker-crash: local-typed-terminal-no-fabricated-peer-reject
    cancel_then_valid_reject: cancelled
    cancel_then_connection-loss: provider.crash-with-cancel-observed
phase_fields:
  before-manifest: [session-id, task-id, task-v4-digest, expected-closure-id, expected-closure-digest, expected-manifest-digest, observed-control-frame-count]
  manifest-streaming: [declared-manifest-bytes, observed-bytes, next-offset, next-chunk-index, streaming-digest]
  manifest-validated: [closure-id, closure-digest, manifest-digest, member-count, blob-count, total-blob-bytes]
  blob-streaming: [blob-ordinal, blob-digest, declared-bytes, observed-bytes, next-offset, next-chunk-index]
  closure-sealed: [recomputed-manifest-digest, blob-receipts-digest, blob-count, total-bytes, transfer-digest]
  acknowledged: [task-local-spool-receipt, cleanup-owner]
  rejected: [failure-phase, reason-code, observed-counters, cleanup-receipt]
limits:
  maximum_members: 4096
  maximum_unique_blobs: 4096
  maximum_logical_path_utf8_bytes: 4096
  maximum_blob_bytes: 16777216
  maximum_unique_blob_bytes: 50331648
  maximum_manifest_bytes: 41943040
  maximum_manifest_chunks: 40
  maximum_chunk_payload_bytes: 1048576
  maximum_chunks_per_blob: 16
  maximum_blob_chunk_frames: 4144
  maximum_task_spool_bytes: 92274688
  maximum_resident_transport_bytes: 1310720
resource_policy:
  allocation: validate-count-length-offset-and-sum-before-allocation-or-write
  spool: backend-owned-private-task-local-digest-bound
  complete-memory-copy: forbidden
  cleanup: reject-cancel-crash-recovery-or-task-terminal
identity:
  projection_codec: canonical-json-utf8-sorted-keys-no-whitespace
  semantic_digest_codec: cxxlens-canonical-binary-v1
  semantic_digest_framing: [cxxlens-semantic-digest-v2, domain, canonical-projection-bytes]
  request_v2_2:
    domain: cxxlens.clang22.materialization-request.v2_2
    projection: [schema, request_version, required_features, top-level-complete-v2-1-authority-without-source-bytes-and-with-protocol-1-2, source_closures, task_extensions-without-task_id-and-task_v4_digest]
    digest_field: request_digest-equals-semantic-digest-of-projection
    id_field: request_id-equals-materialization-request-colon-request_digest
  task_v4:
    base_task_projection: canonical-complete-request-v2_2-base-task-with-source-metadata-and-no-source-bytes
    base_task_v3_digest: sha256-of-canonical-base-task-projection
    compatibility_disposition: field-name-retained-but-digest-intentionally-differs-from-legacy-v3-task
    domain: cxxlens.clang22.task.v4
    projection: [schema, base_task_index, base_provider_task_id, base_task_v3_digest, open_task, source_closure, main_logical_path, logical_working_directory]
    digest_field: task_v4_digest-equals-semantic-digest-of-projection
    id_field: task_id-equals-task-colon-task_v4_digest
  manifest:
    schema: cxxlens.source-closure-manifest.v1
    exact_fields: [schema, closure_id, closure_digest, members, blobs]
    member_exact_fields: [file_id, logical_path, role, encoding, size_bytes, content_digest, read_only]
    member_order: logical_path-utf8-byte-order
    member_role_enum: [main, header, generated, forced-include, macro-file]
    member_encoding_enum: [utf8, utf16le, utf16be, locale_dependent, binary_or_unknown]
    blob_exact_fields: [content_digest, size_bytes]
    blob_order: content_digest-byte-order
    domain: cxxlens.source-closure-manifest.v1
    digest: semantic-digest-of-canonical-complete-manifest
  blob_receipts:
    domain: cxxlens.source-closure-blob-receipts.v1
    item_exact_fields: [blob_ordinal, blob_digest, size_bytes]
    order: exact-manifest-blob-order
    digest: semantic-digest-of-canonical-complete-receipt-array-streamed
  transfer:
    domain: cxxlens.source-closure-transfer.v1
    projection: [session_id, task_id, task_v4_digest, manifest_digest, blob_receipts_digest, blob_count, total_bytes, closure_digest]
    digest: semantic-digest-of-canonical-projection
  manifest_order: adr-0101-canonical-member-and-blob-order
  blob_order: exact-manifest-order
  chunk_order: contiguous-index-and-offset-from-zero
  seal_fields: [session-id, task-id, task-v4-digest, manifest-digest, blob-receipts-digest, blob-count, total-bytes, closure-digest]
  ambient_filesystem: forbidden
request_task_binding:
  request_shape: exact-v2-1-authority-envelope-plus-closure-extensions
  closure_identity: source-closure-id-equals-source-closure-prefix-plus-semantic-closure-digest
  closure_ids: unique
  task_ids: unique-and-exact-index-parity-with-base-v2-1-tasks
  task_reference: resolves-exactly-one-request-closure
  base_task_v3_digest: recompute-from-complete-v2-2-base-task-projection-before-v4-identity-not-legacy-v3-digest
  open_task_fields: exact-base-task-task-input-invocation-toolchain-environment-digests
  logical_paths: adr-0101-strict-utf8-nfc-byte-bound-and-segment-validation
  blob_bytes_in_request_or_task: forbidden
cache:
  cross_task_v1: forbidden
  transfer: complete-per-task
  future_activation: separate-accepted-capability-and-adr
compatibility:
  legacy_2_1_v3: byte-exact-unchanged
  legacy_bindings:
    request_schema_sha256: b960f61c1104dfc62ae12b5cec78e14be616fff70cd1c8d824b2da768a74e73a
    task_v3_header_sha256: ce0709ab54036f17123033c750facbe56532ea7620255df023d3b1887ce4948b
    task_v3_implementation_sha256: da52373e06a68a43bf75afbc623377854cdb578fcced9686854a95e2eb0b4535
    request_v2_1_implementation_sha256: 952ce399e3240558ab347ca97a0b03697c1dad5bccc1bcd1cd067ecc5ccbb1b8
  legacy_protocol_1_1: supported-without-source-closure
  v4_without_capability: reject-before-closure-bytes
  unknown_required_message: reject
  ng1_resume_or_cache_alias: forbidden
failures:
  - source-closure.required-feature-missing
  - source-closure.protocol-state-invalid
  - source-closure.manifest-invalid
  - source-closure.blob-order-invalid
  - source-closure.chunk-order-invalid
  - source-closure.chunk-overlap
  - source-closure.chunk-gap
  - source-closure.digest-mismatch
  - source-closure.limit-exceeded
  - source-closure.task-binding-mismatch
  - source-closure.session-binding-mismatch
  - source-closure.replay-invalid
  - source-closure.cancelled
  - source-closure.transfer-timeout
  - source-closure.spool-io
  - source-closure.cleanup-failed
  - source-closure.ambient-fallback-denied
failure_phase_matrix:
  before-manifest:
    allowed: [source-closure.required-feature-missing, source-closure.protocol-state-invalid, source-closure.task-binding-mismatch, source-closure.session-binding-mismatch, source-closure.limit-exceeded, source-closure.cancelled, source-closure.transfer-timeout]
    counters: [observed-control-frame-count]
  manifest-streaming:
    allowed: [source-closure.protocol-state-invalid, source-closure.manifest-invalid, source-closure.chunk-order-invalid, source-closure.chunk-overlap, source-closure.chunk-gap, source-closure.digest-mismatch, source-closure.limit-exceeded, source-closure.task-binding-mismatch, source-closure.session-binding-mismatch, source-closure.cancelled, source-closure.transfer-timeout, source-closure.spool-io, source-closure.cleanup-failed]
    counters: [declared-manifest-bytes, received-manifest-bytes, next-chunk-index]
  manifest-validated:
    allowed: [source-closure.protocol-state-invalid, source-closure.blob-order-invalid, source-closure.limit-exceeded, source-closure.task-binding-mismatch, source-closure.session-binding-mismatch, source-closure.cancelled, source-closure.transfer-timeout, source-closure.spool-io, source-closure.cleanup-failed]
    counters: [member-count, blob-count, total-blob-bytes]
  blob-streaming:
    allowed: [source-closure.protocol-state-invalid, source-closure.blob-order-invalid, source-closure.chunk-order-invalid, source-closure.chunk-overlap, source-closure.chunk-gap, source-closure.digest-mismatch, source-closure.limit-exceeded, source-closure.task-binding-mismatch, source-closure.session-binding-mismatch, source-closure.cancelled, source-closure.transfer-timeout, source-closure.spool-io, source-closure.cleanup-failed]
    counters: [blob-ordinal, declared-blob-bytes, received-blob-bytes, next-chunk-index]
  closure-sealed:
    allowed: [source-closure.protocol-state-invalid, source-closure.digest-mismatch, source-closure.task-binding-mismatch, source-closure.session-binding-mismatch, source-closure.replay-invalid, source-closure.cancelled, source-closure.transfer-timeout, source-closure.cleanup-failed]
    counters: [blob-count, total-bytes]
  acknowledged:
    allowed: [source-closure.protocol-state-invalid, source-closure.task-binding-mismatch, source-closure.session-binding-mismatch, source-closure.replay-invalid, source-closure.cancelled, source-closure.cleanup-failed]
    counters: [blob-count, total-bytes]
  local-only:
    allowed: [source-closure.ambient-fallback-denied]
    counters: []
protocol_activation:
  current: 1.2.0
  registry: exact-existing-1-through-23-plus-contract-24-through-29
  minor_profile:
    required_features: [task-input-chunks-v1, task-source-closure-v1]
    exact_frame_pattern: [hello_ack, schema_negotiate, open_task-v4, input_descriptor-task-v4, input_chunk-task-v4-one-or-more, source_closure_manifest-descriptor, source_closure_manifest-chunk-one-or-more, source_closure_blob-and-chunk-canonical-repeat, source_closure_seal, source_closure_ack-or-reject, credit, close]
    capability_absence: reject-before-source-closure-bytes
    legacy_v3_disposition: negotiate-protocol-1-1-never-use-1-2
    task_v4_payload: canonical-complete-task-v4-metadata-no-source-bytes
    task_accepted_precondition: task-v4-and-manifest-and-all-blobs-and-transfer-seal-validated
    message_controls: schemas/cxxlens_ng_source_closure_transport.yaml#wire_controls
crash_effects:
  before-manifest: {effect: none, recovery: reject-without-spool}
  unsealed-transfer: {effect: private-unsealed-spool, recovery: remove-and-full-replay}
  sealed-before-ack: {effect: private-sealed-spool, recovery: remove-and-full-replay}
  acknowledged-before-execution: {effect: task-local-sealed-spool, recovery: cancel-removes-no-cache}
  worker-crash: {effect: no-publication-or-ambient-mutation, recovery: authenticated-orphan-cleanup}
  resource-failure: {effect: no-task-acceptance, recovery: typed-reject-and-cleanup-receipt}
counterexamples: [missing, duplicate, reordered, overlap, gap, extra, post-seal, tamper, limit-overflow, orphan-blob, missing-blob, cross-task, cross-session, stale-ack, foreign-replay, cancel-then-content, capability-absent, downgrade, message-id-collision, ambient-shadow, ng1-resume-alias]
qualification:
  implementation: not-claimed
  production: not-claimed
