schema: cxxlens.security-profile.v1
document_version: 2.0.0
maturity: accepted
provider_selection:
  precedence: [explicit_path, installation_manifest, project_config, system_registry]
  identity: [provider_id, provider_version, provider_binary_digest, provider_semantic_contract_digest]
  protocol: version-and-required-features-compatible
  ambiguous_candidates: reject
  invalid_explicit_candidate: fail-with-reason
  fallback: explicitly-configured-identities-only
execution:
  command: argv-without-shell
  executable: measure-content-before-execution
  sandbox_assurance: [none, best_effort, enforced]
  sandbox_minimum: caller-and-provider-requirements
  limits: [wall_ms, cpu_ms, address_space_bytes, output_bytes, open_files, subprocesses]
  cancellation: terminate-and-clean-up-process-group
input_validation:
  encoding: bounded-canonical-protocol
  required: [size-limits, schema-version, descriptor-binding, reference-integrity, source-content-digest]
  malformed_input: typed-error-before-publication
analysis_results:
  retained: [claim-provenance, coverage, closure, unresolved, conflict, guarantee]
