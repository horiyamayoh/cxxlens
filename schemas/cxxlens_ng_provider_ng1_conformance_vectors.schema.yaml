$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.provider-ng1-conformance-vectors.v1
title: cxxlens NG1 provider hardening conformance vectors
type: object
additionalProperties: false
required: [schema, document_version, maturity, authority, vectors]
properties:
  schema: {const: cxxlens.provider-ng1-conformance-vectors.v1}
  document_version: {const: '1.0.0'}
  maturity: {const: proposed}
  authority:
    type: object
    additionalProperties: false
    required: [contract, decision_issue, implementation_issue, digest_grammar_adr, digest_grammar_issue, binding]
    properties:
      contract: {const: schemas/cxxlens_ng_provider_ng1_hardening.yaml}
      decision_issue: {const: '#233'}
      implementation_issue: {const: '#183'}
      digest_grammar_adr: {const: docs/design/adr/0100-ng1-resume-provider-digest-grammar.md}
      digest_grammar_issue: {const: '#243'}
      binding:
        type: object
        additionalProperties: false
        required: [state, revision, tree, provider_binary_digest, provider_semantic_contract_digest, protocol_minor, hardening_contract_digest]
        properties:
          state: {const: authority-only-unbound}
          revision: {type: 'null'}
          tree: {type: 'null'}
          provider_binary_digest: {type: 'null'}
          provider_semantic_contract_digest: {type: 'null'}
          protocol_minor: {const: 1}
          hardening_contract_digest: {type: 'null'}
  vectors:
    type: array
    minItems: 16
    maxItems: 16
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, class, surface, mutation, expected]
      properties:
        id: {type: string, pattern: '^[a-z0-9-]+$'}
        class: {enum: [positive, negative, recovery]}
        surface: {enum: [heartbeat, progress, resume, spill, recovery, qualification]}
        mutation: {type: string, minLength: 1}
        expected:
          type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision: {enum: [accepted, rejected, recovery]}
            reason_code: {type: string, pattern: '^provider\.[a-z0-9-]+$'}
            outcome: {type: string, minLength: 1}
      allOf:
        - if:
            properties: {class: {const: positive}}
          then:
            properties:
              expected:
                required: [decision]
                not: {anyOf: [{required: [reason_code]}, {required: [outcome]}]}
        - if:
            properties: {class: {const: negative}}
          then:
            properties:
              expected:
                required: [decision, reason_code]
                properties: {decision: {const: rejected}}
                not: {required: [outcome]}
        - if:
            properties: {class: {const: recovery}}
          then:
            properties:
              expected:
                required: [decision, outcome]
                properties: {decision: {const: recovery}}
                not: {required: [reason_code]}
