$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-autonomy-ci.v1
title: cxxlens two-layer CI freshness authority
type: object
additionalProperties: false
required: [schema, document_version, fast, heavy, nightly, release, legacy]
properties:
  schema: {const: cxxlens.ng-autonomy-ci.v1}
  document_version: {const: 1.0.0}
  fast: {type: object, required: [workflow, event, cancellation, artifact_binding, evidence]}
  heavy: {type: object, required: [workflow, trigger, coalescing, stale_disposition, cancellation, evidence]}
  nightly: {type: object, required: [workflow, valid_events, candidate, evidence]}
  release: {type: object, required: [workflow, event, candidate_rule, cancellation, composition, current_capability, required_future_inputs]}
  legacy: {type: object, required: [workflow, evidence_disposition]}
