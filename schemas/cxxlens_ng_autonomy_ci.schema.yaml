$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-autonomy-ci.v1
title: cxxlens two-layer CI freshness authority
type: object
additionalProperties: false
required: [schema, document_version, fast, heavy, nightly, gr, terminal_scope, release, legacy]
properties:
  schema: {const: cxxlens.ng-autonomy-ci.v1}
  document_version: {const: 1.0.0}
  fast: {type: object, additionalProperties: false, required: [workflow, event, cancellation, artifact_binding, evidence], properties: {workflow: {type: string}, event: {type: string}, cancellation: {type: string}, artifact_binding: {type: string}, evidence: {type: array}}}
  heavy: {type: object, additionalProperties: false, required: [workflow, trigger, coalescing, stale_disposition, cancellation, artifact_authority, evidence], properties: {workflow: {type: string}, trigger: {type: string}, coalescing: {type: string}, stale_disposition: {type: string}, cancellation: {type: string}, artifact_authority: {const: provisional-consumer-reauthenticates-current-origin-main}, evidence: {type: array}}}
  nightly: {type: object, additionalProperties: false, required: [workflow, valid_events, ineligible_events, candidate, evidence], properties: {workflow: {type: string}, valid_events: {type: array}, ineligible_events: {type: array}, candidate: {type: string}, evidence: {type: array}}}
  gr: {type: object, additionalProperties: false, required: [workflow, owner_issue, event, source_workflow, handoff, evidence], properties: {workflow: {type: string}, owner_issue: {const: '#167'}, event: {const: workflow_dispatch-only}, source_workflow: {const: .github/workflows/quality.yml}, handoff: {const: explicit-source-run-and-artifact-id-direct-download}, evidence: {type: array}}}
  terminal_scope: {type: object, additionalProperties: false, required: [workflow, owner_issue, event, source_workflow, handoff, evidence], properties: {workflow: {type: string}, owner_issue: {const: '#179'}, event: {const: workflow_dispatch-only}, source_workflow: {const: .github/workflows/quality.yml}, handoff: {const: explicit-source-run-and-artifact-id-direct-download}, evidence: {type: array}}}
  release: {type: object, additionalProperties: false, required: [workflow, event, candidate_rule, cancellation, composition, current_capability, required_future_inputs], properties: {workflow: {type: string}, event: {type: string}, candidate_rule: {type: string}, cancellation: {type: string}, composition: {type: object}, current_capability: {type: string}, required_future_inputs: {type: array}}}
  legacy: {type: object, additionalProperties: false, required: [workflow, evidence_disposition], properties: {workflow: {type: string}, evidence_disposition: {type: string}}}
