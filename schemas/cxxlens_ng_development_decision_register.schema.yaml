$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-development-decision-register.v2
title: cxxlens development decision and review register v2
type: object
additionalProperties: false
required: [schema, document_version, authority, delivery, review_policy, decisions, preserved_wip]
properties:
  schema: {const: cxxlens.ng-development-decision-register.v2}
  document_version: {const: 2.0.0}
  authority:
    type: object
    additionalProperties: false
    required: [aggregate_owner, release_gate_contract_owner, scope_closure_contract_owner, product_authority, workflow_authority]
    properties:
      aggregate_owner: {const: '#173'}
      release_gate_contract_owner: {const: '#167'}
      scope_closure_contract_owner: {const: '#179'}
      product_authority: {$ref: '#/$defs/repo_path'}
      workflow_authority: {$ref: '#/$defs/repo_path'}
  delivery:
    type: object
    additionalProperties: false
    required: [route, history, review_commit_sequence, pull_request]
    properties:
      route: {const: main-atomic-commit-post-update-ci}
      history: {const: fast-forward-no-rewrite}
      review_commit_sequence: {const: proposed-candidate-exact-review-connected-verification-status-only-acceptance}
      pull_request: {const: optional-review-transport-not-correctness-authority}
  review_policy:
    type: object
    additionalProperties: false
    required: [user_approval_gate, receipt_registry, high_risk, acceptance_binding]
    properties:
      user_approval_gate: {const: none}
      receipt_registry: {const: schemas/cxxlens_ng_development_review_receipts.yaml}
      high_risk:
        type: array
        uniqueItems: true
        minItems: 6
        items: {enum: [contract, invariant, security, compatibility, irreversible, resource-bound]}
      acceptance_binding: {const: exact-candidate-commit-tree-authority-digest-comment-body-reviewer-session-ci-run}
  decisions:
    type: array
    minItems: 8
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, title, owner_issues, risk, contract_ids, choice, rejected, decision_status, authority_status, review, implementation_status, qualification_status, activation, authority_refs]
      properties:
        id: {type: string, pattern: '^decision\.[a-z][a-z0-9.-]+$'}
        title: {type: string, minLength: 1}
        owner_issues: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/issue'}}
        risk: {enum: [local, contract, invariant, security, compatibility, irreversible, resource-bound]}
        contract_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: '^[a-z][a-z0-9_.-]+$'}}
        choice: {type: string, minLength: 1}
        rejected: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        decision_status: {enum: [undecided, decided]}
        authority_status: {enum: [draft, proposed, accepted, superseded]}
        review:
          type: object
          additionalProperties: false
          required: [mode, outcome, author, reviewer, receipt_ids, references]
          properties:
            mode: {enum: [self, independent]}
            outcome: {enum: [pending, rejected, accepted, not-required]}
            author: {type: string, minLength: 1}
            reviewer: {oneOf: [{type: string, minLength: 1}, {type: 'null'}]}
            receipt_ids: {type: array, uniqueItems: true, items: {type: string, pattern: '^review-receipt\.[a-z0-9.-]+\.v[0-9]+$'}}
            references: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
        implementation_status: {enum: [pending, partial, complete]}
        qualification_status: {enum: [not-claimed, pending, qualified]}
        activation: {enum: [active-by-workflow-amendment, blocked-until-accepted-review, inactive-production-fail-closed, active]}
        authority_refs: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/repo_path'}}
  preserved_wip:
    type: array
    minItems: 2
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [ref, exact_head, disposition, deletion]
      properties:
        ref: {type: string, minLength: 1}
        exact_head: {$ref: '#/$defs/hex40'}
        disposition: {enum: [selected-provenance, historical-unreviewed, merged, prunable-registration]}
        deletion: {const: forbidden}
$defs:
  issue: {type: string, pattern: '^#[1-9][0-9]*$'}
  hex40: {type: string, pattern: '^[0-9a-f]{40}$'}
  repo_path: {type: string, pattern: '^(?!/)(?!.*\.\.)(?!.*\\).+'}
