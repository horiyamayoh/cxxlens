relations:
- descriptor_id: build.project.v1
  name: build.project
  version: 1.0.0
  semantic_major: 1
  semantics: build.project/1
  owner_namespace: cxxlens.standard.build
  stability: versioned
  profile: NG0
  summary: Immutable project and catalog authority.
  cpp_projection: installed-static
  generated_cpp_tag: cxxlens::build::relations::project
  claim:
    cardinality: functional_assertion
    key:
    - build.project.v1.project
    condition_policy: claim-envelope-required
    interpretation_required: true
    domain_identity:
      result_column: build.project.v1.project
      projection:
      - build.project.v1.catalog_digest
      - build.project.v1.logical_root
      - build.project.v1.environment_digest
      contract: canonical-binary-tuple-v1
  columns:
  - id: build.project.v1.project
    name: project
    type: typed_id<project_id>
    required: true
    identity_role: claim_key
  - id: build.project.v1.catalog
    name: catalog
    type: typed_id<catalog_id>
    required: true
    identity_role: authoritative_payload
  - id: build.project.v1.catalog_digest
    name: catalog_digest
    type: digest
    required: true
    identity_role: authoritative_payload
  - id: build.project.v1.logical_root
    name: logical_root
    type: typed_id<logical_path_id>
    required: true
    identity_role: authoritative_payload
  - id: build.project.v1.environment_digest
    name: environment_digest
    type: digest
    required: true
    identity_role: authoritative_payload
  references: []
  merge:
    mode: functional_assertion
    conflict_columns:
    - build.project.v1.catalog
    - build.project.v1.catalog_digest
    - build.project.v1.logical_root
    - build.project.v1.environment_digest
  partition:
    suggested_keys:
    - build.project.v1.project
    condition_fragment: envelope
    interpretation_domain: envelope
  indexes:
  - - build.project.v1.catalog
  coverage:
    execution_domain: build.project.catalog
  closure:
    supported_kinds:
    - relation-key-enumeration
  provenance:
    minimum: canonicalization
  evolution_policy: ng0.additive.v1
- descriptor_id: build.compile_unit.v1
  name: build.compile_unit
  version: 1.0.0
  semantic_major: 1
  semantics: build.compile-unit/1
  owner_namespace: cxxlens.standard.build
  stability: versioned
  profile: NG0
  summary: Main source and one effective invocation under an exact variant.
  cpp_projection: installed-static
  generated_cpp_tag: cxxlens::build::relations::compile_unit
  claim:
    cardinality: functional_assertion
    key:
