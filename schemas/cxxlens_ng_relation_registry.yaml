  name: cc.type
  version: 1.4.0
  semantic_major: 1
  semantics: cc.type/1
  owner_namespace: cxxlens.standard.cc
  stability: versioned
  profile: NG0
  summary: Structural type identity with nominal entities breaking recursive cycles and independent original builtin and integer representation facets.
  cpp_projection: installed-static
  generated_cpp_tag: cxxlens::cc::relations::type
  claim:
    cardinality: functional_assertion
    key:
    - cc.type.v1.type
    condition_policy: claim-envelope-required
    interpretation_required: true
    domain_identity:
      result_column: cc.type.v1.type
      projection:
      - cc.type.v1.constructor
      - cc.type.v1.nominal_entity
      - cc.type.v1.component_signature_digest
      - cc.type.v1.qualifiers
      - cc.type.v1.dependent
      contract: canonical-binary-tuple-v1
  columns:
  - id: cc.type.v1.type
    name: type
    type: typed_id<cc_type_id>
    required: true
    identity_role: claim_key
  - id: cc.type.v1.constructor
    name: constructor
    type: open_symbol<cc.type-constructor/1>
    required: true
    identity_role: authoritative_payload
  - id: cc.type.v1.nominal_entity
    name: nominal_entity
    type: optional<typed_id<cc_entity_id>>
    required: false
    identity_role: authoritative_payload
  - id: cc.type.v1.component_signature_digest
    name: component_signature_digest
    type: digest
    required: true
    identity_role: authoritative_payload
  - id: cc.type.v1.qualifiers
    name: qualifiers
    type: set<open_symbol<cc.type-qualifier/1>>
    required: true
    identity_role: authoritative_payload
  - id: cc.type.v1.dependent
    name: dependent
    type: bool
    required: true
    identity_role: authoritative_payload
  - id: cc.type.v1.spelling
    name: spelling
    type: optional<utf8_string>
    required: false
    identity_role: display
  - id: cc.type.v1.structure_profile
    name: structure_profile
    type: optional<utf8_string>
    required: false
    identity_role: authoritative_payload
    semantic: Named compiler structural encoding; never interpret an opaque digest as a type grammar.
  - id: cc.type.v1.structure_preimage
    name: structure_preimage
    type: optional<utf8_string>
    required: false
    identity_role: authoritative_payload
    semantic: Exact input bytes of component_signature_digest under structure_profile; child types remain references to retained type rows.
  - id: cc.type.v1.structure_state
    name: structure_state
    type: optional<open_symbol<cc.type-structure-state/1>>
    required: false
    identity_role: authoritative_payload
    semantic: Complete means the named grammar represents this constructor; partial preserves unsupported or dependent structure without claiming equality.
  - id: cc.type.v1.builtin_kind
    name: builtin_kind
    type: optional<open_symbol<cc.builtin-kind/1>>
    required: false
    identity_role: authoritative_payload
    semantic: Exact Clang22 BuiltinType enum discriminator from the actual canonical compiler type. Bool is distinct from integer widths, aliases, pointer constructors and IntegralToBoolean conversions.
  - id: cc.type.v1.builtin_profile
    name: builtin_profile
    type: optional<utf8_string>
    required: false
    identity_role: authoritative_payload
    semantic: clang22-original-builtin-type/1. Applies only to actual compiler BuiltinType, independently of the opaque structural grammar.
  - id: cc.type.v1.builtin_state
    name: builtin_state
    type: optional<open_symbol<cc.builtin-observation-state/1>>
    required: false
    identity_role: authoritative_payload
    semantic: Complete means actual nondependent nonplaceholder builtin classification. Dependent is unknown, compiler placeholder is partial, unknown compiler discriminator unsupported. Absent legacy facet is unknown and never inferred from spelling, width or structural bytes.
  - id: cc.type.v1.integer_bit_width
    name: integer_bit_width
    type: optional<uint64>
    required: false
    identity_role: authoritative_payload
    semantic: Actual ASTContext::getIntWidth of canonical integer type or compiler-bound enum underlying type, excluding padding bits. Not object sizeof and not a Bool value-domain bound.
  - id: cc.type.v1.integer_signed
    name: integer_signed
    type: optional<bool>
    required: false
    identity_role: authoritative_payload
    semantic: Actual canonical integer representation signedness, including original _BitInt and enum underlying representation. Enum enumerator-domain completeness remains independent.
  - id: cc.type.v1.integer_profile
    name: integer_profile
    type: optional<utf8_string>
    required: false
    identity_role: authoritative_payload
    semantic: clang22-original-integer-representation/1. Reused through original syntax.canonical_type and cast operand_type references; no duplicated expression grammar.
  - id: cc.type.v1.integer_state
    name: integer_state
    type: optional<open_symbol<cc.integer-representation-state/1>>
    required: false
    identity_role: authoritative_payload
    semantic: Complete requires original nondependent integer value width and signedness; noninteger compiler types are not_applicable; dependent/missing enum underlying type is unknown; placeholder partial; unsupported classifier unsupported. Missing legacy facet remains unknown.
  - id: cc.type.v1.integer_underlying_type
    name: integer_underlying_type
    type: optional<typed_id<cc_type_id>>
    required: false
    identity_role: authoritative_payload
    semantic: Actual EnumDecl::getIntegerType canonical association when this original type is enum. No enum value-domain or implicit conversion identity is inferred.
  - id: cc.type.v1.integer_object_bytes
    name: integer_object_bytes
    type: optional<uint64>
    required: false
    identity_role: authoritative_payload
    semantic: Actual original ASTContext::getTypeSizeInChars of an eligible canonical integer or enum object, in original target character storage units; never derived from value width.
  - id: cc.type.v1.integer_storage_profile
    name: integer_storage_profile
    type: optional<utf8_string>
    required: false
    identity_role: authoritative_payload
    semantic: clang22-original-integer-object-storage/1, independently preserving object storage and value representation.
  - id: cc.type.v1.integer_storage_state
    name: integer_storage_state
    type: optional<open_symbol<cc.integer-representation-state/1>>
    required: false
    identity_role: authoritative_payload
    semantic: Complete requires original nondependent complete integer or enum object storage; noninteger not_applicable, incomplete/dependent unknown, placeholder partial. Absent older facts are unobserved.
  - name: enum_fixed_underlying
    type: optional<bool>
    required: false
    id: cc.type.v1.enum_fixed_underlying
    identity_role: authoritative_payload
  - name: enum_value_lower
    type: optional<utf8_string>
    required: false
    id: cc.type.v1.enum_value_lower
    identity_role: authoritative_payload
  - name: enum_value_upper
    type: optional<utf8_string>
    required: false
    id: cc.type.v1.enum_value_upper
    identity_role: authoritative_payload
  - name: enum_value_profile
    type: optional<utf8_string>
    required: false
    id: cc.type.v1.enum_value_profile
    identity_role: authoritative_payload
  - name: enum_value_state
    type: optional<utf8_string>
    required: false
    id: cc.type.v1.enum_value_state
    identity_role: authoritative_payload
  row_constraints:
    all_or_none:
    - - cc.type.v1.integer_storage_profile
      - cc.type.v1.integer_storage_state
    - - cc.type.v1.structure_profile
      - cc.type.v1.structure_preimage
      - cc.type.v1.structure_state
    - - cc.type.v1.builtin_kind
      - cc.type.v1.builtin_profile
