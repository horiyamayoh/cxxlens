    - - cc.type.v1.integer_bit_width
      - cc.type.v1.integer_signed
    - - cc.type.v1.integer_profile
      - cc.type.v1.integer_state
  references:
  - source_columns:
    - cc.type.v1.nominal_entity
    target_relation: cc.entity
    target_columns:
    - cc.entity.v1.entity
    strength: soft_semantic
    on_missing: unresolved
  - source_columns:
