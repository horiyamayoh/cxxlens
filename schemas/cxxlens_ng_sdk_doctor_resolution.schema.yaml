$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens_ng_sdk_doctor_resolution.schema.yaml
title: cxxlens SDK doctor product capability resolution
type: object
additionalProperties: false
required:
  - schema
  - document_version
  - use_case_id
  - consumer
  - question
  - result
  - capability_path
  - missing
  - completion_plan
  - preserved_semantics
properties:
  schema: {const: cxxlens.sdk-doctor-resolution.v1}
  document_version: {const: 1.0.0}
  use_case_id: {$ref: '#/$defs/nonempty_string'}
  consumer: {$ref: '#/$defs/nonempty_string'}
  question: {$ref: '#/$defs/nonempty_string'}
  result:
    type: object
    additionalProperties: false
    required: [state, reason_code, explanation, guarantee]
    properties:
      state: {$ref: '#/$defs/state'}
      reason_code: {$ref: '#/$defs/reason_code'}
      explanation: {$ref: '#/$defs/nonempty_string'}
      guarantee: {$ref: '#/$defs/nonempty_string'}
  capability_path:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, kind, requires, state, reason_code]
      properties:
        id: {$ref: '#/$defs/nonempty_string'}
        kind:
          enum: [input, provider, relation, query, store, recipe]
        requires:
          type: array
          uniqueItems: true
          items: {$ref: '#/$defs/nonempty_string'}
        state: {$ref: '#/$defs/state'}
        reason_code: {$ref: '#/$defs/reason_code'}
  missing:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [capability_id, reason_code, explanation]
      properties:
        capability_id: {$ref: '#/$defs/nonempty_string'}
        reason_code: {$ref: '#/$defs/reason_code'}
        explanation: {$ref: '#/$defs/nonempty_string'}
  completion_plan:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, requires, action, unlocks]
      properties:
        id: {$ref: '#/$defs/nonempty_string'}
        requires:
          type: array
          uniqueItems: true
          items: {$ref: '#/$defs/nonempty_string'}
        action: {$ref: '#/$defs/nonempty_string'}
        unlocks: {$ref: '#/$defs/nonempty_string'}
  preserved_semantics:
    type: object
    additionalProperties: false
    required:
      - closure
      - conflict
      - coverage
      - differential_disagreement
      - guarantee
      - logical_explain
      - physical_explain
      - provenance
      - unresolved
    properties:
      closure: {$ref: '#/$defs/string_list'}
      conflict: {$ref: '#/$defs/string_list'}
      coverage: {$ref: '#/$defs/string_list'}
      differential_disagreement: {$ref: '#/$defs/string_list'}
      guarantee: {$ref: '#/$defs/string_list'}
      logical_explain: {$ref: '#/$defs/string_list'}
      physical_explain: {$ref: '#/$defs/string_list'}
      provenance: {$ref: '#/$defs/string_list'}
      unresolved: {$ref: '#/$defs/string_list'}
$defs:
  nonempty_string:
    type: string
    minLength: 1
  string_list:
    type: array
    uniqueItems: true
    items: {$ref: '#/$defs/nonempty_string'}
  state:
    enum: [proved, disproved, unknown, partial, conflicting]
  reason_code:
    type: string
    pattern: '^doctor\.[a-z0-9-]+$'
