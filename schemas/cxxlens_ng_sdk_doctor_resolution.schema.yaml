$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens_ng_sdk_doctor_resolution.schema.yaml
title: cxxlens SDK doctor product capability resolution
type: object
additionalProperties: false
required:
  - schema
  - document_version
  - catalog_binding
  - use_case_id
  - consumer
  - question
  - result
  - capability_path
  - missing
  - completion_plan
  - preserved_semantics
properties:
  schema: {const: cxxlens.sdk-doctor-resolution.v2}
  document_version: {const: 2.0.0}
  catalog_binding: {$ref: '#/$defs/catalog_binding'}
  use_case_id: {$ref: '#/$defs/id'}
  consumer: {$ref: '#/$defs/id'}
  question: {$ref: '#/$defs/nonempty_string'}
  result:
    type: object
    additionalProperties: false
    required: [state, reason_code, explanation, guarantee]
    properties:
      state: {$ref: '#/$defs/state'}
      reason_code: {$ref: '#/$defs/reason_code'}
      explanation: {$ref: '#/$defs/nonempty_string'}
      guarantee: {$ref: '#/$defs/nonempty_string'}
  capability_path:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, kind, requires, state, reason_code]
      properties:
        id: {$ref: '#/$defs/id'}
        kind: {enum: [input, provider, relation, query, store, recipe]}
        requires:
          type: array
          uniqueItems: true
          items: {$ref: '#/$defs/id'}
        state: {$ref: '#/$defs/state'}
        reason_code: {$ref: '#/$defs/reason_code'}
  missing:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [capability_id, reason_code, explanation]
      properties:
        capability_id: {$ref: '#/$defs/id'}
        reason_code: {$ref: '#/$defs/reason_code'}
        explanation: {$ref: '#/$defs/nonempty_string'}
  completion_plan:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, requires, action, unlocks]
      properties:
        id: {$ref: '#/$defs/id'}
        requires:
          type: array
          uniqueItems: true
          items: {$ref: '#/$defs/id'}
        action: {$ref: '#/$defs/nonempty_string'}
        unlocks: {$ref: '#/$defs/id'}
  preserved_semantics:
    type: object
    additionalProperties: false
    required:
      - closure
      - conflict
      - coverage
      - differential_disagreement
      - guarantee
      - logical_explain
      - physical_explain
      - provenance
      - unresolved
    properties:
      closure: {$ref: '#/$defs/string_list'}
      conflict:
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/conflict'}
      coverage: {$ref: '#/$defs/string_list'}
      differential_disagreement: {$ref: '#/$defs/string_list'}
      guarantee: {$ref: '#/$defs/string_list'}
      logical_explain: {$ref: '#/$defs/string_list'}
      physical_explain: {$ref: '#/$defs/string_list'}
      provenance: {$ref: '#/$defs/string_list'}
      unresolved: {$ref: '#/$defs/string_list'}
allOf:
  - if:
      properties:
        result:
          properties: {state: {const: conflicting}}
          required: [state]
      required: [result]
    then:
      properties:
        result:
          properties:
            reason_code: {const: doctor.conflicting-capability}
        preserved_semantics:
          properties:
            conflict: {minItems: 1}
    else:
      properties:
        preserved_semantics:
          properties:
            conflict: {maxItems: 0}
$defs:
  catalog_binding:
    type: object
    additionalProperties: false
    required: [id, document_version]
    properties:
      id: {const: cxxlens.sdk-doctor-catalog.v1}
      document_version: {const: 1.0.0}
  id:
    type: string
    pattern: '^[a-z][a-z0-9_.-]+$'
  candidate_identity:
    type: string
    pattern: '^semantic-v2:sha256:[0-9a-f]{64}$'
  nonempty_string:
    type: string
    minLength: 1
  string_list:
    type: array
    uniqueItems: true
    items: {$ref: '#/$defs/nonempty_string'}
  state:
    enum: [proved, disproved, unknown, partial, conflicting]
  reason_code:
    type: string
    pattern: '^doctor\.[a-z0-9-]+$'
  conflict:
    type: object
    additionalProperties: false
    required: [capability_id, candidate_ids, reason_code]
    properties:
      capability_id: {$ref: '#/$defs/id'}
      candidate_ids:
        type: array
        minItems: 2
        uniqueItems: true
        items: {$ref: '#/$defs/candidate_identity'}
      reason_code: {const: doctor.conflicting-capability}
