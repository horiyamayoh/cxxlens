$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-ci-supply-chain-contract.v2
title: cxxlens test-only CI supply-chain contract
type: object
additionalProperties: false
required: [schema, kind, document_version, maturity, authority, workflow, dependency_lock, acceptance]
properties:
  schema: {const: cxxlens.ng-ci-supply-chain-contract.v2}
  kind: {const: ci-supply-chain-contract}
  document_version: {const: 2.0.0}
  maturity: {const: implemented}
  authority:
    type: object
    additionalProperties: false
    required: [design, adr, issue]
    properties:
      design: {const: docs/design/cxxlens_next_generation_integrated_design_ja.md}
      adr: {const: docs/design/adr/0072-ci-supply-chain-provenance.md}
      issue: {const: '#141'}
  workflow:
    type: object
    additionalProperties: false
    required: [files, action_revision, runner_label]
    properties:
      files:
        const: [.github/workflows/quality.yml, .github/workflows/release.yml]
      action_revision: {const: full-commit-sha}
      runner_label: {const: ubuntu-24.04}
  dependency_lock:
    type: object
    additionalProperties: false
    required: [requirements, installer_flags, transitive, distributions]
    properties:
      requirements: {const: tools/quality/requirements.lock}
      installer_flags: {const: [--require-hashes, '--only-binary=:all:']}
      transitive: {const: exact-version-and-sha256}
      distributions: {const: binary-only}
  acceptance:
    type: object
    additionalProperties: false
    required: [mutable_action, unpinned_dependency, unavailable_package, operational_artifacts]
    properties:
      mutable_action: {const: reject}
      unpinned_dependency: {const: reject}
      unavailable_package: {const: fail-without-fallback}
      operational_artifacts: {const: forbidden}
