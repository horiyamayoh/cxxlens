$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens_ng_security_profile.schema.yaml
title: Provider execution and input safety requirements
type: object
additionalProperties: false
required: [schema, document_version, maturity, provider_selection, execution, input_validation, analysis_results]
properties:
  schema: {const: cxxlens.security-profile.v1}
  document_version: {const: 2.0.0}
  maturity: {const: accepted}
  provider_selection:
    type: object
    additionalProperties: false
    required: [precedence, identity, protocol, ambiguous_candidates, invalid_explicit_candidate, fallback]
    properties:
      precedence: {type: array, items: {type: string}, uniqueItems: true}
      identity: {type: array, items: {type: string}, uniqueItems: true}
      protocol: {type: string}
      ambiguous_candidates: {const: reject}
      invalid_explicit_candidate: {const: fail-with-reason}
      fallback: {const: explicitly-configured-identities-only}
  execution:
    type: object
    additionalProperties: false
    required: [command, executable, sandbox_assurance, sandbox_minimum, limits, cancellation]
    properties:
      command: {const: argv-without-shell}
      executable: {const: measure-content-before-execution}
      sandbox_assurance: {const: [none, best_effort, enforced]}
      sandbox_minimum: {type: string}
      limits: {type: array, items: {type: string}, uniqueItems: true}
      cancellation: {type: string}
  input_validation:
    type: object
    additionalProperties: false
    required: [encoding, required, malformed_input]
    properties:
      encoding: {type: string}
      required: {type: array, items: {type: string}, uniqueItems: true}
      malformed_input: {const: typed-error-before-publication}
  analysis_results:
    type: object
    additionalProperties: false
    required: [retained]
    properties:
      retained: {type: array, items: {type: string}, uniqueItems: true}
