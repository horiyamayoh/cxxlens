$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-release-evidence-bundle.v1
title: cxxlens authenticated release evidence handoff bundle
description: >-
  A fail-closed, offline-verifiable snapshot of exact producer workflow runs and
  artifacts. Version 1 accepts only first attempts and produces an input handoff
  disposition; it never issues a GR or a production-support claim.
type: object
additionalProperties: false
required:
  - schema
  - document_version
  - contract_id
  - bundle_id
  - generated_at
  - authentication
  - selection_digest
  - candidate
  - roles
  - outcome
  - reason_codes
  - gr_issued
  - production_qualification
properties:
  schema:
    const: cxxlens.ng-release-evidence-bundle.v1
  document_version:
    const: 1.0.0
  contract_id:
    const: development.authenticated-release-evidence-handoff.v1
  bundle_id:
    type: string
    pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
  generated_at:
    type: string
    format: date-time
  authentication:
    $ref: '#/$defs/authentication'
  selection_digest:
    $ref: '#/$defs/digest'
  candidate:
    $ref: '#/$defs/candidate'
  roles:
    type: object
    additionalProperties: false
    required: [heavy, nightly, gr, terminal_scope]
    properties:
      heavy:
        $ref: '#/$defs/heavy_receipt'
      nightly:
        $ref: '#/$defs/nightly_receipt'
      gr:
        $ref: '#/$defs/gr_receipt'
      terminal_scope:
        $ref: '#/$defs/terminal_scope_receipt'
  outcome:
    enum: [qualified-inputs-ready, not-qualified, superseded, evidence-invalid]
  reason_codes:
    type: array
    uniqueItems: true
    items:
      enum:
        - evidence.invalid-selection
        - evidence.repository-drift
        - evidence.workflow-drift
        - evidence.run-drift
        - evidence.attempt-unsupported
        - evidence.event-ineligible
        - evidence.conclusion-not-success
        - evidence.artifact-drift
        - evidence.archive-digest-mismatch
        - evidence.file-set-drift
        - evidence.payload-drift
        - evidence.role-drift
        - evidence.selection-digest-mismatch
        - evidence.role-not-qualified
        - evidence.main-superseded
  gr_issued:
    const: false
  production_qualification:
    const: not-claimed
$defs:
  sha:
    type: string
    pattern: '^[0-9a-f]{40}$'
  digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
  repository_id:
    type: integer
    minimum: 1
  workflow_id:
    type: integer
    minimum: 1
  run_id:
    type: integer
    minimum: 1
  artifact_id:
    type: integer
    minimum: 1
  candidate:
    type: object
    additionalProperties: false
    required: [repository, repository_id, branch, sha, tree]
    properties:
      repository:
        type: string
        pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
      repository_id:
        $ref: '#/$defs/repository_id'
      branch:
        const: main
      sha:
        $ref: '#/$defs/sha'
      tree:
        $ref: '#/$defs/sha'
  authentication:
    type: object
    additionalProperties: false
    required: [provider, metadata_source, attempt_policy, download_policy]
    properties:
      provider:
        const: github-actions
      metadata_source:
        const: github-actions-rest-api
      attempt_policy:
        const: first-attempt-only
      download_policy:
        const: producer-run-artifact-id-direct-download
  run:
    type: object
    additionalProperties: false
    required:
      - repository_id
      - workflow_id
      - run_id
      - run_attempt
      - workflow_path
      - event
      - status
      - conclusion
      - head_sha
      - head_repository_id
      - api_url
      - html_url
      - created_at
      - updated_at
    properties:
      repository_id:
        $ref: '#/$defs/repository_id'
      workflow_id:
        $ref: '#/$defs/workflow_id'
      run_id:
        $ref: '#/$defs/run_id'
      run_attempt:
        const: 1
      workflow_path:
        type: string
        pattern: '^\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml$'
      event:
        type: string
      status:
        const: completed
      conclusion:
        const: success
      head_sha:
        $ref: '#/$defs/sha'
      head_repository_id:
        $ref: '#/$defs/repository_id'
      api_url:
        type: string
        format: uri
      html_url:
        type: string
        format: uri
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  report_file:
    type: object
    additionalProperties: false
    required: [path, schema, digest, byte_count, revision, tree, result]
    properties:
      path:
        type: string
        pattern: '^[^/][^\n\r]*$'
      schema:
        type: string
        minLength: 1
      digest:
        $ref: '#/$defs/digest'
      byte_count:
        type: integer
        minimum: 1
        maximum: 1073741824
      revision:
        $ref: '#/$defs/sha'
      tree:
        $ref: '#/$defs/sha'
      result:
        enum: [passed, qualified, not-qualified, classified-with-gaps, current, superseded]
  artifact:
    type: object
    additionalProperties: false
    required:
      - kind
      - artifact_id
      - name
      - api_url
      - archive_download_url
      - expired
      - size_bytes
      - digest
      - archive_digest
      - download_source
      - downloaded_archive
      - files
    properties:
      kind:
        enum: [quality-report, postflight, evidence-set, gr-report, terminal-scope-report]
      artifact_id:
        $ref: '#/$defs/artifact_id'
      name:
        type: string
        minLength: 1
      api_url:
        type: string
        format: uri
      archive_download_url:
        type: string
        format: uri
      expired:
        const: false
      size_bytes:
        type: integer
        minimum: 1
        maximum: 1073741824
      digest:
        $ref: '#/$defs/digest'
      archive_digest:
        $ref: '#/$defs/digest'
      download_source:
        const: producer-run-artifact-id-direct-download
      downloaded_archive:
        description: Relative path beneath the checker-provided artifact root.
        type: object
        additionalProperties: false
        required: [path]
        properties:
          path:
            type: string
            pattern: '^[^/][^\n\r]*$'
      files:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/report_file'
  base_receipt:
    type: object
    additionalProperties: false
    required: [owner_issue, workflow_path, workflow_id, event, run, artifacts, disposition]
    properties:
      owner_issue:
        type: string
        pattern: '^#[0-9]+$'
      workflow_path:
        type: string
        pattern: '^\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml$'
      workflow_id:
        $ref: '#/$defs/workflow_id'
      event:
        type: string
      run:
        $ref: '#/$defs/run'
      artifacts:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/artifact'
      disposition:
        enum: [qualified, not-qualified]
      input_selection_digest:
        $ref: '#/$defs/digest'
  heavy_receipt:
    allOf:
      - $ref: '#/$defs/base_receipt'
      - type: object
        properties:
          owner_issue:
            const: '#173'
          workflow_path:
            const: .github/workflows/autonomy-heavy.yml
          workflow_id:
            $ref: '#/$defs/workflow_id'
          event:
            const: workflow_run
          artifacts:
            minItems: 2
            maxItems: 2
  nightly_receipt:
    allOf:
      - $ref: '#/$defs/base_receipt'
      - type: object
        properties:
          owner_issue:
            const: '#173'
          workflow_path:
            const: .github/workflows/nightly.yml
          event:
            enum: [schedule, workflow_dispatch]
          artifacts:
            minItems: 1
            maxItems: 1
  gr_receipt:
    allOf:
      - $ref: '#/$defs/base_receipt'
      - type: object
        required: [input_selection_digest]
        properties:
          owner_issue:
            const: '#167'
          workflow_path:
            const: .github/workflows/autonomy-gr.yml
          event:
            const: workflow_dispatch
          artifacts:
            minItems: 1
            maxItems: 1
  terminal_scope_receipt:
    allOf:
      - $ref: '#/$defs/base_receipt'
      - type: object
        required: [input_selection_digest]
        properties:
          owner_issue:
            const: '#179'
          workflow_path:
            const: .github/workflows/autonomy-production-scope.yml
          event:
            const: workflow_dispatch
          artifacts:
            minItems: 1
            maxItems: 1
