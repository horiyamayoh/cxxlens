$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.clang22-materialization-request.v2_2
title: cxxlens installed Clang 22 materialization request v2.2
type: object

# Installed-process authority. The materializer and worker derive their launch environment from
# this contract; they must not reconstruct task or closure identity from an environment substring.
x-cxxlens-identity-domains:
  inherited_request_v2: cxxlens.clang22-materialization-request.v2
  base_claim_row_v1: cxxlens.base-claim-row.v1
x-cxxlens-installed-ingress-contract:
  mode_environment: CXXLENS_PROVIDER_INGRESS_MODE
  mode: task-v4-source-closure-v2
  version: 2.0.0
  fd_roles:
    read:
      environment: CXXLENS_PROVIDER_SOURCE_CLOSURE_READ_FD
      role: host-to-worker-source-closure-input
      fstat: required-before-frame-receive
    write:
      environment: CXXLENS_PROVIDER_SOURCE_CLOSURE_WRITE_FD
      role: worker-to-host-source-closure-ack
      fstat: required-before-frame-receive
  binding_environment:
    session_id: CXXLENS_PROVIDER_SOURCE_CLOSURE_SESSION_ID
    task_id: CXXLENS_PROVIDER_SOURCE_CLOSURE_TASK_ID
    task_v4_digest: CXXLENS_PROVIDER_SOURCE_CLOSURE_TASK_V4_DIGEST
    source_closure_id: CXXLENS_PROVIDER_SOURCE_CLOSURE_ID
    source_closure_digest: CXXLENS_PROVIDER_SOURCE_CLOSURE_DIGEST
    manifest_digest: CXXLENS_PROVIDER_SOURCE_CLOSURE_MANIFEST_DIGEST
    transfer_digest: CXXLENS_PROVIDER_SOURCE_CLOSURE_TRANSFER_DIGEST
    stream_id: CXXLENS_PROVIDER_SOURCE_CLOSURE_STREAM_ID
    first_sequence: CXXLENS_PROVIDER_SOURCE_CLOSURE_FIRST_SEQUENCE
    binding_digest: CXXLENS_PROVIDER_SOURCE_CLOSURE_BINDING_DIGEST
  binding_environment_encoding:
    session_id: provider-session-id
    task_id: task-id
    task_v4_digest: semantic-v2-digest
    source_closure_id: source-closure-id
    source_closure_digest: semantic-v2-digest
    manifest_digest: semantic-v2-digest
    transfer_digest: semantic-v2-digest
    stream_id: uint64-canonical-decimal
    first_sequence: {encoding: uint64-canonical-decimal, exact: 0}
    binding_digest:
      type: process-channel-sha256
      prefix: "process-channel:sha256:"
      hash: sha256
      identity_domain: process-channel
      projection_encoding: cxxlens-canonical-tuple-v1
      fields:
        - {name: mode, kind: utf8_string, exact: task-v4-source-closure-v2}
        - {name: task_id, kind: utf8_string, encoding: task-id}
        - {name: session_id, kind: utf8_string, encoding: provider-session-id}
        - {name: task_v4_digest, kind: utf8_string, encoding: semantic-v2-digest}
        - {name: source_closure_id, kind: utf8_string, encoding: source-closure-id}
        - {name: source_closure_digest, kind: utf8_string, encoding: semantic-v2-digest}
        - {name: manifest_digest, kind: utf8_string, encoding: semantic-v2-digest}
        - {name: transfer_digest, kind: utf8_string, encoding: semantic-v2-digest}
        - {name: stream_id, kind: utf8_string, encoding: uint64-canonical-decimal}
        - {name: first_sequence, kind: utf8_string, encoding: uint64-canonical-decimal}
        - {name: read_descriptor, kind: canonical_integer}
        - {name: write_descriptor, kind: canonical_integer}
        - {name: read_device, kind: utf8_string, encoding: uint64-canonical-decimal}
        - {name: read_inode, kind: utf8_string, encoding: uint64-canonical-decimal}
        - {name: read_mode, kind: utf8_string, encoding: uint32-canonical-decimal}
        - {name: write_device, kind: utf8_string, encoding: uint64-canonical-decimal}
        - {name: write_inode, kind: utf8_string, encoding: uint64-canonical-decimal}
        - {name: write_mode, kind: utf8_string, encoding: uint32-canonical-decimal}
      endpoint_identity:
        read:
          descriptor_environment: CXXLENS_PROVIDER_SOURCE_CLOSURE_READ_FD
          fstat_fields: [read_device, read_inode, read_mode]
        write:
          descriptor_environment: CXXLENS_PROVIDER_SOURCE_CLOSURE_WRITE_FD
          fstat_fields: [write_device, write_inode, write_mode]
  fallback: forbidden
  caller_override: forbidden
  frame_binding:
    manifest_digest: source_closure_manifest_and_ack_metadata
    stream_id: protocol_frame_stream_id
    first_sequence: protocol_frame_sequence_zero
    binding_digest: authenticated_process_binding_digest
  id_binding: exact-value-cross-check; substring-reconstruction-forbidden
additionalProperties: false
required: [schema, request_version, request_id, request_digest, required_features, materialization_request_id, semantic_request_digest, tool, worker, project, registry, engine, interpretation_policy, trust_policy, group_topology, tasks, source_closures, task_extensions, publication]
properties:
  schema: {const: cxxlens.clang22-materialization-request.v2_2}
  request_version: {const: 2.2.0}
  request_id: {type: string, pattern: '^materialization-request:semantic-v2:sha256:[0-9a-f]{64}$'}
  request_digest: {$ref: '#/$defs/semantic_digest'}
  required_features: {const: [task-input-chunks-v2, task-source-closure-v2]}
  materialization_request_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/strong_id}
  semantic_request_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/semantic_digest}
  tool:
    type: object
    additionalProperties: false
    required: [executable, interface_version, distribution_version, source_revision, source_tree, installed_executable_digest, package_configuration, occurrence_manifest_digest]
    properties:
      executable: {const: cxxlens-clang22-materialize}
      interface_version: {const: 2.2.0}
      distribution_version: {const: 1.0.0}
      source_revision: {type: string, pattern: '^[0-9a-f]{40,64}$'}
      source_tree: {type: string, pattern: '^[0-9a-f]{40,64}$'}
      installed_executable_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      package_configuration: {enum: [static, shared]}
      occurrence_manifest_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  worker:
    type: object
    additionalProperties: false
    required: [executable, provider_id, provider_version, installed_binary_digest, semantic_contract_digest, protocol_major, protocol_minor, required_features, sandbox_policy_digest]
    properties:
      executable: {const: cxxlens-clang-worker-22}
      provider_id: {const: cxxlens.clang22.reference}
      provider_version: {const: 1.0.0}
      installed_binary_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/content_digest}
      semantic_contract_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/content_digest}
      protocol_major: {const: 2}
      protocol_minor: {const: 0}
      required_features: {const: [task-input-chunks-v2, task-source-closure-v2]}
      sandbox_policy_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/content_digest}
  project: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/project}
  registry: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/registry}
  engine: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/engine}
  interpretation_policy: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/interpretation_policy}
  trust_policy:
    type: object
    additionalProperties: false
    required: [policy_id, execution_profile, provider_id, provider_version, semantic_contract_digest, protocol_major, protocol_minor, required_features, required_qualification, worker_sandbox_policy_digest, task_sandbox_requirements, trust_policy_digest]
    properties:
      policy_id: {const: cxxlens.clang22-installed-native-worker-trust.v1}
      execution_profile: {const: trust.native-worker}
      provider_id: {const: cxxlens.clang22.reference}
      provider_version: {const: 1.0.0}
      semantic_contract_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/content_digest}
      protocol_major: {const: 2}
      protocol_minor: {const: 0}
      required_features: {const: [task-input-chunks-v2, task-source-closure-v2]}
      required_qualification: {const: canonical-semantic-qualified}
      worker_sandbox_policy_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/content_digest}
      task_sandbox_requirements:
        type: array
        minItems: 1
        maxItems: 4096
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [minimum, policy_digest]
          properties:
            minimum: {enum: [enforced, certified]}
            policy_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/content_digest}
      trust_policy_digest: {$ref: '#/$defs/semantic_digest'}
  group_topology: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/group_topology}
  tasks: {type: array, minItems: 1, maxItems: 4096, uniqueItems: true, items: {$ref: '#/$defs/base_task_without_source_bytes'}}
  source_closures: {type: array, minItems: 1, maxItems: 4096, items: {$ref: '#/$defs/closure'}, x-cxxlens-unique-by: source_closure_id}
  task_extensions: {type: array, minItems: 1, maxItems: 4096, items: {$ref: cxxlens_ng_provider_task_v4.schema.yaml}, x-cxxlens-unique-by: task_id, x-cxxlens-exact-index-binding: tasks}
  publication: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/publication}
$defs:
  semantic_digest: {type: string, pattern: '^semantic-v2:sha256:[0-9a-f]{64}$'}
  source_closure_id: {type: string, pattern: '^source-closure:semantic-v2:sha256:[0-9a-f]{64}$'}
  base_task_without_source_bytes:
    type: object
    additionalProperties: false
    required: [provider_task_id, provider_execution_id, task_input_digest, project_id, catalog_id, catalog_digest, selected_catalog_compile_unit_id, compile_unit_id, build_variant_id, toolchain_context_id, toolchain_digest, toolchain, variant, normalized_invocation_digest, environment_digest, language, working_directory, condition_universe_id, condition_id, interpretation_domain, source, effective_argv, qualified_read_roots, requested_descriptor_ids, dependency_groups, budget, sandbox]
    properties:
      provider_task_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/provider_task_id}
      provider_execution_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/provider_execution_id}
      task_input_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/task_input_digest}
      project_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/project_id}
      catalog_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/catalog_id}
      catalog_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/catalog_digest}
      selected_catalog_compile_unit_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/selected_catalog_compile_unit_id}
      compile_unit_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/compile_unit_id}
      build_variant_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/build_variant_id}
      toolchain_context_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/toolchain_context_id}
      toolchain_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/toolchain_digest}
      toolchain: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/toolchain}
      variant: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/variant}
      normalized_invocation_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/normalized_invocation_digest}
      environment_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/environment_digest}
      language: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/language}
      working_directory: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/working_directory}
      condition_universe_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/condition_universe_id}
      condition_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/condition_id}
      interpretation_domain: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/interpretation_domain}
      source:
        type: object
        additionalProperties: false
        required: [source_snapshot_id, file_id, logical_path, content_digest, size_bytes, encoding, line_index_id, read_only]
        properties:
          source_snapshot_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/strong_id}
          file_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/file_id}
          logical_path: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/logical_path}
          content_digest: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/content_digest}
          size_bytes: {type: integer, minimum: 0, maximum: 16777216}
          encoding: {enum: [utf8, utf16le, utf16be, locale_dependent, binary_or_unknown]}
          line_index_id: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/$defs/line_index_id}
          read_only: {const: true}
      effective_argv: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/effective_argv}
      qualified_read_roots: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/qualified_read_roots}
      requested_descriptor_ids: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/requested_descriptor_ids}
      dependency_groups: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/dependency_groups}
      budget: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/budget}
      sandbox: {$ref: cxxlens_ng_clang22_materialization_request.schema.yaml#/properties/tasks/items/properties/sandbox}
  closure:
    type: object
    additionalProperties: false
    required: [source_closure_id, source_closure_digest, manifest_digest, member_count, blob_count, unique_blob_bytes]
    properties:
      source_closure_id: {$ref: '#/$defs/source_closure_id'}
      source_closure_digest: {$ref: '#/$defs/semantic_digest'}
      manifest_digest: {$ref: '#/$defs/semantic_digest'}
      member_count: {type: integer, minimum: 1, maximum: 4096}
      blob_count: {type: integer, minimum: 1, maximum: 4096}
      unique_blob_bytes: {type: integer, minimum: 0, maximum: 50331648}
description: Complete v2.2 authority is projected at top level. Task source metadata is retained, content bytes are forbidden, Protocol 2.0 is mandatory, and v4 metadata binds closure transport.
