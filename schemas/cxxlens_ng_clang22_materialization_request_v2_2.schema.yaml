$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.clang22-materialization-request.v2_2
title: cxxlens installed Clang 22 materialization request v2.2 authority envelope
type: object
additionalProperties: false
required: [schema, request_version, request_id, request_digest, required_features, base_request_v2_1, source_closures, task_extensions]
properties:
  schema: {const: cxxlens.clang22-materialization-request.v2_2}
  request_version: {const: 2.2.0}
  request_id: {type: string, pattern: '^materialization-request:semantic-v2:sha256:[0-9a-f]{64}$'}
  request_digest: {$ref: '#/$defs/semantic_digest'}
  required_features: {const: [task-input-chunks-v1, task-source-closure-v1]}
  base_request_v2_1:
    $ref: cxxlens_ng_clang22_materialization_request.schema.yaml
    description: Exact complete v2.1 authority; no tool, worker, trust, budget, catalog, topology, task, or publication field is projected away.
  source_closures:
    type: array
    minItems: 1
    maxItems: 4096
    items: {$ref: '#/$defs/closure'}
    x-cxxlens-unique-by: source_closure_id
  task_extensions:
    type: array
    minItems: 1
    maxItems: 4096
    items: {$ref: cxxlens_ng_provider_task_v4.schema.yaml}
    x-cxxlens-unique-by: task_id
    x-cxxlens-exact-index-binding: base_request_v2_1.tasks
$defs:
  content_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  semantic_digest: {type: string, pattern: '^semantic-v2:sha256:[0-9a-f]{64}$'}
  source_closure_id: {type: string, pattern: '^source-closure:semantic-v2:sha256:[0-9a-f]{64}$'}
  closure:
    type: object
    additionalProperties: false
    required: [source_closure_id, source_closure_digest, manifest_digest, member_count, blob_count, unique_blob_bytes]
    properties:
      source_closure_id: {$ref: '#/$defs/source_closure_id'}
      source_closure_digest: {$ref: '#/$defs/semantic_digest'}
      manifest_digest: {$ref: '#/$defs/semantic_digest'}
      member_count: {type: integer, minimum: 1, maximum: 4096}
      blob_count: {type: integer, minimum: 1, maximum: 4096}
      unique_blob_bytes: {type: integer, minimum: 0, maximum: 50331648}
description: Semantic validation requires unique closure/task IDs, exact task-index parity with the nested v2.1 authority, source-closure ID/digest equality, and every task closure reference to resolve exactly once. Blob bytes are forbidden here.
