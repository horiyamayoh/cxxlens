$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens_ng_clang22_materializer_occurrence_manifest.schema.yaml
title: cxxlens installed Clang 22 materializer occurrence manifest
description: >-
  Source-private, co-located occurrence authority for one installed materializer.
  occurrence_payload_digest is recomputed as SHA-256 over canonical JSON of
  every other manifest field; the manifest never inventories its
  own bytes.  The manifest is the sole runtime occurrence authority; package
  prefix checks are performed by direct quality/release tests and are not
  represented by a separate install-artifact witness.  Package-owned runtime
  DSOs are inventoried only for shared packages; external system libraries
  remain toolchain/runtime inputs and are not occurrence-manifest entries. The
  inventory length and tuple positions are not authority: required semantic
  roles occur exactly once, while every additional installed artifact is bound
  by a unique role, unique prefix-relative path, and full SHA-256 digest.
type: object
additionalProperties: false
required:
  - schema
  - manifest_version
  - source_revision
  - source_tree
  - package_configuration
  - files
  - occurrence_payload_digest
properties:
  schema: {const: cxxlens.clang22-materializer-occurrence-manifest.v1}
  manifest_version: {const: 1.0.0}
  source_revision: {$ref: '#/$defs/revision'}
  source_tree: {$ref: '#/$defs/revision'}
  package_configuration: {enum: [static, shared]}
  files:
    type: array
    uniqueItems: true
    items: {$ref: '#/$defs/file'}
  occurrence_payload_digest: {$ref: '#/$defs/digest'}
allOf:
  - if:
      properties: {package_configuration: {const: static}}
      required: [package_configuration]
    then:
      properties:
        files: {$ref: '#/$defs/static_files'}
    else:
      properties:
        files: {$ref: '#/$defs/shared_files'}
$defs:
  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  revision: {type: string, pattern: '^[0-9a-f]{40}$'}
  file:
    type: object
    additionalProperties: false
    required: [role, path, digest]
    properties:
      role: {type: string, pattern: '^[a-z][a-z0-9-]*$', maxLength: 128}
      path:
        type: string
        minLength: 1
        maxLength: 4095
        pattern: '^(?!/)(?!.*(?:^|/)\.\.?(?:/|$))(?!.*//)[^\u0000\\]+$'
      digest: {$ref: '#/$defs/digest'}
  materializer:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: materializer-executable}
          path: {const: bin/cxxlens-clang22-materialize}
        required: [role, path]
  worker:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: worker-executable}
          path: {const: bin/cxxlens-clang-worker-22}
        required: [role, path]
  relation_registry:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: relation-registry}
          path: {const: share/cxxlens/schemas/cxxlens_ng_relation_registry.yaml}
        required: [role, path]
  project_catalog_contract:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: project-catalog-contract}
          path: {const: share/cxxlens/schemas/cxxlens_ng_project_catalog_contract.yaml}
        required: [role, path]
  portable_provider_task_contract:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: portable-provider-task-contract}
          path: {const: share/cxxlens/schemas/cxxlens_ng_portable_provider_task_contract.yaml}
        required: [role, path]
  provider_protocol:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: provider-protocol}
          path: {const: share/cxxlens/schemas/cxxlens_ng_provider_protocol_v2.yaml}
        required: [role, path]
  provider_runtime_contract:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: provider-runtime-contract}
          path: {const: share/cxxlens/schemas/cxxlens_ng_provider_runtime_contract.yaml}
        required: [role, path]
  snapshot_store_contract:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: snapshot-store-contract}
          path: {const: share/cxxlens/schemas/cxxlens_ng_snapshot_store_contract.yaml}
        required: [role, path]
  sqlite_store_contract:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: sqlite-store-contract}
          path: {const: share/cxxlens/schemas/cxxlens_ng_sqlite_store_contract.yaml}
        required: [role, path]
  materialization_contract:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: materialization-contract}
          path: {const: share/cxxlens/schemas/cxxlens_ng_clang22_materialization_contract.yaml}
        required: [role, path]
  materialization_contract_schema:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: materialization-contract-schema}
          path: {const: share/cxxlens/schemas/cxxlens_ng_clang22_materialization_contract.schema.yaml}
        required: [role, path]
  materialization_request_schema:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: materialization-request-schema}
          path: {const: share/cxxlens/schemas/cxxlens_ng_clang22_materialization_request_v2_2.schema.yaml}
        required: [role, path]
  materialization_report_schema:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: materialization-report-schema}
          path: {const: share/cxxlens/schemas/cxxlens_ng_clang22_materialization_report.schema.yaml}
        required: [role, path]
  runtime_base:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: base}
          path: {type: string, pattern: '^(?:lib|lib64)/libcxxlens_base\.so(?:\.[0-9]+)*$'}
        required: [role, path]
  runtime_kernel:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: kernel}
          path: {type: string, pattern: '^(?:lib|lib64)/libcxxlens_kernel\.so(?:\.[0-9]+)*$'}
        required: [role, path]
  runtime_query:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: query}
          path: {type: string, pattern: '^(?:lib|lib64)/libcxxlens_query\.so(?:\.[0-9]+)*$'}
        required: [role, path]
  runtime_recipes:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: recipes}
          path: {type: string, pattern: '^(?:lib|lib64)/libcxxlens_recipes\.so(?:\.[0-9]+)*$'}
        required: [role, path]
  runtime_provider_sdk:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: provider-sdk}
          path: {type: string, pattern: '^(?:lib|lib64)/libcxxlens_sdk\.so(?:\.[0-9]+)*$'}
        required: [role, path]
  runtime_clang22_provider_sdk:
    allOf:
      - {$ref: '#/$defs/file'}
      - properties:
          role: {const: clang22-provider-sdk}
          path: {type: string, pattern: '^(?:lib|lib64)/libcxxlens_clang22_provider_sdk\.so(?:\.[0-9]+)*$'}
        required: [role, path]
  required_semantic_files:
    type: array
    allOf:
      - {contains: {$ref: '#/$defs/materializer'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/worker'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/relation_registry'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/project_catalog_contract'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/portable_provider_task_contract'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/provider_protocol'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/provider_runtime_contract'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/snapshot_store_contract'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/sqlite_store_contract'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/materialization_contract'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/materialization_contract_schema'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/materialization_request_schema'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/materialization_report_schema'}, minContains: 1, maxContains: 1}
  required_runtime_files:
    type: array
    allOf:
      - {contains: {$ref: '#/$defs/runtime_base'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/runtime_kernel'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/runtime_query'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/runtime_recipes'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/runtime_provider_sdk'}, minContains: 1, maxContains: 1}
      - {contains: {$ref: '#/$defs/runtime_clang22_provider_sdk'}, minContains: 1, maxContains: 1}
  static_files:
    allOf:
      - {$ref: '#/$defs/required_semantic_files'}
      - not:
          contains:
            properties:
              path: {pattern: '^(?:lib|lib64)/.*\.so(?:\.[0-9]+)*$'}
            required: [path]
  shared_files:
    allOf:
      - {$ref: '#/$defs/required_semantic_files'}
      - {$ref: '#/$defs/required_runtime_files'}
