$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.provider-ng1-qualification.v1
title: cxxlens NG1 provider exact qualification report
type: object
additionalProperties: false
required:
  - schema
  - document_version
  - authority
  - binding
  - profiles
  - status
properties:
  schema: {const: cxxlens.provider-ng1-qualification.v1}
  document_version: {const: '1.0.0'}
  authority:
    type: object
    additionalProperties: false
    required: [contract, vectors, decision_issue, implementation_issue]
    properties:
      contract: {const: schemas/cxxlens_ng_provider_ng1_hardening.yaml}
      vectors: {const: schemas/cxxlens_ng_provider_ng1_conformance_vectors.yaml}
      decision_issue: {const: '#233'}
      implementation_issue: {const: '#183'}
  binding:
    type: object
    additionalProperties: false
    required:
      - revision
      - tree
      - provider_binary_digest
      - provider_binary_digest_source
      - provider_semantic_contract_digest
      - provider_semantic_contract_digest_source
      - protocol_minor
      - protocol_contract_digest
      - hardening_contract_digest
      - report_schema_digest
      - vectors_digest
      - vectors_schema_digest
    properties:
      revision: {$ref: '#/$defs/revision'}
      tree: {$ref: '#/$defs/revision'}
      provider_binary_digest: {$ref: '#/$defs/digest'}
      provider_binary_digest_source: {const: host-measured-executable-bytes}
      provider_semantic_contract_digest: {$ref: '#/$defs/digest'}
      provider_semantic_contract_digest_source: {const: selected-contract-digest}
      protocol_minor: {const: 1}
      protocol_contract_digest: {$ref: '#/$defs/digest'}
      hardening_contract_digest: {$ref: '#/$defs/digest'}
      report_schema_digest: {$ref: '#/$defs/digest'}
      vectors_digest: {$ref: '#/$defs/digest'}
      vectors_schema_digest: {$ref: '#/$defs/digest'}
  profiles:
    type: array
    minItems: 2
    maxItems: 2
    uniqueItems: true
    items: {$ref: '#/$defs/profile'}
  status: {const: green}
$defs:
  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  revision: {type: string, pattern: '^[0-9a-f]{40}$'}
  profile:
    type: object
    additionalProperties: false
    required: [profile, status, evidence_digest, cases]
    properties:
      profile: {enum: [static, shared]}
      status: {const: green}
      evidence_digest: {$ref: '#/$defs/digest'}
      cases:
        type: array
        minItems: 13
        maxItems: 13
        uniqueItems: true
        items: {$ref: '#/$defs/case'}
  case:
    type: object
    additionalProperties: false
    required: [id, decision]
    properties:
      id: {type: string, pattern: '^[a-z0-9-]+$'}
      decision: {enum: [accepted, rejected, recovery]}
      reason_code: {type: string, pattern: '^provider\.[a-z0-9-]+$'}
      outcome: {type: string, minLength: 1}
    oneOf:
      - required: [id, decision]
        properties:
          decision: {const: accepted}
        not: {anyOf: [{required: [reason_code]}, {required: [outcome]}]}
      - required: [id, decision, reason_code]
        properties:
          decision: {const: rejected}
        not: {required: [outcome]}
      - required: [id, decision, outcome]
        properties:
          decision: {const: recovery}
        not: {required: [reason_code]}
