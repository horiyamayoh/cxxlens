$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens_ng_sdk_doctor_relation_presence.schema.yaml
title: cxxlens SDK doctor product relation presence
type: object
additionalProperties: false
required: [schema, document_version, mode, requested, missing, state, components]
properties:
  schema: {const: cxxlens.sdk-doctor-relation-presence.v1}
  document_version: {const: 1.0.0}
  mode: {const: relation-presence}
  requested:
    type: integer
    minimum: 1
  missing:
    type: integer
    minimum: 0
  state:
    enum: [proved, unknown]
  components:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, state, reason_code]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9_]+(?:\.[a-z0-9_]+)+\.v[0-9]+$'
        state:
          enum: [proved, unknown]
        reason_code:
          type: string
          pattern: '^(none|sdk\.[a-z0-9-]+)$'
