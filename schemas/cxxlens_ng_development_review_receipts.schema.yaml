$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-development-review-receipts.v1
title: cxxlens authenticated development review receipts
type: object
additionalProperties: false
required: [schema, document_version, repository, receipts]
properties:
  schema: {const: cxxlens.ng-development-review-receipts.v1}
  document_version: {const: 1.0.0}
  repository: {const: horiyamayoh/cxxlens}
  receipts:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, decision_id, owner_issue, candidate_commit, candidate_tree, candidate_git_author_email, candidate_github_login, authority_files, authority_digest, comment_url, comment_body_sha256, comment_author_login, author, reviewer, reviewer_github_login, reviewer_provenance, reviewer_session, reviewer_invocation, reviewer_context_sha256, review_output, review_output_sha256, verdict, findings, finding_ids, verification_limits, connected_verification, acceptance]
      properties:
        id: {type: string, pattern: '^review-receipt\.[a-z0-9.-]+\.v[0-9]+$'}
        decision_id: {type: string, pattern: '^decision\.[a-z][a-z0-9.-]+$'}
        owner_issue: {type: string, pattern: '^#[1-9][0-9]*$'}
        candidate_commit: {$ref: '#/$defs/hex40'}
        candidate_tree: {$ref: '#/$defs/hex40'}
        candidate_git_author_email: {type: string, pattern: '^[^@\s]+@[^@\s]+$'}
        candidate_github_login: {type: string, pattern: '^[A-Za-z0-9-]+$'}
        authority_files:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [path, blob]
            properties: {path: {$ref: '#/$defs/repo_path'}, blob: {$ref: '#/$defs/hex40'}}
        authority_digest: {$ref: '#/$defs/digest'}
        comment_url: {type: string, pattern: '^https://github\.com/horiyamayoh/cxxlens/issues/[1-9][0-9]*#issuecomment-[1-9][0-9]*$'}
        comment_body_sha256: {$ref: '#/$defs/digest'}
        comment_author_login: {type: string, pattern: '^[A-Za-z0-9-]+$'}
        author: {type: string, minLength: 1}
        reviewer: {type: string, pattern: '^codex-independent-[a-z0-9-]+$'}
        reviewer_github_login: {type: string, pattern: '^[A-Za-z0-9-]+$'}
        reviewer_provenance: {const: isolated-read-only-codex-exec}
        reviewer_session: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
        reviewer_invocation: {const: codex-exec-ephemeral-sandbox-read-only}
        reviewer_context_sha256: {$ref: '#/$defs/digest'}
        review_output: {type: string, minLength: 1, maxLength: 60000}
        review_output_sha256: {$ref: '#/$defs/digest'}
        verdict: {enum: [accepted, rejected]}
        findings:
          type: object
          additionalProperties: false
          required: [p0, p1, p2]
          properties: {p0: {type: integer, minimum: 0}, p1: {type: integer, minimum: 0}, p2: {type: integer, minimum: 0}}
        finding_ids: {type: array, uniqueItems: true, items: {type: string, pattern: '^P[0-2]-[A-Z0-9-]+$'}}
        verification_limits: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        connected_verification:
          type: object
          additionalProperties: false
          required: [status, run_id, run_url, run_commit, workflow_id, workflow_path, workflow_name, event, conclusion]
          properties:
            status: {enum: [pending, verified]}
            run_id: {oneOf: [{type: integer, minimum: 1}, {type: 'null'}]}
            run_url: {oneOf: [{type: string, pattern: '^https://github\.com/horiyamayoh/cxxlens/actions/runs/[1-9][0-9]*$'}, {type: 'null'}]}
            run_commit: {oneOf: [{$ref: '#/$defs/hex40'}, {type: 'null'}]}
            workflow_id: {oneOf: [{type: integer, minimum: 1}, {type: 'null'}]}
            workflow_path: {enum: [.github/workflows/autonomy-fast.yml, pending]}
            workflow_name: {enum: [Autonomy fast, pending]}
            event: {enum: [push, pending]}
            conclusion: {enum: [pending, success]}
        acceptance:
          type: object
          additionalProperties: false
          required: [status, derivation, allowed_changed_paths]
          properties:
            status: {enum: [not-applicable, pending, committed]}
            derivation: {enum: [not-applicable, first-descendant-containing-receipt]}
            allowed_changed_paths: {type: array, uniqueItems: true, items: {$ref: '#/$defs/repo_path'}}
$defs:
  hex40: {type: string, pattern: '^[0-9a-f]{40}$'}
  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  repo_path: {type: string, pattern: '^(?!/)(?!.*\.\.)(?!.*\\).+'}
