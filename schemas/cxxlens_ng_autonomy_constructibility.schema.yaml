$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-autonomy-constructibility.v1
title: cxxlens remaining high-risk constructibility witness
type: object
additionalProperties: false
required: [schema, document_version, production_activation, machines, counterexample_sets]
properties:
  schema: {const: cxxlens.ng-autonomy-constructibility.v1}
  document_version: {const: 1.0.0}
  production_activation: {const: prohibited}
  machines:
    type: object
    additionalProperties: false
    required: [source_closure, store_candidate_report, sqlite_read_mapping, sqlite_normalization_effect]
    properties:
      source_closure: {$ref: '#/$defs/source_machine'}
      store_candidate_report: {$ref: '#/$defs/store_machine'}
      sqlite_read_mapping: {$ref: '#/$defs/sqlite_mapping_machine'}
      sqlite_normalization_effect: {$ref: '#/$defs/sqlite_effect_machine'}
  counterexample_sets:
    type: object
    additionalProperties: false
    required: [source_closure, store_candidate_report, sqlite_read_mapping, sqlite_normalization_effect]
    properties:
      source_closure: {$ref: '#/$defs/nonempty_strings'}
      store_candidate_report: {$ref: '#/$defs/nonempty_strings'}
      sqlite_read_mapping: {$ref: '#/$defs/nonempty_strings'}
      sqlite_normalization_effect: {$ref: '#/$defs/nonempty_strings'}
$defs:
  source_machine:
    type: object
    additionalProperties: false
    required: [owner, authority, contract, success_states, message_ids, bounds, terminal_failures]
    properties: {owner: {}, authority: {}, contract: {}, success_states: {}, message_ids: {}, bounds: {}, terminal_failures: {}}
  store_machine:
    type: object
    additionalProperties: false
    required: [owner, authority, candidate_states, report_states, publication_outcomes, post_attempt_failure, projections, bounds, representation]
    properties: {owner: {}, authority: {}, candidate_states: {}, report_states: {}, publication_outcomes: {}, post_attempt_failure: {}, projections: {}, bounds: {}, representation: {}}
  sqlite_mapping_machine:
    type: object
    additionalProperties: false
    required: [owners, authority, nesting, no_effect_boundary, outer_states, writer_states, reader_states, reader_forbidden_products, predelegation_authority, promotion_predicate, teardown_transition_graph, zero_effect_receipt, read_receipt_barrier, fork_transition_graph, child_quarantine_forbidden, ambiguous_callback]
    properties: {owners: {}, authority: {}, nesting: {}, no_effect_boundary: {}, outer_states: {}, writer_states: {}, reader_states: {}, reader_forbidden_products: {}, predelegation_authority: {}, promotion_predicate: {}, teardown_transition_graph: {}, zero_effect_receipt: {}, read_receipt_barrier: {}, fork_transition_graph: {}, child_quarantine_forbidden: {}, ambiguous_callback: {}}
  sqlite_effect_machine:
    type: object
    additionalProperties: false
    required: [owner, authority, separate_from_zero_effect_read, entry, states, fixture_partition_machine, recrash_transition, production_profile, canonical_user_source_activation, parent_sync_after_each_delete]
    properties: {owner: {}, authority: {}, separate_from_zero_effect_read: {}, entry: {}, states: {}, fixture_partition_machine: {}, recrash_transition: {}, production_profile: {}, canonical_user_source_activation: {}, parent_sync_after_each_delete: {}}
  nonempty_strings: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
