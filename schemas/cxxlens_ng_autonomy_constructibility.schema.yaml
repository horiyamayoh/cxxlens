$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-autonomy-constructibility.v1
title: cxxlens remaining high-risk constructibility witness
type: object
additionalProperties: false
required: [schema, document_version, production_activation, machines, counterexample_sets]
properties:
  schema: {const: cxxlens.ng-autonomy-constructibility.v1}
  document_version: {const: 1.0.0}
  production_activation: {const: prohibited}
  machines:
    type: object
    additionalProperties: false
    required: [source_closure, store_candidate_report, sqlite_read_mapping, sqlite_normalization_effect]
    properties:
      source_closure: {$ref: '#/$defs/source_machine'}
      store_candidate_report: {$ref: '#/$defs/store_machine'}
      sqlite_read_mapping: {$ref: '#/$defs/sqlite_mapping_machine'}
      sqlite_normalization_effect: {$ref: '#/$defs/sqlite_effect_machine'}
  counterexample_sets:
    type: object
    additionalProperties: false
    required: [source_closure, store_candidate_report, sqlite_read_mapping, sqlite_normalization_effect]
    properties:
      source_closure: {$ref: '#/$defs/nonempty_strings'}
      store_candidate_report: {$ref: '#/$defs/nonempty_strings'}
      sqlite_read_mapping: {$ref: '#/$defs/nonempty_strings'}
      sqlite_normalization_effect: {$ref: '#/$defs/nonempty_strings'}
$defs:
  source_machine:
    type: object
    additionalProperties: false
    required: [owner, authority, contract, success_states, message_ids, bounds, terminal_failures]
    properties: {owner: {type: string}, authority: {type: string}, contract: {type: string}, success_states: {$ref: '#/$defs/nonempty_strings'}, message_ids: {type: object}, bounds: {type: object}, terminal_failures: {$ref: '#/$defs/nonempty_strings'}}
  store_machine:
    type: object
    additionalProperties: false
    required: [owner, authority, candidate_states, report_states, candidate_transition_graph, report_transition_graph, attempt_coupling, publication_outcomes, outcome_policy, post_attempt_failure, projections, retention_roles, bounds, representation]
    properties: {owner: {type: string}, authority: {type: string}, candidate_states: {$ref: '#/$defs/nonempty_strings'}, report_states: {$ref: '#/$defs/nonempty_strings'}, candidate_transition_graph: {$ref: '#/$defs/closed_graph'}, report_transition_graph: {$ref: '#/$defs/closed_graph'}, attempt_coupling: {type: object}, publication_outcomes: {$ref: '#/$defs/nonempty_strings'}, outcome_policy: {type: object, minProperties: 6, maxProperties: 6}, post_attempt_failure: {type: string}, projections: {type: object}, retention_roles: {$ref: '#/$defs/nonempty_strings'}, bounds: {type: object}, representation: {type: object}}
  sqlite_mapping_machine:
    type: object
    additionalProperties: false
    required: [owners, authority, contract_ids, nesting, no_effect_boundary, outer_effect_boundary, outer_states, outer_transition_graph, writer_states, reader_states, reader_forbidden_products, predelegation_authority, writer_effect_profile, promotion_predicate, reader_promotion_predicate, teardown_transition_graph, reader_teardown_transition_graph, retirement_join, outer_custody_kinds, outer_join_terminal_profiles, outer_join_receipt_profile, zero_effect_receipt, read_receipt_barrier, fork_transition_graph, child_quarantine_forbidden, ambiguous_callback, revocation_events, unload_transition_graph, production_activation_predicate]
    properties: {owners: {$ref: '#/$defs/nonempty_strings'}, authority: {type: string}, contract_ids: {type: object, additionalProperties: false, required: [active_read, writer_generation, reader_attachment, nested_mapping_terminal, logical_read], properties: {active_read: {type: string, pattern: '^[a-z][a-z0-9_.-]+$'}, writer_generation: {type: string, pattern: '^[a-z][a-z0-9_.-]+$'}, reader_attachment: {type: string, pattern: '^[a-z][a-z0-9_.-]+$'}, nested_mapping_terminal: {type: string, pattern: '^[a-z][a-z0-9_.-]+$'}, logical_read: {type: string, pattern: '^[a-z][a-z0-9_.-]+$'}}}, nesting: {type: string}, no_effect_boundary: {type: string}, outer_effect_boundary: {type: object, additionalProperties: false, required: [outer_receipt, writer_effect_disposition, writer_terminal_disposition], properties: {outer_receipt: {type: string}, writer_effect_disposition: {type: string}, writer_terminal_disposition: {type: string}}}, outer_states: {$ref: '#/$defs/nonempty_strings'}, outer_transition_graph: {$ref: '#/$defs/closed_graph'}, writer_states: {$ref: '#/$defs/nonempty_strings'}, reader_states: {$ref: '#/$defs/nonempty_strings'}, reader_forbidden_products: {$ref: '#/$defs/nonempty_strings'}, predelegation_authority: {type: object}, writer_effect_profile: {type: object, additionalProperties: false, required: [writer_receipt, reader_receipt, allowed_extend_pairs, no_effect_pair, gated_effect_pair, rejected_extend_pairs, effect_gate, gated_effect_scope], properties: {writer_receipt: {type: string}, reader_receipt: {type: string}, allowed_extend_pairs: {$ref: '#/$defs/nonempty_strings'}, no_effect_pair: {type: string}, gated_effect_pair: {type: string}, rejected_extend_pairs: {$ref: '#/$defs/nonempty_strings'}, effect_gate: {type: string}, gated_effect_scope: {type: string}}}, promotion_predicate: {type: string}, reader_promotion_predicate: {type: string}, teardown_transition_graph: {$ref: '#/$defs/closed_graph'}, reader_teardown_transition_graph: {$ref: '#/$defs/closed_graph'}, retirement_join: {type: object, additionalProperties: false, required: [writer_terminal, reader_terminal, scope, pending, join, writer_census, reader_census, unrelated_writers, forbidden], properties: {writer_terminal: {type: string}, reader_terminal: {type: string}, scope: {type: string}, pending: {type: string}, join: {type: string}, writer_census: {type: string}, reader_census: {type: string}, unrelated_writers: {type: string}, forbidden: {type: string}}}, outer_custody_kinds: {$ref: '#/$defs/nonempty_strings'}, outer_join_terminal_profiles: {type: object}, outer_join_receipt_profile: {type: object}, zero_effect_receipt: {$ref: '#/$defs/nonempty_strings'}, read_receipt_barrier: {$ref: '#/$defs/nonempty_strings'}, fork_transition_graph: {$ref: '#/$defs/closed_graph'}, child_quarantine_forbidden: {$ref: '#/$defs/nonempty_strings'}, ambiguous_callback: {type: string}, revocation_events: {type: object}, unload_transition_graph: {$ref: '#/$defs/closed_graph'}, production_activation_predicate: {$ref: '#/$defs/nonempty_strings'}}
  sqlite_effect_machine:
    type: object
    additionalProperties: false
    required: [owner, authority, separate_from_zero_effect_read, entry, entry_source_state, states, transition_graph, interruption_edges, admission_guard, cold_family_routes, fixture_partition_machine, recrash_transition, production_activation_predicate, canonical_user_source_activation, parent_sync_after_each_delete]
    properties: {owner: {type: string}, authority: {type: string}, separate_from_zero_effect_read: {type: boolean}, entry: {type: string}, entry_source_state: {const: logical-read-receipt}, states: {$ref: '#/$defs/nonempty_strings'}, transition_graph: {$ref: '#/$defs/closed_graph'}, interruption_edges: {type: object}, admission_guard: {type: object}, cold_family_routes: {type: object}, fixture_partition_machine: {type: object, minProperties: 7, maxProperties: 7, additionalProperties: {$ref: '#/$defs/effect_family'}}, recrash_transition: {type: string}, production_activation_predicate: {$ref: '#/$defs/nonempty_strings'}, canonical_user_source_activation: {type: string}, parent_sync_after_each_delete: {type: string}}
  effect_family:
    type: object
    additionalProperties: false
    required: [entry_guard, route, recrash_graph, success_dominators, terminal]
    properties:
      entry_guard: {enum: [exact-pre-no-sidecar, exact-pre-nonhot-journal-prefix, valid-hot-journal-with-exact-preimages, exact-pre-plus-size-zero-WAL, journal-preimages-exact-pre-and-deterministic-post-plus-invalidated-journal, exact-post-plus-size-zero-WAL, complete-valid-rollback-exact-empty-current-main-no-sidecar]}
      route: {type: array, minItems: 1, uniqueItems: true, items: {enum: [live-receipt, fixture-normalizer, authenticated-cleanup-or-recovery, independently-revalidated-F0, new-live-receipt, retain-and-revalidate-exact-size-zero-coordination-WAL, fixture-normalizer-with-same-coordination-WAL, authenticated-coordination-WAL-delete, retained-parent-fsync, journal-created-and-parent-fsynced, valid-journal-and-main-write, terminal-journal-delete-and-parent-fsynced, confirmed-close, post-close-census, normalization-receipt, independently-validated-rollback-empty-fresh-anchor, authenticated-size-zero-WAL-delete]}}
      recrash_graph: {const: [pre-effect-to-effect-admitted, effect-admitted-to-recoverable-interruption-or-live-terminal, recoverable-interruption-to-recrash-classified, recrash-classified-to-reenter-seven-family-classifier, reclassified-family-authority-only-no-original-success]}
      success_dominators: {type: array, minItems: 1, uniqueItems: true, items: {enum: [confirmed-close, post-close-census, authenticated-cleanup-or-recovery, parent-fsync, authenticated-coordination-WAL-delete, retained-parent-fsync, independently-revalidated-F0, new-live-receipt, fixture-normalizer, fixture-normalizer-with-same-coordination-WAL, journal-created-and-parent-fsynced, valid-journal-and-main-write, terminal-journal-delete-and-parent-fsynced, independently-validated-rollback-empty-fresh-anchor, authenticated-size-zero-WAL-delete]}}
      terminal: {enum: [normalization-receipt, fresh-anchor-only-never-completed-edge]}
  closed_graph:
    type: object
    minProperties: 6
    additionalProperties:
      oneOf:
        - {type: string, minLength: 1}
        - {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
  nonempty_strings: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
