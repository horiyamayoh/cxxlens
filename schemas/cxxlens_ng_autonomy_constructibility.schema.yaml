$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-autonomy-constructibility.v1
title: cxxlens remaining high-risk constructibility witness
type: object
additionalProperties: false
required: [schema, document_version, production_activation, machines, counterexample_sets]
properties:
  schema: {const: cxxlens.ng-autonomy-constructibility.v1}
  document_version: {const: 1.0.0}
  production_activation: {const: prohibited}
  machines:
    type: object
    additionalProperties: false
    required: [source_closure, store_candidate_report, sqlite_read_mapping, sqlite_normalization_effect]
    properties:
      source_closure: {$ref: '#/$defs/source_machine'}
      store_candidate_report: {$ref: '#/$defs/store_machine'}
      sqlite_read_mapping: {$ref: '#/$defs/sqlite_mapping_machine'}
      sqlite_normalization_effect: {$ref: '#/$defs/sqlite_effect_machine'}
  counterexample_sets:
    type: object
    additionalProperties: false
    required: [source_closure, store_candidate_report, sqlite_read_mapping, sqlite_normalization_effect]
    properties:
      source_closure: {$ref: '#/$defs/nonempty_strings'}
      store_candidate_report: {$ref: '#/$defs/nonempty_strings'}
      sqlite_read_mapping: {$ref: '#/$defs/nonempty_strings'}
      sqlite_normalization_effect: {$ref: '#/$defs/nonempty_strings'}
$defs:
  source_machine:
    type: object
    additionalProperties: false
    required: [owner, authority, contract, success_states, message_ids, bounds, terminal_failures]
    properties: {owner: {type: string}, authority: {type: string}, contract: {type: string}, success_states: {$ref: '#/$defs/nonempty_strings'}, message_ids: {type: object}, bounds: {type: object}, terminal_failures: {$ref: '#/$defs/nonempty_strings'}}
  store_machine:
    type: object
    additionalProperties: false
    required: [owner, authority, candidate_states, report_states, publication_outcomes, post_attempt_failure, projections, bounds, representation]
    properties: {owner: {type: string}, authority: {type: string}, candidate_states: {$ref: '#/$defs/nonempty_strings'}, report_states: {$ref: '#/$defs/nonempty_strings'}, publication_outcomes: {$ref: '#/$defs/nonempty_strings'}, post_attempt_failure: {type: string}, projections: {type: object}, bounds: {type: object}, representation: {type: object}}
  sqlite_mapping_machine:
    type: object
    additionalProperties: false
    required: [owners, authority, nesting, no_effect_boundary, outer_states, writer_states, reader_states, reader_forbidden_products, predelegation_authority, promotion_predicate, teardown_transition_graph, reader_teardown_transition_graph, zero_effect_receipt, read_receipt_barrier, fork_transition_graph, child_quarantine_forbidden, ambiguous_callback, production_activation_predicate]
    properties: {owners: {$ref: '#/$defs/nonempty_strings'}, authority: {type: string}, nesting: {type: string}, no_effect_boundary: {type: string}, outer_states: {$ref: '#/$defs/nonempty_strings'}, writer_states: {$ref: '#/$defs/nonempty_strings'}, reader_states: {$ref: '#/$defs/nonempty_strings'}, reader_forbidden_products: {$ref: '#/$defs/nonempty_strings'}, predelegation_authority: {type: object}, promotion_predicate: {type: string}, teardown_transition_graph: {$ref: '#/$defs/closed_graph'}, reader_teardown_transition_graph: {$ref: '#/$defs/closed_graph'}, zero_effect_receipt: {$ref: '#/$defs/nonempty_strings'}, read_receipt_barrier: {$ref: '#/$defs/nonempty_strings'}, fork_transition_graph: {$ref: '#/$defs/closed_graph'}, child_quarantine_forbidden: {$ref: '#/$defs/nonempty_strings'}, ambiguous_callback: {type: string}, production_activation_predicate: {$ref: '#/$defs/nonempty_strings'}}
  sqlite_effect_machine:
    type: object
    additionalProperties: false
    required: [owner, authority, separate_from_zero_effect_read, entry, states, fixture_partition_machine, recrash_transition, production_activation_predicate, canonical_user_source_activation, parent_sync_after_each_delete]
    properties: {owner: {type: string}, authority: {type: string}, separate_from_zero_effect_read: {type: boolean}, entry: {type: string}, states: {$ref: '#/$defs/nonempty_strings'}, fixture_partition_machine: {type: object, minProperties: 7, maxProperties: 7, additionalProperties: {$ref: '#/$defs/effect_family'}}, recrash_transition: {type: string}, production_activation_predicate: {$ref: '#/$defs/nonempty_strings'}, canonical_user_source_activation: {type: string}, parent_sync_after_each_delete: {type: string}}
  effect_family:
    type: object
    additionalProperties: false
    required: [entry_guard, route, recrash_graph, success_dominators, terminal]
    properties:
      entry_guard: {enum: [exact-pre-no-sidecar, exact-pre-nonhot-journal-prefix, valid-hot-journal-with-exact-preimages, exact-pre-plus-size-zero-WAL, journal-preimages-exact-pre-and-deterministic-post-plus-invalidated-journal, exact-post-plus-size-zero-WAL, complete-valid-rollback-exact-empty-current-main-no-sidecar]}
      route: {type: array, minItems: 1, uniqueItems: true, items: {enum: [live-receipt, fixture-normalizer, authenticated-cleanup-or-recovery, independently-revalidated-F0, new-live-receipt, retain-and-revalidate-exact-size-zero-coordination-WAL, new-live-receipt-bound-to-same-WAL, authenticated-coordination-WAL-delete, retained-parent-fsync, independently-validated-rollback-empty-fresh-anchor, authenticated-size-zero-WAL-delete]}}
      recrash_graph: {const: [pre-effect-to-effect-admitted, effect-admitted-to-recoverable-interruption-or-live-terminal, recoverable-interruption-to-recrash-classified, recrash-classified-to-reenter-seven-family-classifier, reclassified-family-authority-only-no-original-success]}
      success_dominators: {type: array, minItems: 1, uniqueItems: true, items: {enum: [confirmed-close, post-close-census, authenticated-cleanup-or-recovery, parent-fsync, authenticated-coordination-WAL-delete, retained-parent-fsync, independently-validated-rollback-empty-fresh-anchor, authenticated-size-zero-WAL-delete]}}
      terminal: {enum: [normalization-receipt, fresh-anchor-only-never-completed-edge]}
  closed_graph:
    type: object
    minProperties: 6
    additionalProperties:
      oneOf:
        - {type: string, minLength: 1}
        - {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
  nonempty_strings: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
