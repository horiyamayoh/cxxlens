$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.support-matrix.v2
title: cxxlens supported environment table
type: object
additionalProperties: false
required: [schema, entries]
properties:
  schema:
    const: cxxlens.support-matrix.v2
  entries:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [release_version, surface, os, architecture,
                 compiler_provider_major, linkage]
      properties:
        release_version:
          type: string
          pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
        surface:
          type: string
          pattern: '^[a-z][a-z0-9.-]+$'
        os:
          type: string
          pattern: '^[a-z][a-z0-9.-]+$'
        architecture:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]+$'
        compiler_provider_major:
          type: string
          pattern: '^[a-z][a-z0-9.-]+$'
        linkage:
          enum: [static, shared]
