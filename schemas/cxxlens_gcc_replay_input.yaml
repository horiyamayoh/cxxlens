schema: cxxlens.gcc-replay-input.v1
document_version: 1.0.0
maturity: experimental
encoding: cxxlens-canonical-tuple-v1
purpose: Exact host-to-worker input for one validated GCC capture replay plan.
authority:
  producer: linux-application-analysis-host
  consumer: clang23-gcc-replay-worker
  not_authoritative_for: [provider-trust, relation-registry, store-publication]
root_tuple:
  - {index: 0, name: schema, type: string, const: cxxlens.gcc-replay-input.v1}
  - {index: 1, name: imported_project_id, type: strong-id}
  - {index: 2, name: capture_bundle_digest, type: digest}
  - {index: 3, name: replay_plan_digest, type: digest}
  - {index: 4, name: compile_unit_id, type: strong-id}
  - {index: 5, name: analysis_frontend, type: string, const: clang-23.1.0-gcc-mode}
  - {index: 6, name: target_abi, type: string, const: x86_64-linux-gnu}
  - {index: 7, name: effective_argv, type: ordered-tuple-of-string}
  - {index: 8, name: source_closure_digest, type: digest}
  - {index: 9, name: source_members, type: ordered-tuple-of-source-member}
  - {index: 10, name: requested_relations, type: sorted-unique-tuple-of-relation-descriptor-id}
  - {index: 11, name: interpretation, type: strong-id}
  - {index: 12, name: unresolved, type: sorted-unique-tuple-of-unresolved}
source_member_tuple:
  fields:
    - {index: 0, name: logical_path, type: logical-project-path}
    - {index: 1, name: content_digest, type: digest}
    - {index: 2, name: content, type: bytes}
    - {index: 3, name: role, type: enum, values: [main, header, generated, forced-include, macro-file]}
unresolved_tuple:
  fields:
    - {index: 0, name: field, type: string}
    - {index: 1, name: state, type: string}
    - {index: 2, name: reason, type: string}
    - {index: 3, name: completion_action, type: string}
invariants:
  - input-digest-is-the-content-digest-of-the-complete-canonical-root
  - replay-plan-digest-binds-effective-argv-source-closure-and-unresolved
  - source-member-content-size-and-digest-are-revalidated-before-worker-use
  - logical-paths-are-project-rooted-canonical-and-unique
  - requested-relations-are-host-authority-and-not-inferred-by-the-worker
  - unresolved-is-retained-and-never-promoted-to-exact-by-parse-success
  - no-machine-local-root-environment-pid-or-timestamp-is-encoded
bounds:
  input_bytes: 67108864
  arguments: 4096
  source_members: 4096
  source_bytes: 50331648
  requested_relations: 4096
  unresolved: 10000
  string_bytes: 4096
  nesting_depth: 32
