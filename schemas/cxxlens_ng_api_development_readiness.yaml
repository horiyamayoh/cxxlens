schema: cxxlens.ng-api-development-readiness.v1
document_version: 1.4.0
maturity: implemented
authority:
  design: docs/design/cxxlens_next_generation_integrated_design_ja.md
  adr: docs/design/adr/0089-high-level-author-sdk-and-wave0-readiness.md
  owner_issue: '#168'
  foundation_issue: '#165'
  callable_inventory_issue: '#169'
  product_direction_issue: '#271'
binding:
  branch: main
  report_schema: cxxlens.ng-api-development-readiness-report.v1
  report_artifact: cxxlens-ng-api-development-readiness-${revision}
target_contract:
  authority: schemas/cxxlens_ng_release_bundle.yaml
  provider_sdk_role: high-level-author-sdk
  direct_dependencies:
    cxxlens::base: []
    cxxlens::kernel: [cxxlens::base]
    cxxlens::query: [cxxlens::kernel]
    cxxlens::cpp: [cxxlens::query]
    cxxlens::recipes: [cxxlens::query]
    cxxlens::cxxlens: [cxxlens::base, cxxlens::kernel, cxxlens::query, cxxlens::cpp]
    cxxlens::provider_sdk: [cxxlens::cxxlens, cxxlens::recipes]
product_direction:
  contract: product.direction.semantic-knowledge-platform.v1
  owner_issue: '#271'
  mission: compiler-observations-to-reproducible-queryable-evidence-backed-semantic-knowledge-with-actionable-missing-prerequisites
  product_class: semantic-knowledge-control-plane
  non_goal: clang-ast-wrapper-or-public-surface-count-maximizer
  closure:
    supply_side: every-admitted-public-surface-has-contract-implementation-and-evidence
    demand_side: every-admitted-use-case-has-an-executable-capability-path-or-explicit-tracked-gap
    complete: no-orphan-public-surface-and-no-orphan-admitted-use-case
  result_contract:
    states: [proved, disproved, unknown, partial, conflicting]
    required_explanations: [why-proved, why-disproved, why-unknown, what-is-missing, what-would-upgrade-the-result]
    completion_plan: dependency-ordered-machine-readable
    preserved_semantics: [coverage, closure, unresolved, conflict, differential-disagreement, guarantee, provenance, logical-explain, physical-explain]
  roadmap:
    capability_strategy: versioned-packs-over-kernel-growth
    priority:
      - source-closure-capture-replay
      - semantic-graph
      - cfg-control-exit
      - use-def-value-flow
      - alias-effect-invalidation
      - interprocedural-summary-model-packs
      - proof-carrying-rewrite-artifacts
      - cross-provider-semantic-consensus
    use_case_families:
      - id: repository-semantic-query
        stage: A-real-project-substrate
        flagship: explain-translation-unit
        capabilities: [source-closure, capture-replay, effective-invocation, toolchain-sysroot-policy]
        disposition: tracked-gap
        tracking_issue: '#261'
      - id: semantic-graph-navigation
        stage: B-semantic-graph
        flagship: find-references-and-call-hierarchy
        capabilities: [declaration-definition-reference, include-macro, inheritance-override-template, richer-call-relations]
        disposition: planned-issue-required-before-write
      - id: program-analysis
        stage: C-program-analysis
        flagship: resource-lifetime-and-taint-path
        capabilities: [cfg-control-exit, use-def-value-flow, alias-effect, interprocedural-summary, model-packs]
        disposition: optional-versioned-capability
        tracking_issue: '#257'
      - id: proof-ready-refactoring
        stage: D-change-and-transformation
        flagship: prove-range-for-refactor
        capabilities: [proof-obligation, editability, overlay-verification, immutable-plan, transaction]
        disposition: optional-versioned-capability
        tracking_issue: '#257'
      - id: semantic-change-impact
        stage: D-change-and-transformation
        flagship: semantic-diff-and-impact
        capabilities: [snapshot-diff, dependency-closure, incremental-invalidation, coverage-delta]
        disposition: planned-issue-required-before-write
      - id: abi-ir-binary-evidence
        stage: E-cross-provider-evidence
        flagship: abi-break-and-compiler-upgrade-risk
        capabilities: [abi-relations, llvm-ir-provider, object-binary-provider, provider-consensus]
        disposition: planned-issue-required-before-write
      - id: agent-guided-extension
        stage: cross-cutting
        flagship: minimal-task-context
        capabilities: [use-case-capability-trace, authority-slice, exact-write-scope, evidence-plan]
        disposition: active
        tracking_issue: '#271'
  capability_admission:
    initial_maturity: [experimental, versioned]
    stable_requires: [two-independent-consumers-or-foundational-invariant, explicit-partiality-and-versioning, lower-level-escape-path, experimental-period]
    production_requires: [exact-support-tuple, real-project-evidence, positive-negative-failure-evidence, same-sha-qualification]
  constructibility_gate:
    contract: development.constructibility-gate.v1
    applies_to: [public-semantics, identity, protocol, persistence, irreversible-effects, resource-bounds]
    required_witnesses: [executable-state-machine, field-availability-by-phase, phase-authentic-outcome-union, minimal-witness-implementation, bounded-resource-witness, crash-effect-matrix, independent-counterexample-review]
    acceptance_rule: all-applicable-witnesses-before-high-risk-authority-acceptance
  agent_context:
    contract: agent.minimal-context.v1
    source: machine-readable-authorities
    required_fields: [goal-use-case, capability-gap, authority-reading-set, exact-contract-ids, allowed-write-paths, required-evidence, known-design-feedback, forbidden-shortcuts, completion-commands]
    handwritten_shadow_authority: forbidden
  metrics:
    - time-to-first-trustworthy-result
    - actionable-unknown-ratio
    - agent-autonomous-completion-rate
    - real-project-qualified-use-case-count
    - independent-consumer-capability-reuse
    - contract-constructibility-escape-rate
public_header_authority:
  admission: schemas/cxxlens_ng_public_api_catalog.yaml
  generated_relation_binding: schemas/cxxlens_ng_relation_registry.yaml
  migration_checker_role: superseded-asset-denylist-only
  extra_header: reject
  missing_header: reject
public_callable_authority:
  decision_adr: docs/design/adr/0092-exact-public-callable-inventory.md
  inventory: schemas/cxxlens_ng_public_callable_inventory.yaml
  inventory_schema: schemas/cxxlens_ng_public_callable_inventory.schema.yaml
  report_schema: schemas/cxxlens_ng_public_callable_inventory_report.schema.yaml
  checker: tools/quality/public_callable_inventory.py
  report_filename: cxxlens-ng-public-callable-inventory-report.json
  review_filename: cxxlens-ng-public-callable-inventory-review.md
  extractor: clang-ast-json-22
  doxygen_correspondence: exact-bidirectional
  required_result: passed
production_scope_closure:
  decision_adr: docs/design/adr/0095-production-scope-closure.md
  owner_issue: '#179'
  manifest: schemas/cxxlens_ng_production_scope_closure.yaml
  manifest_schema: schemas/cxxlens_ng_production_scope_closure.schema.yaml
  report_schema: schemas/cxxlens_ng_production_scope_closure_report.schema.yaml
  checker: tools/quality/check_ng_production_scope_closure.py
  inventory_binding:
    - manifest-digest
    - authority-census-digest
    - classification-digest
    - derived-summary
    - closure-status
  normal_mode: allow-explicit-gaps
  final_mode: require-qualified
  release_evaluation_job: release-evaluation
  terminal_job: production-scope-closure
implementation_learning:
  decision_adr: docs/design/adr/0093-implementation-learning-design-feedback.md
  owner_issue: '#171'
  handbook: docs/development/implementation-learning/README.md
  mental_models: docs/development/implementation-learning/mental-models
  records: docs/development/implementation-learning/records
  index: docs/development/implementation-learning/records/README.md
  record_schema: schemas/cxxlens_ng_design_feedback_record.schema.yaml
  checker: tools/quality/check_ng_design_feedback.py
  issue_template: .github/ISSUE_TEMPLATE/design-feedback.yml
  feedback_record_authority_role: never-normative-resolution-refs-own-authority
  mental_model_authority_role: non-normative-explanatory-only
  completion_check: issue-ready
required_status_checks:
  strict: true
  contexts:
    - build-test (OFF)
    - build-test (ON)
    - gcc-public-headers
    - install-consumer (OFF)
    - install-consumer (ON)
    - quality-contracts
    - quality-evidence
merged_main_checks:
  - foundation-completion
  - wave0-readiness
  - g5-qualification
  - release-evaluation
  - production-scope-closure
baseline:
  exact_revision_tree: required
  clean_main_checkout: required
  required_evidence:
    - toolchain-provenance
    - static-shared-build-test
    - static-shared-install-manifest
    - public-header-inventory
    - authority-digests
    - implementation-learning-contract
    - test-inventory
    - generated-header-inventory
    - public-callable-inventory-report
    - public-callable-review
    - foundation-completion-report
    - branch-protection-status-names
    - production-scope-inventory-binding
api_unit_workflow:
  maximum_active_write_units: 4
  active_write_units: []
  required_stages:
    - use-case-capability-demand-closure
    - semantics-identity-partiality
    - actionable-unknown-completion-plan
    - constructibility-witness
    - registry-schema-catalog
    - generated-static-dynamic-parity
    - production-implementation
    - memory-sqlite-parity
    - typed-dynamic-ir-parity
    - positive-negative-boundary-determinism-tests
    - exact-callable-ast-doxygen-correspondence
    - implementation-learning-checkpoint
    - doxygen-example-install-consumer
    - support-stability-evidence
    - agent-context-card
    - exact-sha-ci
  completion_evidence:
    - use-case-and-capability-trace
    - demand-closure-qualified-or-tracked-gap
    - public-header-signature-ownership-lifetime
    - error-unresolved-coverage-closure-guarantee
    - actionable-unknown-and-completion-plan
    - identity-version-ordering-unknown-handling
    - constructibility-witness-or-not-applicable
    - registry-schema-catalog
    - reproducible-generation
    - correct-target-layer
    - memory-sqlite-reason-code-parity
    - static-dynamic-descriptor-ir-result-parity
    - positive-negative-malformed-boundary-permutation-tests
    - public-callable-inventory-review-binding
    - design-feedback-none-or-issue-ready
    - doxygen-example-install-consumer
    - support-claim
    - agent-context-card
    - pre-main-required-checks
    - merged-main-required-checks
gate_ownership:
  product_direction: '#271'
  foundation: '#113'
  g5: '#166'
  release: '#167'
