$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-sqlite-store-contract.v1
title: cxxlens NG SQLite physical store contract
type: object
additionalProperties: false
required:
  - schema
  - document_version
  - maturity
  - authority
  - physical_format
  - runtime
  - tables
  - indexes
  - schema_profiles
  - counter_storage
  - payload
  - compatibility
  - transaction
  - migration
  - compaction
  - corruption
  - public_error_set
  - materializer_binding
  - release_binding
properties:
  schema: {const: cxxlens.ng-sqlite-store-contract.v1}
  document_version: {const: 2.0.0}
  maturity: {const: accepted}
  authority:
    const:
      semantic_contract: schemas/cxxlens_ng_snapshot_store_contract.yaml
      decision_adr: docs/design/adr/0097-sqlite-v3-chunked-payload-migration.md
      legacy_layout_adr: docs/design/adr/0013-ng-sqlite-physical-store.md
      materialization_adr: docs/design/adr/0096-clang22-installed-materialization-boundary.md
      decision_issue: '#200'
      implementation_issue: '#181'
  physical_format: {$ref: '#/$defs/physical_format'}
  runtime: {$ref: '#/$defs/runtime'}
  tables: {$ref: '#/$defs/tables'}
  indexes: {$ref: '#/$defs/indexes'}
  schema_profiles: {$ref: '#/$defs/schema_profiles'}
  counter_storage: {$ref: '#/$defs/counter_storage'}
  payload: {$ref: '#/$defs/payload'}
  compatibility: {$ref: '#/$defs/compatibility'}
  transaction: {$ref: '#/$defs/transaction'}
  migration: {$ref: '#/$defs/migration'}
  compaction: {$ref: '#/$defs/compaction'}
  corruption: {$ref: '#/$defs/corruption'}
  public_error_set: {$ref: '#/$defs/public_error_set'}
  materializer_binding: {$ref: '#/$defs/materializer_binding'}
  release_binding: {$ref: '#/$defs/release_binding'}
$defs:
  physical_format:
    const:
      id: cxxlens.sqlite-semantic-store.v3
      current: 3.0.0
      layout: bounded-publication-chunk-table
      semantic_snapshot_id_excludes_format: true
      logical_payload_schema_unchanged: true
      predecessor:
        id: cxxlens.sqlite-semantic-store.v2
        persisted_marker: physical-format-id-only-no-minor-row
        reported_readable_format: 2.6.0
        acceptance: exact-v2.6-schema-codec-and-typed-diagnostic-classification
        persisted_minor_inference: forbidden
        direct_open: read-only-no-persistent-side-effects
        migration_id: compact-v2.6.0-to-v3.0.0
      metadata_rows:
        physical_format: cxxlens.sqlite-semantic-store.v3
        physical_format_version: 3.0.0
        payload_chunk_profile: cxxlens.sqlite-payload-chunks.v1
        payload_chunk_maximum_bytes: '8388608'
      unknown_or_additional_format_profile_metadata: reject-before-mutation
  runtime:
    const:
      discovery: explicit-runtime-library
      candidates:
        linux:
        - libsqlite3.so.0
        - libsqlite3.so
        macos:
        - libsqlite3.dylib
        - /usr/lib/libsqlite3.dylib
      missing_runtime:
        public_semantics: unchanged
        cases:
          dynamic_library_missing:
            code: store.backend-unavailable
            field: sqlite
            detail: library
          required_symbol_missing:
            code: store.backend-unavailable
            field: sqlite
            detail: symbols
          unsupported_platform:
            code: store.backend-unavailable
            field: sqlite
            detail: platform
        v3_additional_symbols: use-the-existing-required-symbol-missing-tuple
        source_shm_readonly_symbols: use-the-existing-required-symbol-missing-tuple-only-after-active-wal-census
      required_symbols:
        v2_base:
        - sqlite3_open_v2
        - sqlite3_close_v2
        - sqlite3_errmsg
        - sqlite3_exec
        - sqlite3_free
        - sqlite3_vfs_find
        - sqlite3_vfs_register
        - sqlite3_vfs_unregister
        - sqlite3_prepare_v2
        - sqlite3_step
        - sqlite3_finalize
        - sqlite3_column_type
        - sqlite3_column_text
        - sqlite3_column_blob
        - sqlite3_column_bytes
        - sqlite3_column_int64
        v3_additional:
        - sqlite3_libversion_number
        - sqlite3_limit
        - sqlite3_prepare_v3
        - sqlite3_reset
        - sqlite3_bind_text
        - sqlite3_bind_int64
        - sqlite3_bind_blob64
        source_shm_readonly:
        - sqlite3_sourceid
        - sqlite3_uri_parameter
        - sqlite3_uri_key
        resolution: exact-symbol-from-the-one-pinned-runtime-library-handle
      capability_preflight:
        common_prefix:
        - classify-locator-and-reject-empty-or-invalid-filesystem-locator-before-runtime-load
        - load-and-pin-one-runtime-library-and-resolve-v2-base-symbols
        filesystem_existing_order:
        - bind-and-pin-source-vfs-and-required-observation-capability-before-main-or-sidecar-access
        - canonicalize-through-the-bound-vfs-and-observe-parent-main-and-sidecar-namespace
        - reject-topology-object-kind-readability-or-observation-failure-before-sqlite-open
        - run-the-closed-base-symbol-format-discriminator-on-one-stable-read-only-source-snapshot
        - return-exact-v2-only-after-the-complete-v2-profile-and-eager-row-decode-without-any-v3-gate
        - return-unknown-or-mixed-terminal-result-without-any-v3-gate
        - for-declared-current-v3-only-require-v3-symbols-and-library-version
        - completely-validate-current-v3-on-the-read-only-snapshot
        - reopen-the-existing-main-with-readwrite-privatecache-fullmutex-and-create-uri-omitted
        - query-limit-on-that-actual-current-v3-writer-before-any-write
        active_wal_source_shm_readonly_order:
          steps:
          - bind-nonmutating-census-and-classify-readable-wal-plus-shm-with-v2-wal-header-before-the-branch-specific-symbol-gate
          - resolve-sqlite3-sourceid-sqlite3-uri-parameter-and-sqlite3-uri-key-from-the-same-pinned-runtime-handle
          - qualify-the-exact-runtime-vfs-and-filesystem-profile-on-target-independent-scratch-before-underlying-source-xOpen
          - validate-the-exact-internal-uri-receipt-in-the-owned-main-xOpen-callback-before-delegation
          - open-and-eagerly-decode-on-the-same-connection-and-held-read-lock
          quiescent_exact_v2: no-source-shm-readonly-symbol-version-or-behavioral-qualification-gate
        existing_format_discriminator:
          input: one-stable-read-only-main-sidecar-snapshot-observed-with-v2-base-symbols
          precedence:
          - exact-logical-empty
          - recognized-v2-v3-mixed
          - declared-v2
          - declared-current-v3
          - unknown-nonempty
          recognized_generation_signals:
            v2:
            - exact-v2-physical-format-marker
            - exact-v2-exclusive-publication-checksum-and-single-payload-blob-layout
            v3:
            - exact-v3-physical-format-marker
            - physical-format-version-payload-chunk-profile-or-maximum-metadata
            - payload-chunk-table-or-v3-publication-locator-columns
          classes:
            exact_logical_empty:
              predicate: exact-empty-predicate-with-no-recognized-format-or-layout-signal
              route: fresh-or-empty
            mixed_v2_v3:
              predicate: at-least-one-recognized-v2-signal-and-at-least-one-recognized-v3-signal
              result:
                code: store.corrupt
                field: sqlite-format-classification
                detail: mixed-v2-v3
              v3_gate: forbidden
            declared_v2:
              predicate: exactly-one-v2-format-marker-and-no-v3-signal
              validation: complete-exact-v2.6-schema-codec-storage-class-and-eager-row-profile
              incompatible_result:
                code: store.format-incompatible
                field: sqlite-physical-format
                detail: v2-profile-mismatch
              v3_gate: forbidden
            declared_current_v3:
              predicate: exactly-one-current-v3-format-marker-and-no-v2-signal
              next: v3-symbol-version-gate-before-full-current-v3-profile-validation
              damaged_profile_result_after_gate:
                code: store.corrupt
                field: sqlite-current-v3
                detail: schema-or-authority-damage
            unknown_nonempty:
              predicate: every-other-nonempty-state-including-missing-or-unknown-format-marker
              result:
                code: store.format-incompatible
                field: sqlite-physical-format
                detail: unknown-format-or-layout
              v3_gate: forbidden
          inference_from-table-shape-without-an-exact-marker: forbidden
          current_v3_fallback_to_v2_or_unknown: forbidden
        preauthority_wal_only_current_v3_gate:
          factory: query-version-symbols-and-limit-on-the-pinned-runtime-private-recovery-connection-before-accepting-the-eager-v3-state
          source_before_first_mutation: query-limit-on-the-source-read-write-no-create-recovery-connection-before-recovery-journal-or-authority-effect-then-recheck-on-the-normal-writer-before-store-write
        filesystem_fresh_order:
        - bind-and-pin-source-vfs-and-required-observation-capability-before-main-or-sidecar-access
        - establish-nonexistent-or-exact-empty-main-and-sidecar-census-without-sqlite-target-open
        - observe-v3-symbols-and-library-version
        - query-limit-on-a-separate-side-effect-free-scratch-memory-connection
        - recheck-fresh-census-before-raw-vfs-bootstrap-if-nonexistent-and-target-sqlite-read-write-no-create-open
        filesystem_fresh_scratch_connection: exact-memory-name-opened-through-the-already-registered-source-alias-as-explicit-fourth-argument-vfs-capability-only-discarded-before-target-open-and-never-a-second-null-default-resolution
        ephemeral_memory_order:
        - observe-v3-symbols-and-library-version
        - resolve-and-pin-the-runtime-default-vfs-and-register-one-owned-forwarding-alias
        - open-the-sole-target-memory-connection-with-that-explicit-alias
        - query-limit-on-that-same-target-connection-before-journal-ddl-metadata-or-marker
        - reuse-that-connection-for-initialization-and-the-store-lifetime
        target_persistent_or_authority_effect_before_fresh_v3_gate: forbidden
        permitted_ephemeral_pre_gate_effect: construct-the-sole-target-memory-connection-and-query-its-limit-without-journal-ddl-metadata-or-marker-write
        fresh_or_ephemeral_v3_gate: require-v3-symbols-version-and-branch-specific-limit-before-target-filesystem-open-or-memory-authority-ddl
        existing_below_v3_floor:
          exact_v2_profile: allow-diagnostic-read-with-base-symbols-and-existing-payload-specific-behavior
          declared_current_v3: return-v3-runtime-version-or-symbol-error-before-full-current-v3-profile-validation
          unknown_or_mixed: return-the-base-discriminator-terminal-result-without-v3-symbol-version-or-limit-observation
        error_precedence:
          common_locator:
          - empty-or-invalid-locator
          - existing-library-base-symbol-or-platform-tuple
          filesystem_common:
          - source-vfs-lifetime-and-observation-capability
          - vfs-canonicalization
          - namespace-observation-io
          - sidecar-topology
          - regular-file-or-backend-equivalent-object-kind
          - source-open-and-base-format-discriminator
          exact_v2_existing:
          - common-locator-and-filesystem-prefix
          - exact-v2-schema-codec-storage-class-and-eager-row-classification
          unknown_or_mixed_existing:
          - common-locator-and-filesystem-prefix
          - base-discriminator-terminal-result
          declared_current_v3_existing:
          - common-locator-and-filesystem-prefix
          - v3-required-symbols
          - sqlite-runtime-version
          - current-v3-read-only-full-validation
          - existing-main-read-write-open-with-create-and-uri-omitted
          - bound-vfs-read-write-mode-proof
          - actual-connection-sqlite-limit-length
          filesystem_fresh:
          - common-locator-and-filesystem-prefix
          - v3-required-symbols
          - sqlite-runtime-version
          - explicit-alias-scratch-memory-open-and-limit
          - exclusive-bootstrap-create-file-and-parent-durability
          - fresh-main-read-write-open-with-create-and-uri-omitted
          - bound-vfs-read-write-mode-proof
          - xLock-journal-transition
          migration_or_recovery:
          - common-locator-and-filesystem-prefix
          - clean-source-profile
          - v3-required-symbols
          - sqlite-runtime-version
          - source-main-read-write-no-create-open
          - bound-vfs-read-write-mode-proof
          - actual-connection-sqlite-limit-length
          - begin-immediate
          ephemeral_memory:
          - common-locator
          - v3-required-symbols
          - sqlite-runtime-version
          - loader-origin-default-vfs-alias-binding
          - sole-memory-read-write-create-open
          - actual-target-sqlite-limit-length
        actual_connection_recheck: filesystem-read-write-mode-proof-then-v3-symbols-library-version-and-limit-length-before-first-schema-metadata-payload-or-journal-write
        actual_connection_vfs_arming: source-read-write-no-create-main-connection-is-opened-through-the-bound-forwarding-vfs-with-write-delete-truncate-sidecar-create-shm-map-extension-and-effectful-file-control-denied-until-version-symbol-limit-locator-identity-and-receipt-gates-pass-then-branch-specific-coordination-and-write-stages-arm
        pre_arm_synchronous:
          ordinary-current-v3-fresh-and-memory: set-and-query-connection-local-full-before-first-store-write-with-no-new-persistent-authority-effect
          wal-only-recovery-stage: after-all-runtime-locator-identity-and-receipt-gates-permit-only-wal-index-shm-coordination-create-map-lock-and-bytes-while-main-wal-rollback-journal-write-delete-truncate-and-authority-effects-remain-denied-then-set-and-query-full
          accepted_empty_normalization_stage: after-version-limit-locator-main-identity-source-anchor-and-exact-empty-gates-install-the-pending-coordination-arm-while-effects-remain-denied-then-set-and-query-connection-local-full-the-first-underlying-exclusive-xLock-callback-rechecks-and-arms-coordination-before-the-exact-zero-byte-wal-open-and-no-other-persistent-effect-is-permitted-before-the-later-full-arm
          final_arm: only-after-full-verification-enable-the-named-recovery-checkpoint-journal-transition-or-store-writes
        pre_arm_synchronous_failure:
          code: store.sqlite-failure
          field: database
          detail: preserve-sqlite-runtime-diagnostic
        pre_arm_synchronous_failure_effects:
          ordinary_current_v3_open_before-store-install: finalize-and-attempt-exactly-one-close-v2-close-ok-returns-the-preserved-sqlite-runtime-diagnostic-with-no-store-and-no-reclassifier-close-non-ok-quarantines-the-connection-and-runtime-vfs-pins
          fresh_before-journal-receipt: finalize-and-attempt-exactly-one-close-v2-close-ok-returns-the-preserved-sqlite-runtime-diagnostic-with-no-store-and-no-reclassifier-close-non-ok-quarantines-the-connection-and-runtime-vfs-pins
          ephemeral_memory_before-authority: finalize-and-attempt-exactly-one-close-v2-close-ok-discards-the-sole-database-and-returns-the-preserved-sqlite-runtime-diagnostic-with-no-store-and-no-receipt-or-reclassifier-close-non-ok-quarantines-the-connection-and-runtime-vfs-pins
          wal-only-or-first-mutation-recovery-with-sealed-source-receipt: finalize-and-attempt-exactly-one-close-v2-close-ok-then-run-the-receipt-aware-phase-classifier-close-non-ok-quarantines-and-poisons-without-reopen
          accepted_empty_normalization_with_or_without_coordination_effect: close-and-use-accepted_empty_original_normalization.failure_totality-selecting-pre-effect-or-after-coordination-from-the-latest-stage-evidence
          coordination_effect_limit: wal-only-recovery-stage-new-shm-is-coordination-only-never-authority-and-no-main-wal-journal-or-store-authority-write-is-permitted-before-final-arm
          accepted_empty_normalization_coordination_effect_limit: exact-zero-byte-wal-create-or-open-only-under-accepted-empty-normalization-coordination-with-all-other-persistent-effects-denied-before-full-arm
        recheck_failure_effects:
          filesystem_before_sealed_operation_or_recovery_receipt: finalize-no-live-statement-and-attempt-exactly-one-sqlite3-close-v2-close-ok-returns-the-selected-pre-effect-gate-error-with-no-store-install-reclassifier-or-retry-close-non-ok-quarantines-the-connection-and-runtime-vfs-pins-the-fresh-nonexistent-branch-may-retain-only-its-already-durable-raw-bootstrap-zero-byte-main
          filesystem_after_sealed_receipt_or_coordination_effect: finalize-all-statements-attempt-one-rollback-if-a-transaction-may-remain-then-attempt-exactly-one-sqlite3-close-v2-close-ok-delegates-to-the-receipt-aware-operation-phase-classifier-close-non-ok-quarantines-and-poisons-without-reopen-or-retry
          ephemeral_memory_before_authority: finalize-all-statements-and-attempt-exactly-one-sqlite3-close-v2-close-ok-discards-the-sole-database-and-returns-the-selected-pre-effect-gate-error-close-non-ok-quarantines-the-connection-and-runtime-vfs-pins-no-filesystem-receipt-reopen-reclassifier-or-retry
          after_begin_immediate_epoch_check: delegate-to-transaction.connection_lifecycle.mutation_epoch_recheck.drift_effects
      library_version:
        query: sqlite3-libversion-number
        minimum: 3037000
        applicability: fresh-v3-current-v3-and-v2-compact-before-mutation
        predecessor_v2_diagnostic_read: existing-runtime-and-symbol-capability-without-new-version-floor
        below_minimum:
          code: store.backend-unavailable
          field: sqlite-runtime-version
          detail: '3037000'
      limit_length:
        query: sqlite3_limit-SQLITE_LIMIT_LENGTH-negative-one
        minimum: 16777216
        applicability: fresh-v3-current-v3-and-v2-compact-before-mutation
        predecessor_v2_diagnostic_read: payload-specific-existing-runtime-behavior
        below_minimum:
          code: store.backend-unavailable
          field: sqlite-limit-length
          detail: '16777216'
        public_request_or_payload_cap: false
  tables:
    const:
      - {name: cxxlens_ng_metadata, primary_key: [key], columns: [key, value]}
      - name: cxxlens_ng_publication
        primary_key: [publication_id]
        columns: [publication_id, series_id, snapshot_id, sequence, generation, parent, state, payload_checksum, payload_byte_count, payload_chunk_count]
      - name: cxxlens_ng_payload_chunk
        primary_key: [publication_id, generation, chunk_ordinal]
        columns: [publication_id, generation, chunk_ordinal, byte_offset, byte_count, checksum, payload]
      - {name: cxxlens_ng_series_head, primary_key: [series_id], columns: [series_id, current_publication, sequence]}
  indexes:
    const:
      - {name: cxxlens_ng_publication_series, columns: [series_id, sequence]}
      - {name: cxxlens_ng_payload_chunk_locator, columns: [publication_id, generation, chunk_ordinal]}
  schema_profiles:
    const:
      current_v3:
        strict: true
        without_rowid: true
        canonical_ddl:
          projection: ordered-statements-canonical-json-utf8
          validation_projection: sqlite-schema-explicit-sql-plus-table-xinfo-index-list-and-index-xinfo
          digest: sha256:b1d4e497441749001a67b07adb97d4f58e30a6f5a1a78c7f9a294ed405a6abd8
          statements:
            - 'CREATE TABLE cxxlens_ng_metadata(key TEXT NOT NULL PRIMARY KEY,value TEXT NOT NULL) STRICT, WITHOUT ROWID'
            - 'CREATE TABLE cxxlens_ng_publication(publication_id TEXT NOT NULL PRIMARY KEY,series_id TEXT NOT NULL,snapshot_id TEXT NOT NULL,sequence INTEGER NOT NULL,generation INTEGER NOT NULL,parent TEXT,state INTEGER NOT NULL CHECK(state BETWEEN 0 AND 5),payload_checksum TEXT NOT NULL,payload_byte_count INTEGER NOT NULL,payload_chunk_count INTEGER NOT NULL CHECK(payload_chunk_count BETWEEN 0 AND 2199023255552)) STRICT, WITHOUT ROWID'
            - 'CREATE TABLE cxxlens_ng_payload_chunk(publication_id TEXT NOT NULL,generation INTEGER NOT NULL,chunk_ordinal INTEGER NOT NULL,byte_offset INTEGER NOT NULL,byte_count INTEGER NOT NULL,checksum TEXT NOT NULL,payload BLOB NOT NULL,PRIMARY KEY(publication_id,generation,chunk_ordinal),CHECK(chunk_ordinal BETWEEN 0 AND 2199023255551),CHECK(byte_count BETWEEN 1 AND 8388608),CHECK(length(payload)=byte_count)) STRICT, WITHOUT ROWID'
            - 'CREATE TABLE cxxlens_ng_series_head(series_id TEXT NOT NULL PRIMARY KEY,current_publication TEXT NOT NULL,sequence INTEGER NOT NULL) STRICT, WITHOUT ROWID'
            - 'CREATE INDEX cxxlens_ng_publication_series ON cxxlens_ng_publication(series_id,sequence)'
            - 'CREATE INDEX cxxlens_ng_payload_chunk_locator ON cxxlens_ng_payload_chunk(publication_id,generation,chunk_ordinal)'
        exact_user_objects:
          tables: [cxxlens_ng_metadata, cxxlens_ng_publication, cxxlens_ng_payload_chunk, cxxlens_ng_series_head]
          indexes: [cxxlens_ng_publication_series, cxxlens_ng_payload_chunk_locator]
          views: []
          triggers: []
        column_shape_defaults:
          default_expression: none-for-every-column
          hidden_columns: forbidden
          text_collation: BINARY
        index_profiles:
          cxxlens_ng_publication_series:
            unique: false
            origin: explicit-c
            partial: false
            key_columns: [series_id-asc-binary, sequence-asc-binary]
            auxiliary_columns: [publication_id-primary-key]
          cxxlens_ng_payload_chunk_locator:
            unique: false
            origin: explicit-c
            partial: false
            key_columns: [publication_id-asc-binary, generation-asc-binary, chunk_ordinal-asc-binary]
            auxiliary_columns: []
        automatic_primary_key_index_profiles:
          sqlite_autoindex_cxxlens_ng_metadata_1:
            unique: true
            origin: primary-key
            partial: false
            key_columns: [key-asc-binary]
            auxiliary_columns: [value]
          sqlite_autoindex_cxxlens_ng_publication_1:
            unique: true
            origin: primary-key
            partial: false
            key_columns: [publication_id-asc-binary]
            auxiliary_columns: [series_id, snapshot_id, sequence, generation, parent, state, payload_checksum, payload_byte_count, payload_chunk_count]
          sqlite_autoindex_cxxlens_ng_payload_chunk_1:
            unique: true
            origin: primary-key
            partial: false
            key_columns: [publication_id-asc-binary, generation-asc-binary, chunk_ordinal-asc-binary]
            auxiliary_columns: [byte_offset, byte_count, checksum, payload]
          sqlite_autoindex_cxxlens_ng_series_head_1:
            unique: true
            origin: primary-key
            partial: false
            key_columns: [series_id-asc-binary]
            auxiliary_columns: [current_publication, sequence]
        metadata:
          exact_row_count: 4
          exact_keys: [payload_chunk_maximum_bytes, payload_chunk_profile, physical_format, physical_format_version]
        tables:
          cxxlens_ng_metadata:
            columns:
              - {name: key, declared_type: TEXT, nullable: false, primary_key_ordinal: 1}
              - {name: value, declared_type: TEXT, nullable: false, primary_key_ordinal: 0}
            checks: []
          cxxlens_ng_publication:
            columns:
              - {name: publication_id, declared_type: TEXT, nullable: false, primary_key_ordinal: 1}
              - {name: series_id, declared_type: TEXT, nullable: false, primary_key_ordinal: 0}
              - {name: snapshot_id, declared_type: TEXT, nullable: false, primary_key_ordinal: 0}
              - {name: sequence, declared_type: INTEGER, nullable: false, primary_key_ordinal: 0}
              - {name: generation, declared_type: INTEGER, nullable: false, primary_key_ordinal: 0}
              - {name: parent, declared_type: TEXT, nullable: true, primary_key_ordinal: 0}
              - {name: state, declared_type: INTEGER, nullable: false, primary_key_ordinal: 0}
              - {name: payload_checksum, declared_type: TEXT, nullable: false, primary_key_ordinal: 0}
              - {name: payload_byte_count, declared_type: INTEGER, nullable: false, primary_key_ordinal: 0}
              - {name: payload_chunk_count, declared_type: INTEGER, nullable: false, primary_key_ordinal: 0}
            checks: [state-between-0-and-5, payload-chunk-count-between-0-and-2199023255552]
          cxxlens_ng_payload_chunk:
            columns:
