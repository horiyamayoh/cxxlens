$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-work-unit.v1
title: cxxlens autonomous bounded work-unit inventory
type: object
additionalProperties: false
required: [schema, document_version, aggregate_owner, open_issue_inventory, closed_contract_owners, generated_surface_policy, entries]
properties:
  schema: {const: cxxlens.ng-work-unit.v1}
  document_version: {const: 1.0.0}
  aggregate_owner: {const: '#173'}
  open_issue_inventory: {type: array, minItems: 9, maxItems: 9, uniqueItems: true, items: {$ref: '#/$defs/issue'}}
  closed_contract_owners: {const: ['#167', '#179']}
  generated_surface_policy: {const: integration-owner-regenerates-and-commits}
  entries:
    type: array
    minItems: 9
    maxItems: 9
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [issue, conflict_class, integration_owner, authority_sources, authority_digest, completion_class, residual_qualification, units]
      properties:
        issue: {$ref: '#/$defs/issue'}
        conflict_class: {enum: [governance-global, provider-protocol, materialization-store, sqlite-lifecycle, qualification-global, agent-ux]}
        integration_owner: {$ref: '#/$defs/issue'}
        authority_sources: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/path'}}
        authority_digest: {$ref: '#/$defs/digest'}
        completion_class: {enum: [bounded-implementation, autonomy-readiness]}
        residual_qualification: {type: string, minLength: 1}
        units:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [id, risk, state, depends_on, serialized_with, owned_products, consumed_products, owned_paths, consumed_paths, generated_surfaces, forbidden_shortcuts, evidence_commands, completion_plan]
            properties:
              id: {type: string, pattern: '^wu-[1-9][0-9]*-[a-z0-9-]+$'}
              risk: {enum: [local, contract, invariant, security, compatibility, irreversible, resource-bound]}
              state: {enum: [ready, review-required, blocked-by-authority]}
              depends_on: {type: array, uniqueItems: true, items: {$ref: '#/$defs/unit'}}
              serialized_with: {type: array, uniqueItems: true, items: {$ref: '#/$defs/unit'}}
              owned_products: {type: array, uniqueItems: true, items: {$ref: '#/$defs/product'}}
              consumed_products: {type: array, uniqueItems: true, items: {$ref: '#/$defs/product'}}
              owned_paths: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/path'}}
              consumed_paths: {type: array, uniqueItems: true, items: {$ref: '#/$defs/path'}}
              generated_surfaces: {type: array, uniqueItems: true, items: {$ref: '#/$defs/path'}}
              forbidden_shortcuts: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
              evidence_commands: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
              completion_plan: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
$defs:
  issue: {type: string, pattern: '^#[1-9][0-9]*$'}
  unit: {type: string, pattern: '^wu-[1-9][0-9]*-[a-z0-9-]+$'}
  product: {type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)+$'}
  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  path: {type: string, pattern: '^(?!/)(?!.*\.\.)(?!.*\\).+'}
