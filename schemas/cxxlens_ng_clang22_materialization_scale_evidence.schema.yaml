$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.clang22-materialization-scale-evidence.v1
title: cxxlens Clang 22 materialization scale and resource evidence
type: object
additionalProperties: false
required:
  - schema
  - scope
  - authority
  - execution
  - scenarios
  - planned_negative_vectors
properties:
  schema: {const: cxxlens.clang22-materialization-scale-evidence.v1}
  scope:
    type: object
    additionalProperties: false
    required:
      - kind
      - release_qualification
      - semantic_status
      - resource_qualification
    properties:
      kind: {const: ingress-scale-and-selected-installed-positive}
      release_qualification: {const: false}
      semantic_status: {const: partial}
      resource_qualification: {const: false}
  authority:
    type: object
    additionalProperties: false
    required:
      - source_revision
      - source_tree
      - protocol_minor
      - required_feature
      - raw_input_limit_bytes
      - maximum_task_input_bytes
      - maximum_task_input_chunks
      - maximum_aggregate_source_bytes
      - maximum_task_count
      - retained_memory_formula
      - forbidden_residency
    properties:
      source_revision: {$ref: '#/$defs/revision'}
      source_tree: {$ref: '#/$defs/tree'}
      protocol_minor: {const: 1}
      required_feature: {const: task-input-chunks-v1}
      raw_input_limit_bytes: {const: 1073741824}
      maximum_task_input_bytes: {const: 67108864}
      maximum_task_input_chunks: {const: 64}
      maximum_aggregate_source_bytes: {const: 536870912}
      maximum_task_count: {const: 4096}
      retained_memory_formula:
        const: one-shared-catalog-plus-fixed-buffers-plus-one-task-window-plus-one-source-plus-one-output-window
      forbidden_residency:
        const:
          - raw-request
          - aggregate-source
          - all-task-payloads
          - task-count-times-catalog-count
  execution:
    type: object
    additionalProperties: false
    required:
      - platform
      - runner
      - toolchain
      - command_argv
    properties:
      platform: {const: linux}
      runner: {const: wait4-peak-rss}
      toolchain: {type: object}
      command_argv:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
  scenarios:
    type: array
    minItems: 7
    items: {$ref: '#/$defs/scenario'}
  planned_negative_vectors:
    type: array
    minItems: 8
    uniqueItems: true
    items: {type: string, minLength: 1}
$defs:
  revision: {type: string, pattern: '^[0-9a-f]{40}$'}
  tree: {type: string, pattern: '^[0-9a-f]{40}$'}
  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  scenario:
    type: object
    additionalProperties: false
    required:
      - id
      - expected
      - input
      - admission
      - installed
    properties:
      id:
        enum:
          - one-task
          - four-thousand-ninety-six-tasks
          - sixteen-mib-source
          - five-hundred-twelve-mib-aggregate-source
          - one-gib-raw-request
          - raw-request-limit-plus-one
          - arbitrary-short-reads
      expected:
        enum: [pass, reject]
      input:
        type: object
        additionalProperties: false
        required:
          - raw_input_byte_count
          - raw_input_sha256
          - task_count
          - source_bytes_per_task
          - aggregate_source_bytes
          - read_fragmentation
        properties:
          raw_input_byte_count: {type: integer, minimum: 0, maximum: 1073741825}
          raw_input_sha256: {$ref: '#/$defs/digest'}
          task_count: {type: integer, minimum: 0, maximum: 4096}
          source_bytes_per_task: {type: integer, minimum: 0, maximum: 67108864}
          aggregate_source_bytes: {type: integer, minimum: 0, maximum: 536870912}
          read_fragmentation:
            enum: [file-backed, pipe-fragmented]
          input_artifact:
            oneOf:
              - type: 'null'
              - {$ref: '#/$defs/artifact'}
      admission: {$ref: '#/$defs/process'}
      installed:
        oneOf:
          - type: 'null'
          - {$ref: '#/$defs/process'}
  process:
    type: object
    additionalProperties: false
    required:
      - status
      - observation
      - actual_exit_status
      - stdout_byte_count
      - stdout_sha256
      - stderr_byte_count
      - stderr_sha256
      - parsed_response_count
      - peak_rss_bytes
    properties:
      status: {enum: [passed, expected-rejection, failed]}
      observation:
        enum:
          - driver-ok
          - driver-error
          - installed-detailed-passed
          - installed-json-response
          - empty
      actual_exit_status: {type: integer, minimum: 0, maximum: 255}
      stdout_byte_count: {type: integer, minimum: 0}
      stdout_sha256: {$ref: '#/$defs/digest'}
      stderr_byte_count: {type: integer, minimum: 0}
      stderr_sha256: {$ref: '#/$defs/digest'}
      parsed_response_count: {type: integer, minimum: 0, maximum: 1}
      peak_rss_bytes: {type: integer, minimum: 0}
      command_argv:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      input_transfer:
        type: object
        additionalProperties: false
        required:
          - protocol_version
          - required_feature
          - task_input_codec
          - logical_input_bytes
          - logical_input_digest
          - canonical_chunk_bytes
          - chunk_count
          - ordered_chunk_payload_digest_set_digest
        properties:
          protocol_version: {const: 1.1.0}
          required_feature: {const: task-input-chunks-v1}
          task_input_codec: {const: cxxlens.clang22.task.v3}
          logical_input_bytes: {type: integer, minimum: 0, maximum: 67108864}
          logical_input_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
          canonical_chunk_bytes: {const: 1048576}
          chunk_count: {type: integer, minimum: 0, maximum: 64}
          ordered_chunk_payload_digest_set_digest:
            {type: string, pattern: '^semantic-v2:sha256:[0-9a-f]{64}$'}
      stdout_artifact: {$ref: '#/$defs/artifact'}
      stderr_artifact: {$ref: '#/$defs/artifact'}
      input_artifact: {$ref: '#/$defs/artifact'}
      occurrence_artifact: {$ref: '#/$defs/artifact'}
  artifact:
    type: object
    additionalProperties: false
    required: [path, byte_count, sha256]
    properties:
      path:
        type: string
        minLength: 1
        pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$'
      byte_count: {type: integer, minimum: 0}
      sha256: {$ref: '#/$defs/digest'}
