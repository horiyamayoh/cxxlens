$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-agent-context.v2
title: cxxlens exact work-unit agent context v2
type: object
additionalProperties: false
required: [schema, document_version, role, issue, unit_id, conflict_class, integration_owner, risk, execution_disposition, blockers, dependencies, authority, reading_set, allowed_write_paths, integration_generated_surfaces, forbidden_shortcuts, completion_class, evidence_commands, completion_plan, residual_qualification]
properties:
  schema: {const: cxxlens.ng-agent-context.v2}
  document_version: {const: 2.0.0}
  role: {const: bounded-non-authoritative-execution-packet}
  issue: {type: string, pattern: '^#[1-9][0-9]*$'}
  unit_id: {type: string, pattern: '^wu-[1-9][0-9]*-[a-z0-9-]+$'}
  conflict_class: {enum: [governance-global, provider-protocol, materialization-store, sqlite-lifecycle, qualification-global, agent-ux]}
  integration_owner: {type: string, pattern: '^#[1-9][0-9]*$'}
  risk: {enum: [local, contract, invariant, security, compatibility, irreversible, resource-bound]}
  execution_disposition: {enum: [ready, stop-review-required, stop-blocked-by-authority, stop-blocked-by-dependency]}
  blockers: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
  dependencies: {type: array, uniqueItems: true, items: {type: string, pattern: '^wu-[1-9][0-9]*-[a-z0-9-]+$'}}
  authority:
    type: object
    additionalProperties: false
    required: [revision, tree, worktree, manifest_digest, authority_digest]
    properties:
      revision: {$ref: '#/$defs/hex40'}
      tree: {$ref: '#/$defs/hex40'}
      worktree: {enum: [clean, synthetic-corpus]}
      manifest_digest: {$ref: '#/$defs/digest'}
      authority_digest: {$ref: '#/$defs/digest'}
  reading_set:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [path, sha256]
      properties: {path: {$ref: '#/$defs/path'}, sha256: {$ref: '#/$defs/digest'}}
  allowed_write_paths: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/path'}}
  integration_generated_surfaces: {type: array, uniqueItems: true, items: {$ref: '#/$defs/path'}}
  forbidden_shortcuts: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  completion_class: {enum: [bounded-implementation, autonomy-readiness]}
  evidence_commands: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  completion_plan: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
  residual_qualification: {type: string, minLength: 1}
$defs:
  hex40: {type: string, pattern: '^[0-9a-f]{40}$'}
  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  path: {type: string, pattern: '^(?!/)(?!.*\.\.)(?!.*\\).+'}
