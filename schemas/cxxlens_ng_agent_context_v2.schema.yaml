$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.ng-agent-context.v2
title: cxxlens exact work-unit agent context v2
type: object
additionalProperties: false
required: [schema, document_version, role, issue, unit_id, conflict_class, integration_owner, risk, execution_disposition, blockers, dependencies, owned_products, consumed_products, required_product_receipts, authority, reading_set, allowed_write_paths, integration_generated_surfaces, forbidden_shortcuts, completion_class, evidence_commands, completion_plan, residual_qualification, capability_resolution]
allOf:
  - if:
      properties: {execution_disposition: {const: ready}}
    then:
      properties: {blockers: {maxItems: 0}}
    else:
      properties: {blockers: {minItems: 1}}
properties:
  schema: {const: cxxlens.ng-agent-context.v2}
  document_version: {const: 2.0.0}
  role: {const: bounded-non-authoritative-execution-packet}
  issue: {type: string, pattern: '^#[1-9][0-9]*$'}
  unit_id: {type: string, pattern: '^wu-[1-9][0-9]*-[a-z0-9-]+$'}
  conflict_class: {enum: [governance-global, provider-protocol, materialization-store, sqlite-lifecycle, qualification-global, agent-ux]}
  integration_owner: {type: string, pattern: '^#[1-9][0-9]*$'}
  risk: {enum: [local, contract, invariant, security, compatibility, irreversible, resource-bound]}
  execution_disposition: {enum: [ready, stop-review-required, stop-blocked-by-authority, stop-blocked-by-dependency]}
  blockers: {type: array, uniqueItems: true, items: {$ref: '#/$defs/actionable_string'}}
  dependencies: {type: array, uniqueItems: true, items: {type: string, pattern: '^wu-[1-9][0-9]*-[a-z0-9-]+$'}}
  owned_products: {type: array, uniqueItems: true, items: {$ref: '#/$defs/product'}}
  consumed_products: {type: array, uniqueItems: true, items: {$ref: '#/$defs/product'}}
  required_product_receipts:
    type: object
    additionalProperties:
      oneOf:
        - type: object
          additionalProperties: false
          required: [contract, receipt_profile, status]
          properties: {contract: {$ref: '#/$defs/product'}, receipt_profile: {const: exact-producer-commit-tree-artifact-and-evidence-digests}, status: {const: pending}}
        - type: object
          additionalProperties: false
          required: [contract, receipt_profile, status, producer_unit, producer_commit, producer_tree, artifact_path, artifact_digest, evidence_path, evidence_digest]
          properties:
            contract: {$ref: '#/$defs/product'}
            receipt_profile: {const: exact-producer-commit-tree-artifact-and-evidence-digests}
            status: {const: available}
            producer_unit: {type: string, pattern: '^wu-[1-9][0-9]*-[a-z0-9-]+$'}
            producer_commit: {type: string, pattern: '^[0-9a-f]{40}$'}
            producer_tree: {type: string, pattern: '^[0-9a-f]{40}$'}
            artifact_path: {$ref: '#/$defs/path'}
            artifact_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
            evidence_path: {$ref: '#/$defs/path'}
            evidence_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  authority:
    type: object
    additionalProperties: false
    required: [revision, tree, worktree, manifest_digest, authority_digest]
    properties:
      revision: {$ref: '#/$defs/hex40'}
      tree: {$ref: '#/$defs/hex40'}
      worktree: {enum: [clean, synthetic-corpus]}
      manifest_digest: {$ref: '#/$defs/digest'}
      authority_digest: {$ref: '#/$defs/digest'}
  reading_set:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [path, sha256]
      properties: {path: {$ref: '#/$defs/path'}, sha256: {$ref: '#/$defs/digest'}}
  allowed_write_paths: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/path'}}
  integration_generated_surfaces: {type: array, uniqueItems: true, items: {$ref: '#/$defs/path'}}
  forbidden_shortcuts: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/actionable_string'}}
  completion_class: {enum: [bounded-implementation, autonomy-readiness]}
  evidence_commands: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/actionable_string'}}
  completion_plan: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/actionable_string'}}
  residual_qualification: {$ref: '#/$defs/actionable_string'}
  capability_resolution: {$ref: '#/$defs/capability_resolution'}
$defs:
  hex40: {type: string, pattern: '^[0-9a-f]{40}$'}
  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  path: {type: string, minLength: 1, pattern: '^(?!/)(?!.*\\)(?!.*\u0000)(?!.*(?:^|/)(?:\.{0,2}|\.git)(?:/|$)).+$'}
  product: {type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)+$'}
  actionable_string: {type: string, minLength: 1, pattern: '.*\S.*'}
  capability_resolution:
    type: object
    additionalProperties: false
    required: [schema, document_version, role, authority, use_case_id, consumer, question, expected_result_states, result, capability_path, missing, completion_plan, preserved_semantics, evidence, provenance, canonical_digest]
    properties:
      schema: {const: cxxlens.agent-capability-resolution.v1}
      document_version: {const: 1.0.0}
      role: {enum: [canonical-capability-resolution, evaluation-corpus-resolution]}
      authority: {type: object}
      use_case_id: {type: string, minLength: 1}
      consumer: {type: string, minLength: 1}
      question: {type: string, minLength: 1}
      expected_result_states: {type: array, minItems: 1, items: {enum: [proved, disproved, unknown, partial, conflicting]}}
      result: {type: object}
      capability_path: {type: array, minItems: 1}
      missing: {type: array}
      completion_plan: {type: array}
      preserved_semantics: {type: object}
      evidence: {type: object}
      provenance: {type: object}
      canonical_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
