$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cxxlens.dev/schemas/cxxlens.source-closure-manifest.v1
title: cxxlens source closure manifest v1
type: object
additionalProperties: false
required: [schema, closure_id, closure_digest, members, blobs]
properties:
  schema: {const: cxxlens.source-closure-manifest.v1}
  closure_id: {$ref: '#/$defs/closure_id'}
  closure_digest: {$ref: '#/$defs/semantic_digest'}
  members:
    type: array
    minItems: 1
    maxItems: 4096
    items: {$ref: '#/$defs/member'}
    x-cxxlens-order: logical_path-utf8-bytes-strictly-increasing
    x-cxxlens-unique-by: [file_id, logical_path]
  blobs:
    type: array
    minItems: 1
    maxItems: 4096
    items: {$ref: '#/$defs/blob'}
    x-cxxlens-order: content_digest-ascii-bytes-strictly-increasing
    x-cxxlens-unique-by: content_digest
$defs:
  content_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  semantic_digest: {type: string, pattern: '^semantic-v2:sha256:[0-9a-f]{64}$'}
  closure_id: {type: string, pattern: '^source-closure:semantic-v2:sha256:[0-9a-f]{64}$'}
  logical_path:
    type: string
    minLength: 11
    maxLength: 4096
    x-cxxlens-max-utf8-bytes: 4096
    pattern: '^project://[^\u0000-\u001f\u007f\\?#]+$'
    allOf:
      - {not: {pattern: '^project:///'}}
      - {not: {pattern: '/$'}}
      - {not: {pattern: '(^|/)\.{1,2}(/|$)'}}
  member:
    type: object
    additionalProperties: false
    required: [file_id, logical_path, role, encoding, size_bytes, content_digest, read_only]
    properties:
      file_id: {type: string, pattern: '^file:sha256:[0-9a-f]{64}$'}
      logical_path: {$ref: '#/$defs/logical_path'}
      role: {enum: [main, header, generated, forced-include, macro-file]}
      encoding: {enum: [utf8, utf16le, utf16be, locale_dependent, binary_or_unknown]}
      size_bytes: {type: integer, minimum: 0, maximum: 16777216}
      content_digest: {$ref: '#/$defs/content_digest'}
      read_only: {const: true}
  blob:
    type: object
    additionalProperties: false
    required: [content_digest, size_bytes]
    properties:
      content_digest: {$ref: '#/$defs/content_digest'}
      size_bytes: {type: integer, minimum: 0, maximum: 16777216}
description: Semantic validation additionally requires exactly one main member, every member digest to resolve to one blob with equal size, no orphan blob, aggregate unique bytes at most 50331648, closure_id equality with closure_digest, and ADR 0101 NFC/casefold collision rejection.
